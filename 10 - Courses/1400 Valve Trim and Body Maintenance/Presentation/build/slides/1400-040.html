<!DOCTYPE html>
<html lang="en">
<head>

<title>1400 &middot; Slide 040 &mdash; Cage-Characterised Flow</title>

<body class="ew-deck">
<main class="ew-stage">
  <!-- Slide 40 | ppt slides/slide40-42.xml | layout: figure row with lead table | family: .slide--tmpl-figrow has-lead -->
  <!-- ch2 four-part pass. Slides 40 (quick-opening), 41 (linear), 42 (equal percentage) were one
       near-identical slide each; consolidated to this comparison. 41 / 42 stay dropped from the
       module flow. Layout reworked: the reference table centred on top, the three characterised
       cages in a row beneath it, one under each. Cages split from deck image64 (assets/sourced/). -->
  <article class="slide slide--tmpl-figrow has-lead" data-slide="40" data-deck="1400" data-review="ch2-callout-pass">
    <div class="review-ribbon">ch2 pass: table + cage row</div>
    <h1 class="slide-title">Cage-Characterised Flow</h1>
    <div class="tmpl-stack">
    <div class="tmpl-lead">
      <table class="tmpl-table" data-ref="flow-characteristics">
        <thead><tr><th>Characteristic</th><th>Cage window</th><th>Typical service</th></tr></thead>
        <tbody>
          <tr><td>Quick-opening</td><td>Square-edge</td><td>On/off, dump</td></tr>
          <tr><td>Linear</td><td>Pear-shaped</td><td>Constant &Delta;P (e.g. level)</td></tr>
          <tr><td>Equal percentage</td><td>Offset pear-shaped</td><td>&Delta;P falls as flow rises &mdash; default</td></tr>
        </tbody>
      </table>
    </div>
    <div class="tmpl-row">
      <figure class="tmpl-cell">
        <img src="../assets/sourced/cage-quick-opening.png" alt="Cage with square-edge windows">
        <figcaption><b>Quick-opening</b>square-edge windows</figcaption>
      </figure>
      <figure class="tmpl-cell">
        <img src="../assets/sourced/cage-linear.png" alt="Cage with pear-shaped windows">
        <figcaption><b>Linear</b>pear-shaped windows</figcaption>
      </figure>
      <figure class="tmpl-cell">
        <img src="../assets/sourced/cage-equal-pct.png" alt="Cage with offset pear-shaped windows">
        <figcaption><b>Equal percentage</b>offset pear-shaped windows</figcaption>
      </figure>
    </div>
    </div>
    <div class="slide-chrome"><span class="slide-chrome__copyright"></span><span class="slide-chrome__pageno">40</span><img class="slide-chrome__logo" src="../assets/brand/logo-emerson-corp-2c.png" alt="Emerson"></div>
  </article>
