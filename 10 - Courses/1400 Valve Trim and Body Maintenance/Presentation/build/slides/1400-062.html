  <!-- ch2 four-part pass. Merges the section-opener (old 62) and the lap-line concept slide
       (old 63 - schematic image105). Old 63 dropped-retained.
       REVISED 2026-08-31: an earlier version drew the lap line as an inline-SVG cutaway with a
       flat "V" where the plug and seat-ring cones meet. That geometry is wrong - the lap line is
       a circumferential RING around the plug's seating chamfer, and an axial 2D section of a
       ring is two short marks, not a V. Replaced with the deck photo (image110, cropped) of a
       real plug with the seating band arrowed, so the geometry reads as what it actually is.
       Manual pointer kept in the tmpl-note. -->

      </figure>
    </div>
