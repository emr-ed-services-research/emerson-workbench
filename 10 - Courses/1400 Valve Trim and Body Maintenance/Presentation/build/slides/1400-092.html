  <!-- ch3-m1 four-part pass.
       Part 1/2: the original was bullets only, no visual. Bench set IS a travel-vs-pressure
       relationship, so it gets a graph. Source: Control Valve Handbook 6th ed. Figure 8.10
       "Bench Set Seating Force" (p.187) and the glossary - "Bench Set: ... a pressure range to
       fully stroke a valve to its rated travel". CVH Fig 8.10 itself is deadband-centric (three
       curves, a Deadband bracket, "*actuator connected to valve, deadband present") - that is
       the Deadband module (ch3-m6). For m1, bench set is defined friction-free, so this is a
       reduced redraw: the single bench-set line only, no deadband. Same call as slide 39 (redrew
       a low-fit source graph as a clean inline SVG). See To-Franz note.
       Bullet text -> key concepts (p92).
       ch3-m1 Stage 3 re-pass 2026-09-03 (Part 2, per Component Index ch3-cmp-bench-set-graph):
       re-anchored the citation - the canonical current figure for this graph is Fisher 657/667
       Instruction Manual Fig 5 (DIRECT/REVERSE ACTING panels, bench-set centreline), with CVH
       Fig 8.10 as the backup reference. Also dropped the "valve open" / "plug seated" end labels:
       this graph is the friction-free, on-the-bench case with no valve fitted, and those labels
       imported one specific 657-on-PDTC reading. Replaced with travel-state labels
       ("stem at rest" / "full rated travel") that hold for either action. -->
