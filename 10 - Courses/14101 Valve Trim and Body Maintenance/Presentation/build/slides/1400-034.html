  <!-- ch2 four-part pass. Close-up plug-tip photos (image52 standard / image51 radius) kept -
       the Fisher ET manual's seating figure (D100398X012, Figure 16) is a mono line drawing,
       not clearer. Floating text boxes -> captions.
       RESOLVED 2026-08-31 (was NEEDS VERIFY): the earlier caption called the radius tip a
       "knife-edge" giving "the tightest shutoff" and "never lapped". Checked against the ET
       manual (D100398X012, Table 2 + note 2): Class V metal shutoff on the easy-e uses a
       "radiused-seat plug and wide-bevel seat ring"; standard metal seating is Class IV. So the
       radius / wide-bevel arrangement IS Fisher's tighter metal option - but by a rounded
       surface meeting a wide bevel on a narrow line, NOT a knife edge (the photos show a
       rounded edge, not a sharp one). The captions now state only what the photos show; the
       ranking and the field trade-off (a narrow line seals tighter while true, but tolerates
       damage poorly and is re-machined rather than field-lapped) move to the context pane. The
       burned-in blue arrows on both photos are a separate open follow-up. -->
  <article class="slide slide--tmpl-figrow" data-slide="34" data-deck="1400" data-review="ch2-callout-pass">
    <div class="review-ribbon">ch2: figrow; standard vs radius metal seat</div>
    <h1 class="slide-title">Standard vs. Radius Plug</h1>
    <div class="tmpl-row">
      <figure class="tmpl-cell">
        <img src="../assets/img/image52.png" alt="Close-up of a standard valve plug tip: a chamfered seating band around the bottom edge">
        <figcaption><b>Standard tip</b>chamfered band &mdash; lapped in to its seat ring</figcaption>
      </figure>
      <figure class="tmpl-cell">
        <img src="../assets/img/image51.png" alt="Close-up of a radius valve plug tip: a rounded seating surface at the bottom edge">
        <figcaption><b>Radius tip</b>rounded surface &mdash; meets a wide-bevel seat ring</figcaption>
      </figure>
    </div>
    <p class="tmpl-note">Radius / wide-bevel = Fisher's Class&nbsp;V metal option; standard = Class&nbsp;IV.</p>
