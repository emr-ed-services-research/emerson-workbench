  <!-- ch2 four-part pass 2026-08-31. Was .slide--two-col: one bullet plus two floating text
       boxes (verify plug seat / verify stem). First rebuilt as .slide--tmpl-compare, but a
       2-row table + one image left the slide half empty (the same failure that moved slide 47

       plug/stem reuse rule is module 4 key concept 2 and the tmpl-note. Both photos keep their
       burned-in arrows (deck-wide, batched follow-up). -->
  <article class="slide slide--tmpl-figrow" data-slide="57" data-deck="1400" data-review="ch2-callout-pass">
    <div class="review-ribbon">ch2 pass: figrow; text boxes to captions</div>
    <h1 class="slide-title">Inspect the Plug &amp; Stem</h1>
    <div class="tmpl-row">
      <figure class="tmpl-cell">
        <img src="../assets/img/image91.png" alt="Close-up of an unbalanced valve plug's seating band at the tip, with a light scratch arrowed">
        <figcaption><b>Plug seat</b>lap it; machine or replace a gouge</figcaption>
      </figure>
      <figure class="tmpl-cell">
        <img src="../assets/img/image92.png" alt="Close-up of the valve stem surface with a fine scratch arrowed">
        <figcaption><b>Stem surface</b>polish light marks; replace if gouged</figcaption>
      </figure>
    </div>
    <p class="tmpl-note">A new plug always needs a new stem &mdash; never the reverse.</p>
