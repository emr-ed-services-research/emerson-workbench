  <!-- ch3-m4 four-part pass 2026-09-04.
       Part 1/4: keyConcept 6, role: procedure, level: apply - "off the valve, measure
       travel by the screwdriver method: mark a screwdriver or scale at the low bench-set
       pressure and again at the high bench-set pressure; the distance between marks is the
       actuator travel and must equal rated travel." The original was a .slide--two-col with
       four bullets or positional prose ("Below - Mark screwdriver at low bench set
       pressure" / "Top Right - Mark ... high ..." / "Bottom Right - Measure distance...")
       plus three photos (image176-178) with floating "1"/"2"/"3" digits - a procedure
       described by its LAYOUT position on the old slide rather than by step. Rebuilt as a
       three-cell .slide--tmpl-figrow (matches the step-photo convention on slide 98),
       numbered captions carrying the step instead of floating digits.
       Part 2/4: Component Index ch3-cmp-benchset-adjustment-setup note: "slide 114 (667,
       screwdriver method) is the same procedure with a marked screwdriver/scale instead of
       a travel indicator" - the deck photos are legacy but there is no current-manual
       figure of this specific technique to prefer over them (Fisher 667 IM Fig 4, p7, shows
       the travel-indicator-scale version of this procedure, already used for slide-98's
       method on the 657; the manual's own bench-set steps say to "mark the end of the
       actuator stem on a nearby surface using tape or some other method" - the screwdriver

       sharp, first-party, unambiguous (627x463 - 718x479, all >2x the on-slide display
       size) - kept as-is, no re-crop needed. Burned-in blue arrows and "First/Second Travel
       Mark" labels on image177 kept (house convention, as slides 56/62/98). -->
