<main class="ew-stage">
  <!-- cve1-ch8-m1, page 146 — eng.sizing.fundamentals-liquid-and-compressible.
       calculate-liquid-cv [apply · procedure], part 1 of 2 (continues on
       slide 147). Confirmed prose-only (Fisher Control Valve Sourcebook —
       Oil & Gas, Ch. 3, "Liquid Sizing Sample Problem," printed pp. 3-6–3-8)
       — every number here (q, P1, P2, Gf, the NPS 3 assumption, ΣK=1.11,
       Fp=0.90, Cv=125.7) is transcribed exactly from the source's own
       worked case, not recomputed.

       2026-09-21 (Phase 4, template-gallery rollout): rebuilt from
       role-procedure-worked onto the new role-nomenclature-equation
       (gallery.css §15) — the exact, Franz-reviewed production port of the
       Phase 2 proof (scratchpad phase2-template/proof.html), same schematic,
       same real numbers, no recomputation. This concept is teaching an
       equation's variables (Cv, q, ΔP, Gf, Fp) against a real physical
       setup with real worked values — the clearest fit for the new role of
       any slide in this module (course instructions). The prior tabbed
       Show/Tell/Do treatment covered the same ground three ways at once
       (a static schematic, then the identical steps restated as prose, then
       a "try it yourself" prompt); the new role's cumulative step-by-step
       reveal teaches the same worked case as ONE mechanism instead of three
       parallel ones — clicking a term highlights it on the schematic AND in
       the equation AND states its value, together, which is what "naming
       the symbols of an equation, physically and numerically" actually
       means (design-notes.md). The Tell tab's "common failure" framing and
       the Do tab's "try it yourself before slide 147" prompt are preserved,
       not dropped: the failure point (125.7 > rated 121) is now the pass/
       fail callout on the schematic itself (§15's designed home for a
       consequence line, per design-notes.md's resolved judgment calls), and
       the try-it-yourself bridge to slide 147 is folded into the final
       step's own description text below.

       Judgment call flagged for Franz: gallery.css's new .has-no-fig
       comment (added alongside §15) names cve1-143/144/148's figure-less
       mechanism treatment as the exact inline-style pattern it was written
       to formalize, and cautions that "no figure was found" is not by
       itself a reason to skip drawing one for physical/spatial content.
       144's general Cv equation is a candidate worth a second look under
       that standard, but is out of scope here.

       2026-09-21 (Franz review, post-build): the schematic drew a visible
       gap between each reducer and the valve, with the "d (NPS 3 bore)"
       label floating in that gap — reading as if a length of NPS 3 pipe
       ran between them. Both the Fisher Sourcebook and the Control Valve
       Handbook state a reducer is "directly attached to the inlet and
       outlet connections of the control valve" (also the literal basis of
       the Fp equation — no separate pipe-friction term exists because
       there is no separate pipe). Fixed: both reducers moved immediately
       adjacent to the valve (small ~10-15px gap for clarity only, not
       piping), P1/P2 taps relocated to x=680/800 — the valve's own actual
       inlet/outlet connections — and the "d" label moved to the now-roomy
       right-hand joint.

       2026-09-21 (Franz correction, same review): the tightened reducer/
       valve/reducer cluster from the fix above left no clean spot for Fp's
       old floating callout box (centred over reducer 1) — it now sat
       directly under the cluster and read as cramped. Fp moved off the
       box/leader-line system entirely and listed instead as a fourth
       stacked line under q and Gf, on the left (x=60), in that same list's
       own style (bold value + smaller parenthetical, one tspan pair) — a
       variable value like q and Gf, not a callout pointing at a spot on
       the hardware. "d" keeps its own short leader since it legitimately
       points at a specific physical joint, unlike Fp's single number.

       145 was rebuilt the same dispatch, onto this same role, teaching the
       general (symbolic, no real numbers) version of this exact reducer
       geometry immediately beforehand, following the same left-stack-for-
       values / near-the-joint-for-a-specific-spot split. -->
  <article class="slide slide--role-nomenclature-equation" data-slide="146" data-deck="cve1">
    <h1 class="slide-title">Working the Propane Case &mdash; Sizing Cv Term by Term</h1>
    <div class="tpl-content">

      <!-- ================= 1. PERSISTENT HORIZONTAL SCHEMATIC =================
           Symbol defs copied verbatim from 40 - Engine/Presentation/build/
           assets/symbol-library.svg (sym-valve-actuator, sym-pipe-reducer) —
           reused, not redrawn, per the course instructions and Style Guide
           §5.8. Coordinates, labels, and values copied verbatim from the
           reviewed proof (scratchpad phase2-template/proof.html), which
           already passed the design-notes.md checklist (canvas aspect ratio,
           rendered font scale, left-anchored stacked labels, callout box
           sized to its own longest line, line-height clearance, leader
           routing, qualifier width) through several Franz review rounds. -->
      <div class="tpl-fig-wrap">
        <svg viewBox="0 0 1600 480" xmlns="http://www.w3.org/2000/svg" role="img"
             aria-label="Horizontal schematic: an NPS 8 propane line necks down through a concentric reducer to an NPS 3 control valve and actuator, then expands back to NPS 8 through a second reducer. Pressure taps sit at the valve's own inlet and outlet connections.">

          <defs>
            <symbol id="sym-valve-actuator" viewBox="0 0 120 200">
              <polygon points="20,140 20,200 60,170" fill="#004B8D" stroke="#3F4040" stroke-width="2" stroke-linejoin="round"/>
              <polygon points="100,140 100,200 60,170" fill="#004B8D" stroke="#3F4040" stroke-width="2" stroke-linejoin="round"/>
              <line x1="60" y1="170" x2="60" y2="125" stroke="#3F4040" stroke-width="3"/>
              <path d="M 20 125 A 40 40 0 0 1 100 125 L 20 125 Z" fill="none" stroke="#3F4040" stroke-width="3" stroke-linejoin="round"/>
            </symbol>
            <symbol id="sym-pipe-reducer" viewBox="0 0 100 60">
              <polygon points="0,12 0,48 70,38 70,22" fill="#FFFFFF" stroke="#3F4040" stroke-width="3" stroke-linejoin="round"/>
            </symbol>
            <marker id="arrow-process-146" viewBox="0 0 10 10" refX="8" refY="5"
                    markerWidth="7" markerHeight="7" orient="auto-start-reverse">
              <path d="M 0 0 L 10 5 L 0 10 z" fill="#3F4040"/>
            </marker>
            <marker id="arrow-process-blue-146" viewBox="0 0 10 10" refX="8" refY="5"
                    markerWidth="7" markerHeight="7" orient="auto-start-reverse">
              <path d="M 0 0 L 10 5 L 0 10 z" fill="#004B8D"/>
            </marker>
          </defs>

          <rect x="0" y="0" width="1600" height="480" fill="#FFFFFF"/>

          <!-- Persistent geometry: reducers, valve body. Always present from
               the first frame — this is "the setup," not a taught variable.
               Reducers moved directly adjacent to the valve (2026-09-21,
               Franz review, verified against source): both the Fisher
               Sourcebook and the Control Valve Handbook state a reducer is
               "directly attached to the inlet and outlet connections of the
               control valve" — there is no length of NPS 3 pipe between a
               reducer and the valve in a real installation. The earlier
               gap (with the flow-line and "d (NPS 3 bore)" label running
               through it) misread as a real pipe run. A small ~10-15px gap
               remains for visual clarity only, not drawn as piping. -->
          <!-- Recentred 2026-09-22 (Franz: "the valve diagram is a little
               bit shifted left of center" — verified: the hardware's own
               center was 740, not the viewBox's true center 800, a 60-unit
               offset present in the original geometry this slide copied
               from. Every hardware-relative coordinate below shifted +60;
               the flow line (already centred, spans 60-1540) and the
               Cv callout box (already positioned against the canvas's own
               right edge) did not need to move, only the leader that
               anchors to the hardware's new position. -->
          <use href="#sym-pipe-reducer" x="615" y="155" width="110" height="90"/>
          <g transform="translate(980,155) scale(-1,1)">
            <use href="#sym-pipe-reducer" width="110" height="90"/>
          </g>
          <use href="#sym-valve-actuator" x="740" y="30" width="120" height="200"/>

          <!-- Persistent identification label — names the hardware, not a
               sizing variable, so it is not gated behind a step. -->
          <g class="schem-persist" font-family="Arial, sans-serif">
            <text x="800" y="46" font-size="26" font-weight="700" text-anchor="middle">NPS 3 valve</text>
          </g>

          <!-- STEP 1: q — flow rate + direction -->
          <g class="tpl-schem-part tpl-tok" data-part="q">
            <line class="flow-line" x1="60" y1="200" x2="1540" y2="200" marker-end="url(#arrow-process-blue-146)"></line>
            <text x="60" y="228" font-size="26" font-weight="700" text-anchor="start">q = 800 gpm</text>
          </g>

          <!-- STEP 2: ΔP — P1, P2 taps + bracket. Taps moved to x=680/800
               (2026-09-21, Franz review) — exactly the valve's own
               inlet/outlet connections, matching the equation's own
               definition of P1/P2, now that the reducers sit immediately at
               those same connections rather than a "pipe" length away. -->
          <g class="tpl-schem-part tpl-tok" data-part="dp">
            <line x1="740" y1="212" x2="740" y2="290" stroke-width="2"></line>
            <text x="740" y="314" font-size="24" font-weight="700" text-anchor="middle">P1</text>
            <text x="740" y="336" font-size="20" text-anchor="middle">314.7 psia</text>
            <line x1="860" y1="212" x2="860" y2="290" stroke-width="2"></line>
            <text x="860" y="314" font-size="24" font-weight="700" text-anchor="middle">P2</text>
            <text x="860" y="336" font-size="20" text-anchor="middle">289.7 psia</text>
            <path class="hl-path" d="M740,352 L740,360 L860,360 L860,352" fill="none" stroke-width="2"></path>
            <text x="800" y="382" font-size="22" font-weight="700" text-anchor="middle">&Delta;P = 25 psi</text>
          </g>

          <!-- STEP 3: Gf — specific gravity of the flowing fluid -->
          <g class="tpl-schem-part tpl-tok" data-part="gf">
            <text x="60" y="266" text-anchor="start"><tspan font-size="24" font-weight="700">Gf = 0.50</tspan><tspan font-size="17" dx="6">(propane, flowing)</tspan></text>
          </g>

          <!-- STEP 4: Fp — reducer geometry. D stays at the flow line; d
               stays at the right-hand joint (2026-09-21, Franz review) —
               there's real room there now that both joints are tight, and
               it points at a specific physical spot. Fp itself moved off
               the schematic's floating-callout system (2026-09-21, Franz
               correction): a box centred over the reducer sat directly
               under the tightened reducer/valve/reducer cluster from the
               geometry fix above and read as cramped. Listed instead as a
               fourth stacked line under q/Gf, on the left, matching that
               list's own style exactly — a variable value like q and Gf,
               not a callout pointing at a specific spot on the hardware. -->
          <g class="tpl-schem-part tpl-tok" data-part="fp">
            <text x="60" y="188" font-size="22" text-anchor="start">D (NPS 8 bore)</text>
            <text x="60" y="297" text-anchor="start"><tspan font-size="24" font-weight="700">Fp = 0.90</tspan><tspan font-size="17" dx="6">(&Sigma;K = 1.11, two reducers)</tspan></text>
          </g>

          <!-- STEP 5: solved Cv vs. rated Cv, bottom-right corner. Box moved
               up 2026-09-21 (Franz review, same fix as 145's own callout
               clearance correction): bottom edge was only 18 viewBox-units
               above the frame's own bottom edge; now ~70 units clear,
               matching 145's established standard. Leader's horizontal run
               retargeted to the box's new vertical center. -->
          <g class="tpl-schem-part tpl-tok" data-part="cv">
            <path d="M 1010 205 L 1010 370 L 1140 370" fill="none" stroke-width="1.5" stroke-dasharray="4 3"></path>
            <rect class="callout-box" x="1140" y="315" width="440" height="110" rx="6" stroke-width="3"></rect>
            <text x="1360" y="350" font-size="24" font-weight="700" text-anchor="middle">Cv = 125.7</text>
            <text x="1360" y="384" font-size="22" font-weight="700" text-anchor="middle">&gt; NPS 3 rated 121 &mdash; first assumption</text>
            <text x="1360" y="412" font-size="21" font-weight="700" fill="var(--emerson-orange)" text-anchor="middle">Fails &mdash; steps up to NPS 4</text>
          </g>

        </svg>
      </div>

      <!-- ================= 2. EQUATION ================= -->
      <div class="tpl-eq-wrap">
        <div class="tpl-eq">
          <span class="tpl-eq-cv tpl-eq-term tpl-tok is-revealed is-on" data-part="cv-intro">C<sub>v</sub></span>
          <span class="tpl-eq-op">=</span>
          <span class="tpl-eq-term tpl-tok" data-part="q">q</span>
          <span class="tpl-eq-op">&divide;</span>
          <span class="tpl-eq-op">(</span>
          <span class="tpl-eq-const">N<sub>1</sub></span>
          <span class="tpl-eq-op">&middot;</span>
          <span class="tpl-eq-term tpl-tok" data-part="fp">F<sub>p</sub></span>
          <span class="tpl-eq-op">&middot;&radic;(</span>
          <span class="tpl-eq-term tpl-tok" data-part="dp">&Delta;P</span>
          <span class="tpl-eq-op">&divide;</span>
          <span class="tpl-eq-term tpl-tok" data-part="gf">G<sub>f</sub></span>
          <span class="tpl-eq-op">))</span>
        </div>
        <div class="tpl-eq-solved tpl-tok" data-part="cv">
          <span class="tpl-eq-solved__line">800 &divide; (1.00 &times; 0.90 &times; &radic;(25 &divide; 0.50)) = <strong>125.7</strong></span>
        </div>
      </div>

      <!-- ================= 3. STEPS + DESCRIPTION ================= -->
      <div class="tpl-step-row">
        <div class="tpl-step-keys">
          <button class="tpl-step-key is-active" type="button" data-part="cv-intro"
                  data-def="Same governing equation, now with a real trial size: NPS 3.">1 &middot; Cv &mdash; first assumption</button>
          <button class="tpl-step-key" type="button" data-part="q"
                  data-def="q = 800 gpm &mdash; a liquid propane rate, pressurized enough to stay liquid.">2 &middot; Flow rate (q)</button>
          <button class="tpl-step-key" type="button" data-part="dp"
                  data-def="P1 and P2 are taken at the valve&rsquo;s own inlet and outlet connections.">3 &middot; &Delta;P across the valve</button>
          <button class="tpl-step-key" type="button" data-part="gf"
                  data-def="Gf = 0.50 for propane &mdash; lighter than water (Gf = 1.0).">4 &middot; Specific gravity (Gf)</button>
          <button class="tpl-step-key" type="button" data-part="fp"
                  data-def="Fp = 0.90, from &Sigma;K = 1.11 for two identical reducers.">5 &middot; Piping geometry (Fp)</button>
          <button class="tpl-step-key" type="button" data-part="cv"
                  data-def="Cv = 125.7 exceeds the NPS 3 rating of 121 &mdash; steps up to NPS 4.">6 &middot; Solve for Cv</button>
        </div>
        <div class="tpl-step-def">Same governing equation, now with a real trial size: NPS 3.</div>
      </div>

    </div>
    <div class="slide-chrome"><span class="slide-chrome__copyright"></span><span class="slide-chrome__pageno">146</span><img class="slide-chrome__logo" src="../assets/brand/logo-emerson-corp-2c.png" alt="Emerson"></div>
  </article>
