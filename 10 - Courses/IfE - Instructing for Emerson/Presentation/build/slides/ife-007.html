<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>IfE &middot; Day 1 &mdash; Received vs. Delivered</title>
<link rel="stylesheet" href="../css/emerson-workbench.css">
<script src="../assets/slides.js" defer></script>
</head>
<body class="ew-deck">
<main class="ew-stage">
  <!-- Day 1, concept 2 [understand]. Concept: tenets 1-2 are inputs the
       instructor receives with the assigned slice; tenets 3-5 are what the
       instructor delivers; the Rubric scores that. provenance: original.
       REBUILT 2026-09-09 as an original flow diagram (visual-concept
       check, Course Porting Pipeline.md); execution corrected same day
       (uniform box size/baseline, one shared template, bullets, takeaway
       spacing); wording corrected same day ("Performed" -> "Delivered",
       including the slide's own title, missed in the first wording pass);
       icons added same day (Franz-approved) — one small house-drawn
       pictogram per header (inbound tray / presenting figure / checked
       clipboard), which required growing the header bar height uniformly
       across all three boxes once "Delivered by the instructor" needed a
       second line to avoid overflowing into box 3 (caught by screenshot).

       REBUILT AGAIN 2026-09-10 — Geist-structure + Emerson-blue-as-one-
       accent, adopted IfE-only after a real before/after preview (Franz-
       approved; 14101 deliberately NOT migrated, separate later pass).
       Boxes 1 and 2 (Received, Delivered) are equals in this flow, so
       both are neutral now (light-grey header, charcoal icon/text,
       hairline border) — the prior version colored both of them blue,
       which is differentiation-among-equals, the exact pattern this rule
       exists to catch. Box 3 (Scored) is the one genuinely distinct
       stage and keeps the single accent — now Emerson blue rather than
       orange, since blue is the one standing accent under this direction
       and orange is freed back up for its own real meaning (caution)
       elsewhere. All three boxes get the same soft drop-shadow — depth is
       a structural/materials treatment applied uniformly, not a meaning
       signal, so it is not reserved the way color is.
       Reuses .slide--tmpl-graph's frame (title / figure / takeaway) as
       the closest existing "one diagram + one-line takeaway" container;
       this is a flow diagram, not a data graph — a structural reuse, not
       a semantic claim. Row 4 (.tmpl-source) is unused here, so the
       takeaway gets an explicit bottom margin below (it would otherwise
       sit flush against the card edge with nothing to absorb the space
       .tmpl-source normally would). -->
  <article class="slide slide--tmpl-graph" data-slide="7" data-deck="ife">
    <h1 class="slide-title">Received vs. Delivered</h1>
    <figure class="tmpl-plot">
      <svg viewBox="0 0 940 300" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Flow diagram: Context to Content and Training Objectives are received with the slice, flowing into Student Preparation, Course Delivery, and Acuminating Instructor Skills, which the instructor delivers, flowing into the Instructor Observation Rubric, which scores it.">
        <defs>
          <filter id="cardShadow" x="-20%" y="-20%" width="140%" height="140%">
            <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#000" flood-opacity="0.12"/>
          </filter>
        </defs>
        <g font-family="Arial, Helvetica, sans-serif">
          <!-- Box 1: Received — neutral, an equal to box 2 -->
          <rect x="10" y="40" width="260" height="220" rx="6" fill="#fff" stroke="var(--hairline)" stroke-width="1.5" filter="url(#cardShadow)"/>
          <rect x="10" y="40" width="260" height="56" rx="6" fill="color-mix(in srgb, var(--emerson-charcoal) 6%, #fff)"/>
          <rect x="10" y="84" width="260" height="12" fill="color-mix(in srgb, var(--emerson-charcoal) 6%, #fff)"/>
          <rect x="10" y="94" width="260" height="2" fill="var(--hairline)"/>
          <g transform="translate(24,54)"><path d="M5 17 V24 H23 V17" fill="none" stroke="var(--emerson-charcoal)" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"/><line x1="14" y1="2" x2="14" y2="15" stroke="var(--emerson-charcoal)" stroke-width="2.3" stroke-linecap="round"/><polygon points="8,11 14,18 20,11" fill="var(--emerson-charcoal)"/></g>
          <text x="54" y="72" text-anchor="start" font-size="13" font-weight="700" letter-spacing="0.7" fill="var(--emerson-charcoal)">RECEIVED WITH THE SLICE</text>
          <text x="30" y="168" font-size="16" fill="var(--emerson-charcoal)">&#8226;&#160;&#160;Context to Content</text>
          <text x="30" y="206" font-size="16" fill="var(--emerson-charcoal)">&#8226;&#160;&#160;Training Objectives</text>

          <!-- Arrow 1 -->
          <path d="M270 150 H322" stroke="var(--emerson-grey)" stroke-width="3" fill="none"/>
          <polygon points="322,142 336,150 322,158" fill="var(--emerson-grey)"/>

          <!-- Box 2: Delivered — neutral, an equal to box 1 -->
          <rect x="340" y="40" width="260" height="220" rx="6" fill="#fff" stroke="var(--hairline)" stroke-width="1.5" filter="url(#cardShadow)"/>
          <rect x="340" y="40" width="260" height="56" rx="6" fill="color-mix(in srgb, var(--emerson-charcoal) 6%, #fff)"/>
          <rect x="340" y="84" width="260" height="12" fill="color-mix(in srgb, var(--emerson-charcoal) 6%, #fff)"/>
          <rect x="340" y="94" width="260" height="2" fill="var(--hairline)"/>
          <g transform="translate(354,54)"><circle cx="14" cy="6" r="4" fill="var(--emerson-charcoal)"/><line x1="14" y1="10" x2="14" y2="20" stroke="var(--emerson-charcoal)" stroke-width="2.3" stroke-linecap="round"/><line x1="14" y1="13" x2="8" y2="18" stroke="var(--emerson-charcoal)" stroke-width="2.3" stroke-linecap="round"/><line x1="14" y1="13" x2="21" y2="6" stroke="var(--emerson-charcoal)" stroke-width="2.3" stroke-linecap="round"/><line x1="14" y1="20" x2="9" y2="27" stroke="var(--emerson-charcoal)" stroke-width="2.3" stroke-linecap="round"/><line x1="14" y1="20" x2="19" y2="27" stroke="var(--emerson-charcoal)" stroke-width="2.3" stroke-linecap="round"/></g>
          <text x="384" y="64" text-anchor="start" font-size="13" font-weight="700" letter-spacing="0.7" fill="var(--emerson-charcoal)">DELIVERED BY</text>
          <text x="384" y="81" text-anchor="start" font-size="13" font-weight="700" letter-spacing="0.7" fill="var(--emerson-charcoal)">THE INSTRUCTOR</text>
          <text x="360" y="142" font-size="16" fill="var(--emerson-charcoal)">&#8226;&#160;&#160;Student Preparation</text>
          <text x="360" y="178" font-size="16" fill="var(--emerson-charcoal)">&#8226;&#160;&#160;Course Delivery</text>
          <text x="360" y="214" font-size="16" fill="var(--emerson-charcoal)">&#8226;&#160;&#160;Acuminating</text>
          <text x="382" y="238" font-size="16" fill="var(--emerson-charcoal)">Instructor Skills</text>

          <!-- Arrow 2 -->
          <path d="M600 150 H652" stroke="var(--emerson-grey)" stroke-width="3" fill="none"/>
          <polygon points="652,142 666,150 652,158" fill="var(--emerson-grey)"/>

          <!-- Box 3: Scored — the ONE meaningful accent in the diagram. -->
          <rect x="670" y="40" width="260" height="220" rx="6" fill="#fff" stroke="var(--hairline)" stroke-width="1.5" filter="url(#cardShadow)"/>
          <rect x="670" y="40" width="260" height="56" rx="6" fill="var(--emerson-blue)"/>
          <rect x="670" y="84" width="260" height="12" fill="var(--emerson-blue)"/>
          <g transform="translate(684,54)"><rect x="6" y="4" width="16" height="22" rx="2" fill="none" stroke="#fff" stroke-width="2.2"/><rect x="10" y="2" width="8" height="4" rx="1" fill="#fff"/><path d="M9.5 15 L13 18.5 L19 11" fill="none" stroke="#fff" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"/></g>
          <text x="714" y="72" text-anchor="start" font-size="13" font-weight="700" letter-spacing="0.7" fill="#fff">SCORED BY</text>
          <text x="800" y="173" text-anchor="middle" font-size="17" font-weight="700" fill="var(--emerson-charcoal)">Instructor Observation</text>
          <text x="800" y="201" text-anchor="middle" font-size="17" font-weight="700" fill="var(--emerson-charcoal)">Rubric</text>
        </g>
      </svg>
    </figure>
    <p class="tmpl-takeaway" style="margin-bottom:4.2cqh">Tenets 1&ndash;2 come with the slice. IfE spends its time on 3&ndash;5 because that is what gets scored.</p>
    <div class="slide-chrome"><span class="slide-chrome__copyright"></span><span class="slide-chrome__pageno">7</span><img class="slide-chrome__logo" src="../assets/brand/logo-emerson-corp-2c.png" alt="Emerson"></div>
  </article>
</main>
</body>
</html>
