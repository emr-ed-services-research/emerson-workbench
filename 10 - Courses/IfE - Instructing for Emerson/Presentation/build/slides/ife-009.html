<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>IfE &middot; Day 1 &mdash; Show&ndash;Tell&ndash;Do</title>
<link rel="stylesheet" href="../css/emerson-workbench.css">
<script src="../assets/slides.js" defer></script>
</head>
<body class="ew-deck">
<main class="ew-stage">
  <!-- Day 1, module d1-stad, concept 1 [understand], role mechanism.
       Concept: Show-Tell-Do, the core delivery method — a real 3-stage
       sequence, genuinely diagram-worthy (visual-concept check, Course
       Porting Pipeline.md). provenance: original — IfE Vault,
       02 Methodology/Show-Tell-Do.md.
       Color-as-meaning applied deliberately differently than ife-007's
       Received/Delivered/Scored diagram: THERE, one stage (Scored) was
       genuinely distinct, so it alone got the accent. HERE, all three
       stages are equal steps in one method — none is more important than
       the others — so per the same rule, NONE gets a differentiating
       fill; all three boxes are neutral. The numbered circles stay blue
       throughout, same as the roadmap's day badges: a consistent
       sequence-position role marker, not a meaning signal, so it is not
       reserved the way a highlight color is. -->
  <article class="slide slide--tmpl-graph" data-slide="9" data-deck="ife">
    <h1 class="slide-title">Show&ndash;Tell&ndash;Do</h1>
    <figure class="tmpl-plot">
      <svg viewBox="0 0 940 300" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Three-stage flow diagram: Show, then Tell, then Do, connected by arrows, each box neutral in color with a blue numbered circle marking its sequence position.">
        <defs>
          <filter id="cardShadow2" x="-20%" y="-20%" width="140%" height="140%">
            <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#000" flood-opacity="0.12"/>
          </filter>
        </defs>
        <g font-family="Arial, Helvetica, sans-serif">
          <!-- Box 1: Show -->
          <rect x="10" y="40" width="260" height="220" rx="6" fill="#fff" stroke="var(--hairline)" stroke-width="1.5" filter="url(#cardShadow2)"/>
          <rect x="10" y="40" width="260" height="56" rx="6" fill="color-mix(in srgb, var(--emerson-charcoal) 6%, #fff)"/>
          <rect x="10" y="84" width="260" height="12" fill="color-mix(in srgb, var(--emerson-charcoal) 6%, #fff)"/>
          <rect x="10" y="94" width="260" height="2" fill="var(--hairline)"/>
          <circle cx="38" cy="68" r="14" fill="var(--emerson-blue)"/>
          <text x="38" y="73" text-anchor="middle" font-size="15" font-weight="700" fill="#fff">1</text>
          <text x="62" y="73" text-anchor="start" font-size="15" font-weight="700" letter-spacing="0.5" fill="var(--emerson-charcoal)">SHOW</text>
          <text x="30" y="130" font-size="15" fill="var(--emerson-charcoal)">Demonstrate the whole</text>
          <text x="30" y="152" font-size="15" fill="var(--emerson-charcoal)">task, normal pace &mdash;</text>
          <text x="30" y="184" font-size="15" fill="var(--emerson-charcoal)">then again slowly,</text>
          <text x="30" y="206" font-size="15" fill="var(--emerson-charcoal)">narrated.</text>

          <!-- Arrow 1 -->
          <path d="M270 150 H322" stroke="var(--emerson-grey)" stroke-width="3" fill="none"/>
          <polygon points="322,142 336,150 322,158" fill="var(--emerson-grey)"/>

          <!-- Box 2: Tell -->
          <rect x="340" y="40" width="260" height="220" rx="6" fill="#fff" stroke="var(--hairline)" stroke-width="1.5" filter="url(#cardShadow2)"/>
          <rect x="340" y="40" width="260" height="56" rx="6" fill="color-mix(in srgb, var(--emerson-charcoal) 6%, #fff)"/>
          <rect x="340" y="84" width="260" height="12" fill="color-mix(in srgb, var(--emerson-charcoal) 6%, #fff)"/>
          <rect x="340" y="94" width="260" height="2" fill="var(--hairline)"/>
          <circle cx="368" cy="68" r="14" fill="var(--emerson-blue)"/>
          <text x="368" y="73" text-anchor="middle" font-size="15" font-weight="700" fill="#fff">2</text>
          <text x="392" y="73" text-anchor="start" font-size="15" font-weight="700" letter-spacing="0.5" fill="var(--emerson-charcoal)">TELL</text>
          <text x="360" y="130" font-size="15" fill="var(--emerson-charcoal)">Explain the key points</text>
          <text x="360" y="152" font-size="15" fill="var(--emerson-charcoal)">&mdash; the why, the</text>
          <text x="360" y="184" font-size="15" fill="var(--emerson-charcoal)">standard, the failure</text>
          <text x="360" y="206" font-size="15" fill="var(--emerson-charcoal)">points.</text>

          <!-- Arrow 2 -->
          <path d="M600 150 H652" stroke="var(--emerson-grey)" stroke-width="3" fill="none"/>
          <polygon points="652,142 666,150 652,158" fill="var(--emerson-grey)"/>

          <!-- Box 3: Do -->
          <rect x="670" y="40" width="260" height="220" rx="6" fill="#fff" stroke="var(--hairline)" stroke-width="1.5" filter="url(#cardShadow2)"/>
          <rect x="670" y="40" width="260" height="56" rx="6" fill="color-mix(in srgb, var(--emerson-charcoal) 6%, #fff)"/>
          <rect x="670" y="84" width="260" height="12" fill="color-mix(in srgb, var(--emerson-charcoal) 6%, #fff)"/>
          <rect x="670" y="94" width="260" height="2" fill="var(--hairline)"/>
          <circle cx="698" cy="68" r="14" fill="var(--emerson-blue)"/>
          <text x="698" y="73" text-anchor="middle" font-size="15" font-weight="700" fill="#fff">3</text>
          <text x="722" y="73" text-anchor="start" font-size="15" font-weight="700" letter-spacing="0.5" fill="var(--emerson-charcoal)">DO</text>
          <text x="690" y="130" font-size="15" fill="var(--emerson-charcoal)">Learner performs;</text>
          <text x="690" y="152" font-size="15" fill="var(--emerson-charcoal)">immediate, specific</text>
          <text x="690" y="184" font-size="15" fill="var(--emerson-charcoal)">feedback; repeat to</text>
          <text x="690" y="206" font-size="15" fill="var(--emerson-charcoal)">proficiency.</text>
        </g>
      </svg>
    </figure>
    <p class="tmpl-takeaway" style="margin-bottom:4.2cqh">A hands-on slice runs Do-heavy &mdash; 30+ minutes of talking in a 50-minute slice means it&rsquo;s built wrong.</p>
    <div class="slide-chrome"><span class="slide-chrome__copyright"></span><span class="slide-chrome__pageno">9</span><img class="slide-chrome__logo" src="../assets/brand/logo-emerson-corp-2c.png" alt="Emerson"></div>
  </article>
</main>
</body>
</html>
