  <article class="slide slide--tmpl-figrow" data-slide="1" data-deck="om1">
    <h1 class="slide-title">Direct- and Reverse-Acting Actuators</h1>
    <div class="tmpl-row">
      <figure class="tmpl-cell">
        <img src="../assets/sourced/image151.png" alt="Sectional of a direct-acting spring-and-diaphragm actuator: loading pressure enters the top casing above the diaphragm; the spring is below, seated on the yoke; the stem exits the bottom.">
        <figcaption><b>Direct-acting &middot; Fisher 657</b>air on top pushes the stem down; the spring lifts it &mdash; fails up on loss of air</figcaption>
      </figure>
      <figure class="tmpl-cell">
        <img src="../assets/sourced/image152.png" alt="Sectional of a reverse-acting spring-and-diaphragm actuator: loading pressure enters the lower casing below the diaphragm; the spring is above; the stem passes through a sealed bushing.">
        <figcaption><b>Reverse-acting &middot; Fisher 667</b>air lifts the stem; the spring pushes it down &mdash; fails down on loss of air</figcaption>
      </figure>
    </div>
    <p class="tmpl-note">Actuator action is which way loading pressure drives the stem &mdash; and that is what sets whether the stem retracts or extends when instrument air is lost.</p>
