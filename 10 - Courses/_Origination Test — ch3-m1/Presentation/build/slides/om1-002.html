       pdtc-pdto.body-sections — Component Index ch3-cmp-pdtc-pdto-bodies

       are acceptable). Template .slide--tmpl-figrow, 2 cells. -->
  <article class="slide slide--tmpl-figrow" data-slide="2" data-deck="om1">
    <h1 class="slide-title">PDTC vs. PDTO Valve Bodies</h1>
    <div class="tmpl-row">
      <figure class="tmpl-cell">
        <img src="../assets/sourced/image43.png" alt="Sectional of a push-down-to-close globe body: the plug sits above the seat ring, between the actuator stem and the seat; driving the stem down seats the plug.">
        <figcaption><b>Push-down-to-close</b>plug between actuator and seat &mdash; stem extension seats the plug; seat ring is the lower travel stop</figcaption>
      </figure>
      <figure class="tmpl-cell">
        <img src="../assets/sourced/image42.png" alt="Sectional of a push-down-to-open globe body: the seat ring sits above the plug, between the actuator stem and the plug; driving the stem down lifts the plug off the seat.">
        <figcaption><b>Push-down-to-open</b>seat ring between actuator and plug &mdash; stem extension opens the valve; seat ring is the upper travel stop</figcaption>
      </figure>
    </div>
    <p class="tmpl-note">Body orientation is the second half of what sets fail action: the same actuator drives the plug toward the seat on one body and away from it on the other.</p>

  </article>
