<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Template Gallery — Nomenclature (parse)</title>
<link rel="stylesheet" href="../css/emerson-workbench.css">
<link rel="stylesheet" href="../css/gallery.css">
<script src="../assets/slides.js" defer></script>
</head>
<body class="ew-deck">
<main class="ew-stage">
  <article class="slide slide--role-nomenclature-parse" data-slide="16" data-deck="gallery">
    <h1 class="slide-title">Role: Nomenclature (parse) — Three Parts, One Sentence</h1>
    <div class="tpl-content">
      <div class="tpl-parse-keys">
        <button class="tpl-parse-key is-active" type="button" data-part="lorem" data-def="Lorem's real definition — what this part of the sentence actually means.">Lorem</button>
        <button class="tpl-parse-key" type="button" data-part="ipsum" data-def="Ipsum's real definition.">Ipsum</button>
        <button class="tpl-parse-key" type="button" data-part="dolor" data-def="Dolor's real definition.">Dolor</button>
      </div>
      <p class="tpl-parse-sentence"><span class="tpl-tok is-on" data-part="lorem">Lorem ipsum dolor sit amet</span> — <span class="tpl-tok" data-part="ipsum">consectetur adipiscing elit</span> — <span class="tpl-tok" data-part="dolor">sed do eiusmod tempor</span>.</p>
      <p class="tpl-parse-def">Lorem's real definition — what this part of the sentence actually means.</p>
    </div>
    <div class="slide-chrome"><span class="slide-chrome__copyright"></span><span class="slide-chrome__pageno">16</span><img class="slide-chrome__logo" src="../assets/brand/logo-emerson-corp-2c.png" alt="Emerson"></div>
  </article>
</main>
</body>
</html>
