  <article class="slide slide--tmpl-caution" data-slide="12" data-deck="proof">
    <h1 class="slide-title"><span class="slide-title__mark">!</span>Relieve the spring before you open the diaphragm casing</h1>
    <p class="caution-body">
      The upper diaphragm casing carries the full force of the compressed actuator spring.
      Thread the spring adjuster out until <b>all spring compression is relieved</b> before
      removing the casing cap screws, or <b>the casing is thrown off</b>.
    </p>
    <figure class="caution-fig">
      <img src="../assets/sourced/657-spring-under-casing.png" alt="Sectional of the Fisher 657 upper and lower diaphragm casings enclosing the compressed actuator spring, showing the spring load path into the upper casing">
