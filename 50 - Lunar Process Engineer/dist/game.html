  start:startLevel2,
});
if(!window.LPE_GAME) startLevel2();

</script>
<script>

'use strict';
/* ============================================================
   LEVEL THREE \u2014 THE DOSING SKID

   The duty: 0.50 gpm of feed to two beds, both inside 1.4-1.8 mS/cm.
   The dose rate is already correct. The beds are not.

   The fault is the mixing run. At 0.50 gpm a 3/4 in line runs at Re 1913
   - laminar - and laminar flow does not mix. The concentrate ribbons
   through without blending, so the near bed takes a rich cut and the far
   bed takes a weak one.

   TWO fixes clear it, and they repair different things.

   Right-size the run. Calling this counterintuitive was wrong: at the
   0.50 gpm duty the 3/4 line sits at 0.30 ft/s against a 2-8 ft/s design
   band, so it is not merely unmixed, it is ten times too big. A 1/4 in
   run is 1.54 ft/s and Re 4319 - turbulent, and it mixes - for 0.061 psi.
   This repairs the oversize AND the mixing together.

   Fit a static mixer. It blends by dividing and recombining the stream,
   so it does not need turbulence at all: it works at Re 1913 as the line
   stands, for about 0.004 psi. But it repairs the mixing only - the run
   is still at 0.30 ft/s afterwards, and the level says so.

   A premix tank is the third answer and is deliberately NOT here: it
   deletes the proportional injector rather than repairing it. Dose-on-
   demand was chosen on a colony because a batch tank means standing
   dilute nutrient solution - biofilm, EC drift from selective uptake,
   plus agitator, level control and a transfer pump. That trade is the
   subject of its own level (the blend tank), not this one.

   Checked before it was built (reference/crosscheck.js):
     fitted        Re      BED A   BED B
     3/4          1913    2.32    0.88    fail
     1/2          2532    2.22    0.98    fail
     3/8          3184    1.95    1.25    fail
     1/4          4319    1.60    1.60    PASS  (and v 0.30 -> 1.54)
     static mix   1913    1.60    1.60    PASS  (v stays 0.30)
   and the duty blocks the brute force: holding the 3/4 run and winding
   the feed up until it mixes needs 0.92 gpm, against a duty of 0.50.
   (That figure read 1.10 here for a while and was simply wrong - the
   crosscheck computes it now rather than trusting the comment.)
   ============================================================ */
function startLevel3(){
const A=LPE.art, P=LPE.palette, W=900, H=400;
const FL=LPE_FLUIDS;

/* ---- the duty ---- */
const DUTY=0.50, EC_T=1.6, EC_LO=1.4, EC_HI=1.8, SPREAD=0.45;
const FEED_MAX=1.20;

/* ASME B36.10M bores, the same table sizing.js carries. */
const RUNS=[
  {k:'3/4', bore:0.824, area:0.00370, label:'3/4 in'},
  {k:'1/2', bore:0.622, area:0.00211, label:'1/2 in'},
  {k:'3/8', bore:0.493, area:0.00133, label:'3/8 in'},
  {k:'1/4', bore:0.364, area:0.000724, label:'1/4 in'},
  /* Not a pipe size: a spool with helical elements in it. Same bore as the
     main, so the velocity does not change - only the blending does. */
  {k:'mix', bore:0.824, area:0.00370, label:'STATIC MIX', mixer:true},
];

const S={ feed:0, run:'3/4', drag:false, lastAng:0, turn:0, closing:false, picking:false };

/* ---- layout, one table ----
   Everything on the feed sits on ONE centreline. The first pass had the
   injector 19 px below the mixing run, so the line visibly stepped where
   nothing happens, and the readout's footer printed over its own last
   row. */
const PIPE_Y=256;

/* Drawn bore follows the real bore. The main is 3/4 in at R_MAIN, and every
   spare is scaled off it by bore ratio, so the pipe the player fits is
   visibly the size the table says it is - which is the whole lesson. */
const R_MAIN=11, MAIN_BORE=0.824;
const rOf=bore=>Math.max(4, Math.round(R_MAIN*bore/MAIN_BORE*10)/10);
const R_BED=7;

const LAY={
  pen  : {x:16},                                  // the feed comes through a wall
  tank : {x:177, y:92,  w:86,  h:92},   // directly over the injector
  wheel: {x:132, y:PIPE_Y-62, r:26},
  inj  : {x:196, y:PIPE_Y-21, w:48,  h:42},
  mix  : {x:316, y:PIPE_Y, w:232},                // centreline run, bore varies
  split: {x:606, y:PIPE_Y},
  bedA : {x:664, y:157, w:96, h:66},   // riser 66 up from PIPE_Y
  bedB : {x:664, y:290, w:96, h:66},   // riser 67 down
  rack : {x:316, y:318, w:286, h:52},   // five spares now, not four
  read : {x:620, y:30,  w:238, h:124},  // 5 rows + footer, clear of BED A
};
/* The spool sits between two flanges. Anything narrower than the main needs
   a reducer at each end, and that pair is drawn, not implied. */
const RED_W=18;
const bedAY=()=>LAY.bedA.y+LAY.bedA.h/2, bedBY=()=>LAY.bedB.y+LAY.bedB.h/2;

function runNow(){ return RUNS.find(r=>r.k===S.run) || RUNS[0]; }

/* ---- the model ----
   Mixedness is a straight ramp across the transition band: nothing below
   Re 2300, complete above 4000. The ramp is the honest shape - the
   transition really is gradual - and it is the same band the bench taught
   on, so the number the player learned there means the same thing here. */
function solve(){
  const q = FEED_MAX*S.feed;
  const r = runNow();
  const v = q/448.831/r.area;
  const re = q>0.004 ? FL.reynolds(v, r.bore, FL.FLUIDS.water, 20) : 0;
  /* A static mixer blends mechanically, so Re stops governing the moment
     one is fitted. The Re readout still tells the truth about the line. */
  const mix = r.mixer ? (q>0.004 ? 1 : 0)
                      : Math.max(0, Math.min(1, (re-2300)/1700));
  /* With the dose correct, poor mixing does not change the average - it
     splits it. The near tap takes the rich side of the ribbon, the far
     tap takes what is left. */
  const spread = q>0.004 ? (1-mix)*SPREAD : 0;
  const ecA = q>0.004 ? EC_T*(1+spread) : 0;
  const ecB = q>0.004 ? EC_T*(1-spread) : 0;
  /* Velocity is a separate verdict from mixing: a mixer leaves the run
     oversized and the level is not allowed to pretend otherwise.

     The flag trips at 1.0 ft/s, not at the bottom of the 2-8 ft/s design
     band. 2.0 flagged the 1/4 spool at 1.54 - the level's own winning
     answer - as if it were deficient, which is the wrong thing to tell
     someone who just got it right. 1.54 is reasonable for a small feed
     branch; 0.30 is where you start worrying about what settles out of a
     line that slow. The band still gets named in the debrief. */
  const slow = q>0.004 && v < 1.0;
  return { q, v, re, mix, ecA, ecB, r, slow,
           regime: q<=0.004 ? 'still' : FL.regime(re),
           inBand: ecA>=EC_LO && ecA<=EC_HI && ecB>=EC_LO && ecB<=EC_HI,
           onDuty: Math.abs(q-DUTY)<=0.03 };
}

/* ---- scenery, composed once ---- */
let BG;
function buildScene(){
  BG=document.createElement('canvas'); BG.width=W; BG.height=H;
  const g=BG.getContext('2d');
  A.wall(g,W,H); A.rib(g,0,H); A.rib(g,866,H); A.ceiling(g,W);
  A.overhead(g,W,58,8,false);
  A.floor(g,W,344);
  A.vignetteOnto(g,W,H);                 // room first, then signage on top
  A.stencil(g,48,110,'THE GARDEN',20,'#8b949b');
  A.stencil(g,48,130,'NUTRIENT DOSING SKID',14);   // the bay is in the header
  A.stencil(g,316,214,'MIXING RUN',11,'#8b949b');
  A.stencil(g,316,310,'SPARES',11,'#8b949b');
  A.toolbox(g,60,330);
}

/* ---- the skid ----
   Built the way levels 1 and 2 are: the metal is declared as runs and
   fittings and handed to LPE.piping(), which draws bodies, then collars,
   then every bore last so nothing paints over another fitting's opening.
   The earlier version of this level drew the whole skid as flat bars with
   LPE.pipeRun() - no walls, no elbows, no tees - and the runs started at
   x=0, so the feed was clipped by the panel edge instead of entering
   through the wall. The injector also sat LEFT of the valve while the draw
   order went main -> valve -> injector, which asked for a run of negative
   width and left a hole in the line.                                     */
let NET=null, NETKEY='', FLOW=null;

function netKey(){ return S.run; }

function buildNet(){
  const T=LAY.tank, I=LAY.inj, M=LAY.mix, SP=LAY.split;
  const r=runNow(), rr=rOf(r.bore), small=r.bore<MAIN_BORE-1e-6;
  const x0=M.x, x1=M.x+M.w;                       // the spool's own ends
  const a0=x0+RED_W, a1=x1-RED_W;                 // where the spool bore starts
  const injX=I.x+I.w/2;

  const lines=[
    // feed in through the wall, through the valve, to the injector
    {pts:[[LAY.pen.x+12,PIPE_Y],[I.x,PIPE_Y]], r:R_MAIN},
    // injector out to the mixing run
    {pts:[[I.x+I.w,PIPE_Y],[small?x0:a0,PIPE_Y]], r:R_MAIN},
    // the spool itself
    {pts:[[small?a0:x0,PIPE_Y],[small?a1:x1,PIPE_Y]], r:rr},
    // out of the spool to the split, then on to the two beds
    {pts:[[small?a1:x1,PIPE_Y],[SP.x,PIPE_Y]], r:R_MAIN},
    {pts:[[SP.x,PIPE_Y],[SP.x,bedAY()],[LAY.bedA.x,bedAY()]], r:R_BED},
    {pts:[[SP.x,PIPE_Y],[SP.x,bedBY()],[LAY.bedB.x,bedBY()]], r:R_BED},
    // stock suction: straight down out of the tank into the injector
    {pts:[[injX,T.y+T.h],[injX,PIPE_Y-I.h/2]], r:5},
  ];
  return {
    net: LPE.piping({
      lines,
      /* No tee here. The engine's tee is a side-outlet whose branch leaves
         along +x; this split sends one branch up and one down, which that
         fitting cannot describe. A flanged split with a radiused elbow each
         way is what a small two-bed split is actually built from. */
      tees:[],
      reducers: small
        ? [{x0:x0,x1:a0,y:PIPE_Y,r1:R_MAIN,r2:rr},
           {x0:a1,x1:x1,y:PIPE_Y,r1:rr,r2:R_MAIN}]
        : [],
      fittings:[{x:LAY.pen.x+30,y:PIPE_Y,r:R_MAIN,kind:'union'},
                {x:SP.x-R_MAIN,y:PIPE_Y,r:R_MAIN,kind:'union'}],
    }),
    rr, small, a0, a1, x0, x1,
  };
}

/* The fluid is the engine's Line, the same object levels 1 and 2 carry, so
   every marker in the game is the one square marker() draws. The dosing
   skid used to stamp its own fillRects in its own colours and sizes. */
/* The bed branches leave the main and turn through a 90. Built as straight
   segments they drove into the corner and turned on a point, so the markers
   crossed the outside of a bend the metal had drawn as a curve. Handing the
   same polyline to LPE.runSegments() fillets it off the radius piping()
   uses, so the fluid goes round the elbow the way the pipe does. */
let BRANCH_A=null, BRANCH_B=null;
function buildFlow(){
  const I=LAY.inj, SP=LAY.split, G=NET;
  BRANCH_A=[[SP.x,PIPE_Y],[SP.x,bedAY()],[LAY.bedA.x,bedAY()]];
  BRANCH_B=[[SP.x,PIPE_Y],[SP.x,bedBY()],[LAY.bedB.x,bedBY()]];
  FLOW=new LPE.Line({
    r:R_MAIN,
    segments:[
      {ax:LAY.pen.x+12, ay:PIPE_Y, bx:I.x,  by:PIPE_Y, r:R_MAIN},
      {ax:I.x+I.w, ay:PIPE_Y, bx:G.small?G.a0:G.x0, by:PIPE_Y, r:R_MAIN},
      {ax:G.small?G.a0:G.x0, ay:PIPE_Y, bx:G.small?G.a1:G.x1, by:PIPE_Y, r:G.rr},
      {ax:G.small?G.a1:G.x1, ay:PIPE_Y, bx:SP.x, by:PIPE_Y, r:R_MAIN},
    ].concat(LPE.runSegments(BRANCH_A, R_BED))
     .concat(LPE.runSegments(BRANCH_B, R_BED)),
  });
  NBR = LPE.runSegments(BRANCH_A, R_BED).length;   // where the branches start
}
let NBR=0;

function syncNet(){
  const k=netKey();
  if(k===NETKEY && NET) return;
  NETKEY=k; NET=buildNet(); buildFlow();
}

/* Flow is advanced in step(dt), not in draw(), so the markers move at a
   rate tied to real time rather than to how often the frame happens to
   be painted - the same split levels 1 and 2 use. */
function stepFlow(dt,s){
  syncNet();
  const live=s.q>0.004, f=live?Math.min(1,s.v/3):0;
  FLOW.regime = s.regime==='still' ? 'laminar' : s.regime;
  for(let i=0;i<FLOW.segs.length;i++) FLOW.set(i,{flow: i>=4 ? f*0.5 : f});   // 0-3 feed, the rest branches
  FLOW.update(dt);
}

function drawSkid(g,s){
  const T=LAY.tank, I=LAY.inj, M=LAY.mix, injX=I.x+I.w/2;
  syncNet();

  // stock tank
  g.fillStyle='#2b343a'; A.rr(g,T.x,T.y,T.w,T.h,6); g.fill();
  g.fillStyle='#39444b'; g.fillRect(T.x,T.y,T.w,5);
  const lv=T.y+26;
  g.fillStyle='rgba(126,196,122,0.55)'; g.fillRect(T.x+6,lv,T.w-12,T.h-(lv-T.y)-8);
  g.fillStyle='rgba(160,220,150,0.8)'; g.fillRect(T.x+6,lv,T.w-12,2);
  g.strokeStyle='#4a565d'; g.lineWidth=2; A.rr(g,T.x,T.y,T.w,T.h,6); g.stroke();
  g.fillStyle=P.rim; g.font="11px 'VT323',monospace"; g.textAlign='center';
  g.fillText('STOCK',T.x+T.w/2,T.y+18);
  g.font="9px 'VT323',monospace"; g.fillStyle='#8fb9ff';
  g.fillText('SG 1.22',T.x+T.w/2,T.y+T.h+13);
  g.textAlign='left';

  // all the metal, in one pass, bores last
  NET.net.draw(g);
  LPE.penetration(g, LAY.pen.x, PIPE_Y, R_MAIN);

  // the fluid, through the bores the metal just opened
  const live=s.q>0.004;
  FLOW.draw(g);

  // the valve sits IN the line
  LPE.valveBody(g, LAY.wheel.x, PIPE_Y, R_MAIN, LAY.wheel.y, S.turn, LAY.wheel.r,
                !S.closing, live);

  // the injector body, straddling the run
  g.fillStyle='#4a565d'; A.rr(g,I.x,I.y,I.w,I.h,4); g.fill();
  g.fillStyle='#6d7a84'; g.fillRect(I.x,I.y,I.w,2);
  g.strokeStyle='#2b343a'; g.lineWidth=2; A.rr(g,I.x,I.y,I.w,I.h,4); g.stroke();
  g.fillStyle=P.rim; g.font="9px 'VT323',monospace"; g.textAlign='center';
  g.fillText('1:100',I.x+I.w/2,I.y+I.h/2+3);
  g.textAlign='left';

  /* The concentrate. This is the one fluid the level draws itself, because
     it is not the carrier - it is the dosed stream, and whether it has
     blended INTO the carrier is the entire puzzle. It rides the same square
     marker shape and the same size as every other fluid in the game; only
     the hue says "this is the concentrate".

     It used to be drawn only inside the mixing run, which meant the thing
     the skid exists to do - injecting - was never shown. Nothing came down
     the suction line and nothing appeared between the injector and the
     spool, so the concentrate simply materialised in the middle of the
     pipe. It is now drawn where it actually goes: down out of the stock
     tank, into the injector, and then the whole way along the feed. */
  if(live){
    const t=performance.now()*0.001;
    const CONC='rgba(126,196,122,0.9)';
    const dot=(x,y)=>{ g.fillStyle=CONC; g.fillRect(x-1.2,y-1.2,2.4,2.4); };

    /* 1. down the suction, out of the tank into the injector. At 1:100 this
       is a trickle beside the carrier, and it is drawn as one. */
    const sy0=T.y+T.h, sy1=PIPE_Y-I.h/2, sLen=sy1-sy0;
    for(let i=0;i<5;i++){
      const py=sy0+((i*(sLen/5) + t*26)%sLen);
      dot(injX, py);
    }

    /* 2. along the feed, from the injector outlet to the split. The bore it
       is confined by changes with the fitted spool, and so does how much of
       it has blended by the time it gets to any given point. */
    const xi=I.x+I.w, xsp=LAY.split.x;
    const x0=NET.x0, x1=NET.x1, a0=NET.a0, a1=NET.a1, rr=NET.rr;
    const radAt=px=>{
      if(!NET.small || px<=x0 || px>=x1) return R_MAIN;
      if(px<a0) return R_MAIN+(rr-R_MAIN)*(px-x0)/(a0-x0);
      if(px>a1) return rr+(R_MAIN-rr)*(px-a1)/(x1-a1);
      return rr;
    };
    /* Blending happens ACROSS the run, not at a line. Before the spool the
       stock is still a rope of neat concentrate; by the far flange it has
       whatever mixedness the run achieved. */
    const mixAt=px=> px<=x0 ? 0 : px>=x1 ? s.mix : s.mix*(px-x0)/(x1-x0);
    const span=xsp-xi;
    for(let i=0;i<40;i++){
      const px=xi+((i*(span/40) + t*s.v*52)%span);
      const m=mixAt(px);
      /* laminar: the concentrate stays a band in the upper half and the
         water under it never gets any. turbulent: it is everywhere. */
      const lane = m>=1 ? (Math.random()*2-1)
                 : (Math.random()*2-1)*m + (1-m)*(-0.45);
      dot(px, PIPE_Y+lane*radAt(px)*0.82);
    }

    /* 3. past the split, each bed gets what its own tap drew. Unmixed, the
       near bed is taking the rich side of the rope and the far bed is not.

       Walked along the whole branch PATH, riser included. Drawing only the
       horizontal leg left the two vertical runs out of the split empty,
       so the concentrate appeared to jump the elbow. */
    const along=(pts,u)=>{
      const seg=[]; let L=0;
      for(let i=1;i<pts.length;i++){
        const d=Math.hypot(pts[i][0]-pts[i-1][0], pts[i][1]-pts[i-1][1]);
        seg.push(d); L+=d;
      }
      let d=((u%1)+1)%1*L;
      for(let i=0;i<seg.length;i++){
        if(d<=seg[i] || i===seg.length-1){
          const f=seg[i]?Math.min(1,d/seg[i]):0;
          const ax=pts[i][0], ay=pts[i][1], bx=pts[i+1][0], by=pts[i+1][1];
          const ux=(bx-ax)/(seg[i]||1), uy=(by-ay)/(seg[i]||1);
          return [ax+(bx-ax)*f, ay+(by-ay)*f, -uy, ux];   // point + across-pipe normal
        }
        d-=seg[i];
      }
    };
    [[BRANCH_A, s.ecA],[BRANCH_B, s.ecB]].forEach(([pts,ec])=>{
      const path=LPE.runPoly(pts, R_BED);       // the same bend the metal has
      const n=Math.max(0,Math.round(9*ec/EC_T));
      for(let i=0;i<n;i++){
        const [px,py,nx,ny]=along(path, i/n + t*s.v*0.22);
        const j=(Math.random()*2-1)*R_BED*0.66;
        dot(px+nx*j, py+ny*j);
      }
    });
  }

  /* If the player fitted a mixer they should be able to SEE what is in the
     run, not just read its name. The elements are drawn inside the bore,
     after the fluid, because they are what the fluid is being folded
     through - the rack icon is the same object seen end-on. */
  if(runNow().mixer){
    const rr=rOf(runNow().bore), x0=NET.x0, x1=NET.x1, n=7;
    g.strokeStyle='rgba(159,216,160,0.75)'; g.lineWidth=2; g.lineCap='round';
    for(let i=0;i<n;i++){
      const ex=x0+24+i*((x1-x0-48)/(n-1)), k=(i%2)?1:-1;
      g.beginPath();
      g.moveTo(ex-9, PIPE_Y+k*rr*0.62);
      g.quadraticCurveTo(ex, PIPE_Y-k*rr*0.70, ex+9, PIPE_Y+k*rr*0.62);
      g.stroke();
    }
    g.lineCap='butt';
  }

  g.fillStyle=P.amber; g.font="11px 'VT323',monospace"; g.textAlign='center';
  g.fillText(runNow().label, M.x+M.w/2, PIPE_Y-rOf(runNow().bore)-14);
  g.textAlign='left';

  // the beds, coloured by how far off band they are
  [[LAY.bedA,s.ecA,'BED A'],[LAY.bedB,s.ecB,'BED B']].forEach(([bd,ec,name])=>{
    const ok = ec>=EC_LO && ec<=EC_HI;
    g.fillStyle='#232a2f'; A.rr(g,bd.x,bd.y,bd.w,bd.h,4); g.fill();
    g.strokeStyle= live ? (ok?'#39ff6a':'#c0493b') : '#4a565d';
    g.lineWidth=2; A.rr(g,bd.x,bd.y,bd.w,bd.h,4); g.stroke();
    for(let i=0;i<5;i++){                      // a row of plants, greener when fed right
      const px=bd.x+12+i*17, base=bd.y+bd.h-10;
      const vig = !live ? 0.25 : (ok?1:(ec>EC_HI?0.55:0.4));
      g.strokeStyle='rgba('+Math.round(90+40*vig)+','+Math.round(120+90*vig)+',90,'+(0.5+0.4*vig)+')';
      g.lineWidth=2;
      g.beginPath(); g.moveTo(px,base); g.lineTo(px,base-10-8*vig); g.stroke();
      g.beginPath(); g.moveTo(px,base-8); g.lineTo(px-5,base-14-5*vig); g.stroke();
      g.beginPath(); g.moveTo(px,base-8); g.lineTo(px+5,base-14-5*vig); g.stroke();
    }
    g.fillStyle=P.rim; g.font="10px 'VT323',monospace";
    g.fillText(name,bd.x+6,bd.y+13);
    g.fillStyle= !live ? '#5d6a73' : (ok?'#39ff6a':'#ffd24a');
    g.font="14px 'VT323',monospace"; g.textAlign='right';
    g.fillText(live?ec.toFixed(2):'\u2014', bd.x+bd.w-7, bd.y+14);
    g.textAlign='left';
  });
}

/* ---- the spares rack: four sections, one fitted ---- */
function rackBtns(){
  const R=LAY.rack, n=RUNS.length, w=R.w/n-6;
  return RUNS.map((r,i)=>({ r, x:R.x+i*(R.w/n), y:R.y, w, h:R.h }));
}
function drawRack(g){
  const live=!S.closing && !SH.done ? true : true;
  rackBtns().forEach(b=>{
    const on=b.r.k===S.run;
    g.fillStyle = on?'#2f3b34':'#232a2f'; A.rr(g,b.x,b.y,b.w,b.h,3); g.fill();
    g.strokeStyle = on?P.amber:'#44505a'; g.lineWidth= on?2:1;
    A.rr(g,b.x,b.y,b.w,b.h,3); g.stroke();
    // the section, end on
    const cx=b.x+b.w/2, cy=b.y+20, R0=13, wall=R0*(1-b.r.bore/0.824)*0.55+3;
    g.fillStyle='#78848d'; g.beginPath(); g.arc(cx,cy,R0,0,6.284); g.fill();
    g.fillStyle='#c3ccd3'; g.beginPath();
    g.arc(cx,cy,R0,-2.4,-0.7); g.arc(cx,cy,R0-wall,-0.7,-2.4,true); g.fill();
    g.fillStyle='#0b1013'; g.beginPath(); g.arc(cx,cy,R0-wall,0,6.284); g.fill();
    /* The mixer has the main's bore, so end-on it would be indistinguishable
       from the 3/4 spool. What is different is what is INSIDE it: the
       helical elements you are looking down the axis of. */
    if(b.r.mixer){
      const rb=R0-wall;
      g.strokeStyle = on?'#9fd8a0':'#6d7a84'; g.lineWidth=2; g.lineCap='round';
      [-0.6,0.6].forEach(k=>{
        g.beginPath();
        g.moveTo(cx-rb*0.78, cy+k*rb*0.55);
        g.quadraticCurveTo(cx, cy-k*rb*0.62, cx+rb*0.78, cy+k*rb*0.55);
        g.stroke();
      });
      g.lineCap='butt';
    }
    g.fillStyle = on?P.amber:'#8e9aa3'; g.font="10px 'VT323',monospace"; g.textAlign='center';
    g.fillText(b.r.label, cx, b.y+b.h-6);
    g.textAlign='left';
  });
}

/* ---- readout ---- */
function drawRead(g,s){
  const R=LAY.read;
  g.fillStyle='#232a2f'; A.rr(g,R.x,R.y,R.w,R.h,4); g.fill();
  g.strokeStyle='#4a565d'; g.lineWidth=2; A.rr(g,R.x,R.y,R.w,R.h,4); g.stroke();
  const rows=[
    ['FEED', s.q.toFixed(2)+' gpm', s.onDuty?'#39ff6a':'#ffd24a'],
    ['MIX RUN Re', s.re>0?Math.round(s.re).toLocaleString('en-US'):'\u2014', '#39ff6a'],
    /* On the panel because the debrief names it: a mixer clears the beds
       and leaves this reading low, and the player has to be able to see
       that for themselves rather than be told it. */
    ['VELOCITY', s.q>0.004?s.v.toFixed(2)+' ft/s':'\u2014',
     s.q<=0.004?'#8b949b':(s.slow?'#ffd24a':'#39ff6a')],
    ['REGIME', s.regime.toUpperCase(),
     s.regime==='laminar'?'#8fb9ff':(s.regime==='turbulent'?'#ffd24a':'#8b949b')],
    ['MIXED', s.q>0.004?Math.round(s.mix*100)+' %':'\u2014',
     s.mix>0.72?'#39ff6a':'#c0493b'],
  ];
  rows.forEach((c,i)=>{
    const y=R.y+12+i*20;
    g.fillStyle=P.rim; g.font="10px 'VT323',monospace"; g.textAlign='left';
    g.fillText(c[0],R.x+10,y+9);
    g.fillStyle=s.q>0.004?c[2]:'#5d6a73';
    g.font="15px 'VT323',monospace"; g.textAlign='right';
    g.fillText(c[1],R.x+R.w-10,y+9);
  });
  g.textAlign='left';
  g.fillStyle='#7a6b54'; g.font="9px 'VT323',monospace";
  g.fillText('TARGET  '+DUTY.toFixed(2)+' gpm  \u00b7  EC '+EC_LO+'-'+EC_HI,R.x+10,R.y+R.h-6);
}

/* ---- script ---- */

  { task:'Open the feed valve. The beds are asking for '+DUTY.toFixed(2)+' gpm.',
    ok:s=>s.onDuty,
    lesson:'Dose rate is right &mdash; the injector is set at 1:100 and it holds that '+
      'ratio whatever the flow does. But bed A is reading high and bed B is reading '+

  { task:'Both beds are off band. Read MIX RUN Re and REGIME before you touch anything.',
    ok:s=>s.onDuty && s.re>0,
    watch:2.4,
    lesson:'Re 1,913 in the mixing run, and that is <b>laminar</b>. Laminar flow '+
      'travels in layers that do not mix, so the stock never blends into the water '+
      '&mdash; it rides through as a ribbon. Bed A taps the rich side of it and bed '+
      'B gets what is left.' },
  { task:'Fix the mixing. Hold '+DUTY.toFixed(2)+' gpm and bring both beds inside '+EC_LO+'-'+EC_HI+'.',
    ok:s=>s.onDuty && s.inBand && !S.drag,
    /* Two parts clear this step and they do not deserve the same debrief. */
    lesson:s=>s.r.mixer
      ? 'The mixer blends by cutting the stream and folding it back on itself, '+
        'so it never needed turbulence &mdash; it is working at Re 1,913. Both '+
        'beds are on number. Note what it did <b>not</b> fix: VELOCITY still '+
        'reads '+s.v.toFixed(2)+' ft/s against a 2-8 band. The run is still a '+
        'size too big; you have stopped it mattering.'
      : 'A smaller pipe. Same half gallon a minute through a 1/4 in run is '+
        s.v.toFixed(2)+' ft/s instead of 0.30, Re '+Math.round(s.re).toLocaleString('en-US')+
        ' instead of 1,913, and turbulent flow mixes. That run was never sized '+
        'for this duty &mdash; 0.30 ft/s against a 2-8 band is ten times too '+
        'big. Right-size it and the mixing comes free.' },
];
let si=0;
function say(){ if(SH.holding||SH.done||S.closing) return;
  SH.say(STEPS[si].task,''); SH.count((si+1)+' / '+STEPS.length); }

/* The debrief has to be honest that there was more than one way through,
   and that the one nobody could do tonight is the one an engineer would
   draw. Both solves land on the same first card; the second names what
   the player did not do. */
const CLOSING=[
  '<span class="who">COMMS:</span> Both beds on number. Nobody touched the dose and '+
  'nothing was blocked.<span class="gap"></span>Somebody specified that run a size up '+
  'to be safe. Reasonable instinct, wrong answer &mdash; and it took three weeks of '+
  'blaming the injector before anyone measured the Reynolds number in the pipe.',

  '<span class="who">COMMS:</span> Worth saying what you had tonight was a spares '+
  'rack.<span class="gap"></span>With a parts order you would put a <b>static mixer</b> '+
  'in that run and be done: it folds the stream back through itself, so it blends at '+
  'Re 1,913 without needing turbulence at all, for about four thousandths of a psi.',

  '<span class="who">COMMS:</span> And the one that is not a repair at all &mdash; '+
  'premix in a <b>batch tank</b>. Make it up, stir it, read the EC before anything '+
  'drinks it.<span class="gap"></span>That deletes the injector instead of fixing it. '+
  'It is the right answer on a farm.',

  '<span class="who">COMMS:</span> It is a harder call up here. A batch tank means '+
  'dilute nutrient standing warm in a closed colony &mdash; biofilm, and the EC drifts '+
  'as the plants pull ions out unevenly.<span class="gap"></span>Dose-on-demand was '+
  'chosen for a reason. Bay 7 runs the other way. You will see it.',
];
let ci=0, closeT=0;
function closeOut(i){
  if(i>=CLOSING.length){
    S.closing=false;
    SH.finish({ lesson:CLOSING[CLOSING.length-1],
      next:()=>LPE.next && LPE.next() });
    return;
  }
  S.closing=true;
  SH.beat(CLOSING[i], ()=>closeOut(i+1));
}

/* ---- frame ---- */
function step(dt){
  const s=solve();
  stepFlow(dt,s);
  S.turn += (S.feed - S.turn)*Math.min(1,dt*6);
  /* !SH.holding matters, and its absence cost level 4 its whole middle
     lesson. While a beat is on screen the sim keeps running, so the NEXT
     step's ok() is already being polled: its watch timer runs down behind
     the text the player is still reading, and the moment it expires
     SH.beat() is called mid-hold, hits `if(S._holding) return`, and is
     dropped - but si has already advanced, so that lesson is gone and the
     level jumps straight to the step after it. Levels 1 and 2 guard this;
     levels 3 and 4 did not. */
  if(!SH.done && !S.closing && !SH.holding && STEPS[si]){
    const st=STEPS[si];
    if(st.ok(s)){
      if(st.watch){ closeT+=dt; if(closeT<st.watch) return; }
      closeT=0;
      const lesson = typeof st.lesson==='function' ? st.lesson(s) : st.lesson;
      /* Advance only if the beat actually took. Belt and braces behind
         the guard above: a lesson must never be lost in silence. */
      const last=si+1>=STEPS.length;
      if(SH.beat(lesson, last?()=>closeOut(0):say)) si++;
    } else closeT=0;
  }
}
function draw(g){
  if(!BG) buildScene();
  const s=solve();
  g.drawImage(BG,0,0);
  drawSkid(g,s); drawRack(g); drawRead(g,s);
}

const cv=SH.canvas;
cv.addEventListener('pointerdown',e=>{
  LPE.audio.init(); LPE.audio.resume();
  const p=SH.pt(e);
  for(const b of rackBtns()){
    if(p.x>=b.x && p.x<=b.x+b.w && p.y>=b.y && p.y<=b.y+b.h){
      if(S.run!==b.r.k){ S.run=b.r.k; LPE.audio.clack(); }
      return;
    }
  }
  const Wl=LAY.wheel;
  if(Math.hypot(p.x-Wl.x,p.y-Wl.y)<Wl.r+18){
    S.drag=true; S.lastAng=Math.atan2(p.y-Wl.y,p.x-Wl.x);
    cv.setPointerCapture(e.pointerId); LPE.audio.startFlow();
  }
});
cv.addEventListener('pointermove',e=>{
  if(!S.drag) return;
  const p=SH.pt(e), Wl=LAY.wheel, a=Math.atan2(p.y-Wl.y,p.x-Wl.x);
  let d=a-S.lastAng;
  while(d>Math.PI) d-=6.2832; while(d<-Math.PI) d+=6.2832;
  S.lastAng=a;
  const before=S.feed;
  S.feed=Math.max(0,Math.min(1,S.feed+d/(2*6.2832)));
  /* The duty is a number to hit, not a pixel to find: within a touch of
     it the wheel is pulled onto it. */
  const dutyPos=DUTY/FEED_MAX;
  if(Math.abs(S.feed-dutyPos)<0.035) S.feed=dutyPos;
  if(Math.floor(S.feed*18)!==Math.floor(before*18)) LPE.audio.tick();
});
['pointerup','pointercancel'].forEach(k=>cv.addEventListener(k,()=>{S.drag=false;}));
}

        leaves the tail alone on a line. */
     text:'&ldquo;Bay 3 again. The beds at the near end are burning<br>'+
          'and the far end is starving, off the same feed.<br>'+
          'Dosing says the injector is fine. Go and find out.&rdquo;'},
  ],
  /* Both rungs already exist on the bench and have never had a level.
     Reynolds is what the player measures here; specific gravity is why a
     heavier stock rides as a ribbon instead of blending. */
  teach:['reynolds','specific-gravity'],
  start:startLevel3,
});
if(!window.LPE_GAME) startLevel3();

</script>
<script>

'use strict';
/* ============================================================
   LEVEL FOUR \u2014 THE MIST HEADER

   The Garden runs hypobaric at 51 kPa (design doc, 2026-10-07). The
   Thermal Reservoir header is the same 60 psig as every other level. That
   pressure ratio is what makes this level: 74.7 psia into 7.4 psia is
   67.3 psi of drop, and a single-stage trim cannot take it.

       choked when   dP >= FL^2 (P1 - FF.Pv)       Fisher CVH ch5
       FF = 0.96 - 0.28 sqrt(Pv/Pc)

   P2 stays well above Pv, so this is CAVITATION, not flashing - the
   design doc's step 8 was corrected on exactly this point. The dip
   happens inside the valve and recovers; the bubbles collapse on the
   trim and eat it.

   The fix is staged trim, and the duty makes it a squeeze rather than a
   dial. With Cv 0.35 a stage and a 1.50 gpm misting duty:

     stages  dP/stage  last inlet  allowable          flow
       1       67.3       74.7       60.2   CAVITATES  2.87
       2       33.7       41.0       33.0   CAVITATES  2.03
       3       22.4       29.8       23.9   clear      1.66  <- the answer
       4       16.8       24.2       19.4   clear      1.44  starves
       5       13.5       20.9       16.6   clear      1.28  starves

   Too few and the bottom stage chokes. Too many and the header cannot
   pass the duty. Verified in reference/crosscheck.js on every build.
   ============================================================ */
function startLevel4(){
const A=LPE.art, P=LPE.palette, W=900, H=400;
const FL=LPE_FLUIDS;

/* ---- the conditions ---- */
const POD_KPA=51, P_SUP_G=60, DUTY=1.50, FLV=0.90, CV_STAGE=0.35;
const P1=P_SUP_G+FL.ATM, P2=POD_KPA*0.145038, PV=FL.waterPv(20);
const FF=0.96-0.28*Math.sqrt(PV/3200.1);
const DP=P1-P2;

const TRIMS=[
  {n:1, label:'STANDARD',  sub:'single stage'},
  {n:2, label:'2-STAGE',   sub:'two'},
  {n:3, label:'3-STAGE',   sub:'three'},
  {n:4, label:'4-STAGE',   sub:'four'},
];

const S={ open:0, trim:1, drag:false, lastAng:0, turn:0, closing:false, wear:0, run:0 };

const R_HDR=9;                 // the mist header is a branch, not a main
const LAY={
  hdr  : {y:172},
  pen  : {x:16},                // the header comes in through the bay wall
  wheel: {x:214, y:108, r:26},
  valve: {x:214},
  drop : {x:272},               // where the header turns down into the pod
  trace: {x:300, y:50, w:330, h:98},
  pod  : {x:300, y:214, w:330, h:116},
  rack : {x:300, y:338, w:330, h:46},
  read : {x:652, y:50,  w:206, h:112},
};
const RAIL_Y=()=>LAY.pod.y+14;            // the nozzle rail IS the header
const NOZZ=6;
const nozzX=i=>LAY.pod.x+32+i*((LAY.pod.w-64)/(NOZZ-1));

function trimNow(){ return TRIMS.find(t=>t.n===S.trim) || TRIMS[0]; }

/* ---- the model ----
   Equal pressure drop per stage. The LAST stage is the one that governs,
   because it sits at the lowest inlet pressure in the stack. */
function solve(){
  const n = trimNow().n;
  const cvTrim = CV_STAGE/Math.sqrt(n);
  const cv = cvTrim*S.open;
  const q = cv*Math.sqrt(DP);                    // SG 1 water
  const dPs = DP/n;
  const inLast = P2 + dPs;
  const allow = FLV*FLV*(inLast - FF*PV);
  const cav = S.open>0.02 && dPs >= allow;
  /* how hard it is cavitating, for the noise and the damage */
  const sev = cav ? Math.min(1,(dPs-allow)/allow) : 0;
  const pvc = FL.venaContracta(inLast, dPs, FLV);
  return { n, q, cv, dPs, inLast, allow, cav, sev, pvc,
           onDuty: q>=DUTY, live:S.open>0.02 };
}

let BG;
function buildScene(){
  BG=document.createElement('canvas'); BG.width=W; BG.height=H;
  const g=BG.getContext('2d');
  A.wall(g,W,H); A.rib(g,0,H); A.rib(g,866,H); A.ceiling(g,W);
  A.overhead(g,W,46,8,false);
  A.floor(g,W,344);
  A.vignetteOnto(g,W,H);
  A.stencil(g,44,96,'THE GARDEN',20,'#8b949b');
  A.stencil(g,44,116,'MIST HEADER \u00b7 POD 3',14);
  A.stencil(g,44,330,'HYPOBARIC \u2014 51 kPa',12,'#c0493b');
  A.stencil(g,300,206,'POD 3',11,'#8b949b');
  A.stencil(g,300,332,'TRIM',11,'#8b949b');
}

/* ---- the header ----
   Declared as a run and handed to LPE.piping(), the way levels 1 and 2 do
   it. What was here before drew two flat bars with LPE.pipeRun(): the first
   started at x=0 so the header was clipped by the panel edge instead of
   entering through the wall, and the second stopped at pod.x+20 on the
   header centreline - 40 px above, and short of, the nozzle rail it is
   supposed to feed. The comment said "into the pod"; the pipe ended in mid
   air and the rail inside the pod was an unconnected rectangle. The run now
   turns down at LAY.drop, penetrates the pod wall, and BECOMES the rail. */
let NET=null, FLOW=null;

function buildNet(){
  const y=LAY.hdr.y, ry=RAIL_Y(), D=LAY.pod;
  NET=LPE.piping({
    lines:[{pts:[[LAY.pen.x+12,y],[LAY.drop.x,y],[LAY.drop.x,ry],
                 [D.x+D.w-12,ry]], r:R_HDR}],
    /* A nozzle is a bored block on the rail, not a pipe fitting, so each one
       is a collar pair on the run with its body drawn under the rail. */
    fittings:[{x:LAY.pen.x+30,y:y,r:R_HDR,kind:'union'}],
  });
  /* Same polyline as the metal, filleted the same way, so the mist feed
     actually goes round the elbow instead of cutting the corner. */
  FLOW=new LPE.Line({
    r:R_HDR,
    segments:LPE.runSegments([[LAY.pen.x+12,y],[LAY.drop.x,y],
                              [LAY.drop.x,ry],[D.x+D.w-12,ry]], R_HDR),
  });
}

function stepFlow(dt,s){
  if(!NET) buildNet();
  /* A cavitating valve passes less, and passes it unevenly. */
  const f = s.live ? (s.cav ? 0.45 : 1) * Math.min(1, s.q/1.5) : 0;
  for(let i=0;i<FLOW.segs.length;i++) FLOW.set(i,{flow:f});
  FLOW.update(dt);
}

function drawHeader(g,s){
  if(!NET) buildNet();
  NET.draw(g);
  LPE.penetration(g, LAY.pen.x, LAY.hdr.y, R_HDR);     // in through the bay wall
  LPE.penetration(g, LAY.pod.x-6, RAIL_Y(), R_HDR);    // in through the pod wall
  FLOW.draw(g);
  LPE.valveBody(g, LAY.wheel.x, LAY.hdr.y, R_HDR, LAY.wheel.y, S.turn, LAY.wheel.r,
                !S.closing, s.live);
}

/* ---- the pressure trace through the trim stack ---- */
function drawTrace(g,s){
  const T=LAY.trace, PMAX=80;
  const y=p=>T.y+T.h-8-(Math.max(0,Math.min(PMAX,p))/PMAX)*(T.h-20);
  g.fillStyle='#161d21'; A.rr(g,T.x,T.y,T.w,T.h,4); g.fill();
  g.strokeStyle='#39444b'; g.lineWidth=1; A.rr(g,T.x,T.y,T.w,T.h,4); g.stroke();

  // vapour pressure, and the band under it
  g.fillStyle='rgba(192,73,59,0.18)';
  g.fillRect(T.x+1,y(PV),T.w-2,T.y+T.h-y(PV)-1);
  g.strokeStyle='#c0493b'; g.lineWidth=1.3; g.setLineDash([4,3]);
  g.beginPath(); g.moveTo(T.x,y(PV)); g.lineTo(T.x+T.w,y(PV)); g.stroke();
  g.setLineDash([]);
  g.fillStyle='#c0493b'; g.font="9px 'VT323',monospace";
  g.fillText('Pv '+PV.toFixed(2),T.x+5,y(PV)-3);

  if(!s.live){
    g.fillStyle='#5d6a73'; g.font="12px 'VT323',monospace"; g.textAlign='center';
    g.fillText('open the header valve',T.x+T.w/2,T.y+T.h/2); g.textAlign='left';
    return;
  }
  // one dip per stage, each starting lower than the last
  const seg=(T.w-24)/s.n;
  g.strokeStyle='#ffd24a'; g.lineWidth=2; g.beginPath();
  g.moveTo(T.x+8,y(P1));
  for(let i=0;i<s.n;i++){
    const x0=T.x+12+i*seg, x1=x0+seg;
    const pIn=P1-i*s.dPs, pOut=pIn-s.dPs;
    const vc=FL.venaContracta(pIn,s.dPs,FLV);
    g.lineTo(x0+seg*0.22, y(pIn));
    g.bezierCurveTo(x0+seg*0.38,y(pIn), x0+seg*0.44,y(vc), x0+seg*0.52,y(vc));
    g.bezierCurveTo(x0+seg*0.64,y(vc), x0+seg*0.74,y(pOut), x0+seg*0.86,y(pOut));
    g.lineTo(x1,y(pOut));
  }
  g.stroke();
  // mark every stage that dips under the line
  for(let i=0;i<s.n;i++){
    const x0=T.x+12+i*seg;
    const vc=FL.venaContracta(P1-i*s.dPs,s.dPs,FLV);
    const bad=vc<=PV;
    g.fillStyle=bad?'#c0493b':'#7ec47a';
    g.beginPath(); g.arc(x0+seg*0.52, y(Math.max(vc,PV*0.4)), 3.2,0,6.284); g.fill();
    if(bad){
      g.fillStyle='#c0493b'; g.font="9px 'VT323',monospace"; g.textAlign='center';
      g.fillText('boils', x0+seg*0.52, y(PV)+13); g.textAlign='left';
    }
  }
  g.fillStyle='#8fb9ff'; g.font="9px 'VT323',monospace";
  g.fillText('P1 '+P1.toFixed(0),T.x+6,y(P1)-4);
  g.fillText('P2 '+P2.toFixed(1),T.x+T.w-54,y(P2)-4);
}

/* ---- the pod ---- */
function drawPod(g,s){
  const D=LAY.pod;
  g.fillStyle='#101a16'; A.rr(g,D.x,D.y,D.w,D.h,5); g.fill();
  g.strokeStyle='#39444b'; g.lineWidth=2; A.rr(g,D.x,D.y,D.w,D.h,5); g.stroke();
  /* The rail is no longer drawn here - it is the header run itself, laid in
     by drawHeader() before the pod so the chamber does not paint over it.
     Only the nozzle bodies hang off it. */
  const nz=NOZZ;
  for(let i=0;i<nz;i++){
    const nx=nozzX(i);
    g.fillStyle='#5d6a73'; g.fillRect(nx-3,RAIL_Y()+R_HDR,6,7);
    if(s.live){
      /* a cavitating valve passes less, and what comes out is coarse and
         uneven rather than a mist */
      const good=!s.cav;
      const nDrops=good?9:4;
      for(let d=0;d<nDrops;d++){
        const t=(performance.now()*0.0012+d*0.13+i*0.07)%1;
        const px=nx+(good?(Math.random()*2-1)*13:(Math.random()*2-1)*5);
        const py=RAIL_Y()+R_HDR+9+t*(D.h-56);
        g.fillStyle=good?'rgba(150,215,255,0.5)':'rgba(140,180,205,0.75)';
        const sz=good?1.6:3.0;
        g.fillRect(px-sz/2,py-sz/2,sz,sz);
      }
    }
  }
  // plants
  for(let i=0;i<7;i++){
    const px=D.x+30+i*((D.w-60)/6), base=D.y+D.h-12;
    const vig=!s.live?0.3:(s.onDuty&&!s.cav?1:0.45);
    g.strokeStyle='rgba('+Math.round(84+40*vig)+','+Math.round(118+92*vig)+',84,'+(0.5+0.4*vig)+')';
    g.lineWidth=2;
    g.beginPath(); g.moveTo(px,base); g.lineTo(px,base-12-10*vig); g.stroke();
    g.beginPath(); g.moveTo(px,base-9); g.lineTo(px-6,base-16-6*vig); g.stroke();
    g.beginPath(); g.moveTo(px,base-9); g.lineTo(px+6,base-16-6*vig); g.stroke();
  }
  g.fillStyle='#c0493b'; g.font="10px 'VT323',monospace"; g.textAlign='right';
  g.fillText(POD_KPA+' kPa',D.x+D.w-8,D.y+D.h-8); g.textAlign='left';
}

/* ---- the trim rack ---- */
function rackBtns(){
  const R=LAY.rack, w=R.w/4-7;
  return TRIMS.map((t,i)=>({t, x:R.x+i*(R.w/4), y:R.y, w, h:R.h}));
}
function drawRack(g){
  rackBtns().forEach(b=>{
    const on=b.t.n===S.trim;
    g.fillStyle=on?'#2f3b34':'#232a2f'; A.rr(g,b.x,b.y,b.w,b.h,3); g.fill();
    g.strokeStyle=on?P.amber:'#44505a'; g.lineWidth=on?2:1;
    A.rr(g,b.x,b.y,b.w,b.h,3); g.stroke();
    // n stacked disks, which is what staged trim looks like
    for(let i=0;i<b.t.n;i++){
      const dy=b.y+9+i*(22/Math.max(1,b.t.n));
      g.fillStyle=on?'#8d98a1':'#5d6872';
      g.fillRect(b.x+b.w/2-14, dy, 28, Math.max(2,16/b.t.n-1));
    }
    g.fillStyle=on?P.amber:'#8e9aa3'; g.font="9px 'VT323',monospace"; g.textAlign='center';
    g.fillText(b.t.label,b.x+b.w/2,b.y+b.h-6);
    g.textAlign='left';
  });
}

function drawRead(g,s){
  const R=LAY.read;
  g.fillStyle='#232a2f'; A.rr(g,R.x,R.y,R.w,R.h,4); g.fill();
  g.strokeStyle='#4a565d'; g.lineWidth=2; A.rr(g,R.x,R.y,R.w,R.h,4); g.stroke();
  const rows=[
    ['MIST FLOW', s.q.toFixed(2)+' gpm', s.onDuty?'#39ff6a':'#c0493b'],
    ['\u0394P / STAGE', s.dPs.toFixed(1)+' psi', '#39ff6a'],
    ['ALLOWABLE', s.allow.toFixed(1)+' psi', '#8fb9ff'],
    ['STATE', s.cav?'CAVITATING':(s.live?'CLEAR':'SHUT'),
     s.cav?'#c0493b':(s.live?'#39ff6a':'#8b949b')],
  ];
  rows.forEach((c,i)=>{
    const y=R.y+14+i*23;
    g.fillStyle=P.rim; g.font="10px 'VT323',monospace"; g.textAlign='left';
    g.fillText(c[0],R.x+9,y+9);
    g.fillStyle=s.live?c[2]:'#5d6a73'; g.font="14px 'VT323',monospace"; g.textAlign='right';
    g.fillText(c[1],R.x+R.w-9,y+9);
  });
  g.textAlign='left';
  g.fillStyle='#7a6b54'; g.font="9px 'VT323',monospace";
  g.fillText('DUTY '+DUTY.toFixed(2)+' gpm',R.x+9,R.y+R.h-7);
}

/* ---- script ---- */
const STEPS=[
  { task:'Open the header valve and let the misters run.',
    ok:s=>s.live && S.open>0.9,
    lesson:'Listen to it. That is not flow noise &mdash; it is gravel. The '+
      'header is passing water but the pod is getting a coarse spatter instead '+
      'of a mist, and the trim has been in six weeks.' },
  { task:'Read \u0394P PER STAGE against ALLOWABLE before you change anything.',
    ok:s=>s.live && S.open>0.9,
    watch:2.6,
    lesson:'67.3 psi across one stage, and the most it can take is 60.2. Sixty '+
      'psig into a pod at half an atmosphere is a ratio no single seat survives. '+
      'The pressure dives under the vapour line inside the valve, the water '+
      'boils, and the bubbles collapse on the way out. <b>Cavitation.</b>' },
  { task:'Fit trim that clears the vapour line and still passes '+DUTY.toFixed(2)+' gpm.',
    ok:s=>s.live && !s.cav && s.onDuty && !S.drag,
    lesson:'Three stages. Each one takes 22.4 psi, which is inside the 23.9 any '+
      'single stage can hold, so nothing boils. Two stages still choke the '+
      'bottom seat; four clears it easily and then cannot pass the duty. The '+
      'answer was the narrowest trim that does not cavitate, not the safest '+
      'one on the shelf.' },
];
let si=0, closeT=0;
function say(){ if(SH.holding||SH.done||S.closing) return;
  SH.say(STEPS[si].task,''); SH.count((si+1)+' / '+STEPS.length); }

const CLOSING=[
  '<span class="who">COMMS:</span> Mist is a mist again. And the trim you pulled '+
  'out was not worn &mdash; it was eaten. Cavitation does not wear metal, it '+
  'hammers it: every bubble that collapses on a seat takes a bit of it with it.',

  '<span class="who">COMMS:</span> The pod runs at half an atmosphere because '+
  'that is cheaper to build and the plants prefer it.<span class="gap"></span>'+
  'Nobody costed what that does to every valve feeding it off a 60 psig header. '+
  'You just did.',
];
function closeOut(i){
  if(i>=CLOSING.length){
    S.closing=false;
    SH.finish({ lesson:CLOSING[CLOSING.length-1], next:()=>LPE.next && LPE.next() });
    return;
  }
  S.closing=true;
  SH.beat(CLOSING[i], ()=>closeOut(i+1));
}

function step(dt){
  const s=solve();
  stepFlow(dt,s);
  S.turn += (S.open-S.turn)*Math.min(1,dt*6);
  S.run += dt;
  if(s.cav) S.wear=Math.min(1,S.wear+dt*0.05*s.sev);
  LPE.audio.flow(s.live? (s.cav?0.9:0.5) : 0);
  /* !SH.holding matters, and its absence cost level 4 its whole middle
     lesson. While a beat is on screen the sim keeps running, so the NEXT
     step's ok() is already being polled: its watch timer runs down behind
     the text the player is still reading, and the moment it expires
     SH.beat() is called mid-hold, hits `if(S._holding) return`, and is
     dropped - but si has already advanced, so that lesson is gone and the
     level jumps straight to the step after it. Levels 1 and 2 guard this;
     levels 3 and 4 did not. */
  if(!SH.done && !S.closing && !SH.holding && STEPS[si]){
    const st=STEPS[si];
    if(st.ok(s)){
      if(st.watch){ closeT+=dt; if(closeT<st.watch) return; }
      closeT=0;
      /* Advance only if the beat actually took. Belt and braces behind
         the guard above: a lesson must never be lost in silence. */
      const lesson=st.lesson, last=si+1>=STEPS.length;
      if(SH.beat(lesson, last?()=>closeOut(0):say)) si++;
    } else closeT=0;
  }
}
function draw(g){
  if(!BG) buildScene();
  const s=solve();
  g.drawImage(BG,0,0);
  /* The pod goes down BEFORE the header, so the chamber body cannot close
     the rail's bore where the run crosses its wall. */
  drawTrace(g,s); drawPod(g,s); drawHeader(g,s); drawRack(g); drawRead(g,s);
  // the rattle, drawn as a shiver on the valve when it is cavitating
  if(s.cav && s.live){
    const j=()=>(Math.random()*2-1)*2.2*s.sev;
    g.fillStyle='rgba(192,73,59,0.5)'; g.font="12px 'VT323',monospace";
    g.textAlign='center';
    g.fillText('\u25b2 RATTLE', LAY.wheel.x+j(), LAY.wheel.y-40+j());
    g.textAlign='left';
  }
}

buildScene();
const SH=LPE.mount({
  t1:'GARDEN \u2014 MIST HEADER',
  t2:'Pod 3 \u00b7 hypobaric 51 kPa \u00b7 manual',
  w:W,h:H, step, draw,
  intro:[
    {kind:'place',
     text:'Pod 3 is held at 51 kPa &mdash; half an atmosphere. It is cheaper to '+
          'build at that pressure, it leaks less, and the crop does better in '+
          'it.<br><br>The mist header feeding it comes off the same 60 psig '+
          'Thermal Reservoir line as everything else on this base.'},
    {kind:'title', eyebrow:'THE GARDEN \u00b7 POD 3',
     title:'MIST HEADER', sub:'SIXTY PSIG INTO HALF AN ATMOSPHERE'},
  ],
  onStart:()=>{ say(); },
  onReset(){
    Object.assign(S,{open:0,trim:1,drag:false,turn:0,closing:false,wear:0,run:0});
    si=0; closeT=0; buildScene(); say();
  },
});

const cv=SH.canvas;
cv.addEventListener('pointerdown',e=>{
  LPE.audio.init(); LPE.audio.resume();
  const p=SH.pt(e);
  for(const b of rackBtns()){
    if(p.x>=b.x && p.x<=b.x+b.w && p.y>=b.y && p.y<=b.y+b.h){
      if(S.trim!==b.t.n){ S.trim=b.t.n; LPE.audio.clack(); }
      return;
    }
  }
  const Wl=LAY.wheel;
  if(Math.hypot(p.x-Wl.x,p.y-Wl.y)<Wl.r+18){
    S.drag=true; S.lastAng=Math.atan2(p.y-Wl.y,p.x-Wl.x);
    cv.setPointerCapture(e.pointerId); LPE.audio.startFlow();
  }
});
cv.addEventListener('pointermove',e=>{
  if(!S.drag) return;
  const p=SH.pt(e), Wl=LAY.wheel, a=Math.atan2(p.y-Wl.y,p.x-Wl.x);
  let d=a-S.lastAng;
  while(d>Math.PI) d-=6.2832; while(d<-Math.PI) d+=6.2832;
  S.lastAng=a;
  const before=S.open;
  S.open=Math.max(0,Math.min(1,S.open+d/(2*6.2832)));
  if(S.open>0.94) S.open=1;                     // wide open is a stop, not a target
  if(Math.floor(S.open*18)!==Math.floor(before*18)) LPE.audio.tick();
});
['pointerup','pointercancel'].forEach(k=>cv.addEventListener(k,()=>{S.drag=false;}));
}

(window.LPE_LEVELS=window.LPE_LEVELS||[]).push({
  label:'LEVEL 4 \u2014 THE MIST HEADER',
  sub:'The Garden  \u00b7  pod 3',
  /* The job, before the training for it. launch() plays this first;
     see PIPELINE.md section 6. */
  brief:[
    {kind:'comms', tag:'[ COLONY INTERCOM \u00b7 CREW CHANNEL 3 ]',
     /* Every <br> segment must fit 52 characters or the card wraps it and
        leaves the tail alone on a line. */
     text:'&ldquo;Pod 3 misters sound like a bucket of gravel<br>'+
          'and the crop under them is going spotty.<br>'+
          'Second set of trim in four months. Find out why.&rdquo;'},
  ],
  /* The vena contracta is what the player has to read here, and the bench
     teaches it honestly - including that the bench itself cannot reach
     cavitation. This pod can. */
  teach:['vena-contracta'],
  start:startLevel4,
});
if(!window.LPE_GAME) startLevel4();

</script>
