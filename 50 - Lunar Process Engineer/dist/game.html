        lesson:'The yellow curve is drawn from the speed at every point across the '+
          'bore, so closing the valve pulls it in. Its length is how fast the fluid '+
          'is going; its shape is how the speed is shared from wall to centre.' },
    ],
  },

  'vena-contracta':{
    concept:'THE VENA CONTRACTA',
    sub:'the lowest pressure is the one you cannot measure',
    trace:true,
    shows:['pressure','restriction'],
    controls:['flow','section','temp'],
    steps:[
      { ctl:['flow','section'],
        task:'Fit the REDUCER and open the valve into the marked band.',
        target:{on:'flow',lo:0.65,hi:1,label:'OPEN'},
        ok:()=>B.flow>=0.65 && B.section==='reducer',
        lesson:'The trace is pressure along the pipe. It does not step down from '+
          'P1 to P2 \u2014 it dives well below P2 at the throat and then climbs back. '+
          'That low point is the vena contracta, and no gauge on either flange '+
          'can see it.' },
      { ctl:['temp'], target:{on:'temp',lo:HOT[0]/80,hi:HOT[1]/80,label:'HOT'},
        task:'Leave the valve alone. Heat the water and watch the red line.',
        ok:()=>B.temp>=HOT[0],
        lesson:'The red line is the vapour pressure of the water. Hot water boils '+
          'at a higher pressure, so heating lifts the line toward the dip: the '+
          'margin closes from 12.4 psi to 5.9. Nothing about the valve changed.' },
      { ctl:['flow','section','temp'],
        task:'Try to close that margin to nothing.',
        ok:()=>PROBE.triedHard,
        lesson:'You cannot, on this bench. If the dip ever reached the line the '+
          'water would boil inside the valve and collapse again downstream \u2014 '+
          'cavitation, which chews trim to grey powder. Twenty psi into a warm '+
          'room is too gentle to get there. A 60 psig header into a pod at half '+
          'an atmosphere is not.' },
    ],
  },

  'reynolds':{
    concept:'LAMINAR AND TURBULENT',
    sub:'Reynolds number, and what decides which',
    controls:['flow','temp'],
    steps:[
      { ctl:['flow'], target:{on:'flow',lo:TRICKLE[0],hi:TRICKLE[1],label:'TRICKLE'},
        task:'Close FLOW down into the marked band.',
        ok:()=>!B.drag && B.flow>=TRICKLE[0] && B.flow<=TRICKLE[1] && rig().regime==='laminar',
        lesson:'Reynolds number compares the fluid\u2019s inertia to its viscosity: '+
          'velocity times bore, divided by kinematic viscosity. Reynolds has no units. '+
          'Below about 2,300 viscosity dominates and the layers stay ordered. That '+
          'is laminar flow.' },
      { ctl:['temp'], target:{on:'temp',lo:HOT[0]/80,hi:HOT[1]/80,label:'HOT'},
        task:'Leave FLOW alone. Push TEMPERATURE into the marked band.',
        ok:()=>rig().regime==='turbulent',
        lesson:'The valve has not moved, so the opening is unchanged. Heating water '+
          'lowers its viscosity \u2014 its resistance to shear. Viscosity is the '+
          'denominator of Reynolds, so Reynolds rose. Above about 4,000 inertia '+
          'dominates and the layers break up: turbulent.' },
    ],
  },

  'specific-gravity':{
    concept:'SPECIFIC GRAVITY',
    sub:'density, as a ratio against water',
    controls:['flow','temp','fluid'],
    steps:[
      { ctl:['fluid'],
        task:'Switch the loop over to propane.',
        ok:()=>B.fluid==='propane',
        lesson:'Specific gravity is the ratio of a fluid\u2019s density to the '+
          'density of water. Propane is 0.50, half as dense. Through a fixed '+
          'restriction, flow goes as Cv times the square root of pressure drop '+
          'over SG \u2014 so less dense means more volume through the same opening.' },
      { ctl:['flow','temp','fluid'],
        task:'Deliver 0.50 gpm and keep the flow laminar. Fluid, temperature and valve are all live.',
        ok:()=>{ const r=rig(); return !B.drag && r.q>=0.50 && r.regime==='laminar'; },
        /* The TEMPERATURE slider greys out and reads HELD NEAR SATURATION
           for anything but water, so 'propane fails at any temperature' was
           asserting something the player is prevented from testing. Say what
           the bench actually does instead. */
        lesson:'Propane is held near saturation on this bench, so TEMPERATURE '+
          'locks and you cannot cool it. At 20 \u00b0C it is too thin to stay '+
          'laminar at 0.50 gpm. Water will, once cooled, because cold water is '+
          'more viscous. Fluid, temperature and valve decide together.' },
    ],
  },
};

/* ---- running a visit ---- */
let QUEUE=[], seg=null, STEPS=[], si=0, done=false, SH=null, onDone=null;

function liveCtl(which){
  if(done||!STEPS[si]) return true;
  return (STEPS[si].ctl||[]).indexOf(which)>=0;
}
function magnet(key,v){
  if(done||!STEPS[si]) return v;
  const tg=STEPS[si].target;
  if(!tg || (tg.on==='flow')!==(key==='flow')) return v;
  if(v>tg.lo-0.035 && v<tg.lo) return tg.lo;
  if(v<tg.hi+0.035 && v>tg.hi) return tg.hi;
  return v;
}

function draw(g,dt,t){
  const r=rig();
  /* the compare step wants the player to have actually seen both */
  if(B.flow>0.3){ if(B.section==='reducer') PROBE.sawRed=true; else PROBE.sawPlain=true; }
  if(PROBE.sawRed && PROBE.sawPlain) PROBE.sawBoth=true;
  /* the margin is smallest at full flow, hottest water, reducer fitted -
     let the step pass once the player has been to that corner */
  if(B.flow>0.9 && B.temp>=70 && B.section==='reducer') PROBE.triedHard=true;
  g.drawImage(BG,0,0);
  CUT.set({ flow:Math.min(1,r.v/3.0), regime:r.regime, re:r.re,
            tempF:r.t*9/5+32, sg:r.f.sg, gas:false });
  drawRig(g,r); drawTee(g,r);
  if(venaOn()) drawTrace(g,r);
  drawMeters(g,r); drawFluidSwitches(g); drawSections(g);
  if(manifoldOn()){
    slider(g,SLID_MAN.b1, liveCtl('b1'));
    slider(g,SLID_MAN.b2, liveCtl('b2'));
  } else {
    slider(g,SLID.flow, liveCtl('flow'));
    slider(g,SLID.temp, liveCtl('temp') && !tempLocked());
  }
  if(tempLocked()){
    g.fillStyle=P.amber; g.font="10px 'VT323',monospace";
    g.fillText('HELD NEAR SATURATION',SLID.temp.box.x+6,SLID.temp.box.y-5);
  }
  // the concept, named, where it cannot be missed
  if(seg){
    A.plate(g,LAY.glass.x,LAY.glass.y-56,LAY.glass.w,34);
    g.fillStyle=P.amber; g.font="17px 'VT323',monospace"; g.textAlign='left';
    g.fillText('CONCEPT: '+seg.concept,LAY.glass.x+10,LAY.glass.y-40);
    g.fillStyle='#8b949b'; g.font="12px 'VT323',monospace";
    g.fillText(seg.sub,LAY.glass.x+10,LAY.glass.y-27);
  }
}
function step(dt){
  const r=rig();
  CUT.update(dt);
  if(r.v>0.25) B.watch+=dt;
  LPE.audio.flow(Math.min(1,r.v/4));
  if(done||!STEPS[si]||SH.holding) return;
  if(STEPS[si].ok()){
    const last=si>=STEPS.length-1;
    const need=STEPS[si].watch;
    SH.beat(STEPS[si].lesson, ()=>{
      if(last) nextSegment(); else { si++; B.watch=0; say(); }
    }, need? (()=>B.watch>=need) : null);
    SH.count(last?'\u2014':(si+2)+' / '+STEPS.length);
  }
}
function say(){ if(done||!STEPS[si]) return;
  SH.say(STEPS[si].task,''); SH.count((si+1)+' / '+STEPS.length); }

function nextSegment(){
  if(!QUEUE.length){ done=true; SH.destroy(); onDone&&onDone(); return; }
  const id=QUEUE.shift();
  seg=SEG[id]; STEPS=seg.steps; si=0; B.watch=0;
  KNOWN.add(id);          // its readouts may appear from now on
  PROBE.opened=false; PROBE.seen={};
  PROBE.sawPlain=false; PROBE.sawRed=false; PROBE.sawBoth=false; PROBE.triedHard=false;
  SH.title('R.O.\u2019S BENCH \u2014 TRAINING LOOP', seg.concept.toLowerCase());
  if(STEPS[0].auto){
    SH.beat(STEPS[0].lesson, ()=>{ si=0; nextStepsOrSegment(); });
  } else say();
}
function nextStepsOrSegment(){
  if(STEPS.length<=1) nextSegment(); else { si=1; say(); }
}

/* ---- input ---- */
function down(p){
  for(const key of (manifoldOn()?['b1','b2']:['flow','temp'])){
    const sl=(manifoldOn()?SLID_MAN:SLID)[key], tr=sl.track;
    if(!liveCtl(key)) continue;
    if(key==='temp' && tempLocked()) continue;
    if(p.x>=tr.x-12 && p.x<=tr.x+tr.w+12 && Math.abs(p.y-tr.y)<18){
      B.drag=key; sl.set(magnet(key,Math.max(0,Math.min(1,(p.x-tr.x)/tr.w))));
      LPE.audio.tick(); return;
    }
  }
  /* The whole switch row is the target, lever through label - a 22px
     lever alone is a smaller hit than the thing it represents. */
  if(liveCtl('section')) for(const b of SECBTN){
    if(p.x>=b.x-6 && p.x<=b.x+b.w+6 && p.y>=b.y-6 && p.y<=b.y+b.h+20){
      if(B.section!==b.k){ B.section=b.k; LPE.audio.clack(); }
      return;
    }
  }
  if(liveCtl('fluid')) for(const s of FSW){
    if(p.x>=s.x-10 && p.x<=LAY.fsw.x+LAY.fsw.w && p.y>=s.y-4 && p.y<=s.y+28){
      if(B.fluid!==s.k){ B.fluid=s.k; LPE.audio.clack(); }
      return;
    }
  }
}
function move(p){
  if(!B.drag) return;
  const sl=(manifoldOn()?SLID_MAN:SLID)[B.drag];
  if(!sl) return;                      // a lever from the other apparatus
  const tr=sl.track, before=sl.get();
  sl.set(magnet(B.drag,Math.max(0,Math.min(1,(p.x-tr.x)/tr.w))));
  if(Math.floor(before*14)!==Math.floor(sl.get()*14)) LPE.audio.tick();
}

/* ---- entry point ---- */
LPE.trainer=function(ids,after){
  QUEUE=ids.slice(); onDone=after; done=false;
  Object.assign(B,{flow:0,temp:20,fluid:'water',section:'sch40',b1:0,b2:0,watch:0,drag:null});
  buildDesk();
  SH=LPE.mount({
    t1:'R.O.\u2019S BENCH \u2014 TRAINING LOOP', t2:'', w:W,h:H, step, draw,
    intro:[
      {kind:'comms', tag:'[ COLONY INTERCOM \u00b7 CREW CHANNEL 3 ]',
       text:'&ldquo;Before you go down there.<br>R.O. keeps a bench for this. Use it.&rdquo;'},
    ],
    onStart:nextSegment,
    onReset(){ Object.assign(B,{flow:0,temp:20,fluid:'water',section:'sch40',b1:0,b2:0,watch:0,drag:null});
               si=0; say(); },
  });
  SH.canvas.addEventListener('pointerdown',e=>{
    LPE.audio.init(); LPE.audio.resume(); LPE.audio.startFlow(); down(SH.pt(e)); });
  SH.canvas.addEventListener('pointermove',e=>move(SH.pt(e)));
  ['pointerup','pointercancel'].forEach(k=>
    SH.canvas.addEventListener(k,()=>{B.drag=null;}));
  return SH;
};
LPE.TRAINER_SEGMENTS=SEG;
/* Standalone: run every segment, for working on the bench itself.
   ?seg=reynolds,specific-gravity runs just those, in that order - working
   on the last segment should not cost four playthroughs of the first. The
   game path never reads this; it passes the ids it wants. */
if(!window.LPE_GAME) LPE.boot(()=>{
  const want=(new URLSearchParams(location.search).get('seg')||'')
    .split(',').map(s=>s.trim()).filter(s=>SEG[s]);
  LPE.trainer(want.length?want:Object.keys(SEG),()=>{});
});
})();

</script>
<script>

'use strict';
/* ============================================================
   LEVEL ZERO \u2014 the interaction grammar, nothing else.
   A panel reveals. A wheel controls. A gauge responds.

   Everything this file does is geometry, scenery composition and
   script. Water, scenery pieces, the valve, the gauge, sound and the
   shell all come from engine.js \u2014 this level cannot disagree with
   another level about how any of them behave.
   ============================================================ */
function startLevel0(){
const A=LPE.art, P=LPE.palette, W=900, H=400;

const PANEL={x:232,y:142,w:452,h:190};
const PIPE_Y=262, R=11;
const VALVE_X=338, WHEEL_R=26, WHEEL_Y=PIPE_Y-R-10-26;
const GAUGE={x:584,y:196,r:33};
const LAMP={x:458,y:96};
/* The Thermal Reservoir header is 60 psig everywhere on the base. This read
   42 while the Garden manifold in level one sits at 60 off the same source,
   which cannot both be true. */
const P_SUPPLY=60, TURNS=2;

const S={phase:'closed',slide:0,turn:0,open:0,press:0,drag:false,lastAng:0,
         flick:1,dripT:0,dripY:-1,closing:false};

/* The line: full and still upstream of the shut valve, air beyond it.
   Both facts are the engine's rules, not this level's invention. */
const line=new LPE.Line({r:R,segments:[
  // live off the reservoir
  {ax:PANEL.x-6, ay:PIPE_Y, bx:VALVE_X,            by:PIPE_Y, flow:0, fill:1},
  // dead leg to the lab
  {ax:VALVE_X,   ay:PIPE_Y, bx:PANEL.x+PANEL.w+6,  by:PIPE_Y, flow:0, fill:0},
]});

/* ---------------- scenery, composed once ---------------- */
let BG,dust=[];
for(let i=0;i<34;i++) dust.push({x:LAMP.x-90+Math.random()*180,y:LAMP.y+Math.random()*230,
  s:4+Math.random()*9,p:Math.random()*6.3});
function buildScene(){
  BG=document.createElement('canvas'); BG.width=W; BG.height=H;
  const g=BG.getContext('2d');
  A.wall(g,W,H); A.rib(g,0,H); A.rib(g,862,H); A.ceiling(g,W);
  A.overhead(g,W,62,8,false);
  A.overhead(g,W,92,9,true);
  A.floor(g,W,352);
  A.vignetteOnto(g,W,H);   // room first, then signage and props on top
  A.stencil(g,52,132,'SECTION 4-B',20,'#8b949b');
  A.stencil(g,52,152,'HAND-OPERATED \u2014 NO REMOTE',15);
  A.arrow(g,846,300,'BIO LAB 1');
  A.placard(g,724,116);
  A.lampHousing(g,LAMP.x,LAMP.y);
  A.toolbox(g,96,312);
  A.clipboard(g,790,158);
  A.dither(g,0,0,170,120,P.shadow,0.26);
  A.dither(g,W-170,0,170,120,P.shadow,0.26);

  // the recess the panel covers
  g.fillStyle='#0c1114'; g.fillRect(PANEL.x-12,PANEL.y-12,PANEL.w+24,PANEL.h+24);
  g.fillStyle=P.light; g.fillRect(PANEL.x-12,PANEL.y-12,PANEL.w+24,4);
  g.fillStyle=P.mid;   g.fillRect(PANEL.x-12,PANEL.y+PANEL.h+8,PANEL.w+24,4);
  g.fillStyle='#2b353b';
  for(let x=PANEL.x-4;x<PANEL.x+PANEL.w+8;x+=38){
    g.fillRect(x,PANEL.y-9,3,3); g.fillRect(x,PANEL.y+PANEL.h+11,3,3); }
  g.fillStyle='#161d21';
  g.fillRect(PANEL.x-12,PANEL.y-6,PANEL.w+24,5);
  g.fillRect(PANEL.x-12,PANEL.y+PANEL.h+1,PANEL.w+24,5);
  g.fillStyle='#070a0c'; g.fillRect(PANEL.x,PANEL.y,PANEL.w,PANEL.h);
  A.dither(g,PANEL.x,PANEL.y,PANEL.w,40,'#000000',0.5);

}

/* ---------------- script ---------------- */
/* The picture carries the state. These lines are a person talking, not a
   caption describing what is already on screen. */
function lines(){
  switch(S.phase){
    case 'closed': return ['Open the panel.',
      '<span class="who">COMMS:</span> Access panel, right in front of you. Slide it across. '+
      'Nothing automated down this end, it is all turned by hand.'];
    case 'opening': return ['Open the panel.',
      '<span class="who">COMMS:</span> Put your back into it.'];
    case 'open': return ['Turn the wheel.',
      '<span class="who">COMMS:</span> Couple of full turns. Watch the gauge &mdash; it is on the '+
      'lab side of the valve, so it tells you what they are actually getting.'];
    case 'turning': return ['Keep turning.',
      '<b>'+S.press.toFixed(0)+' psig</b> at the lab.'];
    default: return ['That is water into Bio Lab One.',
      '<span class="who">COMMS:</span> Good. Panel open, wheel turned, gauge read. '+
      'That is the whole job down this end of Four-B.'];
  }
}
/* The strip belongs to whatever is holding it. say() runs on every drag
   move, so without this the closing comms were overwritten the moment the
   player nudged the wheel again - and nothing speaks once the level is
   over, or the sign-off would be wiped by a stray turn. */
function say(){ if(SH.holding||SH.done||S.closing) return;
                const [t,l]=lines(); SH.say(t,l); }

/* ---------------- the wind-down ----------------
   Water arriving used to go straight to the debrief card, which landed on
   top of the closing line before any of it could be read. The level has
   something to say first, and the player says when to move on. */
const CLOSING=[
  /* The velocity profile has been drawn in every pipe of every level since
     the beginning and no level has ever pointed at it. It is the detail a
     cutaway view exists for. Two tracers race while this is held: the
     centreline one and the one against the bore, both carried by the same
     profile the water uses. */
  /* The trainer taught this properly. Here it is only recognition - the
     same shape, in a line that matters. Re-teaching it would be the
     lesson arriving twice and landing neither time. */
  '<span class="who">COMMS:</span> Watch the middle of that run against the pipe '+
  'wall &mdash; the centre is pulling ahead. Same <b>velocity profile</b> you saw on '+
  'R.O.&rsquo;s bench, in a line that actually feeds somebody.',

  '<span class="who">COMMS:</span> And look at what the gauge did. It sat at nothing '+
  'while the line behind the valve was already full and already under pressure. '+
  '<b>Pressure is not flow.</b> The wheel did not make water &mdash; it gave what was '+
  'already standing there somewhere to go.',

  '<span class="who">COMMS:</span> Nothing down this end is automated. No actuators, '+
  'no remote, no screens. Every run in Four-B gets opened by somebody standing where '+
  'you are, reading a gauge with their own eyes.<span class="gap"></span>'+
  'The engineer you stood in for today walked this round for six years.',

  '<span class="who">COMMS:</span> Bio Lab One has water. Nobody up there will think '+
  'about you again until it stops &mdash; that is the job.<span class="gap"></span>'+
  'Play your cards right, you might make a decent one yourself.',
];
/* True once the centreline tracer has covered most of the run, which is
   the moment the gap between the two is unmistakable. */
/* Watched-for, in SIMULATION seconds since the markers started running.
   Lap position does not work as a gate: flow establishes while the player
   is still turning the wheel, so the race can finish before their hand
   leaves it and the lesson unlocks before they have looked at anything. */
let raceT=0;
const RACE_WATCH=2.6;
const raceRun=()=>raceT>=RACE_WATCH;
function closeOut(i){
  if(i===0) raceT=0;
  line.race(1, i===0);              // downstream run, during the velocity beat only
  if(i>=CLOSING.length){
    S.closing=false;
    line.race(1,false);
    SH.finish({ lesson:CLOSING[CLOSING.length-1],
      line:'<span class="accent">Bio Lab One has water.</span> That is one valve, '+
           'by hand, on the oldest run on the base. Everything after this is the '+
           'same job with more of it happening at once.' });
    return;
  }
  /* The velocity beat waits for the tracers to have separated. Starting it
     the instant flow establishes and accepting a click immediately meant the
     one thing it exists to show could be clicked past before it happened. */
  SH.beat(CLOSING[i], ()=>closeOut(i+1), i===0 ? raceRun : null);
}

/* ---------------- simulation ---------------- */
function step(dt){
  if(S.phase==='opening'){
    S.slide=Math.min(1,S.slide+dt/0.95);
    if(S.slide>=1){ S.phase='open'; LPE.audio.clunk(); say(); }
  }
  const up=line.segs[0], down=line.segs[1];
  if(S.phase==='turning'||S.phase==='flowing'){
    const f=S.open>0.04?S.open:0;
    up.flow  += (f-up.flow)*Math.min(1,dt/0.5);
    down.flow = up.flow;
    if(f>0) down.fill=Math.min(1,down.fill+dt*f*0.75);
    // the lab-side gauge only reads once water has actually reached it
    const target=P_SUPPLY*S.open*Math.min(1,down.fill/0.85);
    S.press+=(target-S.press)*Math.min(1,dt/0.3);
    LPE.audio.flow(up.flow);
    if(S.phase==='turning' && down.fill>=1 && S.press>14){
      S.phase='flowing'; S.closing=true; closeOut(0);
    }
  }
  if(line.segs[1].race) raceT+=dt;   // simulation seconds the markers have run
  line.update(dt);
}

/* ---------------- frame ---------------- */
function draw(g,dt,t){
  if(!BG) buildScene();            // never draw from nothing
  g.drawImage(BG,0,0);

  /* The lamp is on the wall face, so its light falls on the wall \u2014 it
     cannot reach into the chase behind the panel. Clipping the recess out
     of the cone (and out of the dust) keeps that true whether the cover is
     open or shut. */
  S.flick += ((Math.random()<0.012?0.55:1)-S.flick)*Math.min(1,dt/0.05);
  g.save();
  g.beginPath();
  g.rect(0,0,W,H);
  g.rect(PANEL.x-12,PANEL.y-12,PANEL.w+24,PANEL.h+24);
  g.clip('evenodd');
  g.globalAlpha=0.15*S.flick; g.fillStyle=P.lamp;
  g.beginPath(); g.moveTo(LAMP.x-22,LAMP.y+6); g.lineTo(LAMP.x+22,LAMP.y+6);
  g.lineTo(LAMP.x+190,352); g.lineTo(LAMP.x-190,352); g.closePath(); g.fill();
  g.globalAlpha=1; g.fillStyle='rgba(255,217,160,0.33)';
  dust.forEach(d=>{ d.y+=d.s*dt; if(d.y>340){ d.y=LAMP.y+10; d.x=LAMP.x-90+Math.random()*180; }
    g.fillRect(d.x+Math.sin(t*0.6+d.p)*7,d.y,1,1); });
  g.restore();

  S.dripT+=dt;
  if(S.dripY<0 && S.dripT>3.4){ S.dripY=104; S.dripT=0; }
  if(S.dripY>=0){
    S.dripY+=170*dt; g.fillStyle=P.water; g.fillRect(220,S.dripY,2,4);
    if(S.dripY>348){ S.dripY=-1; LPE.audio.drip(); }
  }

  g.save(); g.beginPath(); g.rect(PANEL.x,PANEL.y,PANEL.w,PANEL.h); g.clip();
  LPE.pipeRun(g,PANEL.x,PANEL.x+PANEL.w,PIPE_Y,R);
  LPE.penetration(g,PANEL.x+4,PIPE_Y,R);
  LPE.penetration(g,PANEL.x+PANEL.w-16,PIPE_Y,R);
  LPE.valveShell(g,VALVE_X,PIPE_Y,R);
  line.draw(g);
  LPE.valveTrim(g,VALVE_X,PIPE_Y,R,WHEEL_Y,S.open*LPE.WHEEL_SWEEP,WHEEL_R,S.phase==='open',S.open);
  g.strokeStyle=P.light; g.lineWidth=4;
  g.beginPath(); g.moveTo(GAUGE.x,PIPE_Y-R-6); g.lineTo(GAUGE.x,GAUGE.y+GAUGE.r); g.stroke();
  LPE.gauge(g,GAUGE.x,GAUGE.y,GAUGE.r,S.press,80);
  g.restore();

  if(S.slide<1){
    const sx=PANEL.x+S.slide*(PANEL.w+20);
    g.fillStyle='#2e3338'; g.fillRect(sx,PANEL.y,PANEL.w,PANEL.h);
    g.fillStyle='#3b4147'; g.fillRect(sx,PANEL.y,PANEL.w,3);
    g.fillStyle='#1d2225'; g.fillRect(sx,PANEL.y+PANEL.h-3,PANEL.w,3);
    g.strokeStyle='#454c52'; g.lineWidth=2; g.strokeRect(sx+4,PANEL.y+4,PANEL.w-8,PANEL.h-8);
    A.dither(g,sx+30,PANEL.y+22,84,15,P.rust,0.3);
    A.dither(g,sx+PANEL.w-170,PANEL.y+PANEL.h-50,110,13,P.rust,0.26);
    A.dither(g,sx,PANEL.y+PANEL.h-26,PANEL.w,26,P.shadow,0.35);
    A.stencil(g,sx+30,PANEL.y+74,'BIO LAB ONE SUPPLY',25,P.stencil);
    A.stencil(g,sx+30,PANEL.y+98,'THERMAL RESERVOIR \u2014 LINE 1',16);
    A.handNote(g,sx+32,PANEL.y+144,'wheel sticks. keep turning.  \u2014 R.O.');
    g.fillStyle='#565d64'; A.rr(g,sx+PANEL.w-54,PANEL.y+PANEL.h/2-28,20,56,6); g.fill();
    g.strokeStyle='#848d96'; g.lineWidth=2; g.stroke();
    /* The handle is the thing to pull, and 'Open the panel' in front of a
       flat grey rectangle does not say which part. It pulses until used. */
    if(S.phase==='closed'){
      const pulse=0.45+0.4*Math.sin(t*5);
      g.save(); g.globalAlpha=pulse;
      g.strokeStyle=P.amber; g.lineWidth=2;
      A.rr(g,sx+PANEL.w-58,PANEL.y+PANEL.h/2-32,28,64,8); g.stroke();
      g.fillStyle=P.amber; g.font="12px 'VT323',monospace"; g.textAlign='right';
      g.fillText('SLIDE',sx+PANEL.w-64,PANEL.y+PANEL.h/2+4);
      g.textAlign='left'; g.restore();
    }
  }

}


/* ============================================================
   The training loop used to live here as ACT 1 - a second, older crash

/* ---------------- mount ---------------- */
/* Compose the scenery before mounting. draw() runs from the first frame
   the shell pumps, which is before onStart - so building BG in a

buildScene();
const SH=LPE.mount({
  t1:'BIO LAB ONE \u2014 SUPPLY PANEL',
  t2:'Thermal Reservoir feed \u00b7 Section 4-B \u00b7 manual',
  w:W,h:H,
  step, draw,
  /* The welcome. This is the player's first real job and the first place
     the game speaks to them as a person rather than a bench, so it says
     three things and stops: who is calling, where they are, and what the

     this level - so nothing here re-teaches it. */
  intro:[
    {kind:'place',
     text:'Four-B is the oldest run on the base. No actuators, no remote, no '+
          'screens &mdash; just lines on brackets and wheels you turn yourself.'+
          '<br><br>Line 1 ends at a steel access panel with a hand wheel behind '+
          'it and a pressure gauge above it. The Thermal Reservoir header holds '+
          '60 psig at that wall whether anyone opens the valve or not.'},
    {kind:'title', eyebrow:'SECTION 4-B \u00b7 MANUAL SERVICES',
     title:'BIO LAB ONE', sub:'LINE 1 \u00b7 SUPPLY VALVE'},

  onStart:()=>{
    SH.beat('<span class="who">COMMS:</span> That is the panel. The wheel behind '+
      'it is the only thing between the header and Bio Lab One, and it has been '+

      'and let us see what the gauge is doing before you touch anything.',
      ()=>{ say(); });
  },
  /* RESET restores the level, which is now one act rather than two. */
  onReset(){
    Object.assign(S,{phase:'closed',slide:0,turn:0,open:0,press:0,drag:false});
    line.set(0,{flow:0,fill:1}); line.set(1,{flow:0,fill:0});
    S.closing=false; raceT=0; line.race(1,false);
    LPE.audio.flow(0);
    buildScene();
    SH.title('BIO LAB ONE \u2014 SUPPLY PANEL',
             'Thermal Reservoir feed \u00b7 Section 4-B \u00b7 manual');
    say();
  },
});

const cv=SH.canvas;
cv.addEventListener('pointerdown',e=>{
  LPE.audio.init(); LPE.audio.resume();
  const p=SH.pt(e);
  if(S.phase==='closed'){ S.phase='opening'; LPE.audio.scrape(); say(); return; }
  if(S.phase!=='opening' && Math.hypot(p.x-VALVE_X,p.y-WHEEL_Y)<WHEEL_R+18){
    S.drag=true; S.lastAng=Math.atan2(p.y-WHEEL_Y,p.x-VALVE_X);
    cv.setPointerCapture(e.pointerId); LPE.audio.startFlow();
  }
});
cv.addEventListener('pointermove',e=>{
  if(!S.drag) return;
  const p=SH.pt(e), a=Math.atan2(p.y-WHEEL_Y,p.x-VALVE_X);
  let d=a-S.lastAng;
  while(d>Math.PI) d-=6.2832; while(d<-Math.PI) d+=6.2832;
  S.lastAng=a;

  S.open=Math.max(0,Math.min(1,S.open+d/(TURNS*6.2832)));   // the wheel follows this, so it cannot over-travel
  if(S.open>0 && S.phase==='open') S.phase='turning';
  if(Math.floor(S.open*16)!==Math.floor(before*16)) LPE.audio.tick();
  say();
});
['pointerup','pointercancel'].forEach(k=>cv.addEventListener(k,()=>{S.drag=false;}));
cv.addEventListener('keydown',e=>{

     gating against the crash course that ran before it: the canvas takes
     focus on the first click, so Enter and Space pressed to advance a
     lesson were quietly opening the supply panel behind the bench. The
     bench is a separate device now, so there is nothing to gate against. */
  if(S.phase==='closed'&&(e.key==='Enter'||e.key===' ')){
    e.preventDefault(); LPE.audio.init(); S.phase='opening'; LPE.audio.scrape(); say(); return; }
  if(e.key==='ArrowRight'||e.key==='ArrowUp'){
    e.preventDefault(); LPE.audio.init(); LPE.audio.startFlow();
    S.open=Math.min(1,S.open+0.4/(TURNS*6.2832));
    if(S.phase==='open') S.phase='turning';
    LPE.audio.tick(); say(); }
});
}

/* Registered so the game shell can launch it; still runs on its own if

(window.LPE_LEVELS=window.LPE_LEVELS||[]).push({

     as net movement, and then the velocity profile - which the closing
     lines point at in the real line, so it has to have been taught. Each
     is taught once; replaying the level does not repeat them. Reynolds
     and specific gravity belong to later levels. */
  /* The job, before the training for it. launch() plays this first;
     see PIPELINE.md section 6. */
  brief:[
    {kind:'comms', tag:'[ COLONY INTERCOM \u00b7 CREW CHANNEL 3 ]',
      /* Every <br> segment must fit 52 characters or the card wraps it and
         leaves the tail alone on a line. */
      text:'&ldquo;Morning. You are the new process engineer,<br>'+
           'so you get the walk-round.<br>'+
           'Bio Lab One has no water. Section 4-B, line 1.<br>'+
           'It needs opening by hand, and you are the hand.&rdquo;'}
  ],
  teach:['process','fluid','temperature','pressure','flow','velocity-profile'],

<script>

'use strict';
/* ============================================================
   LEVEL ONE - THE GARDEN, BIO-GROW BAY 3

   A PORT, not a rewrite. The handoff locks this level's working parts, so
   every constant, the network solve, the air-fill model and all six steps
   are carried over unchanged from the original build. What changed is only
   what it sits on: the engine's shell, water model, valves and gauges
   instead of its own private copies.

   If this plays differently from the original, that is a bug in the port.
   ============================================================ */
function startLevel1(){
const A=LPE.art, P=LPE.palette, W=900, H=400;

/* ---------- geometry (verbatim) ---------- */
const MAIN_Y=86, TRUNK_X=320, POD_X=812;
const BR_Y=[170,256,342];
/* Bore radii ARE the sizing's bores, at the cutaway's own scale, so the
   drawing cannot quietly disagree with the physics. R_BR is the anchor and
   everything else follows from a real bore in inches - see sizing.js.
     NPS 3/8 Sch 40   bore 0.493 in   the branches
     NPS 1/2 Sch 40   bore 0.622 in   the main and the riser
     restriction      throat 0.108 in  derived from the Cv it has to have
   The main was drawn at 11 px for a long time, which is NPS 3/8 wearing a
   half-inch label; at this scale it is 12.6. */
const R_BR=10;                                      // the anchor
const PX_PER_IN=R_BR/0.493;                         // ~20.3 px per inch of bore
const R_MAIN=Math.round(0.622*PX_PER_IN*10)/10;     // 12.6
const RED_X0=600, RED_X1=680, RED_R=Math.round(0.108*PX_PER_IN*10)/10;      // the spliced-in reducer on bay 3
const VALVE_X=410, WHEEL_R=18, STEM=24;
const BR_LEN=POD_X-TRUNK_X;
const wheelMainX=170;
const wheels=[
  {key:'main',x:wheelMainX,y:MAIN_Y,  label:'MAIN SUPPLY'},
  {key:'b0',  x:VALVE_X,y:BR_Y[0],label:'BED 1'},
  {key:'b1',  x:VALVE_X,y:BR_Y[1],label:'BED 2'},
  {key:'b2',  x:VALVE_X,y:BR_Y[2],label:'BED 3'},
];

/* ---------- physics (verbatim) ---------- */
const P_SUP=60, SG=1.0;
/* DERIVED, not chosen - run `node sizing.js` to regenerate and see the
   working. Application: 3 NFT beds at 2.0 gpm each (an NFT channel runs
   1-2 L/min; a bed carries ~6), manifold at 15.2 psig because
   micro-irrigation headers run 10-25 psi, not mains pressure. Lines from
   ASME B36.10M Sch 40 by velocity band: NPS 3/8 branches at 3.35 ft/s,
   NPS 1/2 main at 6.34 ft/s. Then Cv = q/sqrt(dP).
   The first pass had Cv 7 / 4 / 2.2, picked because they balanced nicely,
   and the bay delivered 46.8 gpm - 2,800 gal/hour through three grow beds
   on a colony whose own narration says the water is counted. */
const CV_MAIN_MAX=0.896, CV_BR_MAX=0.513, CV_REDUCER=0.296;
const valves={main:0,b0:0,b1:0,b2:0};
const seriesCv=(a,b)=>1/Math.sqrt(1/(a*a)+1/(b*b));
/* Manifold pressure is STATE, not recomputed each frame. Water is
   incompressible: shut the main with every bed shut and that volume is
   trapped - it holds whatever pressure it had, because nothing can leave. */
let pManHeld=0;
const P_TAU=0.22;
function solve(){
  const cvMain=CV_MAIN_MAX*valves.main;
  const cv=[CV_BR_MAX*valves.b0, CV_BR_MAX*valves.b1, 0];
  const raw2=CV_BR_MAX*valves.b2;
  cv[2]= raw2>0 ? seriesCv(raw2,CV_REDUCER) : 0;   // bed 3 runs through the reducer
  const cvSum=cv[0]+cv[1]+cv[2];
  let pTarget;
  if(cvMain<=0){
    pTarget=(cvSum<=0) ? pManHeld : 0;             // isolated and full = trapped
  } else if(cvSum<=0){
    pTarget=P_SUP;                                 // dead-headed against the header
  } else {
    pTarget=P_SUP*(cvMain*cvMain)/(cvMain*cvMain+cvSum*cvSum);
  }
  const pMan=pManHeld;                             // flows follow pressure that is
  const root=Math.sqrt(Math.max(0,pMan)/SG);       // actually there, not the target
  const q=cv.map(c=>c*root);
  return {cvMain,cv,cvSum,pMan,pTarget,q,qTot:q[0]+q[1]+q[2]};
}

/* ---------- air fill (verbatim) ----------
   New pipe is full of air at room pressure. Water stands to each closed
   valve and has to push the air out of the emitters before it reaches root. */
const FILL_START=(VALVE_X-TRUNK_X)/BR_LEN;
const fill=[FILL_START,FILL_START,FILL_START];
/* Air purge rate, set from the duration it has to produce rather than
   left as a bare number. purge = (1 - FILL_START) * BR_LEN / (q * FILL_RATE).
   At the real flows (about 2 gpm a branch) 50 gives ~4 s: long enough to
   read the caption and watch the front move, short enough not to stall.
   This is a constant that only means anything in combination with the flow
   scale - when the Cv values were derived down 8x, the old 12 silently
   became a 15 s purge, and a hand-tuned 5 became 40 s. */
const FILL_RATE=50;
const venting=i=>fill[i]>FILL_START+0.001 && fill[i]<1;

/* ---------- water on the engine's model ----------
   The trunk is split at every tee: flow is constant BETWEEN tees and changes
   AT them, and each piece owns its particles so none can strand at a
   velocity boundary. That is the original's own fix, now the engine's rule. */
/* Split at the main valve. The header side is fed from the Thermal Reservoir
   and is ALWAYS full and standing - it was previously one segment with the
   manifold side, so before the valve opened there was nothing visibly sitting
   against the seat. */
/* The run the engine draws, expressed for the water too: straight to the
   first elbow, round it, down the riser, round the second, out to bed 3.
   BEND is the same long-radius value the piping uses (3 x bore radius). */
const BEND=3*R_MAIN;
const E1={x:TRUNK_X,y:MAIN_Y}, E2={x:TRUNK_X,y:BR_Y[2]};
const main=new LPE.Line({r:R_MAIN,segments:[
  {ax:30,ay:MAIN_Y,bx:wheelMainX,by:MAIN_Y,fill:1},            // reservoir header
  {ax:wheelMainX,ay:MAIN_Y,bx:E1.x-BEND,by:MAIN_Y,fill:1},     // into the manifold
  {arc:{cx:E1.x-BEND,cy:E1.y+BEND,R:BEND,a0:-Math.PI/2,a1:0},fill:1},   // elbow down
]});
const trunk=new LPE.Line({r:R_MAIN,segments:[
  {ax:TRUNK_X,ay:E1.y+BEND,bx:TRUNK_X,by:BR_Y[0],fill:1},      // carries all three
  {ax:TRUNK_X,ay:BR_Y[0],bx:TRUNK_X,by:BR_Y[1],fill:1},        // bed 1 has tapped off
  {ax:TRUNK_X,ay:BR_Y[1],bx:TRUNK_X,by:E2.y-BEND,fill:1},      // only bed 3 left
  {arc:{cx:E2.x+BEND,cy:E2.y-BEND,R:BEND,a0:Math.PI,a1:Math.PI/2},fill:1}, // elbow out
]});
/* The bay as it is actually built: a run from the header that turns down
   into the riser, three branches teed off it, and the reducer somebody
   spliced into bay 3. Corners become real elbows; the engine draws every
   bore last so no fitting can close another one off. */
const NET=LPE.piping({
  lines:[
    /* One continuous run: header, down the riser, out to bed 3. Both
       corners are elbows. The riser TERMINATES at bed 3 - it is not a tee
       there - and drawing it as one stopped the butt-capped riser leaving
       bed 3 hanging off its end. */
    {pts:[[30,MAIN_Y],[TRUNK_X,MAIN_Y],[TRUNK_X,BR_Y[2]],[RED_X0,BR_Y[2]]], r:R_MAIN},
    {pts:[[RED_X1,BR_Y[2]],[POD_X,BR_Y[2]]], r:R_MAIN},  // past it, same bore in as out
    {pts:[[TRUNK_X,BR_Y[0]],[POD_X,BR_Y[0]]], r:R_BR},
    {pts:[[TRUNK_X,BR_Y[1]],[POD_X,BR_Y[1]]], r:R_BR},
  ],
  // only beds 1 and 2 are taken off the riser as branches
  tees:[{x:TRUNK_X,y:BR_Y[0],r:R_MAIN,branch:R_BR},
        {x:TRUNK_X,y:BR_Y[1],r:R_MAIN,branch:R_BR}],
  // one fitting: taper in, throat, taper out
  reducers:[{x0:RED_X0,x1:RED_X1,y:BR_Y[2],r1:R_MAIN,r2:RED_R}],
  fittings:[{x:wheelMainX-54,y:MAIN_Y,r:R_MAIN,kind:"union"}],
});
/* Bay 3 runs full bore up to the reducer, squeezes through its throat, and
   opens out again - three segments, so the water narrows only where the
   fitting narrows it instead of the whole branch being drawn thin. */
/* Water turns into a branch, it does not appear already running sideways.
   Each tee gets a short bend off the riser (a tee turn is tight - nothing
   like the long-radius elbows on the main run), and bed 3 picks up from
   the elbow the riser already ends in. */
const TEE_R=R_BR*1.6;
const BR_SEGS=BR_Y.map((y,i)=> i!==2
  ? [{arc:{cx:TRUNK_X+TEE_R,cy:y-TEE_R,R:TEE_R,a0:Math.PI,a1:Math.PI/2},r:R_BR},
     {ax:TRUNK_X+TEE_R,ay:y,bx:POD_X,by:y,r:R_BR}]
  : [{ax:TRUNK_X+BEND,ay:y,bx:RED_X0,by:y,r:R_BR},
     {ax:RED_X0,ay:y,bx:RED_X1,by:y,r:RED_R,speed:6},   // sprints through
     {ax:RED_X1,ay:y,bx:POD_X,by:y,r:R_BR}]);
const branches=BR_Y.map((y,i)=>new LPE.Line({r:R_BR,
  segments:BR_SEGS[i].map(s=>({...s,fill:0}))}));
const BR_TOTAL=branches.map(b=>b.segs.reduce((t,s)=>t+s.len,0));

/* Particle speed is scaled against what this bay can really carry, measured
   from the solver rather than guessed. The old divisors (22 on the riser, 11
   on a branch) clamped: with all three beds open the riser top segment
   carries 44 gpm and the next 26, and both pinned to full and drew the same,
   hiding the very thing the riser is there to show. */
const FLOW_REF=(()=>{
  const keep={...valves}, keepP=pManHeld;
  const settle=v=>{ Object.assign(valves,v); let S=solve(); pManHeld=S.pTarget; return solve(); };
  const all=settle({main:1,b0:1,b1:1,b2:1}).qTot;
  const one=settle({main:1,b0:1,b1:0,b2:0}).q[0];
  Object.assign(valves,keep); pManHeld=keepP;
  return {riser:all, branch:one};
})();

/* ---------- the six steps (verbatim) ---------- */
const STEPS=[
  { keys:['main'], watch:-1,
    task:'Open the MAIN SUPPLY valve. Drag the hand wheel.',
    ok:()=>valves.main>=0.9,
    lesson:'60 psig at the manifold &mdash; and <b>nothing is moving</b>. In Four-B the gauge sat downstream, so it only woke up once water ran. This one sits on the manifold: the line is loaded and perfectly still, with every bed shut.' },
  { keys:['b0'], watch:0,
    task:'Open BED 1.',
    ok:()=>valves.b0>=0.9,
    lesson:'The valve created nothing \u2014 it opened a path, and the pressure spent itself. And watch what left first: that run was new pipe, <b>full of air</b>, which had to vent out the emitters before water reached a single root.' },
  { keys:['b1'], watch:1,
    task:'Open BED 2. Keep an eye on Bed 1\u2019s number.',
    ok:()=>valves.b1>=0.9,
    lesson:'Bed 1 <b>dropped</b> when Bed 2 opened, and nobody touched Bed 1. One supply, two demands &mdash; what divides at the tee is all there ever was.' },
  { keys:['b2'], watch:2,
    task:'Open BED 3.',
    ok:()=>valves.b2>=0.9,
    lesson:'Bed 3 is on the old run with a <b>reducer</b> in it. Same valve, same manifold pressure, noticeably less flow &mdash; and watch the particles sprint through that throat. Squeeze the bore and velocity goes up while pressure goes down. The restriction is in the pipe, not the valve.' },
  { keys:['b0'], watch:2,
    task:'Now throttle BED 1 back to about a quarter open \u2014 and watch Bed 3.',
    ok:()=>valves.b0<=0.35,
    lesson:'Bed 3 came up and nobody touched Bed 3. Add resistance to one branch and manifold pressure rises for every other branch. In a shared system <b>there is no local change</b>.' },
  { keys:['b0','b1','b2'], watch:-1,
    task:'Last job: balance the bay. Three identical beds should drink about the same \u2014 get all three within a tenth of a gallon of each other.',
    ok:()=>{ const S=solve(); const mn=Math.min(...S.q), mx=Math.max(...S.q);
             return mn>=1.0 && (mx-mn)<=0.15; },
    lesson:'<b>That</b> is commissioning. You balanced down to the weakest branch: Bed 3 can never pass more than its reducer allows, so the other two came back to meet it. The whole bay now runs at Bed 3&rsquo;s ceiling \u2014 that reducer is not costing one bed, it is capping all three.' },
];
let step=0, done=false;
/* Once the assignment is over the rig is unlocked: every wheel turns, and
   every wheel lights, because every one of them is now a control you may
   use. While the level is running this still points at exactly the valve
   the current step is about. Before this, `done` locked the lot - finishing
   a level left the player holding a rig they could not touch. */
const isLive=k=> done ? true : STEPS[step].keys.indexOf(k)>=0;

/* ---------- scenery ---------- */
let BG;
function buildScene(){
  BG=document.createElement('canvas'); BG.width=W; BG.height=H;
  const g=BG.getContext('2d');
  A.wall(g,W,H); A.rib(g,0,H); A.rib(g,862,H);
  A.vignetteOnto(g,W,H);   // room first, then signage on top of it
  A.stencil(g,52,H-26,'BIO-GROW BAY 3',18,'#8b949b');
  A.stencil(g,52,H-10,'IRRIGATION MANIFOLD',14);
}

/* ---------- drawing ---------- */
function pipeH(g,x0,x1,y,r){
  g.fillStyle=P.light; g.fillRect(x0,y-r-5,x1-x0,5);
  g.fillStyle=P.mid;   g.fillRect(x0,y+r,x1-x0,5);
  g.fillStyle=P.pipeDark; g.fillRect(x0,y-r,x1-x0,2*r);
}
function pipeV(g,x,y0,y1,r){
  g.fillStyle=P.light; g.fillRect(x-r-5,y0,5,y1-y0);
  g.fillStyle=P.mid;   g.fillRect(x+r,y0,5,y1-y0);
  g.fillStyle=P.pipeDark; g.fillRect(x-r,y0,2*r,y1-y0);
}
function draw(g,dt,t){
  const S=solve();
  g.drawImage(BG,0,0);

  // ---- pipe work ----
  /* The whole network in one call, so no wall can land across a bore. */
  NET.draw(g);
  g.fillStyle=P.rim; g.font="13px 'VT323',monospace"; g.textAlign="center";
  g.fillText("REDUCER",(RED_X0+RED_X1)/2,BR_Y[2]-R_BR-14);
  wheels.forEach(w=>LPE.valveShell(g,w.x,w.y,w.key==='main'?R_MAIN:R_BR));
  main.draw(g); trunk.draw(g);
  branches.forEach(b=>b.draw(g));

  /* The beds are growing trays, not labels. Drawn as real objects whether
     or not they are running - an unlit rectangle the colour of the wall read
     as nothing being there at all. */
  BR_Y.forEach((y,i)=>{
    const q=S.q[i], wet=q>0.05, bx=POD_X, bw=62, bh=40;
    g.fillStyle='#2a333a'; g.fillRect(bx,y-bh/2,bw,bh);          // tray
    g.fillStyle='#1a2a1c'; g.fillRect(bx+3,y-bh/2+3,bw-6,bh-6);  // growing media
    for(let k=0;k<5;k++){                                        // seedlings
      const sx=bx+10+k*10, h=wet?9:5;
      g.fillStyle=wet?'#39ff6a':'#4a5a44';
      g.fillRect(sx,y-h,2,h);
      g.fillRect(sx-2,y-h,6,2);
    }
    if(wet){                                                     // water in the tray
      const lv=Math.min(1,q/1.5);
      g.fillStyle='rgba(54,224,255,0.30)';
      g.fillRect(bx+3,y+bh/2-3-8*lv,bw-6,8*lv);
    }
    g.strokeStyle=wet?P.water:'#4a545e'; g.lineWidth=2;
    g.strokeRect(bx,y-bh/2,bw,bh);
    /* Readout plates come from the engine now, opaque. The level does not
       get to invent how a number is set on a wall. */
    const plate=(px,py,pw,ph)=>A.plate(g,px,py,pw,ph);
    plate(bx-4,y-bh/2-20,62,17);
    g.fillStyle=P.rim; g.font="13px 'VT323',monospace"; g.textAlign='left';
    g.fillText('BED '+(i+1),bx,y-bh/2-7);
    /* The flow reading belongs ON the line it describes, in the clear run
       before the tray. Under the tray it was unreadable for two reasons at
       once: the plate ran from x=808 to the canvas edge at 900, straight
       over the right-hand rib, and each one finished exactly where the next
       bed's label plate started. There is 90px of empty pipe here and
       nothing else competing for it. */
    A.readout(g,{x:714,y:y-39,w:94,h:26,size:20,text:q.toFixed(1)+' gpm',lit:wet});
    if(venting(i)){
      /* Below the line: the flow reading now holds the space above it. */
      plate(bx-104,y+18,96,17);
      g.fillStyle=P.amber; g.font="13px 'VT323',monospace"; g.textAlign='right';
      g.fillText('VENTING AIR',bx-10,y+31);
    }
  });

  // ---- valves ----
  wheels.forEach(w=>{
    const v=valves[w.key], r=w.key==='main'?R_MAIN:R_BR;
    LPE.valveTrim(g,w.x,w.y,r,w.y-r-10-STEM,v*LPE.WHEEL_SWEEP,WHEEL_R,isLive(w.key),v);
    /* Beside the valve on its own plate. There is only 86px between branches,
       so both above the wheel and below the body land on a neighbour. */
    // the main sits under the manifold gauge, so its plate goes to the left
    const lx=(w.key==='main')?w.x-128:w.x+38, ly=w.y-34;   // above the bore, never on it
    A.plate(g,lx-4,ly-17,92,34);
    g.fillStyle=isLive(w.key)?P.amber:P.rim;
    g.font="13px 'VT323',monospace"; g.textAlign='left';
    g.fillText(w.label,lx,ly-4);
    g.fillStyle=v>0.02?'#39ff6a':'#b8434a';
    g.font="17px 'VT323',monospace";
    g.fillText(v<=0.02?'SHUT':Math.round(v*100)+'% OPEN',lx,ly+13);
  });

  /* Gauge teed off above the header. Sitting it on the line at x=222 put it
     through the main valve body and hid the pipe behind it. */
  const GX=258, GY=36, GR=25;
  g.strokeStyle=P.light; g.lineWidth=4;
  g.beginPath(); g.moveTo(GX,MAIN_Y-R_MAIN-5); g.lineTo(GX,GY+GR); g.stroke();
  LPE.gauge(g,GX,GY,GR,S.pMan,80);
  g.fillStyle=P.rim; g.font="13px 'VT323',monospace"; g.textAlign='left';
  g.fillText('MANIFOLD',GX+GR+8,GY+4);

}

/* ---------- simulation ---------- */
function stepSim(dt){
  const S=solve();
  pManHeld += (S.pTarget-pManHeld)*Math.min(1,dt/P_TAU);
  for(let i=0;i<3;i++){
    if(S.q[i]>0) fill[i]=Math.min(1,fill[i]+S.q[i]*FILL_RATE*dt/BR_LEN);
    const f=Math.min(1,S.q[i]/FLOW_REF.branch);
    // one wetted front walking along the branch, across however many pieces
    // the engine knows each piece's true length, arcs included
    let walked=fill[i]*BR_TOTAL[i], off=0;
    branches[i].segs.forEach((s,n)=>{
      branches[i].set(n,{flow:f, fill:Math.max(0,Math.min(1,(walked-off)/s.len))});
      off+=s.len;
    });
  }
  // trunk pieces carry only what is still downstream of them
  // four pieces now: the elbow out to bed 3 is one of them, and it was
  // being left at zero flow, so nothing moved round the bottom 90
  const dn=[S.q[0]+S.q[1]+S.q[2], S.q[1]+S.q[2], S.q[2], S.q[2]];
  dn.forEach((q,i)=>trunk.set(i,{flow:Math.min(1,q/FLOW_REF.riser)}));
  /* The header carries the SAME stream as the manifold side - one series
     path, so whatever leaves the beds came through here first. It was pinned
     to zero, which left the supply standing still while water poured out of
     the bay. Always full is right; always still is not - that is only true
     while the main is shut, and the flow value handles that on its own. */
  const mainFlow=Math.min(1,S.qTot/FLOW_REF.riser);
  [0,1,2].forEach(n=>main.set(n,{flow:mainFlow}));
  main.update(dt); trunk.update(dt); branches.forEach(b=>b.update(dt));
  LPE.audio.flow(Math.min(1,S.qTot/FLOW_REF.riser));
  /* The same air, the same sound. Level one shows VENTING AIR on all three
     branches as they purge and had no sound for it at all, which is the
     half of the lesson you are meant to hear. Loudest branch wins - they
     are feet apart in the same bay, not separate rooms. */
  LPE.audio.vent(Math.max(0,...[0,1,2].map(i=>
    venting(i) ? Math.min(1,0.35+S.q[i]/4) : 0)));
  /* Bed 3's reducer is noisy whenever it is passing water. */
  LPE.audio.rush(Math.min(1,S.q[2]/1.5));

  /* The lesson is held on screen until the player continues - the engine
     owns that wait, so no level picks its own timer. A 1.5s flash was far
     too short to read a paragraph. */
  if(!done && !SH.holding && STEPS[step].ok()){
    const last=step>=STEPS.length-1;
    SH.beat(STEPS[step].lesson, ()=>{
      if(last){ done=true;
        /* The engine takes it from here: it keeps the closing lesson on the
           strip, and offers the way out that used to not exist. */
        SH.finish({ lesson:STEPS[STEPS.length-1].lesson,
          line:'<span class="accent">Bay 3 is commissioned.</span> Three beds balanced, '+
               'and a reducer in line 3 that is now holding the whole bay back.' }); }
      else { step++; say(); }
    });
    SH.count(last?'DONE':(step+2)+' / '+STEPS.length);
  }
}
function say(){
  if(done) return;
  SH.say(STEPS[step].task,'');
  SH.count((step+1)+' / '+STEPS.length);
}

/* ---------- input: drag a hand wheel ---------- */
let drag=null,lastAng=0;
function onDown(e){
  LPE.audio.init(); LPE.audio.resume(); LPE.audio.startFlow();
  const p=SH.pt(e);
  for(const w of wheels){
    const r=w.key==='main'?R_MAIN:R_BR, wy=w.y-r-10-STEM;
    if(Math.hypot(p.x-w.x,p.y-wy)<WHEEL_R+16 && isLive(w.key)){
      drag=w; lastAng=Math.atan2(p.y-wy,p.x-w.x);
      SH.canvas.setPointerCapture(e.pointerId); return;
    }
  }
}
function onMove(e){
  if(!drag) return;
  const p=SH.pt(e), r=drag.key==='main'?R_MAIN:R_BR, wy=drag.y-r-10-STEM;
  const a=Math.atan2(p.y-wy,p.x-drag.x);
  let d=a-lastAng;
  while(d>Math.PI) d-=6.2832; while(d<-Math.PI) d+=6.2832;
  lastAng=a;
  const before=valves[drag.key];
  valves[drag.key]=Math.max(0,Math.min(1,before+d/(2*Math.PI)));
  if(Math.floor(valves[drag.key]*12)!==Math.floor(before*12)) LPE.audio.tick();
}

/* ---------- mount ---------- */
buildScene();
const SH=LPE.mount({
  t1:'IRRIGATION MANIFOLD \u2014 CUTAWAY',
  t2:'The Garden \u00b7 Bio-Grow Bay 3',
  w:W,h:H,step:stepSim,draw,
  intro:[
    {kind:'place',
     text:'Two decks up from Four-B, and a different century. The lift opens on humid '+
          'air and the hum of circulation fans. Three new growing beds sit dry at the '+
          'end of the row, media packed, lines run, waiting on water.'+
          '<br><br>One valve by hand got Bio Lab One its water. There are four here, '+
          'and they are all drinking from the same pipe.'+
          '<br><br>Everything in this bay comes up the line from the '+
          '<span class="accent">Thermal Reservoir</span> &mdash; some of it mined out of the ice, '+
          'some of it condensate pulled back out of this very air. None of it is cheap, and all of '+
          'it is counted. Nothing down here gets opened carelessly.'},
    {kind:'title', eyebrow:'SECTOR 3 \u00b7 LIFE SUPPORT',
     title:'BIO-GROW BAY 3', sub:'IRRIGATION MANIFOLD \u00b7 COMMISSIONING'},
  ],
  onStart:say,
  onReset(){
    valves.main=valves.b0=valves.b1=valves.b2=0;
    pManHeld=0; step=0; done=false;
    for(let i=0;i<3;i++){ fill[i]=FILL_START; branches[i].set(0,{flow:0,fill:FILL_START}); }
    LPE.audio.flow(0); LPE.audio.vent(0); LPE.audio.rush(0); say();
  },
});
SH.canvas.addEventListener('pointerdown',onDown);
SH.canvas.addEventListener('pointermove',onMove);
['pointerup','pointercancel'].forEach(k=>SH.canvas.addEventListener(k,()=>{drag=null;}));
say();
}

(window.LPE_LEVELS=window.LPE_LEVELS||[]).push({
  label:'LEVEL 1 \u2014 BIO-GROW BAY 3',
  sub:'The Garden  \u00b7  commissioning',
  /* The job, before the training for it. launch() plays this first;
     see PIPELINE.md section 6. */
  brief:[
    {kind:'comms', tag:'[ COLONY INTERCOM \u00b7 CREW CHANNEL 3 ]',
      /* Every <br> segment must fit 52 characters or the card wraps it and
         leaves the tail alone on a line. */
      text:'&ldquo;Nice work on Four-B \u2014 the lab has pressure.<br>'+
           'While you are on shift: Bay 3 is plumbed and dry.<br>'+
           'Can you bring the beds online?&rdquo;'}
  ],
  /* Level 1 ends on the reducer in bed 3 - a bore change. Nothing in the
     game had ever said what a bore is, so the rung goes here. */
  /* Bed 3's reducer is a bore change, and the whole level is one supply
     against three competing demands. Both rungs are taught on the bench
     before the player meets them in a line that matters. */
  teach:['bore','manifold'],
  start:startLevel1,
});
if(!window.LPE_GAME) startLevel1();

</script>
<script>

'use strict';
/* ============================================================
   LEVEL TWO - BAY 3, LINE 3: THE REDUCER COMES OUT

   The same rig as level one, deliberately. Level one ends by naming the
   problem out loud - "the real argument for pulling that reducer: it is
   not costing one bed, it is capping all three" - and this is going back
   to do it. Re-balancing a bay the player has already balanced once is
   reinforcement, not repetition.

   The lesson is NOT the reducer. It is the order of operations: measure
   first and you can prove what your repair bought; measure after only and
   you are taking your own word for it. The player is asked to choose, both
   choices genuinely work, and the coach reacts to which one they picked.

   The payoff falls out of the real physics rather than being staged. With
   the reducer in, balancing means throttling the two healthy beds down to
   meet the crippled one: 11.51 gpm each. With three identical branches the
   manifold splits evenly on its own at full open: 15.61 gpm each, +36%,
   and no throttling at all. The reducer was not costing bed 3 - it was
   costing every adjustment made elsewhere to work around it.
   ============================================================ */
function startLevel2(){
const A=LPE.art, P=LPE.palette, W=900, H=400;

/* ---------- geometry (level one's, unchanged) ---------- */
const MAIN_Y=86, TRUNK_X=320, POD_X=812;
const BR_Y=[170,256,342];
/* Bore radii ARE the sizing's bores, at the cutaway's own scale, so the
   drawing cannot quietly disagree with the physics. R_BR is the anchor and
   everything else follows from a real bore in inches - see sizing.js.
     NPS 3/8 Sch 40   bore 0.493 in   the branches
     NPS 1/2 Sch 40   bore 0.622 in   the main and the riser
     restriction      throat 0.108 in  derived from the Cv it has to have
   The main was drawn at 11 px for a long time, which is NPS 3/8 wearing a
   half-inch label; at this scale it is 12.6. */
const R_BR=10;                                      // the anchor
const PX_PER_IN=R_BR/0.493;                         // ~20.3 px per inch of bore
const R_MAIN=Math.round(0.622*PX_PER_IN*10)/10;     // 12.6
const RED_X0=600, RED_X1=680, RED_R=Math.round(0.108*PX_PER_IN*10)/10;
const VALVE_X=410, WHEEL_R=18, STEM=24;
const BR_LEN=POD_X-TRUNK_X;
const wheelMainX=170;
const wheels=[
  {key:'main',x:wheelMainX,y:MAIN_Y,  label:'MAIN SUPPLY'},
  {key:'b0',  x:VALVE_X,y:BR_Y[0],label:'BED 1'},
  {key:'b1',  x:VALVE_X,y:BR_Y[1],label:'BED 2'},
  {key:'b2',  x:VALVE_X,y:BR_Y[2],label:'BED 3'},
];

/* ---------- physics (level one's, plus the fitting being removable) ----------
   Verified against level one state-for-state by diffphys.js: with
   reducerIn true this solve is identical to level one's across all 27
   valve combinations. The ONLY new thing is that the series term can go. */
const P_SUP=60, SG=1.0;
/* DERIVED, not chosen - run `node sizing.js` to regenerate and see the
   working. Application: 3 NFT beds at 2.0 gpm each (an NFT channel runs
   1-2 L/min; a bed carries ~6), manifold at 15.2 psig because
   micro-irrigation headers run 10-25 psi, not mains pressure. Lines from
   ASME B36.10M Sch 40 by velocity band: NPS 3/8 branches at 3.35 ft/s,
   NPS 1/2 main at 6.34 ft/s. Then Cv = q/sqrt(dP).
   The first pass had Cv 7 / 4 / 2.2, picked because they balanced nicely,
   and the bay delivered 46.8 gpm - 2,800 gal/hour through three grow beds
   on a colony whose own narration says the water is counted. */
const CV_MAIN_MAX=0.896, CV_BR_MAX=0.513, CV_REDUCER=0.296;
const valves={main:1,b0:1,b1:1,b2:1};
let reducerIn=true;
const seriesCv=(a,b)=>1/Math.sqrt(1/(a*a)+1/(b*b));
let pManHeld=0;
const P_TAU=0.22;
function solve(){
  const cvMain=CV_MAIN_MAX*valves.main;
  const cv=[CV_BR_MAX*valves.b0, CV_BR_MAX*valves.b1, 0];
  const raw2=CV_BR_MAX*valves.b2;
  cv[2]= raw2>0 ? (reducerIn?seriesCv(raw2,CV_REDUCER):raw2) : 0;
  const cvSum=cv[0]+cv[1]+cv[2];
  let pTarget;
  if(cvMain<=0){
    pTarget=(cvSum<=0) ? pManHeld : 0;
  } else if(cvSum<=0){
    pTarget=P_SUP;
  } else {
    pTarget=P_SUP*(cvMain*cvMain)/(cvMain*cvMain+cvSum*cvSum);
  }
  const pMan=pManHeld;
  const root=Math.sqrt(Math.max(0,pMan)/SG);
  const q=cv.map(c=>c*root);
  return {cvMain,cv,cvSum,pMan,pTarget,q,qTot:q[0]+q[1]+q[2]};
}

/* ---------- air fill ----------
   The bay has been running since level one, so the lines are wet and the
   air is long gone. It comes back for line 3 only, and only once: cutting
   a spool out opens that branch to the bay and it fills with air again.
   Level one taught that; this is it arriving as a consequence. */
const FILL_START=(VALVE_X-TRUNK_X)/BR_LEN;
const fill=[1,1,1];
/* Air purge rate, set from the duration it has to produce rather than
   left as a bare number. purge = (1 - FILL_START) * BR_LEN / (q * FILL_RATE).
   At the real flows (about 2 gpm a branch) 50 gives ~4 s: long enough to
   read the caption and watch the front move, short enough not to stall.
   This is a constant that only means anything in combination with the flow
   scale - when the Cv values were derived down 8x, the old 12 silently
   became a 15 s purge, and a hand-tuned 5 became 40 s. */
const FILL_RATE=50;
const venting=i=>fill[i]>FILL_START+0.001 && fill[i]<1;

/* ---------- water ---------- */
const BEND=3*R_MAIN;
const E1={x:TRUNK_X,y:MAIN_Y}, E2={x:TRUNK_X,y:BR_Y[2]};
const main=new LPE.Line({r:R_MAIN,segments:[
  {ax:30,ay:MAIN_Y,bx:wheelMainX,by:MAIN_Y,fill:1},
  {ax:wheelMainX,ay:MAIN_Y,bx:E1.x-BEND,by:MAIN_Y,fill:1},
  {arc:{cx:E1.x-BEND,cy:E1.y+BEND,R:BEND,a0:-Math.PI/2,a1:0},fill:1},
]});
const trunk=new LPE.Line({r:R_MAIN,segments:[
  {ax:TRUNK_X,ay:E1.y+BEND,bx:TRUNK_X,by:BR_Y[0],fill:1},
  {ax:TRUNK_X,ay:BR_Y[0],bx:TRUNK_X,by:BR_Y[1],fill:1},
  {ax:TRUNK_X,ay:BR_Y[1],bx:TRUNK_X,by:E2.y-BEND,fill:1},
  {arc:{cx:E2.x+BEND,cy:E2.y-BEND,R:BEND,a0:Math.PI,a1:Math.PI/2},fill:1},
]});

/* The network is rebuilt when the fitting changes, because the drawn pipe
   and the water's path are the same description of the same hardware. A
   level that let those two drift would show a reducer that was not there. */
let NET, branches, BR_SEGS, BR_TOTAL;
const TEE_R=R_BR*1.6;
function buildNet(){
  NET=LPE.piping({
    lines:[
      {pts:[[30,MAIN_Y],[TRUNK_X,MAIN_Y],[TRUNK_X,BR_Y[2]],
            [reducerIn?RED_X0:POD_X,BR_Y[2]]], r:R_MAIN},
    ].concat(reducerIn?[{pts:[[RED_X1,BR_Y[2]],[POD_X,BR_Y[2]]], r:R_MAIN}]:[])
     .concat([
      {pts:[[TRUNK_X,BR_Y[0]],[POD_X,BR_Y[0]]], r:R_BR},
      {pts:[[TRUNK_X,BR_Y[1]],[POD_X,BR_Y[1]]], r:R_BR},
    ]),
    tees:[{x:TRUNK_X,y:BR_Y[0],r:R_MAIN,branch:R_BR},
          {x:TRUNK_X,y:BR_Y[1],r:R_MAIN,branch:R_BR}],
    reducers: reducerIn?[{x0:RED_X0,x1:RED_X1,y:BR_Y[2],r1:R_MAIN,r2:RED_R}]:[],
    /* The union on the header, and - once the swap is done - the coupling
       that replaces the reducer. A coupling is a collar pair: same bore
       either side, which is the entire point of it. */
    fittings:[{x:wheelMainX-54,y:MAIN_Y,r:R_MAIN,kind:'union'}]
      .concat(reducerIn?[]:[{x:(RED_X0+RED_X1)/2,y:BR_Y[2],r:R_BR,kind:'coupling'}]),
  });
  BR_SEGS=BR_Y.map((y,i)=> i!==2
    ? [{arc:{cx:TRUNK_X+TEE_R,cy:y-TEE_R,R:TEE_R,a0:Math.PI,a1:Math.PI/2},r:R_BR},
       {ax:TRUNK_X+TEE_R,ay:y,bx:POD_X,by:y,r:R_BR}]
    : reducerIn
      ? [{ax:TRUNK_X+BEND,ay:y,bx:RED_X0,by:y,r:R_BR},
         {ax:RED_X0,ay:y,bx:RED_X1,by:y,r:RED_R,speed:6},
         {ax:RED_X1,ay:y,bx:POD_X,by:y,r:R_BR}]
      : [{ax:TRUNK_X+BEND,ay:y,bx:POD_X,by:y,r:R_BR}]);   // one clear bore
  const keep=branches;
  branches=BR_Y.map((y,i)=>new LPE.Line({r:R_BR,
    segments:BR_SEGS[i].map(s=>({...s,fill:(keep?fill[i]:1)}))}));
  BR_TOTAL=branches.map(b=>b.segs.reduce((t,s)=>t+s.len,0));
}
buildNet();

const FLOW_REF=(()=>{
  const keep={...valves}, keepP=pManHeld, keepR=reducerIn;
  reducerIn=false;                       // reference the bay at its best
  const settle=v=>{ Object.assign(valves,v); let S=solve(); pManHeld=S.pTarget; return solve(); };
  const all=settle({main:1,b0:1,b1:1,b2:1}).qTot;
  const one=settle({main:1,b0:1,b1:0,b2:0}).q[0];
  Object.assign(valves,keep); pManHeld=keepP; reducerIn=keepR;
  return {riser:all, branch:one};
})();

/* ---------- the baseline the player is asked to take ---------- */
let baseline=null;                        // {per, tot} once measured, else null
let result=null;                          // and the same, after the repair

/* A step may only latch once the manifold has actually settled.
   Without this the bay reads as balanced DURING the pressure transient:
   every branch is scaled by the same sqrt(pMan), so while the pressure is
   still climbing all three numbers are low but nearly equal, and a
   spread-plus-floor test passes at a moment that is not a steady state.
   That is how the first run of this level recorded a baseline of 8.8 gpm
   for a bay that settles at 11.5. A measurement taken before the rig stops
   moving is not a measurement. */
const settled=()=>Math.abs(solve().pTarget-pManHeld)<0.12;

/* What the bay is ON ITS WAY TO, not where the needle happens to be this
   frame. Recorded figures are read from here: within the settle tolerance
   the live value still drifts enough to print 15.7 for a bay that runs at
   15.61, and the whole level turns on two numbers being comparable. */
function steady(){
  const S=solve(), root=Math.sqrt(Math.max(0,S.pTarget)/SG);
  const q=S.cv.map(c=>c*root);
  return {q, per:(q[0]+q[1]+q[2])/3, tot:q[0]+q[1]+q[2]};
}

/* Balanced means even AND as high as the weakest branch allows - not merely
   even. Throttling all three down to match would also be "within a gallon",
   and would quietly understate the baseline, which flatters the repair that
   comes next. Bed 3 tops out at 11.51 through the reducer, so the window
   sits just under it. */
const balanced=()=>{ if(!settled()) return false;
                     const S=solve(), mn=Math.min(...S.q), mx=Math.max(...S.q);
                     return mn>=1.31 && (mx-mn)<=0.125; };
const allWide=()=>settled()&&valves.main>=0.9&&valves.b0>=0.9&&
                  valves.b1>=0.9&&valves.b2>=0.9;

/* ---------- the two routes through the job ---------- */
const ISOLATE={ keys:['b2'], watch:2,
  task:'Isolate line 3 \u2014 shut BED 3 right off.',
  ok:()=>valves.b2<=0.02,
  lesson:'You do not cut into a live line. And look what isolating it did to everyone '+
         'else: shut one demand and manifold pressure climbs for every branch left open. '+
         'Same rule as commissioning, now with a spanner in your hand.' };
const PULL={ keys:[], watch:2, click:true,
  task:'Now take the reducer out. Click the fitting.',
  ok:()=>!reducerIn,
  lesson:'Coupler and a new spool, same bore as the rest of the branch. '+
         'And line 3 is <b>full of air</b> again \u2014 you just had it open to the bay. '+
         'That will have to vent before water reaches the roots.' };

const THOROUGH=[
  { keys:['b0','b1','b2'], watch:-1,
    task:'Balance the bay first \u2014 all three even, and as high as Bed 3 will let them go.',
    ok:balanced,
    lesson:()=>'<b>'+baseline.per.toFixed(1)+' gpm a bed, '+baseline.tot.toFixed(1)+
      ' for the bay.</b> That is your baseline, and it is the whole reason for doing this '+
      'in this order. Whatever happens next, you can now say exactly what it was worth.' },
  ISOLATE,
  PULL,
  { keys:['b2','b0','b1','main'], watch:-1,
    task:'Open BED 3 back up and bring the whole bay wide open.',
    ok:allWide,
    lesson:()=>'<b>'+result.per.toFixed(1)+' gpm a bed</b>, against '+baseline.per.toFixed(1)+
      ' before \u2014 and notice what you did <b>not</b> have to do. You never throttled anything. '+
      'Three identical branches split the manifold evenly all by themselves. '+
      'That reducer was never costing you Bed 3; it was costing you every adjustment you '+
      'made everywhere else to work around it.' },
];

const SHORTCUT=[
  ISOLATE,
  PULL,
  { keys:['b2','b0','b1','main'], watch:-1,
    task:'Open BED 3 back up and bring the whole bay wide open.',
    ok:allWide,
    /* The strip carries the measurement; the coach's verdict carries on the
       debrief card. Together in one lesson they ran 44px past the bottom of
       a box that clips rather than scrolls, so the point of the whole route
       was the part the player never got to read. */
    lesson:()=>'<b>'+result.per.toFixed(1)+' gpm a bed</b>, and the bay balances itself now '+
      'that the three branches match. It is a good repair.<span class="gap"></span>'+
      '<span class="who">COMMS:</span> Is it better than it was? Almost certainly. '+
      '<b>How much</b> better? Neither of us can say.' },
];

let STEPS=null, step=0, done=false, route='';
/* Once the assignment is over the rig is unlocked: every wheel turns, and
   every wheel lights, because every one of them is now a control you may
   use. While the level is running this still points at exactly the valve
   the current step is about. Before this, `done` locked the lot - finishing
   a level left the player holding a rig they could not touch. */
const isLive=k=> done ? true : (!!STEPS && STEPS[step].keys.indexOf(k)>=0);
const canPull=()=>!done && STEPS && !!STEPS[step].click && reducerIn && valves.b2<=0.02;

/* ---------- scenery ---------- */
let BG;
function buildScene(){
  BG=document.createElement('canvas'); BG.width=W; BG.height=H;
  const g=BG.getContext('2d');
  A.wall(g,W,H); A.rib(g,0,H); A.rib(g,862,H);
  A.vignetteOnto(g,W,H);
  A.stencil(g,52,H-26,'BIO-GROW BAY 3',18,'#8b949b');
  A.stencil(g,52,H-10,'IRRIGATION MANIFOLD',14);
}

/* ---------- drawing ---------- */
function draw(g,dt,t){
  const S=solve();
  g.drawImage(BG,0,0);
  NET.draw(g);

  /* The fitting labels itself, and says so louder while it is the thing
     being asked for - a click target the player cannot find is not a
     puzzle, it is a dead end. */
  const RX=(RED_X0+RED_X1)/2;
  if(reducerIn){
    const hot=canPull();
    g.fillStyle=hot?P.amber:P.rim; g.font="13px 'VT323',monospace"; g.textAlign='center';
    g.fillText('REDUCER',RX,BR_Y[2]-R_BR-14);
    if(hot){
      const pulse=0.45+0.35*Math.sin(t*5);
      g.save(); g.globalAlpha=pulse; g.strokeStyle=P.amber; g.lineWidth=2;
      g.strokeRect(RED_X0-8,BR_Y[2]-R_MAIN-10,RED_X1-RED_X0+16,2*(R_MAIN+10));
      g.restore();
      g.fillStyle=P.amber; g.font="12px 'VT323',monospace";
      g.fillText('CLICK TO REMOVE',RX,BR_Y[2]+R_MAIN+22);
    }
  } else {
    g.fillStyle=P.rim; g.font="13px 'VT323',monospace"; g.textAlign='center';
    g.fillText('COUPLING',RX,BR_Y[2]-R_BR-14);
  }

  wheels.forEach(w=>LPE.valveShell(g,w.x,w.y,w.key==='main'?R_MAIN:R_BR));
  main.draw(g); trunk.draw(g);
  branches.forEach(b=>b.draw(g));

  BR_Y.forEach((y,i)=>{
    const q=S.q[i], wet=q>0.05, bx=POD_X, bw=62, bh=40;
    g.fillStyle='#2a333a'; g.fillRect(bx,y-bh/2,bw,bh);
    g.fillStyle='#1a2a1c'; g.fillRect(bx+3,y-bh/2+3,bw-6,bh-6);
    for(let k=0;k<5;k++){
      const sx=bx+10+k*10, h=wet?9:5;
      g.fillStyle=wet?'#39ff6a':'#4a5a44';
      g.fillRect(sx,y-h,2,h); g.fillRect(sx-2,y-h,6,2);
    }
    if(wet){
      const lv=Math.min(1,q/1.5);
      g.fillStyle='rgba(54,224,255,0.30)';
      g.fillRect(bx+3,y+bh/2-3-8*lv,bw-6,8*lv);
    }
    g.strokeStyle=wet?P.water:'#4a545e'; g.lineWidth=2;
    g.strokeRect(bx,y-bh/2,bw,bh);
    A.plate(g,bx-4,y-bh/2-20,62,17);
    g.fillStyle=P.rim; g.font="13px 'VT323',monospace"; g.textAlign='left';
    g.fillText('BED '+(i+1),bx,y-bh/2-7);
    A.readout(g,{x:714,y:y-39,w:94,h:26,size:20,text:q.toFixed(1)+' gpm',lit:wet});
    if(venting(i)){
      /* A small static caption at the far right lost every time, because the
         player is looking at the hand wheel. It pulses, it says what is
         actually happening, and the escaping air is drawn at the bed end
         where it is leaving. */
      const pulse=0.55+0.45*Math.sin(t*9);
      A.plate(g,bx-150,y+18,142,19);
      g.save(); g.globalAlpha=pulse;
      g.fillStyle=P.amber; g.font="14px 'VT323',monospace"; g.textAlign='right';
      g.fillText('>> VENTING AIR',bx-14,y+32);
      g.restore();
      for(let k=0;k<7;k++){                       // air spitting out at the bed
        const ph=(t*2.2+k*0.37)%1;
        g.globalAlpha=(1-ph)*0.75*pulse;
        g.fillStyle='#cfe6ff';
        g.fillRect(bx-2+ph*22, y-5+Math.sin(t*7+k*1.9)*6, 3, 2);
      }
      g.globalAlpha=1;
    }
  });

  wheels.forEach(w=>{
    const v=valves[w.key], r=w.key==='main'?R_MAIN:R_BR;
    LPE.valveTrim(g,w.x,w.y,r,w.y-r-10-STEM,v*LPE.WHEEL_SWEEP,WHEEL_R,isLive(w.key),v);
    const lx=(w.key==='main')?w.x-128:w.x+38, ly=w.y-34;
    A.plate(g,lx-4,ly-17,92,34);
    g.fillStyle=isLive(w.key)?P.amber:P.rim;
    g.font="13px 'VT323',monospace"; g.textAlign='left';
    g.fillText(w.label,lx,ly-4);
    g.fillStyle=v>0.02?'#39ff6a':'#b8434a';
    g.font="17px 'VT323',monospace";
    g.fillText(v<=0.02?'SHUT':Math.round(v*100)+'% OPEN',lx,ly+13);
  });

  const GX=258, GY=36, GR=25;
  g.strokeStyle=P.light; g.lineWidth=4;
  g.beginPath(); g.moveTo(GX,MAIN_Y-R_MAIN-5); g.lineTo(GX,GY+GR); g.stroke();
  LPE.gauge(g,GX,GY,GR,S.pMan,80);
  g.fillStyle=P.rim; g.font="13px 'VT323',monospace"; g.textAlign='left';
  g.fillText('MANIFOLD',GX+GR+8,GY+4);

  /* The baseline, once taken, stays on the wall. It is the thing the whole
     level is about; it should not live only in a lesson the player scrolled
     past four steps ago. */
  if(baseline){
    /* On clear wall to the right of the gauge. At x=36 it was drawn straight
       over the MAIN SUPPLY hand wheel and over its own label plate - every
       candidate position was checked against the fixed furniture rather
       than eyeballed from a screenshot. */
    A.plate(g,380,22,186,42);
    g.fillStyle=P.rim; g.font="12px 'VT323',monospace"; g.textAlign='left';
    g.fillText('BASELINE \u00b7 REDUCER IN',388,38);
    g.fillStyle='#8fb9ff'; g.font="17px 'VT323',monospace";
    g.fillText(baseline.per.toFixed(1)+' gpm/bed   '+baseline.tot.toFixed(1)+' total',388,56);
  }
}

/* ---------- simulation ---------- */
function stepSim(dt){
  const S=solve();
  pManHeld += (S.pTarget-pManHeld)*Math.min(1,dt/P_TAU);
  for(let i=0;i<3;i++){
    if(S.q[i]>0) fill[i]=Math.min(1,fill[i]+S.q[i]*FILL_RATE*dt/BR_LEN);
    const f=Math.min(1,S.q[i]/FLOW_REF.branch);
    let walked=fill[i]*BR_TOTAL[i], off=0;
    branches[i].segs.forEach((s,n)=>{
      branches[i].set(n,{flow:f, fill:Math.max(0,Math.min(1,(walked-off)/s.len))});
      off+=s.len;
    });
  }
  const dn=[S.q[0]+S.q[1]+S.q[2], S.q[1]+S.q[2], S.q[2], S.q[2]];
  dn.forEach((q,i)=>trunk.set(i,{flow:Math.min(1,q/FLOW_REF.riser)}));
  const mainFlow=Math.min(1,S.qTot/FLOW_REF.riser);
  [0,1,2].forEach(n=>main.set(n,{flow:mainFlow}));
  main.update(dt); trunk.update(dt); branches.forEach(b=>b.update(dt));
  LPE.audio.flow(Math.min(1,S.qTot/FLOW_REF.riser));
  /* The throat is noisy while it is in, and the bay goes quiet when it comes
     out. That silence is half the payoff - the player hears the repair. */
  LPE.audio.rush(reducerIn ? Math.min(1,S.q[2]/1.5) : 0);
  LPE.audio.vent(venting(2) ? Math.min(1,0.35+S.q[2]/4) : 0);

  if(!STEPS || done || SH.holding) return;
  if(STEPS[step].ok()){
    /* The baseline is captured the instant it is earned, before the next
       step can move the valves and make the number a lie. */
    if(route==='thorough' && step===0 && !baseline){
      baseline=steady();
    }
    /* The closing figure is captured once, here, and every later mention
       reads that one number. Re-reading the solver for the lesson and
       again for the debrief printed 15.7 and 15.6 for the same bay. */
    if(step>=STEPS.length-1 && !result){
      result=steady();
    }
    const last=step>=STEPS.length-1;
    const L=STEPS[step].lesson, text=(typeof L==='function')?L():L;
    SH.beat(text, ()=>{
      if(last){ done=true; SH.finish(ending(text)); }
      else { step++; say(); }
    });
    SH.count(last?'DONE':(step+2)+' / '+STEPS.length);
  }
}
function ending(text){
  const q=result.per;
  return route==='thorough'
    ? { lesson:text,
        line:'<span class="accent">Line 3 is a line again.</span> '+baseline.per.toFixed(1)+
             ' to '+q.toFixed(1)+' gpm a bed, and you can prove it \u2014 because you '+
             'measured the bay before you changed it.' }
    : { lesson:text,
        line:'<span class="accent">Line 3 is a line again.</span> The repair is sound \u2014 '+
             'but nobody wrote down what the bay was doing before you touched it, and that '+
             'number only ever existed in the bay you did not stop to read.<br><br>'+
             'A repair you cannot measure is a repair you cannot defend.' };
}
function say(){
  if(done||!STEPS) return;
  SH.say(STEPS[step].task,'');
  SH.count((step+1)+' / '+STEPS.length);
}

/* ---------- the fork ---------- */
function askRoute(){
  SH.ask({
    lesson:'<span class="who">COMMS:</span> Before you start \u2014 your call on the order. '+
           'We can balance the bay the way it stands and write the numbers down, then pull '+
           'the reducer. Or we can just pull it now and balance once, afterwards.',
    options:[
      { label:'BALANCE FIRST, THEN PULL IT', note:'the long way',
        pick:()=>{ route='thorough'; STEPS=THOROUGH; step=0;
          SH.beat('<span class="who">COMMS:</span> Good. That is the right instinct \u2014 '+
            'you take the measurement while the fault is still in the line, because afterwards '+
            'there is nothing left to measure. Costs you one extra balance, and plenty of '+
            'people would not bother. <b>If we are spending a shift on this, we are going '+
            'to be able to say what it bought.</b>',
            say); } },
      { label:'PULL IT NOW, BALANCE AFTER', note:'the quick way',
        pick:()=>{ route='shortcut'; STEPS=SHORTCUT; step=0;
          SH.beat('<span class="who">COMMS:</span> \u2026Alright. It will work, and the bay '+
            'will be better off than it is now. I would have spent the five minutes first, '+
            'myself. <b>Your rig, your call.</b> Let us get it out.',
            say); } },
    ],
  });
}

/* ---------- input ---------- */
let drag=null,lastAng=0;
function onDown(e){
  LPE.audio.init(); LPE.audio.resume(); LPE.audio.startFlow();
  const p=SH.pt(e);
  if(canPull() && p.x>RED_X0-12 && p.x<RED_X1+12 &&
     Math.abs(p.y-BR_Y[2])<R_MAIN+12){
    reducerIn=false;
    fill[2]=FILL_START;                 // the branch is open to the bay: air back in
    buildNet();
    LPE.audio.clunk(); LPE.audio.scrape();
    return;
  }
  for(const w of wheels){
    const r=w.key==='main'?R_MAIN:R_BR, wy=w.y-r-10-STEM;
    if(Math.hypot(p.x-w.x,p.y-wy)<WHEEL_R+16 && isLive(w.key)){
      drag=w; lastAng=Math.atan2(p.y-wy,p.x-w.x);
      SH.canvas.setPointerCapture(e.pointerId); return;
    }
  }
}
function onMove(e){
  if(!drag) return;
  const p=SH.pt(e), r=drag.key==='main'?R_MAIN:R_BR, wy=drag.y-r-10-STEM;
  const a=Math.atan2(p.y-wy,p.x-drag.x);
  let d=a-lastAng;
  while(d>Math.PI) d-=6.2832; while(d<-Math.PI) d+=6.2832;
  lastAng=a;
  const before=valves[drag.key];
  valves[drag.key]=Math.max(0,Math.min(1,before+d/(2*Math.PI)));
  if(Math.floor(valves[drag.key]*12)!==Math.floor(before*12)) LPE.audio.tick();
}

/* ---------- mount ---------- */
buildScene();
pManHeld=solve().pTarget;        // the bay is already running when you walk in
const SH=LPE.mount({
  t1:'BIO-GROW BAY 3 \u2014 LINE 3 REPAIR',
  t2:'The Garden \u00b7 Bio-Grow Bay 3 \u00b7 line 3 repair',
  w:W,h:H,step:stepSim,draw,
  intro:[
    /* The repair is not a coincidence that arrives on its own. The coach
       PUTS it on the ticket, in front of the player, and owns the cost of
       doing so - that is where the time goes, not into one extra balance. */
    {kind:'place',
     text:'Bay 3 is green now. The beds you brought online are growing, the fans are '+
          'running, and line 3 is still drinking less than the other two.'+
          '<br><br>Nobody can tell you why the reducer is there. It is not on any drawing. '+
          'Someone fitted it, years ago, for a reason that left with them \u2014 and the '+
          'bay has been working around it ever since.'+
          '<br><br>Nothing is broken. Nobody was ever going to schedule this. It is going '+
          'on the order because <span class="accent">there is slack in the shift</span> '+
          'to put it right, and because a bay that works around a fault is still a bay '+
          'with a fault in it. There is a coupling and a length of new spool on the cart.'},
    {kind:'title', eyebrow:'SECTOR 3 \u00b7 LIFE SUPPORT',
     title:'LINE 3 \u2014 REDUCER REMOVAL', sub:'BIO-GROW BAY 3 \u00b7 CORRECTIVE WORK'},
  ],
  onStart:askRoute,
  onReset(){
    Object.assign(valves,{main:1,b0:1,b1:1,b2:1});
    reducerIn=true; baseline=null; result=null; STEPS=null; step=0; done=false; route='';
    fill[0]=fill[1]=fill[2]=1;
    buildNet();
    pManHeld=solve().pTarget;
    LPE.audio.flow(0); LPE.audio.vent(0); LPE.audio.rush(0);
    askRoute();
  },
});
SH.canvas.addEventListener('pointerdown',onDown);
SH.canvas.addEventListener('pointermove',onMove);
['pointerup','pointercancel'].forEach(k=>SH.canvas.addEventListener(k,()=>{drag=null;}));
}

(window.LPE_LEVELS=window.LPE_LEVELS||[]).push({
  label:'LEVEL 2 \u2014 LINE 3 REPAIR',
  sub:'Bio-Grow Bay 3  \u00b7  corrective',
  /* The job, before the training for it. launch() plays this first;
     see PIPELINE.md section 6. */
  brief:[
    {kind:'comms', tag:'[ COLONY INTERCOM \u00b7 CREW CHANNEL 3 ]',
      /* Every <br> segment must fit 52 characters or the card wraps it and
         leaves the tail alone on a line. */
      text:'&ldquo;Bay 3 is on your round this shift.<br>'+
           'One more on your ticket while you are down there \u2014<br>'+
           'that reducer in line 3. It comes out today.&rdquo;'}
  ],
  /* Level 2 measures the reducer in bed 3 and then takes it out. The
     rung behind that - what a restriction costs, in P1/P2 terms - is
     taught on the bench first. */
  teach:['restriction'],
  start:startLevel2,
});
if(!window.LPE_GAME) startLevel2();

</script>
<script>

'use strict';
/* ============================================================
   LEVEL THREE \u2014 THE DOSING SKID

   The duty: 0.50 gpm of feed to two beds, both inside 1.4-1.8 mS/cm.
   The dose rate is already correct. The beds are not.

   The fault is the mixing run. At 0.50 gpm a 3/4 in line runs at Re 1913
   - laminar - and laminar flow does not mix. The concentrate ribbons
   through without blending, so the near bed takes a rich cut and the far
   bed takes a weak one. The fix is counterintuitive and real: make the
   pipe SMALLER. Same flow through a 1/4 in run is Re 4319, turbulent,
   and it mixes.

   Checked before it was built (reference/crosscheck.js):
     mixing run   Re      BED A   BED B
     3/4          1913    2.32    0.88    fail
     1/2          2532    2.22    0.98    fail
     3/8          3184    1.95    1.25    fail
     1/4          4319    1.60    1.60    PASS
   and the duty blocks the brute-force: holding 3/4 in and winding the
   feed up until it mixes needs 1.10 gpm, more than double what the beds
   are asking for.
   ============================================================ */
function startLevel3(){
const A=LPE.art, P=LPE.palette, W=900, H=400;
const FL=LPE_FLUIDS;

/* ---- the duty ---- */
const DUTY=0.50, EC_T=1.6, EC_LO=1.4, EC_HI=1.8, SPREAD=0.45;
const FEED_MAX=1.20;

/* ASME B36.10M bores, the same table sizing.js carries. */
const RUNS=[
  {k:'3/4', bore:0.824, area:0.00370, label:'3/4 in'},
  {k:'1/2', bore:0.622, area:0.00211, label:'1/2 in'},
  {k:'3/8', bore:0.493, area:0.00133, label:'3/8 in'},
  {k:'1/4', bore:0.364, area:0.000724, label:'1/4 in'},
];

const S={ feed:0, run:'3/4', drag:false, lastAng:0, turn:0, closing:false, picking:false };

/* ---- layout, one table ----
   Everything on the feed sits on ONE centreline. The first pass had the
   injector 19 px below the mixing run, so the line visibly stepped where
   nothing happens, and the readout's footer printed over its own last
   row. */
const PIPE_Y=256;
const LAY={
  tank : {x:52,  y:150, w:86,  h:132},
  inj  : {x:188, y:PIPE_Y-20, w:46,  h:40},
  mix  : {x:300, y:PIPE_Y-15, w:250, h:30},
  wheel: {x:252, y:PIPE_Y-62, r:26},
  split: {x:596, y:PIPE_Y},
  bedA : {x:656, y:158, w:96, h:66},
  bedB : {x:656, y:268, w:96, h:66},
  rack : {x:300, y:314, w:250, h:52},
  read : {x:612, y:38,  w:246, h:112},
};

function runNow(){ return RUNS.find(r=>r.k===S.run) || RUNS[0]; }

/* ---- the model ----
   Mixedness is a straight ramp across the transition band: nothing below
   Re 2300, complete above 4000. The ramp is the honest shape - the
   transition really is gradual - and it is the same band the bench taught
   on, so the number the player learned there means the same thing here. */
function solve(){
  const q = FEED_MAX*S.feed;
  const r = runNow();
  const v = q/448.831/r.area;
  const re = q>0.004 ? FL.reynolds(v, r.bore, FL.FLUIDS.water, 20) : 0;
  const mix = Math.max(0, Math.min(1, (re-2300)/1700));
  /* With the dose correct, poor mixing does not change the average - it
     splits it. The near tap takes the rich side of the ribbon, the far
     tap takes what is left. */
  const spread = q>0.004 ? (1-mix)*SPREAD : 0;
