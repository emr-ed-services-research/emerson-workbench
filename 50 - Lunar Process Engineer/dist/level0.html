    /* Liquid only under pressure - about 57 bar at 20 C. The bench holds it
       near saturation, so its temperature is not a free dial: heat it and
       it does not get hotter, it flashes. That is a later lesson, and the
       reason this one is pinned. */
    co2: {
      name: 'LIQUID CO2',
      sg: 0.772,
      nuAt: () => 0.0908e-6,
      tempRange: [20, 20],
      note: 'held near saturation, about 57 bar at 20 C',
    },
    propane: {
      name: 'LIQUID PROPANE',
      sg: 0.501,
      nuAt: () => 0.204e-6,
      tempRange: [20, 20],
      note: 'held near saturation, about 8.4 bar at 20 C',
    },
  };

  /* Reynolds number. D in feet, v in ft/s, nu converted from the table. */
  function reynolds(velFtS, boreIn, fluid, tempC) {
    const nu = fluid.nuAt(tempC) * M2_TO_FT2;
    return velFtS * (boreIn / 12) / nu;
  }

  function regime(re) {
    return re < 2300 ? 'laminar' : (re > 4000 ? 'turbulent' : 'transitional');
  }

  /* How much flows, for a given Cv and pressure drop. The SG term is the
     one the fluid selector moves. */
  function flow(cv, dP, fluid) { return cv * Math.sqrt(dP / fluid.sg); }

  root.LPE_FLUIDS = { FLUIDS, waterNu, reynolds, regime, flow, M2_TO_FT2 };

})(typeof window !== 'undefined' ? window : globalThis);

if (typeof module !== 'undefined') module.exports = globalThis.LPE_FLUIDS;

</script>
<script>
'use strict';
/* ============================================================
   LEVEL ZERO \u2014 the interaction grammar, nothing else.
   A panel reveals. A wheel controls. A gauge responds.

   Everything this file does is geometry, scenery composition and
   script. Water, scenery pieces, the valve, the gauge, sound and the
   shell all come from engine.js \u2014 this level cannot disagree with
   another level about how any of them behave.
   ============================================================ */
function startLevel0(){
const A=LPE.art, P=LPE.palette, W=900, H=400;

const PANEL={x:232,y:142,w:452,h:190};
const PIPE_Y=262, R=11;
const VALVE_X=338, WHEEL_R=26, WHEEL_Y=PIPE_Y-R-10-26;
const GAUGE={x:584,y:196,r:33};
const LAMP={x:458,y:96};
/* The Thermal Reservoir header is 60 psig everywhere on the base. This read
   42 while the Garden manifold in level one sits at 60 off the same source,
   which cannot both be true. */
const P_SUPPLY=60, TURNS=2;

const S={phase:'closed',slide:0,turn:0,open:0,press:0,drag:false,lastAng:0,
         flick:1,dripT:0,dripY:-1,closing:false};

/* The line: full and still upstream of the shut valve, air beyond it.
   Both facts are the engine's rules, not this level's invention. */
const line=new LPE.Line({r:R,segments:[
  // live off the reservoir
  {ax:PANEL.x-6, ay:PIPE_Y, bx:VALVE_X,            by:PIPE_Y, flow:0, fill:1},
  // dead leg to the lab
  {ax:VALVE_X,   ay:PIPE_Y, bx:PANEL.x+PANEL.w+6,  by:PIPE_Y, flow:0, fill:0},
]});

/* ---------------- scenery, composed once ---------------- */
let BG,dust=[];
for(let i=0;i<34;i++) dust.push({x:LAMP.x-90+Math.random()*180,y:LAMP.y+Math.random()*230,
  s:4+Math.random()*9,p:Math.random()*6.3});
function buildScene(){
  BG=document.createElement('canvas'); BG.width=W; BG.height=H;
  const g=BG.getContext('2d');
  A.wall(g,W,H); A.rib(g,0,H); A.rib(g,862,H); A.ceiling(g,W);
  A.overhead(g,W,62,8,false);
  A.overhead(g,W,92,9,true);
  A.floor(g,W,352);
  A.vignetteOnto(g,W,H);   // room first, then signage and props on top
  A.stencil(g,52,132,'SECTION 4-B',20,'#8b949b');
  A.stencil(g,52,152,'HAND-OPERATED \u2014 NO REMOTE',15);
  A.arrow(g,846,300,'BIO LAB 1');
  A.placard(g,724,116);
  A.lampHousing(g,LAMP.x,LAMP.y);
  A.toolbox(g,96,312);
  A.clipboard(g,790,158);
  A.dither(g,0,0,170,120,P.shadow,0.26);
  A.dither(g,W-170,0,170,120,P.shadow,0.26);

  // the recess the panel covers
  g.fillStyle='#0c1114'; g.fillRect(PANEL.x-12,PANEL.y-12,PANEL.w+24,PANEL.h+24);
  g.fillStyle=P.light; g.fillRect(PANEL.x-12,PANEL.y-12,PANEL.w+24,4);
  g.fillStyle=P.mid;   g.fillRect(PANEL.x-12,PANEL.y+PANEL.h+8,PANEL.w+24,4);
  g.fillStyle='#2b353b';
  for(let x=PANEL.x-4;x<PANEL.x+PANEL.w+8;x+=38){
    g.fillRect(x,PANEL.y-9,3,3); g.fillRect(x,PANEL.y+PANEL.h+11,3,3); }
  g.fillStyle='#161d21';
  g.fillRect(PANEL.x-12,PANEL.y-6,PANEL.w+24,5);
  g.fillRect(PANEL.x-12,PANEL.y+PANEL.h+1,PANEL.w+24,5);
  g.fillStyle='#070a0c'; g.fillRect(PANEL.x,PANEL.y,PANEL.w,PANEL.h);
  A.dither(g,PANEL.x,PANEL.y,PANEL.w,40,'#000000',0.5);

}

/* ---------------- script ---------------- */
/* The picture carries the state. These lines are a person talking, not a
   caption describing what is already on screen. */
function lines(){
  switch(S.phase){
    case 'closed': return ['Open the panel.',
      '<span class="who">COMMS:</span> Access panel, right in front of you. Slide it across. '+
      'Nothing automated down this end, it is all turned by hand.'];
    case 'opening': return ['Open the panel.',
      '<span class="who">COMMS:</span> Put your back into it.'];
    case 'open': return ['Turn the wheel.',
      '<span class="who">COMMS:</span> Couple of full turns. Watch the gauge &mdash; it is on the '+
      'lab side of the valve, so it tells you what they are actually getting.'];
    case 'turning': return ['Keep turning.',
      '<b>'+S.press.toFixed(0)+' psig</b> at the lab.'];
    default: return ['That is water into Bio Lab One.',
      '<span class="who">COMMS:</span> Good. Find the panel, work the valve, read the gauge &mdash; '+
      'that is the job down this end, and the engineer you are standing in for did it for six years. '+
      'Play your cards right, you might make a decent one yourself.'];
  }
}
/* The strip belongs to whatever is holding it. say() runs on every drag
   move, so without this the closing comms were overwritten the moment the
   player nudged the wheel again - and nothing speaks once the level is
   over, or the sign-off would be wiped by a stray turn. */
function say(){ if(SH.holding||SH.done||S.closing) return;
                const [t,l]=lines(); SH.say(t,l); }

/* ---------------- the wind-down ----------------
   Water arriving used to go straight to the debrief card, which landed on
   top of the closing line before any of it could be read. The level has
   something to say first, and the player says when to move on. */
const CLOSING=[
  /* The velocity profile has been drawn in every pipe of every level since
     the beginning and no level has ever pointed at it. It is the detail a
     cutaway view exists for. Two tracers race while this is held: the
     centreline one and the one against the bore, both carried by the same
     profile the water uses. */
  /* The trainer taught this properly. Here it is only recognition - the
     same shape, in a line that matters. Re-teaching it would be the
     lesson arriving twice and landing neither time. */
  '<span class="who">COMMS:</span> And there it is in a real line &mdash; centre '+
  'running away from the wall, exactly like the loop. You will see it in every pipe '+
  'on this base now that you know to look for it.',

  '<span class="who">COMMS:</span> There it is. And look at what that gauge did &mdash; '+
  'it sat at nothing while the line behind the valve was already full and already '+
  'under pressure. <b>Pressure is not flow.</b> The wheel did not make water. It gave '+
  'what was already standing there somewhere to go.',

  '<span class="who">COMMS:</span> Nothing down this end is automated. No actuators, '+
  'no remote, no screens. Every run in Four-B gets opened by somebody standing where '+
  'you are, reading a gauge with their own eyes.<span class="gap"></span>'+
  'The engineer you stood in for today walked this round for six years.',

  '<span class="who">COMMS:</span> Bio Lab One has water. Nobody up there will think '+
  'about you again until it stops &mdash; that is the job.<span class="gap"></span>'+
  'Play your cards right, you might make a decent one yourself.',
];
/* True once the centreline tracer has covered most of the run, which is
   the moment the gap between the two is unmistakable. */
/* Watched-for, in SIMULATION seconds since the markers started running.
   Lap position does not work as a gate: flow establishes while the player
   is still turning the wheel, so the race can finish before their hand
   leaves it and the lesson unlocks before they have looked at anything. */
let raceT=0;
const RACE_WATCH=2.6;
const raceRun=()=>raceT>=RACE_WATCH;
function closeOut(i){
  if(i===0) raceT=0;
  line.race(1, i===0);              // downstream run, during the velocity beat only
  if(i>=CLOSING.length){
    S.closing=false;
    line.race(1,false);
    SH.finish({ lesson:CLOSING[CLOSING.length-1],
      line:'<span class="accent">Bio Lab One has water.</span> That is one valve, '+
           'by hand, on the oldest run on the base. Everything after this is the '+
           'same job with more of it happening at once.' });
    return;
  }
  /* The velocity beat waits for the tracers to have separated. Starting it
     the instant flow establishes and accepting a click immediately meant the
     one thing it exists to show could be clicked past before it happened. */
  SH.beat(CLOSING[i], ()=>closeOut(i+1), i===0 ? raceRun : null);
}

/* ---------------- simulation ---------------- */
function step(dt){
  if(S.phase==='opening'){
    S.slide=Math.min(1,S.slide+dt/0.95);
    if(S.slide>=1){ S.phase='open'; LPE.audio.clunk(); say(); }
  }
  const up=line.segs[0], down=line.segs[1];
  if(S.phase==='turning'||S.phase==='flowing'){
    const f=S.open>0.04?S.open:0;
    up.flow  += (f-up.flow)*Math.min(1,dt/0.5);
    down.flow = up.flow;
    if(f>0) down.fill=Math.min(1,down.fill+dt*f*0.75);
    // the lab-side gauge only reads once water has actually reached it
    const target=P_SUPPLY*S.open*Math.min(1,down.fill/0.85);
    S.press+=(target-S.press)*Math.min(1,dt/0.3);
    LPE.audio.flow(up.flow);
    if(S.phase==='turning' && down.fill>=1 && S.press>14){
      S.phase='flowing'; S.closing=true; closeOut(0);
    }
  }
  if(line.segs[1].race) raceT+=dt;   // simulation seconds the markers have run
  line.update(dt);
}

/* ---------------- frame ---------------- */
function draw(g,dt,t){
  g.drawImage(BG,0,0);

  /* The lamp is on the wall face, so its light falls on the wall \u2014 it
     cannot reach into the chase behind the panel. Clipping the recess out
     of the cone (and out of the dust) keeps that true whether the cover is
     open or shut. */
  S.flick += ((Math.random()<0.012?0.55:1)-S.flick)*Math.min(1,dt/0.05);
  g.save();
  g.beginPath();
  g.rect(0,0,W,H);
  g.rect(PANEL.x-12,PANEL.y-12,PANEL.w+24,PANEL.h+24);
  g.clip('evenodd');
  g.globalAlpha=0.15*S.flick; g.fillStyle=P.lamp;
  g.beginPath(); g.moveTo(LAMP.x-22,LAMP.y+6); g.lineTo(LAMP.x+22,LAMP.y+6);
  g.lineTo(LAMP.x+190,352); g.lineTo(LAMP.x-190,352); g.closePath(); g.fill();
  g.globalAlpha=1; g.fillStyle='rgba(255,217,160,0.33)';
  dust.forEach(d=>{ d.y+=d.s*dt; if(d.y>340){ d.y=LAMP.y+10; d.x=LAMP.x-90+Math.random()*180; }
    g.fillRect(d.x+Math.sin(t*0.6+d.p)*7,d.y,1,1); });
  g.restore();

  S.dripT+=dt;
  if(S.dripY<0 && S.dripT>3.4){ S.dripY=104; S.dripT=0; }
  if(S.dripY>=0){
    S.dripY+=170*dt; g.fillStyle=P.water; g.fillRect(220,S.dripY,2,4);
    if(S.dripY>348){ S.dripY=-1; LPE.audio.drip(); }
  }

  g.save(); g.beginPath(); g.rect(PANEL.x,PANEL.y,PANEL.w,PANEL.h); g.clip();
  LPE.pipeRun(g,PANEL.x,PANEL.x+PANEL.w,PIPE_Y,R);
  LPE.penetration(g,PANEL.x+4,PIPE_Y,R);
  LPE.penetration(g,PANEL.x+PANEL.w-16,PIPE_Y,R);
  LPE.valveShell(g,VALVE_X,PIPE_Y,R);
  line.draw(g);
  LPE.valveTrim(g,VALVE_X,PIPE_Y,R,WHEEL_Y,S.open*LPE.WHEEL_SWEEP,WHEEL_R,S.phase==='open',S.open);
  g.strokeStyle=P.light; g.lineWidth=4;
  g.beginPath(); g.moveTo(GAUGE.x,PIPE_Y-R-6); g.lineTo(GAUGE.x,GAUGE.y+GAUGE.r); g.stroke();
  LPE.gauge(g,GAUGE.x,GAUGE.y,GAUGE.r,S.press,80);
  g.restore();

  if(S.slide<1){
    const sx=PANEL.x+S.slide*(PANEL.w+20);
    g.fillStyle='#2e3338'; g.fillRect(sx,PANEL.y,PANEL.w,PANEL.h);
    g.fillStyle='#3b4147'; g.fillRect(sx,PANEL.y,PANEL.w,3);
    g.fillStyle='#1d2225'; g.fillRect(sx,PANEL.y+PANEL.h-3,PANEL.w,3);
    g.strokeStyle='#454c52'; g.lineWidth=2; g.strokeRect(sx+4,PANEL.y+4,PANEL.w-8,PANEL.h-8);
    A.dither(g,sx+30,PANEL.y+22,84,15,P.rust,0.3);
    A.dither(g,sx+PANEL.w-170,PANEL.y+PANEL.h-50,110,13,P.rust,0.26);
    A.dither(g,sx,PANEL.y+PANEL.h-26,PANEL.w,26,P.shadow,0.35);
    A.stencil(g,sx+30,PANEL.y+74,'BIO LAB ONE SUPPLY',25,P.stencil);
    A.stencil(g,sx+30,PANEL.y+98,'THERMAL RESERVOIR \u2014 LINE 1',16);
    A.handNote(g,sx+32,PANEL.y+144,'wheel sticks. keep turning.  \u2014 R.O.');
    g.fillStyle='#565d64'; A.rr(g,sx+PANEL.w-54,PANEL.y+PANEL.h/2-28,20,56,6); g.fill();
    g.strokeStyle='#848d96'; g.lineWidth=2; g.stroke();
    /* The handle is the thing to pull, and 'Open the panel' in front of a
       flat grey rectangle does not say which part. It pulses until used. */
    if(S.phase==='closed'){
      const pulse=0.45+0.4*Math.sin(t*5);
      g.save(); g.globalAlpha=pulse;
      g.strokeStyle=P.amber; g.lineWidth=2;
      A.rr(g,sx+PANEL.w-58,PANEL.y+PANEL.h/2-32,28,64,8); g.stroke();
      g.fillStyle=P.amber; g.font="12px 'VT323',monospace"; g.textAlign='right';
      g.fillText('SLIDE',sx+PANEL.w-64,PANEL.y+PANEL.h/2+4);
      g.textAlign='left'; g.restore();
    }
  }

}


/* ============================================================
   ACT 1 - THE TRAINING LOOP

   Every new engineer is run through this before touching a live line, and
   that is the honest reason a crash course gets to dial temperature and
   swap the working fluid: you would do neither to the supply feeding a lab
   that has no water. Real facilities have test loops. This is ours.

   Act 2 - walking over and opening Bio Lab One's actual valve - is
   unchanged below, and still ends the level.
   ============================================================ */
let act=1;
const FL=LPE_FLUIDS;
const BORE_IN=0.493, BORE_AREA=0.00133;       // NPS 3/8 Sch 40, B36.10M
/* 0.25, not 0.5. At 0.5 the lever's full travel was 2.24 gpm, which crammed
   every regime change into the bottom quarter of it - the applied step had a
   window 6.3% wide at exactly 0 C, shrinking to 2.3% by 5 C. Halving it puts
   the interesting range in the middle of the lever where it can be found. */
const BENCH_CV=0.25, BENCH_DP=20;              // a needle valve and a bench pump

/* The window where the line is laminar cold AND turbulent hot. Outside it
   the next step is unreachable, so the lever is given a visible target and
   a magnet rather than being left as a 4% sliver to find by feel. */
const TRICKLE=[0.23,0.30];
/* 70 C, not 50: at the bottom of the trickle band 50 C only reaches
   Re 3102, so a target that works for part of the band is a target that
   strands part of the players. The whole band is turbulent by 70. */
const HOT=[72,80];
const B={ flow:0, temp:20, fluid:'water', watch:0, drag:null };
const CUT=new LPE.Cutaway({x:48,y:92,w:640,h:112});

const FLUID_KEYS=['water','co2','propane'];
/* 32px tall on a 40px pitch, so there is 8px of air between them, and the
   three together span exactly the cutaway above (y 92 to 204). HIT is the
   full 40px slot: the gaps belong to the nearer button rather than being
   dead, so clipping an edge picks the one you were aiming at instead of
   nothing at all. */
const FBTN=FLUID_KEYS.map((k,i)=>({k,x:706,y:92+i*40,w:174,h:32}));
const FHIT=4;
const SLIDERS={
  flow:{x:48,  y:338, w:372, label:'FLOW',        get:()=>B.flow,
        set:v=>{B.flow=v;}, fmt:()=>Math.round(B.flow*100)+'%'},
  temp:{x:470, y:338, w:372, label:'TEMPERATURE', get:()=>B.temp/80,
        set:v=>{B.temp=Math.round(v*80);},        fmt:()=>B.temp+' \u00b0C'},
};

function fluidNow(){ return FL.FLUIDS[B.fluid]; }
/* Temperature is a free variable for water only. CO2 and propane are
   liquid because they are held under pressure near saturation - heating
   them does not make them hotter, it boils them. */
function tempLocked(){ return B.fluid!=='water'; }
function bench(){
  const f=fluidNow();
  const q=FL.flow(BENCH_CV*B.flow, BENCH_DP, f);
  const v=q/448.831/BORE_AREA;
  const t=tempLocked()?20:B.temp;
  const re=B.flow>0.001?FL.reynolds(v,BORE_IN,f,t):0;
  /* Re of zero is not laminar flow - it is a shut valve. Reporting it as
     laminar let the trickle step pass with nothing moving, and then no     amount of heat could ever make a dead line turbulent. */
  return {f,q,v,re,regime:B.flow<=0.001?'still':FL.regime(re)};
}

let BG_BENCH;
function buildBench(){
  BG_BENCH=document.createElement('canvas'); BG_BENCH.width=W; BG_BENCH.height=H;
  const g=BG_BENCH.getContext('2d');
  A.wall(g,W,H); A.rib(g,0,H);
  A.vignetteOnto(g,W,H);
  A.stencil(g,52,H-26,'SECTION 4-B \u00b7 TRAINING LOOP',18,'#8b949b');
  A.stencil(g,52,H-10,'NOT CONNECTED TO SERVICE',14);
}

function slider(g,sl,live){
  const tg=(!done1&&COURSE[c1]&&COURSE[c1].target);
  if(tg && ((tg.on==='flow')===(sl.label==='FLOW'))){
    const a=sl.x+tg.lo*sl.w, b=sl.x+tg.hi*sl.w;
    g.fillStyle='rgba(255,210,74,0.20)'; g.fillRect(a,sl.y-15,b-a,30);
    g.strokeStyle='#ffd24a'; g.lineWidth=1; g.strokeRect(a+0.5,sl.y-15.5,b-a-1,30);
    g.fillStyle='#ffd24a'; g.font="11px 'VT323',monospace"; g.textAlign='center';
    g.fillText(tg.label,(a+b)/2,sl.y-19);
    g.textAlign='left';
  }
  const v=Math.max(0,Math.min(1,sl.get())), kx=sl.x+v*sl.w;
  g.fillStyle='#10171a'; g.fillRect(sl.x,sl.y-3,sl.w,6);
  g.fillStyle=live?P.amber:'#39464f'; g.fillRect(sl.x,sl.y-3,v*sl.w,6);
  g.fillStyle=live?'#ffd24a':'#5d6a73';
  g.fillRect(kx-5,sl.y-13,10,26);
  g.strokeStyle='rgba(0,0,0,0.6)'; g.lineWidth=1; g.strokeRect(kx-5,sl.y-13,10,26);
  A.plate(g,sl.x,sl.y-46,152,20);
  g.fillStyle=P.rim; g.font="13px 'VT323',monospace"; g.textAlign='left';
  g.fillText(sl.label,sl.x+6,sl.y-31);
  g.fillStyle=live?'#39ff6a':'#6f7980'; g.font="17px 'VT323',monospace"; g.textAlign='right';
  g.fillText(sl.fmt(),sl.x+sl.w,sl.y-31);
  g.textAlign='left';
}

function liveCtl(which){
  if(done1||!COURSE[c1]) return true;
  return (COURSE[c1].ctl||[]).indexOf(which)>=0;
}

function drawBench(g,dt,t){
  const r=bench();
  g.drawImage(BG_BENCH,0,0);

  CUT.set({flow:Math.min(1,r.v/5.5), regime:r.regime,
           temp:0.12+0.88*((tempLocked()?20:B.temp)/80)});
  CUT.draw(g);

  FBTN.forEach(b=>{
    const on=b.k===B.fluid, f=FL.FLUIDS[b.k], live=liveCtl('fluid');
    A.plate(g,b.x,b.y,b.w,b.h);
    g.strokeStyle=on?P.amber:(live?'#4d6157':'#2b3a33'); g.lineWidth=on?2:1;
    g.strokeRect(b.x+0.5,b.y+0.5,b.w-1,b.h-1);
    g.fillStyle=on?P.amber:(live?P.rim:'#4a545e'); g.font="14px 'VT323',monospace"; g.textAlign='left';
    g.fillText(f.name,b.x+9,b.y+15);
    g.fillStyle=on?'#8fb9ff':'#5d6a73'; g.font="12px 'VT323',monospace";
    g.fillText('SG '+f.sg.toFixed(3),b.x+9,b.y+27);
  });

  const cells=[
    ['VELOCITY',  r.v.toFixed(2)+' ft/s',  '#39ff6a'],
    ['REYNOLDS',  r.re>0?Math.round(r.re).toLocaleString('en-US'):'-', '#39ff6a'],
    ['REGIME',    r.regime.toUpperCase(),
                  r.regime==='laminar'?'#8fb9ff':(r.regime==='turbulent'?'#ffd24a':'#d2dae0')],
    ['DELIVERED', r.q.toFixed(2)+' gpm',  '#39ff6a'],
  ];
  cells.forEach((c,i)=>{
    const x=48+i*210;
    A.plate(g,x,226,196,40);
    g.fillStyle=P.rim; g.font="12px 'VT323',monospace"; g.textAlign='left';
    g.fillText(c[0],x+8,241);
    g.fillStyle=B.flow>0.001?c[2]:'#5d6a73'; g.font="20px 'VT323',monospace";
    g.fillText(c[1],x+8,261);
  });

  slider(g,SLIDERS.flow, liveCtl('flow'));
  slider(g,SLIDERS.temp, liveCtl('temp') && !tempLocked());
  if(tempLocked()){
    A.plate(g,SLIDERS.temp.x,SLIDERS.temp.y+14,372,19);
    g.fillStyle=P.amber; g.font="12px 'VT323',monospace"; g.textAlign='left';
    g.fillText('HELD NEAR SATURATION \u2014 '+fluidNow().note,SLIDERS.temp.x+6,SLIDERS.temp.y+28);
  }
}

function stepBench(dt){
  const r=bench();
  CUT.update(dt);
  if(r.v>0.25) B.watch+=dt;
  LPE.audio.flow(Math.min(1,r.v/6));
  if(!done1 && !SH.holding && COURSE[c1].ok()){
    const last=c1>=COURSE.length-1;
    const need=COURSE[c1].watch;
    SH.beat(COURSE[c1].lesson, ()=>{
      if(last){ done1=true; toAct2(); } else { c1++; B.watch=0; sayCourse(); }
    }, need? (()=>B.watch>=need) : null);
    SH.count(last?'\u2014':(c1+2)+' / '+COURSE.length);
  }
}

/* ---- the crash course ----
   Instruction, not chat. Each step names what the player did, what changed,
   the quantity that changed it, and the term for it. The last step is the
   only one with no target drawn on a lever, because it is the one where the
   player has to work out the setting themselves. */
const COURSE=[
  { ctl:['flow'], target:{on:'flow',lo:0.65,hi:1,label:'OPEN'},
    task:'Open the loop: push FLOW into the OPEN band.',
    ok:()=>B.flow>=0.65,
    lesson:'With the valve shut the markers moved but stayed where they were. That '+
      'motion is temperature. Now they are travelling along the pipe, and that is '+
      '<b>flow</b>. A pipe that is full and a pipe that is flowing are two different '+
      'states.' },

  { ctl:['flow'], watch:2.6, target:{on:'flow',lo:0.65,hi:1,label:'OPEN'},
    task:'Compare the markers at the wall with the markers down the middle.',
    ok:()=>B.flow>=0.65,
    lesson:'They are not moving at the same speed. <b>Friction between the fluid and '+
      'the pipe surface</b> holds the fluid at the wall almost stationary; further '+
      'from the wall less of that drag reaches it. The yellow curve is that spread of '+
      'speed across the bore: the <b>velocity profile</b>.' },

  { ctl:['flow'], target:{on:'flow',lo:TRICKLE[0],hi:TRICKLE[1],label:'TRICKLE'},
    task:'Close FLOW down into the TRICKLE band.',
    ok:()=>!B.drag && B.flow>=TRICKLE[0] && B.flow<=TRICKLE[1] && bench().regime==='laminar',
    lesson:'At this speed the fluid travels in parallel layers that do not mix, and '+
      'the profile becomes a long parabola with the centre at about twice the average '+
      'speed. This is <b>laminar</b> flow. REYNOLDS, the number that identifies it, is '+
      'now below 2,300.' },

  { ctl:['temp'], target:{on:'temp',lo:HOT[0]/80,hi:HOT[1]/80,label:'HOT'},
    task:'Leave FLOW alone. Push TEMPERATURE into the HOT band.',
    ok:()=>bench().regime==='turbulent',
    lesson:'The valve has not moved, so the fluid is travelling at the same speed. '+
      'Heating water lowers its <b>viscosity</b>. Reynolds is velocity x bore / '+
      'viscosity, so lower viscosity means higher Reynolds. Above 4,000 the layers '+
      'break up and mix: <b>turbulent</b> flow, and the profile goes blunt.' },

  { ctl:['fluid'],
    task:'Switch the loop to LIQUID PROPANE.',
    ok:()=>B.fluid==='propane',
    lesson:'Nothing else changed and DELIVERED went up. Flow through a fixed '+
      'restriction is q = Cv x sqrt(dP / SG). Propane has a <b>specific gravity</b> of '+
      '0.501 &mdash; half of water &mdash; so more of it passes for the same pressure '+
      'drop. Its viscosity is five times lower too, which is why REYNOLDS jumped.' },

  /* Apply it. No band is drawn for this one: the point is that the player
     works out the setting from what the last four steps taught. It cannot be
     brute-forced on the flow lever alone - 0.50 gpm is turbulent for water at
     every temperature above about 7 C, and for propane at every temperature
     there is. The only route is: water, cold, then open up. */
  { ctl:['flow','temp','fluid'],
    task:'Now use it. Deliver 0.50 gpm and keep the flow laminar.',
    ok:()=>{ const r=bench(); return !B.drag && r.q>=0.50 && r.regime==='laminar'; },
    lesson:'That is the chain, used. Propane could not do it at any temperature &mdash; '+
      'too little viscosity, so Reynolds is always high. Water could not either until '+
      'you cooled it, because cold water is <b>more</b> viscous. Fluid, temperature and '+
      'valve position together decide what a line does.' },
];
let c1=0, done1=false;
function sayCourse(){ if(done1) return; SH.say(COURSE[c1].task,''); SH.count((c1+1)+' / '+COURSE.length); }

function toAct2(){
  SH.title('BIO LAB ONE \u2014 SUPPLY PANEL','Thermal Reservoir feed \u00b7 Section 4-B \u00b7 manual');
  act=2;
  LPE.audio.flow(0);
  SH.beat('<span class="who">COMMS:</span> That is the loop. Everything you just '+
    'watched happens in every pipe on this base whether anyone is looking at it or '+
    'not.<span class="gap"></span>Now the job. Bio Lab One, line 1, down the far '+
    'end of Four-B &mdash; the access panel with the hand wheel behind it.', ()=>{ buildScene(); say(); });
}

/* ---- bench input ---- */
function benchDown(p){
  for(const key of ['flow','temp']){
    const sl=SLIDERS[key];
    if(!liveCtl(key)) continue;
    if(key==='temp' && tempLocked()) continue;
    if(p.x>=sl.x-10 && p.x<=sl.x+sl.w+10 && Math.abs(p.y-sl.y)<20){
      B.drag=key; sl.set(magnet(key,Math.max(0,Math.min(1,(p.x-sl.x)/sl.w))));
      LPE.audio.tick(); return true;
    }
  }
  if(liveCtl('fluid')) for(const b of FBTN){
    if(p.x>=b.x-FHIT && p.x<=b.x+b.w+FHIT &&
       p.y>=b.y-FHIT && p.y<b.y+b.h+FHIT){   // half-open: a boundary row belongs to one button
      if(B.fluid!==b.k){ B.fluid=b.k; LPE.audio.clack(); }
      return true;
    }
  }
  return false;
}
/* Within a touch of the marked band the lever is pulled into it. The window
   is narrow because the physics makes it narrow, not because precision is
   the lesson. */
function magnet(key,v){
  if(done1||!COURSE[c1]) return v;
  const tg=COURSE[c1].target;
  if(!tg || (tg.on==='flow')!==(key==='flow')) return v;
  if(v>tg.lo-0.035 && v<tg.lo) return tg.lo;
  if(v<tg.hi+0.035 && v>tg.hi) return tg.hi;
  return v;
}
function benchMove(p){
  if(!B.drag) return;
  const sl=SLIDERS[B.drag];
  const before=sl.get();
  sl.set(magnet(B.drag,Math.max(0,Math.min(1,(p.x-sl.x)/sl.w))));
  if(Math.floor(before*14)!==Math.floor(sl.get()*14)) LPE.audio.tick();
}

/* ---------------- mount ---------------- */
buildBench();
const SH=LPE.mount({
  t1:'BIO LAB ONE \u2014 SUPPLY PANEL',
  t2:'Thermal Reservoir feed \u00b7 Section 4-B \u00b7 manual',
  w:W,h:H,
  step:dt=>act===1?stepBench(dt):step(dt),
  draw:(g,dt,t)=>act===1?drawBench(g,dt,t):draw(g,dt,t),
  /* The opening is the engine's three-beat template, same as level one. */
  intro:[
    {kind:'comms', tag:'[ COLONY INTERCOM \u00b7 CREW CHANNEL 3 ]',
     text:'&ldquo;Bio Lab One has no water.<br>Section 4-B, line 1 &mdash; it needs opening by hand.<br>You are new, so run the training loop on your way past.&rdquo;'},
    {kind:'place',
     text:'Four-B is the oldest run on the base. No actuators, no remote, no screens '+
          '&mdash; just lines on brackets and wheels you turn yourself.<br><br>'+
          'Against the far wall is the training loop: a short length of pipe, cut away '+
          'down one side, with a pump behind it and dials on the front. It is not '+
          'plumbed into anything. That is the point of it.'},
    {kind:'title', eyebrow:'SECTION 4-B \u00b7 MANUAL SERVICES',
     title:'TRAINING LOOP', sub:'BEFORE YOU TOUCH A LIVE LINE'},
  ],
  /* The convention goes first. Everything after it - temperature as
     agitation most of all - is a claim about what the marks represent,
     and the player is owed that before any of it is shown. */
  onStart:()=>{
    SH.title('SECTION 4-B \u2014 TRAINING LOOP','not connected to service');
    SH.beat(
    '<span class="who">COMMS:</span> One thing before we start. Those marks in the '+
    'pipe are <b>not molecules</b> &mdash; you could not see a molecule through a wall '+
    'of steel. They are markers. Spaced so you can count them, and moving in true '+
    'proportion but far slower than the real thing, because real water tells the eye '+
    'nothing.', sayCourse);
  },
  /* RESET restores the LEVEL, not the act you happen to be standing in.
     It used to reset only the supply panel and then speak act 2 lines over
     act 1, so resetting during the course left the trainer on screen being
     narrated as though you were already at the valve. */
  onReset(){
    act=1; c1=0; done1=false;
    Object.assign(B,{flow:0,temp:20,fluid:'water',watch:0,drag:null});
    CUT.set({flow:0,regime:'turbulent',temp:0.25});
    Object.assign(S,{phase:'closed',slide:0,turn:0,open:0,press:0,drag:false});
    line.set(0,{flow:0,fill:1}); line.set(1,{flow:0,fill:0});
    S.closing=false; raceT=0; line.race(1,false);
    LPE.audio.flow(0);
    buildBench();
    SH.title('SECTION 4-B \u2014 TRAINING LOOP','not connected to service');
    sayCourse();
  },
});

const cv=SH.canvas;
cv.addEventListener('pointerdown',e=>{
  LPE.audio.init(); LPE.audio.resume();
  const p=SH.pt(e);
  if(act===1){ benchDown(p); return; }
  if(S.phase==='closed'){ S.phase='opening'; LPE.audio.scrape(); say(); return; }
  if(S.phase!=='opening' && Math.hypot(p.x-VALVE_X,p.y-WHEEL_Y)<WHEEL_R+18){
    S.drag=true; S.lastAng=Math.atan2(p.y-WHEEL_Y,p.x-VALVE_X);
    cv.setPointerCapture(e.pointerId); LPE.audio.startFlow();
  }
});
cv.addEventListener('pointermove',e=>{
  if(act===1){ benchMove(SH.pt(e)); return; }
  if(!S.drag) return;
  const p=SH.pt(e), a=Math.atan2(p.y-WHEEL_Y,p.x-VALVE_X);
  let d=a-S.lastAng;
  while(d>Math.PI) d-=6.2832; while(d<-Math.PI) d+=6.2832;
  S.lastAng=a;
  const before=S.open;
  S.open=Math.max(0,Math.min(1,S.open+d/(TURNS*6.2832)));   // the wheel follows this, so it cannot over-travel
  if(S.open>0 && S.phase==='open') S.phase='turning';
  if(Math.floor(S.open*16)!==Math.floor(before*16)) LPE.audio.tick();
  say();
});
['pointerup','pointercancel'].forEach(k=>cv.addEventListener(k,()=>{S.drag=false; B.drag=null;}));
cv.addEventListener('keydown',e=>{
  /* Act 2 only. The canvas takes focus the moment a slider is clicked, so
     during the crash course this handler was catching the Enter and Space
     the player presses to continue a lesson - quietly opening the supply
     panel behind the trainer, and then narrating act 2 over act 1. */
  if(act!==2) return;
  if(S.phase==='closed'&&(e.key==='Enter'||e.key===' ')){
    e.preventDefault(); LPE.audio.init(); S.phase='opening'; LPE.audio.scrape(); say(); return; }
  if(e.key==='ArrowRight'||e.key==='ArrowUp'){
    e.preventDefault(); LPE.audio.init(); LPE.audio.startFlow();
    S.open=Math.min(1,S.open+0.4/(TURNS*6.2832));
    if(S.phase==='open') S.phase='turning';
    LPE.audio.tick(); say(); }
});
/* act 2 speaks for itself when toAct2 hands over */
}

/* Registered so the game shell can launch it; still runs on its own if
   this file is opened directly, which is how a single level is iterated. */
(window.LPE_LEVELS=window.LPE_LEVELS||[]).push({
  label:"LEVEL 0 \u2014 BIO LAB ONE SUPPLY",
  sub:"Section 4-B  \u00b7  manual",
  start:startLevel0,
});
if(!window.LPE_GAME) startLevel0();
</script>
