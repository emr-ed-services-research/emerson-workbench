    BVLV: {
      w: 1.6, h: 1.4, ports: { in: [-0.8, 0], out: [0.8, 0] },
      path: (g, s) => {
        g.beginPath();
        g.moveTo(-0.5 * s, -0.7 * s); g.lineTo(-0.5 * s, 0.7 * s);
        g.moveTo(0.5 * s, -0.7 * s); g.lineTo(0.5 * s, 0.7 * s);
        g.moveTo(-0.5 * s, 0.6 * s); g.lineTo(0.5 * s, -0.6 * s);
      },
      stroke: true,
      dot: true,
    },

    /* 3.3.13 Check Valve. "Arrow shows direction of allowable flow and is
       part of the symbol" -- so the arrow is drawn, not decoration. */
    CVLV: {
      w: 1.8, h: 1.4, ports: { in: [-0.9, 0], out: [0.9, 0] },
      path: (g, s) => {
        g.beginPath();
        g.moveTo(-0.3 * s, -0.7 * s); g.lineTo(-0.3 * s, 0.7 * s);
        g.moveTo(0.6 * s, -0.7 * s); g.lineTo(0.6 * s, 0.7 * s);
        g.moveTo(-0.3 * s, -0.6 * s); g.lineTo(0.6 * s, 0.6 * s);
        // flow arrow
        g.moveTo(-0.9 * s, 0); g.lineTo(-0.45 * s, 0);
        g.moveTo(-0.55 * s, -0.18 * s); g.lineTo(-0.3 * s, 0);
        g.lineTo(-0.55 * s, 0.18 * s);
      },
      stroke: true,
    },

    /* 3.3.13 Relief Valve: a right triangle on the line. Shown two ways
       for normally-closed-actually-open where feedback exists. */
    RVLV: {
      w: 1.4, h: 1.6, ports: { in: [-0.7, 0], out: [0, -0.8] },
      path: (g, s) => {
        g.beginPath();
        g.moveTo(-0.6 * s, 0.7 * s); g.lineTo(0.6 * s, 0.7 * s);
        g.lineTo(-0.6 * s, -0.7 * s); g.closePath();
      },
      fillWhenOpen: true,
    },

    /* 3.3.2 Vessel: "a vessel or separator... can also be used as a
       pressurized vessel in either a vertical or horizontal
       arrangement." Drawn with dished heads. */
    /* ---- 3.3.2 Process subgroup, page 17 ----------------------------
       Mapped alongside VSSL and, until the automatic coverage check went
       in, mapped without being drawn -- a hand-kept list of "mnemonics we
       implement" had been hiding the gap. */

    /* "A vessel with a heating or cooling jacket. Jacket may be on
       straight shell, on bottom head, on top head, or any combination."
       Drawn on the straight shell, which is the common case. */
    JVSL: {
      w: 2.2, h: 2.6, ports: { in: [-1.1, 0], out: [1.1, 0] },
      path: (g, s) => {
        const w = 0.82 * s, h = 1.05 * s, d = 0.3 * s, j = 0.22 * s;
        g.beginPath();
        g.moveTo(-w, -h + d);
        g.quadraticCurveTo(-w, -h - d * 0.4, 0, -h - d * 0.4);
        g.quadraticCurveTo(w, -h - d * 0.4, w, -h + d);
        g.lineTo(w, h - d);
        g.quadraticCurveTo(w, h + d * 0.4, 0, h + d * 0.4);
        g.quadraticCurveTo(-w, h + d * 0.4, -w, h - d);
        g.closePath();
        /* the jacket: a bar down each side of the straight shell */
        g.moveTo(-w - j, -h + d * 1.2); g.lineTo(-w - j, h - d * 1.2);
        g.moveTo(w + j, -h + d * 1.2);  g.lineTo(w + j, h - d * 1.2);
      },
      stroke: true,
    },

    /* "A chemical reactor. Internal details may be shown to indicate
       type of reactor." Straight shell, shallow convex heads, and the
       head seams drawn -- which is what separates it from a plain
       vessel at a glance. */
    RCTR: {
      w: 2.0, h: 2.6, ports: { in: [-1.0, 0], out: [1.0, 0] },
      path: (g, s) => {
        const w = 0.95 * s, h = 1.0 * s, d = 0.3 * s;
        g.beginPath();
        g.moveTo(-w, -h);
        g.quadraticCurveTo(0, -h - d * 1.6, w, -h);
        g.lineTo(w, h);
        g.quadraticCurveTo(0, h + d * 1.6, -w, h);
        g.closePath();
        /* the seams where the heads meet the shell */
        g.moveTo(-w, -h); g.lineTo(w, -h);
        g.moveTo(-w, h);  g.lineTo(w, h);
      },
      stroke: true,
    },

    /* "A packed or trayed distillation tower used for separation."
       Tall and slender with fully semicircular caps -- the proportion
       is the symbol as much as the outline is. */
    DTWR: {
      w: 1.4, h: 3.4, ports: { in: [-0.7, 0], out: [0.7, 0] },
      path: (g, s) => {
        const w = 0.42 * s, h = 1.15 * s;
        g.beginPath();
        g.moveTo(-w, -h);
        g.arc(0, -h, w, Math.PI, 0);
        g.lineTo(w, h);
        g.arc(0, h, w, 0, Math.PI);
        g.closePath();
        g.moveTo(-w, -h); g.lineTo(w, -h);
        g.moveTo(-w, h);  g.lineTo(w, h);
      },
      stroke: true,
    },

    /* ---- 3.3.2 Storage subgroup, pages 18-19 ------------------------
       Implemented from the standard's written descriptions and the
       silhouette each one is built from, in our own code and keyed by
       the standard's own mnemonic. No page, figure or drawing from
       ISA-5.5 is reproduced anywhere in this repository -- see the
       header. */

    /* "A tank for material stored under atmospheric pressure."
       A shell with a peaked roof: the roof is the whole distinction,
       because an atmospheric tank is one that does not have to hold
       pressure and so does not need a domed head. */
    ATNK: {
      w: 2.0, h: 2.4, ports: { in: [-1.0, 0], out: [1.0, 0] },
      path: (g, s) => {
        const w = 1.0 * s, h = 0.85 * s, roof = 0.6 * s;
        g.beginPath();
        g.moveTo(-w, -h); g.lineTo(0, -h - roof); g.lineTo(w, -h);
        g.lineTo(w, h); g.lineTo(-w, h);
        g.closePath();
      },
      stroke: true,
    },

    /* "A container used to store solid or granular material that is
       discharged from the bottom." Hence the taper: the bottom corners
       chamfer in to a narrow outlet. */
    BINN: {
      w: 2.0, h: 2.4, ports: { in: [-1.0, 0], out: [1.0, 0] },
      path: (g, s) => {
        const w = 0.95 * s, h = 1.0 * s, cut = 0.5 * s, out = 0.32 * s;
        g.beginPath();
        g.moveTo(-w, -h); g.lineTo(w, -h);
        g.lineTo(w, h - cut); g.lineTo(out, h);
        g.lineTo(-out, h); g.lineTo(-w, h - cut);
        g.closePath();
      },
      stroke: true,
    },

    /* "A tank for liquids with roof of vessel moving up and down with a
       change in stored volume." The roof is drawn inside the shell,
       below the rim, which is what says it floats. */
    FTNK: {
      w: 2.0, h: 2.2, ports: { in: [-1.0, 0], out: [1.0, 0] },
      path: (g, s) => {
        const w = 1.0 * s, h = 0.95 * s, drop = 0.3 * s;
        g.beginPath();
        g.moveTo(-w, -h); g.lineTo(-w, h); g.lineTo(w, h); g.lineTo(w, -h);
        g.moveTo(-w, -h + drop); g.lineTo(w, -h + drop);
      },
      stroke: true,
    },

    /* "A tank for gases with roof of vessel moving up and down with a
       change in stored volume." Same idea as FTNK and deliberately a
       different drawing: the bell rises from the bottom, so the inner
       lines run up from the base rather than across the top. */
    GHDR: {
      w: 2.0, h: 2.2, ports: { in: [-1.0, 0], out: [1.0, 0] },
      path: (g, s) => {
        const w = 1.0 * s, h = 0.95 * s, inset = 0.22 * s, rise = 0.55 * s;
        g.beginPath();
        g.moveTo(-w, -h); g.lineTo(w, -h); g.lineTo(w, h); g.lineTo(-w, h);
        g.closePath();
        g.moveTo(-w + inset, h); g.lineTo(-w + inset, h - rise);
        g.moveTo(w - inset, h);  g.lineTo(w - inset, h - rise);
      },
      stroke: true,
    },

    /* "A pressurized spherical vessel for storage of gases and liquids."
       A sphere on legs -- the legs are part of the symbol, because a
       sphere cannot stand on its own and the standard draws them. */
    PVSL: {
      w: 2.0, h: 2.6, ports: { in: [-1.0, 0], out: [1.0, 0] },
      path: (g, s) => {
        const r = 0.9 * s, leg = 0.55 * s, span = 0.55 * s;
        g.beginPath();
        g.arc(0, -0.18 * s, r, 0, Math.PI * 2);
        g.moveTo(-span, -0.18 * s + r * 0.82); g.lineTo(-span, -0.18 * s + r * 0.82 + leg);
        g.moveTo(span, -0.18 * s + r * 0.82);  g.lineTo(span, -0.18 * s + r * 0.82 + leg);
      },
      stroke: true,
    },

    /* "A vessel used for weighing material." A funnel slung between two
       supports: the supports are the weighing, and without them it is
       just a hopper. */
    WHPR: {
      w: 2.0, h: 2.4, ports: { in: [-1.0, 0], out: [1.0, 0] },
      path: (g, s) => {
        const w = 1.0 * s, h = 0.9 * s, out = 0.3 * s, neck = 0.45 * s;
        g.beginPath();
        g.moveTo(-w, -h); g.lineTo(w, -h);
        g.lineTo(out, h - neck); g.lineTo(out, h);
        g.lineTo(-out, h); g.lineTo(-out, h - neck);
        g.closePath();
        /* the two supports it hangs from */
        g.moveTo(-w, -h); g.lineTo(-w, -h + 1.1 * s);
        g.moveTo(w, -h);  g.lineTo(w, -h + 1.1 * s);
      },
      stroke: true,
    },

    VSSL: {
      w: 1.8, h: 2.6, ports: { in: [-0.9, 0], out: [0.9, 0] },
      path: (g, s) => {
        const w = 0.9 * s, h = 1.1 * s, d = 0.35 * s;
        g.beginPath();
        g.moveTo(-w, -h + d);
        g.quadraticCurveTo(-w, -h - d * 0.4, 0, -h - d * 0.4);
        g.quadraticCurveTo(w, -h - d * 0.4, w, -h + d);
        g.lineTo(w, h - d);
        g.quadraticCurveTo(w, h + d * 0.4, 0, h + d * 0.4);
        g.quadraticCurveTo(-w, h + d * 0.4, -w, h - d);
        g.closePath();
      },
      stroke: true,
    },

    /* 3.3.10 Pump: "that class of equipment used to transport slurries or
       liquids by internal rotary action." Volute casing on a base. */
    PUMP: {
      w: 2.0, h: 2.0, ports: { in: [-0.9, 0], out: [0.45, -0.95] },
      path: (g, s) => {
        g.beginPath();
        g.arc(0, 0, 0.72 * s, Math.PI * 0.75, Math.PI * 1.75);
        g.lineTo(0.72 * s, -0.95 * s);
        g.lineTo(0.18 * s, -0.95 * s);
        g.moveTo(-0.55 * s, 0.5 * s); g.lineTo(-0.85 * s, 1.0 * s);
        g.lineTo(0.85 * s, 1.0 * s); g.lineTo(0.55 * s, 0.5 * s);
      },
      stroke: true,
    },

    /* 3.3.8 Inline Mixer: "a mixing device used to continuously blend
       materials." A zigzag element inside the line body -- distinct from
       AGIT, which stirs a vessel and does not sit in a line. */
    IMIX: {
      w: 2.2, h: 1.0, ports: { in: [-1.1, 0], out: [1.1, 0] },
      path: (g, s) => {
        const w = 0.9 * s, h = 0.5 * s;
        g.beginPath();
        g.rect(-w, -h, 2 * w, 2 * h);
        const n = 4, step = (2 * w) / n;
        for (let i = 0; i < n; i++) {
          g.moveTo(-w + i * step, h);
          g.lineTo(-w + (i + 0.5) * step, -h);
          g.lineTo(-w + (i + 1) * step, h);
        }
      },
      stroke: true,
    },
  };

  /* ---- planning ------------------------------------------------------
     Everything decidable is decided here, as plain data, so it can be
     checked without a canvas. draw() does no thinking.                 */

  const DEFAULTS = {
    scale: 14,          // px per symbol unit
    hide: ['fitting'],  // ISA-5.5 draws equipment, not pipe connections
    state: {},          // solver valve positions, by the valve's `key`
    openAt: 0.5,        // a valve reads OPEN at or above this
    /* What a symbol is captioned with. A plant board wants the TAG --
       HV-1 is what the thing is called in every document the operator
       has. A game level wants the solver's own name, because that is
       what its own instructions say. Neither is more correct; it is a
       display choice, so the display makes it. */
    labelBy: 'key',     // 'tag' | 'key' | 'id'
    breakGap: 5,        // px gap drawn at a crossing
  };

  function plan(net, options) {
    const o = Object.assign({}, DEFAULTS, options || {});
    const piping = net.toPiping({ hide: o.hide });
    const ops = [];
    const warnings = [];

    /* Lines first: on a process display a connection is a plain line.
       No elbow radii, no bores, no fittings -- that is tier 3's job.

       And nothing it declined to draw may leave a gap: the run through a
       hidden reducer arrives as two lines 80 px apart, which on screen
       reads as bay 3 being cut in half rather than as a fitting nobody
       drew. toPiping reports what it left undrawn; stitching across it
       is this layer's decision, because this is the layer that chose not
       to draw it. */
    const lines = stitch(piping.lines.map(l => l.pts), piping.undrawn || []);
    lines.forEach(pts => ops.push({ op: 'line', pts }));

    /* ISA-5.5 3.3.1, the one thing the Connectors section does specify:
       "a recommended practice to avoid any confusion on the video display
       is to use line breaks to indicate that the lines do not join. The
       most important lines should be kept solid with the secondary lines
       being broken. If all lines are of equal importance, a usual
       convention is to break the vertical line."

       So: find crossings that are not joints, and break the vertical. */
    for (const cross of crossings(lines)) {
      ops.push({ op: 'break', x: cross.x, y: cross.y,
                 axis: 'v', gap: o.breakGap });
    }

    /* ---- THE INSTRUMENT LOOP IS A DIFFERENT GRAPH ------------------

       A netlist says what is connected to what by PIPE. A control loop
       is connected by SIGNAL, and the two graphs share only the
       component a transmitter happens to be measuring. Forcing
       instruments into the piping netlist would make a 4-20 mA pair a
       kind of pipe, which is the sort of tidy lie that is very hard to
       get back out of later.

       So they are declared, not derived: the caller says which
       instruments exist, what each is attached to, and which signals
       run between them. ISA-5.1 symbology:

         field mounted      a plain circle
         control room       a circle with a horizontal line across it
         electric signal    a dashed line
         pneumatic signal   a line with double cross-hatches

       The tag inside is the caller's and follows ISA-5.1's own
       convention -- first letter the measured variable, the rest the
       function -- which this layer does not police because the
       netlist already polices tag FORM and policing meaning here
       would be two layers with an opinion about the same string. */
    for (const ins of (o.instruments || [])) {
      if (!ins || !ins.tag)
        throw new Error('schem.plan: every instrument needs a tag. ' +
          'An unlabelled bubble on a loop diagram is not a symbol, it ' +
          'is a circle.');
      if (!(typeof ins.x === 'number' && typeof ins.y === 'number'))
        throw new Error('schem.plan: instrument ' + ins.tag +
          ' needs {x, y}. Where an instrument sits on a display is a ' +
          'drawing decision and this layer will not invent one.');
      ops.push({ op: 'instrument', tag: ins.tag,
                 x: ins.x, y: ins.y, scale: o.scale,
                 /* 'field' or 'panel' -- ISA-5.1 draws them
                    differently and the difference is where the thing
                    physically is. */
                 mount: ins.mount === 'panel' ? 'panel' : 'field',
                 reading: ins.reading === undefined ? null : ins.reading });
    }
    for (const sg of (o.signals || [])) {
      if (!sg || !Array.isArray(sg.pts) || sg.pts.length < 2)
        throw new Error('schem.plan: a signal needs {pts} with at ' +
          'least two points.');
      const type = sg.type || 'electric';
      if (type !== 'electric' && type !== 'pneumatic')
        throw new Error('schem.plan: signal type "' + type + '" is not ' +
          'one ISA-5.1 draws here. Electric is dashed, pneumatic is ' +
          'cross-hatched, and a third kind would need its own line.');
      ops.push({ op: 'signal', pts: sg.pts, signal: type });
    }

    /* Then equipment. A valve's fill carries its state, which is the
       standard's own convention rather than a choice made here. */
    for (const e of piping.equipment) {
      const sym = SYMBOLS[e.isa];
      if (!sym) {
        warnings.push(`${e.id}: no symbol implemented for ISA-5.5 ${e.isa}`);
        continue;
      }
      const pos = e.key != null && o.state[e.key] !== undefined
        ? Number(o.state[e.key]) : null;
      ops.push({
        op: 'symbol', id: e.id, isa: e.isa, kind: e.kind,
        x: e.x, y: e.y, scale: o.scale,
        position: pos,
        open: pos === null ? null : pos >= o.openAt,
        label: o.labelBy === 'tag' ? (e.tag || e.id)
             : o.labelBy === 'id'  ? e.id
             : (e.key || e.id),
      });
    }

    return { ops, warnings, scale: o.scale, bounds: bounds(ops) };
  }

  /* Join lines that stop at opposite ports of a component nobody drew.

     Each `undrawn` entry carries that component's port positions. A line
     ENDING on one of them and another line STARTING on a different one
     belong to the same connection, so they become one polyline with the
     undrawn component's footprint collapsed out of it: the join takes the
     first line's own last point and continues from the second's second
     point, which is what makes the 80 px of reducer disappear rather than
     be drawn as a straight line nobody can explain.

     Conservative on purpose. A port with two lines ending on it is a
     shape this does not understand, so it is left alone -- a visible gap
     is a better failure than a wrong connection. */
  function stitch(lines, undrawn) {
    if (!undrawn.length) return lines;
    const out = lines.map(pts => pts.slice());
    const at = (p, q) => p[0] === q[0] && p[1] === q[1];

    for (const u of undrawn) {
      for (const a of u.pts) {
        for (const b of u.pts) {
          if (at(a, b)) continue;
          const ends = out.filter(L => L.length && at(L[L.length - 1], a));
          const starts = out.filter(L => L.length && at(L[0], b));
          if (ends.length !== 1 || starts.length !== 1) continue;
          const head = ends[0], tail = starts[0];
          if (head === tail) continue;
          head.push.apply(head, tail.slice(1));
          tail.length = 0;
        }
      }
    }
    return out.filter(L => L.length > 1).map(collinear);
  }

  /* A stitched join leaves a vertex mid-run. piping() fillets every
     interior vertex, and crossings() treats each leg separately, so a
     collinear one is at best noise. topology.js drops them for the same
     reason; this is the same rule applied after a join it did not make. */
  function collinear(pts) {
    if (pts.length < 3) return pts;
    const out = [pts[0]];
    for (let i = 1; i < pts.length - 1; i++) {
      const a = pts[i - 1], b = pts[i], c = pts[i + 1];
      const flat = (a[0] === b[0] && b[0] === c[0]) ||
                   (a[1] === b[1] && b[1] === c[1]);
      if (!flat) out.push(b);
    }
    out.push(pts[pts.length - 1]);
    return out;
  }

  /* Where two line legs cross without sharing an endpoint. Orthogonal
     only, which the netlist already guarantees. */
  function crossings(lines) {
    const legs = [];
    lines.forEach((pts, li) => {
      for (let i = 1; i < pts.length; i++) {
        legs.push({ li, a: pts[i - 1], b: pts[i],
                    horiz: pts[i - 1][1] === pts[i][1] });
      }
    });
    const out = [];
    for (let i = 0; i < legs.length; i++) {
      for (let j = i + 1; j < legs.length; j++) {
        const A = legs[i], B = legs[j];
        if (A.horiz === B.horiz) continue;
        const h = A.horiz ? A : B, v = A.horiz ? B : A;
        const hy = h.a[1], vx = v.a[0];
        const hx0 = Math.min(h.a[0], h.b[0]), hx1 = Math.max(h.a[0], h.b[0]);
        const vy0 = Math.min(v.a[1], v.b[1]), vy1 = Math.max(v.a[1], v.b[1]);
        // Strictly inside both, so a shared corner or a tee is not a crossing.
        if (vx > hx0 && vx < hx1 && hy > vy0 && hy < vy1) {
          out.push({ x: vx, y: hy });
        }
      }
    }
    return out;
  }

  function bounds(ops) {
    let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
    const hit = (x, y) => {
      if (x < x0) x0 = x; if (x > x1) x1 = x;
      if (y < y0) y0 = y; if (y > y1) y1 = y;
    };
    for (const op of ops) {
      if (op.op === 'line') op.pts.forEach(p => hit(p[0], p[1]));
      else if (op.op === 'symbol') {
        const s = SYMBOLS[op.isa];
        hit(op.x - s.w * op.scale, op.y - s.h * op.scale);
        hit(op.x + s.w * op.scale, op.y + s.h * op.scale);
      }
    }
    return Number.isFinite(x0) ? { x0, y0, x1, y1 } : null;
  }

  /* ---- painting ------------------------------------------------------
     No decisions here. Walks the plan and strokes it.

     AND NO COLOURS. This layer knows that a line needs a colour; it does
     not get to know which. The same plan has to come out as 1990s pixel
     art and as a modern render, and a default here would quietly become
     the model -- it did: this block used to carry five of them, which is
     chrome that had leaked two layers down, recorded as debt in Phase 0
     and removed here in Phase 5a.

     Every role below must be supplied. A missing one throws, by name,
     rather than falling back: a silent fallback is how a display ends up
     black on black and nobody can say why.                             */

  /* What has to be coloured. `ground` may legitimately be null -- meaning
     "do not paint a ground" -- but it must be SAID, not omitted. */
  const ROLES = ['line', 'symbol', 'fill', 'label', 'ground', 'gap'];
  const METRICS = ['lineWidth', 'symbolWidth', 'labelFont'];

  /* Validate once, at setup, rather than inside a 60 fps draw loop. */
  function theme(spec) {
    const t = Object.assign({}, spec);
    const missing = ROLES.filter(r => !(r in t))
      .concat(METRICS.filter(m => t[m] === undefined));
    if (missing.length) {
      throw new Error(
        'schem.draw needs a theme and this one is missing: ' +
        missing.join(', ') + '. The process core holds no colours -- the ' +
        'same plan has to render as pixel art and as a modern view, so the ' +
        'consumer says what each role looks like. "ground" may be null for ' +
        '"paint none", but it has to be said. Roles: ' + ROLES.join(', ') +
        '; metrics: ' + METRICS.join(', '));
    }
    return t;
  }

  function draw(g, p, theme_) {
    const t = theme(theme_ || {});

    if (t.ground && p.bounds) {
      g.fillStyle = t.ground;
      g.fillRect(p.bounds.x0 - 20, p.bounds.y0 - 20,
                 (p.bounds.x1 - p.bounds.x0) + 40,
                 (p.bounds.y1 - p.bounds.y0) + 40);

            'narrated in a game. Put the text in the narrative, against the id ' +
            '"' + (s.id || '?') + '"');
        }
      }

      (s.operable || []).forEach(tag => {
        if (net && !tagsIn[tag]) {
          errors.push(where(i) + ': cannot make "' + tag + '" operable, there ' +
            'is no such thing in this rig. It has: ' + tagList());
        }
      });
      if (s.observe && net && !tagsIn[s.observe]) {
        errors.push(where(i) + ': cannot observe "' + s.observe + '", there is ' +
          'no such thing in this rig. It has: ' + tagList());
      }

      const when = s.when || [];
      if (!when.length) {
        errors.push(where(i) + ' has no "when", so nothing the player does ' +
          'could ever finish it');
      }
      when.forEach(c => {
        const forms = ['measure', 'each', 'spread'].filter(f => c[f] !== undefined);
        if (forms.length !== 1) {
          errors.push(where(i) + ': a condition says exactly one of "measure", ' +
            '"each" or "spread"' +
            (forms.length ? ' -- this one says ' + forms.join(' and ') : ''));
          return;
        }
        const bounds = ['atLeast', 'atMost'].filter(b => c[b] !== undefined);
        if (!bounds.length) {
          errors.push(where(i) + ': a condition needs "atLeast" or "atMost" -- ' +
            'without a bound there is nothing to compare against');
        }
        if (c.measure !== undefined) checkMeasure(i, c.measure);
        if (c.each !== undefined) {
          if (!Array.isArray(c.each) || c.each.length < 2) {
            errors.push(where(i) + ': "each" wants a list of two or more ' +
              'measurements; for one, use "measure"');
          } else c.each.forEach(m => checkMeasure(i, m));
        }
        if (c.spread !== undefined) {
          if (!Array.isArray(c.spread) || c.spread.length < 2) {
            errors.push(where(i) + ': "spread" is the gap between the highest ' +
              'and lowest of a list, so it wants two or more measurements');
          } else c.spread.forEach(m => checkMeasure(i, m));
        }
      });
    });

    if (spec && spec.start) {
      Object.keys(spec.start).forEach(tag => {
        if (net && !tagsIn[tag]) {
          errors.push('"start" sets "' + tag + '", which is not in this rig. ' +
            'It has: ' + tagList());
        }
      });
    }
    if (spec && spec.rig && net && net.spec.rig && spec.rig !== net.spec.rig) {
      errors.push('this scenario is written for rig "' + spec.rig + '" but was ' +
        'given "' + net.spec.rig + '"');
    }

    /* ---- reading the rig --------------------------------------------
       A measurement is resolved by TAG. Positions come from whatever the
       consumer is holding valve state in -- which may still be keyed by
       the solver's private names -- so the tag is translated through the
       netlist rather than the consumer having to know both. */
    function read(m, state, solved) {
      const { tag, quantity } = parseMeasure(m);
      const c = tagsIn[tag];
      if (quantity === 'position') {
        if (state == null) return 0;
        if (c && c.key !== undefined && state[c.key] !== undefined) return state[c.key];
        return state[tag] !== undefined ? state[tag] : 0;
      }
      if (quantity === 'flow') {
        if (!solved || !solved.q) return 0;
        if (solved.q[tag] !== undefined) return solved.q[tag];
        if (c && c.key !== undefined && solved.q[c.key] !== undefined) return solved.q[c.key];
        return 0;
      }
      return 0;
    }

    function holds(c, state, solved) {
      if (c.measure !== undefined) {
        const v = read(c.measure, state, solved);
        if (c.atLeast !== undefined && !(v >= c.atLeast)) return false;
        if (c.atMost !== undefined && !(v <= c.atMost)) return false;
        return true;
      }
      const list = (c.each || c.spread).map(m => read(m, state, solved));
      if (c.each !== undefined) {
        /* Min against a bound -- the same comparison a hand-written step
           made with Math.min, so the arithmetic is unchanged. */
        const lo = Math.min.apply(null, list);
        const hi = Math.max.apply(null, list);
        if (c.atLeast !== undefined && !(lo >= c.atLeast)) return false;
        if (c.atMost !== undefined && !(hi <= c.atMost)) return false;
        return true;
      }
      const gap = Math.max.apply(null, list) - Math.min.apply(null, list);
      if (c.atLeast !== undefined && !(gap >= c.atLeast)) return false;
      if (c.atMost !== undefined && !(gap <= c.atMost)) return false;
      return true;
    }

    return {
      spec, errors, steps,
      count: steps.length,
      at: i => steps[i],
      ids: steps.map(s => s.id),

      /* Which tags the player may touch at this step. Everything else is
         locked, which is the scenario's business and not the chrome's. */
      operable: i => (steps[i] && steps[i].operable) || [],
      observe: i => (steps[i] && steps[i].observe) || null,

      /* Has this step been satisfied? Every condition must hold. */
      met(i, state, solved) {
        const s = steps[i];
        if (!s) return false;
        return (s.when || []).every(c => holds(c, state, solved));
      },

      /* The starting position of everything the scenario sets, keyed the
         way the consumer holds state. */
      initial() {
        const out = {};
        const start = (spec && spec.start) || {};
        for (const tag of Object.keys(start)) {
          const c = tagsIn[tag];
          out[c && c.key !== undefined ? c.key : tag] = start[tag];
        }
        return out;
      },

      read: (m, state, solved) => read(m, state, solved),
    };
  }

  LPE.scenario = Scenario;
  LPE.scenario.QUANTITIES = QUANTITIES;
  LPE.scenario.PROSE_KEYS = PROSE_KEYS;

})(typeof window !== 'undefined'
   ? (window.LPE = window.LPE || {})
   : (module.exports = module.exports || {}));

</script>
<script>
'use strict';
/* ============================================================
   LEVEL TWO - BAY 3, LINE 3: THE REDUCER COMES OUT

   The same rig as level one, deliberately. Level one ends by naming the
   problem out loud - "the real argument for pulling that reducer: it is
   not costing one bed, it is capping all three" - and this is going back
   to do it. Re-balancing a bay the player has already balanced once is
   reinforcement, not repetition.

   The lesson is NOT the reducer. It is the order of operations: measure
   first and you can prove what your repair bought; measure after only and
   you are taking your own word for it. The player is asked to choose, both
   choices genuinely work, and the coach reacts to which one they picked.

   The payoff falls out of the real physics rather than being staged. With
   the reducer in, balancing means throttling the two healthy beds down to
   meet the crippled one: 11.51 gpm each. With three identical branches the
   manifold splits evenly on its own at full open: 15.61 gpm each, +36%,
   and no throttling at all. The reducer was not costing bed 3 - it was
   costing every adjustment made elsewhere to work around it.
   ============================================================ */
function startLevel2(){
const A=LPE.art, P=LPE.palette, W=900, H=400;

/* ---------- geometry (level one's, unchanged) ---------- */
const MAIN_Y=86, TRUNK_X=320, POD_X=812;
const BR_Y=[170,256,342];
/* Bore radii ARE the sizing's bores, at the cutaway's own scale, so the
   drawing cannot quietly disagree with the physics. R_BR is the anchor and
   everything else follows from a real bore in inches - see sizing.js.
     NPS 3/8 Sch 40   bore 0.493 in   the branches
     NPS 1/2 Sch 40   bore 0.622 in   the main and the riser
     restriction      throat 0.108 in  derived from the Cv it has to have
   The main was drawn at 11 px for a long time, which is NPS 3/8 wearing a
   half-inch label; at this scale it is 12.6. */
/* THE BORES ARE NOT TYPED HERE. They come from the Process Core's
   component catalogue, which reads them from ASME B36.10M and refuses to
   load unless every dimension matches what it says the standard printed.
   Level 1 was migrated first; this is the same bay, so it reads the same
   two parts. */
const CAT=LPE.catalogue.load(LPE.catalogueData);
const BORE_MAIN=CAT.part('PIPE/NPS0.5/S40').dims.bore;      // 0.622 in
const BORE_BR  =CAT.part('PIPE/NPS0.375/S40').dims.bore;    // 0.493 in
const R_BR=10;                                      // the anchor
const PX_PER_IN=R_BR/BORE_BR;                       // ~20.3 px per inch of bore
const R_MAIN=Math.round(BORE_MAIN*PX_PER_IN*10)/10; // 12.6
const MAN_TOP=132;        // the manifold body's inlet face, below the elbow
const P_SUP=60;           // the Thermal Reservoir, psig
const RED_X0=600, RED_X1=680, RED_R=Math.round(0.108*PX_PER_IN*10)/10;
const VALVE_X=410, WHEEL_R=18, STEM=24;
const BR_LEN=POD_X-TRUNK_X;
const wheelMainX=170;
const wheels=[
  {key:'main',x:wheelMainX,y:MAIN_Y,  label:'MAIN SUPPLY'},
  {key:'b0',  x:VALVE_X,y:BR_Y[0],label:'BED 1'},
  {key:'b1',  x:VALVE_X,y:BR_Y[1],label:'BED 2'},
  {key:'b2',  x:VALVE_X,y:BR_Y[2],label:'BED 3'},
];

/* ---------- physics (level one's, plus the fitting being removable) ----------
   Verified against level one state-for-state by diffphys.js: with
   reducerIn true this solve is identical to level one's across all 27
   valve combinations. The ONLY new thing is that the series term can go. */
/* DERIVED, not chosen - run `node sizing.js` to regenerate and see the
   working. Application: 3 NFT beds at 2.0 gpm each (an NFT channel runs
   1-2 L/min; a bed carries ~6), manifold at 15.2 psig because
   micro-irrigation headers run 10-25 psi, not mains pressure. Lines from
   ASME B36.10M Sch 40 by velocity band: NPS 3/8 branches at 3.35 ft/s,
   NPS 1/2 main at 6.34 ft/s. Then Cv = q/sqrt(dP).
   The first pass had Cv 7 / 4 / 2.2, picked because they balanced nicely,
   and the bay delivered 46.8 gpm - 2,800 gal/hour through three grow beds
   on a colony whose own narration says the water is counted. */
const valves={main:1,b0:1,b1:1,b2:1};
let reducerIn=true;

/* ---- THE BAY, AS A NETLIST -----------------------------------------
   This file used to carry its own solver: a Cv table, a series-Cv helper,
   a pressure-split formula and a lagged manifold pressure, about thirty
   lines of arithmetic that had to stay identical to level 1's by hand.
   verify.js compared the two across 81 valve states for exactly that
   reason -- the check existed because the duplication did.

   It is the same bay. So it is now the same netlist, and the physics is
   `LPE.dyn` reading it, which is what level 1 already does. The Cv values
   live on the valve components where a reader can see which valve has
   which, instead of in three constants at the top.

   WHAT IS DIFFERENT FROM LEVEL 1, and the only thing: the reducer comes
   out. That makes the netlist a function of one boolean rather than a
   constant, because pulling a fitting changes what is connected to what
   -- which is precisely a netlist's business, not a renderer's.

   ONE BODY, NOT TWO TEES. Level 1 says why at length: mass is launch
   cost, every discrete fitting is a part number somebody stocks, and
   every joint is a leak path. This file still drew two forged tees for
   the same bay, which is two levels disagreeing about what the hardware
   IS. They cannot disagree now -- there is one description. */
const specFor=red=>({
  bores:{main:'PIPE/NPS0.5/S40', branch:'PIPE/NPS0.375/S40'},
  fluid:{sg:1.0},
  components:{
    reservoir:{kind:'vessel', tag:'TK-1', role:'source', pressure:P_SUP},
    union1:   {kind:'union'},
    vMain:    {kind:'valve',  tag:'HV-1', key:'main', valveType:'globe', cv:0.896},
    manifold: {kind:'manifold'},
    v0:       {kind:'valve',  tag:'HV-2', key:'b0', valveType:'globe', cv:0.513},
    v1:       {kind:'valve',  tag:'HV-3', key:'b1', valveType:'globe', cv:0.513},
    v2:       {kind:'valve',  tag:'HV-4', key:'b2', valveType:'globe', cv:0.513},
    /* The swap. A reducer restricts; a coupling does not -- it is a
       collar pair with the same bore either side, which is the entire
       point of it. Topologically both are inline two-port fittings, so
       the segments below are the same either way; what changes is
       whether there is a Cv in the line. `fitting:` is the render hint
       for which one to draw, because union-versus-coupling is a
       fabrication fact and a renderer cannot deduce it from coordinates. */
    red:      red ? {kind:'reducer', throat:0.108, cv:0.296}
                  : {kind:'union', fitting:'coupling'},
    pod0:     {kind:'vessel', tag:'TK-2', role:'sink', vesselType:'atmospheric'},
    pod1:     {kind:'vessel', tag:'TK-3', role:'sink', vesselType:'atmospheric'},
    pod2:     {kind:'vessel', tag:'TK-4', role:'sink', vesselType:'atmospheric'},
  },
  segments:[
    {from:'reservoir.out', to:'union1.in', bore:'main'},
    {from:'union1.out',    to:'vMain.in',  bore:'main'},
    {from:'vMain.out',     to:'manifold.in',  bore:'main'},
    {from:'manifold.out',  to:'v2.in',     bore:'main'},
    {from:'v2.out',        to:'red.in',    bore:'main'},
    {from:'red.out',       to:'pod2.in',   bore:'main'},
    {from:'manifold.b0',   to:'v0.in',     bore:'branch'},
    {from:'v0.out',        to:'pod0.in',   bore:'branch'},
    {from:'manifold.b1',   to:'v1.in',     bore:'branch'},
    {from:'v1.out',        to:'pod1.in',   bore:'branch'},
  ],
  frames:{
    rig:{
      pxPerInch:PX_PER_IN, round:1,
      at:{
        reservoir:[30,MAIN_Y],
        union1:   [wheelMainX-54,MAIN_Y],
        vMain:    [wheelMainX,MAIN_Y],
        manifold: [[TRUNK_X,MAN_TOP],[TRUNK_X,BR_Y[0]],
                   [TRUNK_X,BR_Y[1]],[TRUNK_X,BR_Y[2]]],
        v0:       [VALVE_X,BR_Y[0]],
        v1:       [VALVE_X,BR_Y[1]],
        v2:       [VALVE_X,BR_Y[2]],
        /* A reducer spans two points -- it has a length and a taper. A
           coupling is a point. Placing one where the other is expected
           is refused by name, which is the frame doing its job. */
        red:      red ? [[RED_X0,BR_Y[2]],[RED_X1,BR_Y[2]]]
                      : [(RED_X0+RED_X1)/2,BR_Y[2]],
        pod0:     [POD_X,BR_Y[0]],
        pod1:     [POD_X,BR_Y[1]],
        pod2:     [POD_X,BR_Y[2]],
      },
      via:{
        'vMain.out->manifold.in':[[TRUNK_X,MAIN_Y]],
        'manifold.out->v2.in':   [[TRUNK_X,BR_Y[2]]],
      },
    },
  },
});

let NETLIST,DYN;
/* `solve()` keeps the shape this level has always read -- q as an array in
   bed order -- so nothing downstream changed when the physics moved out. */
function solve(){
  const S=DYN.solve(valves);
  return {cvMain:S.cvUp, cvSum:S.cvDown, pMan:S.pressure, pTarget:S.target,
          q:[S.q.b0,S.q.b1,S.q.b2], qTot:S.qTot};
}

/* ---------- air fill ----------
   The bay has been running since level one, so the lines are wet and the
   air is long gone. It comes back for line 3 only, and only once: cutting
   a spool out opens that branch to the bay and it fills with air again.
   Level one taught that; this is it arriving as a consequence. */
const FILL_START=(VALVE_X-TRUNK_X)/BR_LEN;
const fill=[1,1,1];
/* Air purge rate, set from the duration it has to produce rather than
   left as a bare number. purge = (1 - FILL_START) * BR_LEN / (q * FILL_RATE).
   At the real flows (about 2 gpm a branch) 50 gives ~4 s: long enough to
   read the caption and watch the front move, short enough not to stall.
   This is a constant that only means anything in combination with the flow
   scale - when the Cv values were derived down 8x, the old 12 silently
   became a 15 s purge, and a hand-tuned 5 became 40 s. */
const FILL_RATE=50;
const venting=i=>fill[i]>FILL_START+0.001 && fill[i]<1;

/* ---------- water ---------- */
/* The same long-radius value the piping uses, ASKED FOR rather than
   restated -- topology.js owns the convention. This was the last copy of
   `3 x bore radius` in this level, as it was in level 1. */
const BEND=LPE.net.bendRadius(R_MAIN);
const E1={x:TRUNK_X,y:MAIN_Y}, E2={x:TRUNK_X,y:BR_Y[2]};
const main=new LPE.Line({r:R_MAIN,segments:[
  {ax:30,ay:MAIN_Y,bx:wheelMainX,by:MAIN_Y,fill:1},
  {ax:wheelMainX,ay:MAIN_Y,bx:E1.x-BEND,by:MAIN_Y,fill:1},
  {arc:{cx:E1.x-BEND,cy:E1.y+BEND,R:BEND,a0:-Math.PI/2,a1:0},fill:1},
]});
const trunk=new LPE.Line({r:R_MAIN,segments:[
  {ax:TRUNK_X,ay:E1.y+BEND,bx:TRUNK_X,by:BR_Y[0],fill:1},
  {ax:TRUNK_X,ay:BR_Y[0],bx:TRUNK_X,by:BR_Y[1],fill:1},
  {ax:TRUNK_X,ay:BR_Y[1],bx:TRUNK_X,by:E2.y-BEND,fill:1},
  {arc:{cx:E2.x+BEND,cy:E2.y-BEND,R:BEND,a0:Math.PI,a1:Math.PI/2},fill:1},
]});

/* The network is rebuilt when the fitting changes, because the drawn pipe
   and the water's path are the same description of the same hardware. A
   level that let those two drift would show a reducer that was not there. */
let NET, branches, BR_SEGS, BR_TOTAL;
/* The tee-turn radius is the netlist's, not a number restated here. */
const TEE_R=LPE.net.teeTurnRadius(R_BR);
function buildNet(){
  /* Rebuild the netlist, not just the drawing. Pulling the reducer
     changes what is connected to what, so the graph changes and the
     physics and the geometry both fall out of the new one -- which is
     the only way they cannot drift. The lagged manifold pressure is
     carried across, because the bay does not forget its pressure when a
     fitting is swapped; without this the pull would snap it to zero. */
  const keepP=DYN?DYN.pressure:0;
  NETLIST=LPE.net(specFor(reducerIn),{frame:'rig',catalogue:CAT});
  if(NETLIST.errors.length)
    throw new Error('level 2 netlist: '+NETLIST.errors.join('; '));
  DYN=LPE.dyn(NETLIST,{tau:0.22});
  if(DYN.errors.length)
    throw new Error('level 2 dynamics: '+DYN.errors.join('; '));
  DYN.pressure=keepP;
  NET=LPE.piping(NETLIST.toPiping());
  BR_SEGS=BR_Y.map((y,i)=> i!==2
    ? [{arc:{cx:TRUNK_X+TEE_R,cy:y-TEE_R,R:TEE_R,a0:Math.PI,a1:Math.PI/2},r:R_BR},
       {ax:TRUNK_X+TEE_R,ay:y,bx:POD_X,by:y,r:R_BR}]
    : reducerIn
      ? [{ax:TRUNK_X+BEND,ay:y,bx:RED_X0,by:y,r:R_BR},
         {ax:RED_X0,ay:y,bx:RED_X1,by:y,r:RED_R,speed:6},
         {ax:RED_X1,ay:y,bx:POD_X,by:y,r:R_BR}]
      : [{ax:TRUNK_X+BEND,ay:y,bx:POD_X,by:y,r:R_BR}]);   // one clear bore
  const keep=branches;
  branches=BR_Y.map((y,i)=>new LPE.Line({r:R_BR,
    segments:BR_SEGS[i].map(s=>({...s,fill:(keep?fill[i]:1)}))}));
  BR_TOTAL=branches.map(b=>b.segs.reduce((t,s)=>t+s.len,0));
}
buildNet();

/* The bay at its best -- reducer out, everything open -- measured on a
   THROWAWAY netlist rather than by toggling the live one and putting it
   back. The old version mutated three globals and restored them; a
   restore that is one line long is a restore that will one day be two. */
const FLOW_REF=(()=>{
  const n=LPE.net(specFor(false),{frame:'rig',catalogue:CAT});
  const d=LPE.dyn(n,{tau:0.22});
  const settle=v=>{ d.settle(v); return d.solve(v); };
  const all=settle({main:1,b0:1,b1:1,b2:1}).qTot;
  const one=settle({main:1,b0:1,b1:0,b2:0}).q.b0;
  return {riser:all, branch:one};
})();

/* ---------- the baseline the player is asked to take ---------- */
let baseline=null;                        // {per, tot} once measured, else null
let result=null;                          // and the same, after the repair

/* A step may only latch once the manifold has actually settled.
   Without this the bay reads as balanced DURING the pressure transient:
   every branch is scaled by the same sqrt(pMan), so while the pressure is
   still climbing all three numbers are low but nearly equal, and a
   spread-plus-floor test passes at a moment that is not a steady state.
   That is how the first run of this level recorded a baseline of 8.8 gpm
   for a bay that settles at 11.5. A measurement taken before the rig stops
   moving is not a measurement. */
const settled=()=>Math.abs(solve().pTarget-DYN.pressure)<0.12;

/* What the bay is ON ITS WAY TO, not where the needle happens to be this
   frame. Recorded figures are read from here: within the settle tolerance
   the live value still drifts enough to print 15.7 for a bay that runs at
   15.61, and the whole level turns on two numbers being comparable. */
function steady(){
  /* Was: re-derive each branch flow from its Cv and sqrt(pTarget/SG), a
     copy of the solver's own arithmetic living in the view. Now it asks
     the dynamics layer what the bay settles to and reads the answer.
     The live pressure is put back, because this is a QUERY -- the needle
     must keep lagging on screen while a recorded figure is taken. */
  const keep=DYN.pressure;
  DYN.settle(valves);
  const S=solve();
  DYN.pressure=keep;
  return {q:S.q, per:S.qTot/3, tot:S.qTot};
}

/* Balanced means even AND as high as the weakest branch allows - not merely
   even. Throttling all three down to match would also be "within a gallon",
   and would quietly understate the baseline, which flatters the repair that
   comes next. Bed 3 tops out at 11.51 through the reducer, so the window
   sits just under it. */
const balanced=()=>{ if(!settled()) return false;
                     const S=solve(), mn=Math.min(...S.q), mx=Math.max(...S.q);
                     return mn>=1.31 && (mx-mn)<=0.125; };
const allWide=()=>settled()&&valves.main>=0.9&&valves.b0>=0.9&&
                  valves.b1>=0.9&&valves.b2>=0.9;

/* ---------- the two routes through the job ---------- */
const ISOLATE={ keys:['b2'], watch:2,
  task:'Isolate line 3 \u2014 shut BED 3 right off.',
  ok:()=>valves.b2<=0.02,
  lesson:'You do not cut into a live line. And look what isolating it did to everyone '+
         'else: shut one demand and manifold pressure climbs for every branch left open. '+
         'Same rule as commissioning, now with a spanner in your hand.' };
const PULL={ keys:[], watch:2, click:true,
  task:'Now take the reducer out. Click the fitting.',
  ok:()=>!reducerIn,
  lesson:'Coupler and a new spool, same bore as the rest of the branch. '+
         'And line 3 is <b>full of air</b> again \u2014 you just had it open to the bay. '+
         'That will have to vent before water reaches the roots.' };

const THOROUGH=[
  { keys:['b0','b1','b2'], watch:-1,
    task:'Balance the bay first \u2014 all three even, and as high as Bed 3 will let them go.',
    ok:balanced,
    lesson:()=>'<b>'+baseline.per.toFixed(1)+' gpm a bed, '+baseline.tot.toFixed(1)+
      ' for the bay.</b> That is your baseline, and it is the whole reason for doing this '+
      'in this order. Whatever happens next, you can now say exactly what it was worth.' },
  ISOLATE,
  PULL,
  { keys:['b2','b0','b1','main'], watch:-1,
    task:'Open BED 3 back up and bring the whole bay wide open.',
    ok:allWide,
    lesson:()=>'<b>'+result.per.toFixed(1)+' gpm a bed</b>, against '+baseline.per.toFixed(1)+
      ' before \u2014 and notice what you did <b>not</b> have to do. You never throttled anything. '+
      'Three identical branches split the manifold evenly all by themselves. '+
      'That reducer was never costing you Bed 3; it was costing you every adjustment you '+
      'made everywhere else to work around it.' },
];

const SHORTCUT=[
  ISOLATE,
  PULL,
  { keys:['b2','b0','b1','main'], watch:-1,
    task:'Open BED 3 back up and bring the whole bay wide open.',
    ok:allWide,
    /* The strip carries the measurement; the coach's verdict carries on the
       debrief card. Together in one lesson they ran 44px past the bottom of
       a box that clips rather than scrolls, so the point of the whole route
       was the part the player never got to read. */
    lesson:()=>'<b>'+result.per.toFixed(1)+' gpm a bed</b>, and the bay balances itself now '+
      'that the three branches match. It is a good repair.<span class="gap"></span>'+
      '<span class="who">COMMS:</span> Is it better than it was? Almost certainly. '+
      '<b>How much</b> better? Neither of us can say.' },
];

let STEPS=null, step=0, done=false, route='';
/* Once the assignment is over the rig is unlocked: every wheel turns, and
   every wheel lights, because every one of them is now a control you may
   use. While the level is running this still points at exactly the valve
   the current step is about. Before this, `done` locked the lot - finishing
   a level left the player holding a rig they could not touch. */
const isLive=k=> done ? true : (!!STEPS && STEPS[step].keys.indexOf(k)>=0);
const canPull=()=>!done && STEPS && !!STEPS[step].click && reducerIn && valves.b2<=0.02;

/* ---------- scenery ---------- */
let BG;
function buildScene(){
  BG=document.createElement('canvas'); BG.width=W; BG.height=H;
  const g=BG.getContext('2d');
  A.wall(g,W,H); A.rib(g,0,H); A.rib(g,862,H);
  A.vignetteOnto(g,W,H);
  A.stencil(g,52,H-26,'BIO-GROW BAY 3',18,'#8b949b');
  A.stencil(g,52,H-10,'IRRIGATION MANIFOLD',14);
}

/* ---------- drawing ---------- */
function draw(g,dt,t){
  const S=solve();
  g.drawImage(BG,0,0);
  NET.draw(g);

  /* The fitting labels itself, and says so louder while it is the thing
     being asked for - a click target the player cannot find is not a
     puzzle, it is a dead end. */
  const RX=(RED_X0+RED_X1)/2;
  if(reducerIn){
    const hot=canPull();
    g.fillStyle=hot?P.amber:P.rim; g.font="13px 'VT323',monospace"; g.textAlign='center';
    g.fillText('REDUCER',RX,BR_Y[2]-R_BR-14);
    if(hot){
      const pulse=0.45+0.35*Math.sin(t*5);
      g.save(); g.globalAlpha=pulse; g.strokeStyle=P.amber; g.lineWidth=2;
      g.strokeRect(RED_X0-8,BR_Y[2]-R_MAIN-10,RED_X1-RED_X0+16,2*(R_MAIN+10));
      g.restore();
      g.fillStyle=P.amber; g.font="12px 'VT323',monospace";
      g.fillText('CLICK TO REMOVE',RX,BR_Y[2]+R_MAIN+22);
    }
  } else {
    g.fillStyle=P.rim; g.font="13px 'VT323',monospace"; g.textAlign='center';
    g.fillText('COUPLING',RX,BR_Y[2]-R_BR-14);
  }

  wheels.forEach(w=>LPE.valveShell(g,w.x,w.y,w.key==='main'?R_MAIN:R_BR));
  main.draw(g); trunk.draw(g);
  branches.forEach(b=>b.draw(g));

  BR_Y.forEach((y,i)=>{
    const q=S.q[i], wet=q>0.05, bx=POD_X, bw=62, bh=40;
    g.fillStyle='#2a333a'; g.fillRect(bx,y-bh/2,bw,bh);
    g.fillStyle='#1a2a1c'; g.fillRect(bx+3,y-bh/2+3,bw-6,bh-6);
    for(let k=0;k<5;k++){
      const sx=bx+10+k*10, h=wet?9:5;
      g.fillStyle=wet?'#39ff6a':'#4a5a44';
      g.fillRect(sx,y-h,2,h); g.fillRect(sx-2,y-h,6,2);
    }
    if(wet){
      const lv=Math.min(1,q/1.5);
      g.fillStyle='rgba(54,224,255,0.30)';
      g.fillRect(bx+3,y+bh/2-3-8*lv,bw-6,8*lv);
    }
    g.strokeStyle=wet?P.water:'#4a545e'; g.lineWidth=2;
    g.strokeRect(bx,y-bh/2,bw,bh);
    A.plate(g,bx-4,y-bh/2-20,62,17);
    g.fillStyle=P.rim; g.font="13px 'VT323',monospace"; g.textAlign='left';
    g.fillText('BED '+(i+1),bx,y-bh/2-7);
    A.readout(g,{x:714,y:y-39,w:94,h:26,size:20,text:q.toFixed(1)+' gpm',lit:wet});
    if(venting(i)){
      /* A small static caption at the far right lost every time, because the
         player is looking at the hand wheel. It pulses, it says what is
         actually happening, and the escaping air is drawn at the bed end
         where it is leaving. */
      const pulse=0.55+0.45*Math.sin(t*9);
      A.plate(g,bx-150,y+18,142,19);
      g.save(); g.globalAlpha=pulse;
      g.fillStyle=P.amber; g.font="14px 'VT323',monospace"; g.textAlign='right';
      g.fillText('>> VENTING AIR',bx-14,y+32);
      g.restore();
      for(let k=0;k<7;k++){                       // air spitting out at the bed
        const ph=(t*2.2+k*0.37)%1;
        g.globalAlpha=(1-ph)*0.75*pulse;
        g.fillStyle='#cfe6ff';
        g.fillRect(bx-2+ph*22, y-5+Math.sin(t*7+k*1.9)*6, 3, 2);
      }
      g.globalAlpha=1;
    }
  });

  wheels.forEach(w=>{
    const v=valves[w.key], r=w.key==='main'?R_MAIN:R_BR;
    LPE.valveTrim(g,w.x,w.y,r,w.y-r-10-STEM,v*LPE.WHEEL_SWEEP,WHEEL_R,isLive(w.key),v);
    const lx=(w.key==='main')?w.x-128:w.x+38, ly=w.y-34;
    A.plate(g,lx-4,ly-17,92,34);
    g.fillStyle=isLive(w.key)?P.amber:P.rim;
    g.font="13px 'VT323',monospace"; g.textAlign='left';
    g.fillText(w.label,lx,ly-4);
    g.fillStyle=v>0.02?'#39ff6a':'#b8434a';
    g.font="17px 'VT323',monospace";
    g.fillText(v<=0.02?'SHUT':Math.round(v*100)+'% OPEN',lx,ly+13);
  });

  const GX=258, GY=36, GR=25;
  g.strokeStyle=P.light; g.lineWidth=4;
  g.beginPath(); g.moveTo(GX,MAIN_Y-R_MAIN-5); g.lineTo(GX,GY+GR); g.stroke();
  LPE.gauge(g,GX,GY,GR,S.pMan,80);
  g.fillStyle=P.rim; g.font="13px 'VT323',monospace"; g.textAlign='left';
  g.fillText('MANIFOLD',GX+GR+8,GY+4);

  /* The baseline, once taken, stays on the wall. It is the thing the whole
     level is about; it should not live only in a lesson the player scrolled
     past four steps ago. */
  if(baseline){
    /* On clear wall to the right of the gauge. At x=36 it was drawn straight
       over the MAIN SUPPLY hand wheel and over its own label plate - every
       candidate position was checked against the fixed furniture rather
       than eyeballed from a screenshot. */
    A.plate(g,380,22,186,42);
    g.fillStyle=P.rim; g.font="12px 'VT323',monospace"; g.textAlign='left';
    g.fillText('BASELINE \u00b7 REDUCER IN',388,38);
    g.fillStyle='#8fb9ff'; g.font="17px 'VT323',monospace";
    g.fillText(baseline.per.toFixed(1)+' gpm/bed   '+baseline.tot.toFixed(1)+' total',388,56);
  }
}

/* ---------- simulation ---------- */
function stepSim(dt){
  const S=solve();
  DYN.step(dt,valves);          // the lag lives in the dynamics layer now
  for(let i=0;i<3;i++){
    if(S.q[i]>0) fill[i]=Math.min(1,fill[i]+S.q[i]*FILL_RATE*dt/BR_LEN);
    const f=Math.min(1,S.q[i]/FLOW_REF.branch);
    let walked=fill[i]*BR_TOTAL[i], off=0;
    branches[i].segs.forEach((s,n)=>{
      branches[i].set(n,{flow:f, fill:Math.max(0,Math.min(1,(walked-off)/s.len))});
      off+=s.len;
    });
  }
  const dn=[S.q[0]+S.q[1]+S.q[2], S.q[1]+S.q[2], S.q[2], S.q[2]];
  dn.forEach((q,i)=>trunk.set(i,{flow:Math.min(1,q/FLOW_REF.riser)}));
  const mainFlow=Math.min(1,S.qTot/FLOW_REF.riser);
  [0,1,2].forEach(n=>main.set(n,{flow:mainFlow}));
  main.update(dt); trunk.update(dt); branches.forEach(b=>b.update(dt));
  LPE.audio.flow(Math.min(1,S.qTot/FLOW_REF.riser));
  /* The throat is noisy while it is in, and the bay goes quiet when it comes
     out. That silence is half the payoff - the player hears the repair. */
  LPE.audio.rush(reducerIn ? Math.min(1,S.q[2]/1.5) : 0);
  LPE.audio.vent(venting(2) ? Math.min(1,0.35+S.q[2]/4) : 0);

  if(!STEPS || done || SH.holding) return;
  if(STEPS[step].ok()){
    /* The baseline is captured the instant it is earned, before the next
       step can move the valves and make the number a lie. */
    if(route==='thorough' && step===0 && !baseline){
      baseline=steady();
    }
    /* The closing figure is captured once, here, and every later mention
       reads that one number. Re-reading the solver for the lesson and
       again for the debrief printed 15.7 and 15.6 for the same bay. */
    if(step>=STEPS.length-1 && !result){
      result=steady();
    }
    const last=step>=STEPS.length-1;
    const L=STEPS[step].lesson, text=(typeof L==='function')?L():L;
    SH.beat(text, ()=>{
      if(last){ done=true; SH.finish(ending(text)); }
      else { step++; say(); }
    });
    SH.count(last?'DONE':(step+2)+' / '+STEPS.length);
  }
}
function ending(text){
  const q=result.per;
  return route==='thorough'
    ? { lesson:text,
        line:'<span class="accent">Line 3 is a line again.</span> '+baseline.per.toFixed(1)+
             ' to '+q.toFixed(1)+' gpm a bed, and you can prove it \u2014 because you '+
             'measured the bay before you changed it.' }
    : { lesson:text,
        line:'<span class="accent">Line 3 is a line again.</span> The repair is sound \u2014 '+
             'but nobody wrote down what the bay was doing before you touched it, and that '+
             'number only ever existed in the bay you did not stop to read.<br><br>'+
             'A repair you cannot measure is a repair you cannot defend.' };
}
function say(){
  if(done||!STEPS) return;
  SH.say(STEPS[step].task,'');
  SH.count((step+1)+' / '+STEPS.length);
}

/* ---------- the fork ---------- */
function askRoute(){
  SH.ask({
    lesson:'<span class="who">COMMS:</span> Before you start \u2014 your call on the order. '+
           'We can balance the bay the way it stands and write the numbers down, then pull '+
           'the reducer. Or we can just pull it now and balance once, afterwards.',
    options:[
      { label:'BALANCE FIRST, THEN PULL IT', note:'the long way',
        pick:()=>{ route='thorough'; STEPS=THOROUGH; step=0;
          SH.beat('<span class="who">COMMS:</span> Good. That is the right instinct \u2014 '+
            'you take the measurement while the fault is still in the line, because afterwards '+
            'there is nothing left to measure. Costs you one extra balance, and plenty of '+
            'people would not bother. <b>If we are spending a shift on this, we are going '+
            'to be able to say what it bought.</b>',
            say); } },
      { label:'PULL IT NOW, BALANCE AFTER', note:'the quick way',
        pick:()=>{ route='shortcut'; STEPS=SHORTCUT; step=0;
          SH.beat('<span class="who">COMMS:</span> \u2026Alright. It will work, and the bay '+
            'will be better off than it is now. I would have spent the five minutes first, '+
            'myself. <b>Your rig, your call.</b> Let us get it out.',
            say); } },
    ],
  });
}

/* ---------- input ---------- */
let drag=null,lastAng=0;
function onDown(e){
  LPE.audio.init(); LPE.audio.resume(); LPE.audio.startFlow();
  const p=SH.pt(e);
  if(canPull() && p.x>RED_X0-12 && p.x<RED_X1+12 &&
     Math.abs(p.y-BR_Y[2])<R_MAIN+12){
    reducerIn=false;
    fill[2]=FILL_START;                 // the branch is open to the bay: air back in
    buildNet();
    LPE.audio.clunk(); LPE.audio.scrape();
    return;
  }
  for(const w of wheels){
    const r=w.key==='main'?R_MAIN:R_BR, wy=w.y-r-10-STEM;
    if(Math.hypot(p.x-w.x,p.y-wy)<WHEEL_R+16 && isLive(w.key)){
      drag=w; lastAng=Math.atan2(p.y-wy,p.x-w.x);
      SH.canvas.setPointerCapture(e.pointerId); return;
    }
  }
}
function onMove(e){
  if(!drag) return;
  const p=SH.pt(e), r=drag.key==='main'?R_MAIN:R_BR, wy=drag.y-r-10-STEM;
  const a=Math.atan2(p.y-wy,p.x-drag.x);
  let d=a-lastAng;
  while(d>Math.PI) d-=6.2832; while(d<-Math.PI) d+=6.2832;
  lastAng=a;
  const before=valves[drag.key];
  valves[drag.key]=Math.max(0,Math.min(1,before+d/(2*Math.PI)));
  if(Math.floor(valves[drag.key]*12)!==Math.floor(before*12)) LPE.audio.tick();
}

/* ---------- mount ---------- */
buildScene();
DYN.settle(valves);              // the bay is already running when you walk in
const SH=LPE.mount({
  t1:'BIO-GROW BAY 3 \u2014 LINE 3 REPAIR',
  t2:'The Garden \u00b7 Bio-Grow Bay 3 \u00b7 line 3 repair',
  w:W,h:H,step:stepSim,draw,
  intro:[
    /* The repair is not a coincidence that arrives on its own. The coach
       PUTS it on the ticket, in front of the player, and owns the cost of
       doing so - that is where the time goes, not into one extra balance. */
    {kind:'place',
     text:'Bay 3 is green now. The beds you brought online are growing, the fans are '+
          'running, and line 3 is still drinking less than the other two.'+
          '<br><br>Nobody can tell you why the reducer is there. It is not on any drawing. '+
          'Someone fitted it, years ago, for a reason that left with them \u2014 and the '+
          'bay has been working around it ever since.'+
          '<br><br>Nothing is broken. Nobody was ever going to schedule this. It is going '+
          'on the order because <span class="accent">there is slack in the shift</span> '+
          'to put it right, and because a bay that works around a fault is still a bay '+
          'with a fault in it. There is a coupling and a length of new spool on the cart.'},
    {kind:'title', eyebrow:'SECTOR 3 \u00b7 LIFE SUPPORT',
     title:'LINE 3 \u2014 REDUCER REMOVAL', sub:'BIO-GROW BAY 3 \u00b7 CORRECTIVE WORK'},
  ],
  onStart:askRoute,
  onReset(){
    Object.assign(valves,{main:1,b0:1,b1:1,b2:1});
    reducerIn=true; baseline=null; result=null; STEPS=null; step=0; done=false; route='';
    fill[0]=fill[1]=fill[2]=1;
    buildNet();
    DYN.settle(valves);
    LPE.audio.flow(0); LPE.audio.vent(0); LPE.audio.rush(0);
    askRoute();
  },
});
SH.canvas.addEventListener('pointerdown',onDown);
SH.canvas.addEventListener('pointermove',onMove);
['pointerup','pointercancel'].forEach(k=>SH.canvas.addEventListener(k,()=>{drag=null;}));
}

(window.LPE_LEVELS=window.LPE_LEVELS||[]).push({
  label:'LEVEL 2 \u2014 LINE 3 REPAIR',
  sub:'Bio-Grow Bay 3  \u00b7  corrective',
  /* The job, before the training for it. launch() plays this first;
     see PIPELINE.md section 6. */
  brief:[
    {kind:'comms', tag:'[ COLONY INTERCOM \u00b7 CREW CHANNEL 3 ]',
      /* Every <br> segment must fit 52 characters or the card wraps it and
         leaves the tail alone on a line. */
      text:'&ldquo;Bay 3 is on your round this shift.<br>'+
           'One more on your ticket while you are down there \u2014<br>'+
           'that reducer in line 3. It comes out today.&rdquo;'}
  ],
  /* Level 2 measures the reducer in bed 3 and then takes it out. The
     rung behind that - what a restriction costs, in P1/P2 terms - is
     taught on the bench first. */
  teach:['restriction'],
  start:startLevel2,
});
if(!window.LPE_GAME) startLevel2();
</script>
