      q('.task').innerHTML=hint();
      q('.lesson').innerHTML=lesson||'';
      const openedAt=performance.now();
      /* Polled from the frame loop, not a timer. What the predicate is
         waiting on is something happening in the SIMULATION, and the
         simulation only advances when a frame runs - so a wall-clock timer
         both fires when nothing has moved and, in a background tab where
         timers are throttled to a second or more, fails to fire when it
         has. Tying it to pump() makes the two agree by construction. */
      S._holdUntil = until ? ()=>{
        if(!until()) return;
        S._holdUntil=null;
        q('.task').innerHTML=hint();
      } : null;
      const go=e=>{
        if(until && !until()) return;            // nothing to continue from yet
        if(e.type==='keydown' && e.key!=='Enter' && e.key!==' ') return;
        if(e.type==='click'){
          /* Only the control advances. This used to listen on the whole
             shell, so any click anywhere - opening a valve, picking a
             spare, missing a drag - ate the lesson you had not read yet.
             The hint has looked like a button the whole time; now it is
             the only thing that behaves like one. ENTER and SPACE still
             work, for anyone who would rather not go back to the mouse. */
          if(!(e.target.closest && e.target.closest('.beat-hint'))) return;
          /* And the click that finishes the drag which OPENED this lesson
             is not the player asking to move on either. */
          if(lastDownAt<openedAt) return;
        }
        e.preventDefault();
        drop();
        S._holding=false; if(then) then();
      };
      function drop(){ window.removeEventListener('keydown',go);
                       root.removeEventListener('click',go); S._holdDrop=null;
                       S._holdUntil=null; }
      S._holdDrop=drop;
      window.addEventListener('keydown',go);
      root.addEventListener('click',go);
      return true;
    },
    get holding(){ return !!S._holding; },
    get done(){ return !!S._done; },
    /* A fork the player is asked to make out loud, in the coach's voice.
       Same hold as `beat` - the rig keeps running underneath, nothing
       advances until they answer - but with named options instead of a
       continue. The choice itself is the teaching: which one they pick is
       allowed to be wrong, and the coach is allowed to say so. */
    ask(o2){
      if(S._holding) return;
      S._holding=true;
      q('.task').innerHTML='<span class="beat-hint">your call &rarr;</span>';
      q('.lesson').innerHTML=(o2.lesson||'')+'<div class="choice"></div>';
      const box=q('.choice');
      o2.options.forEach(opt=>{
        const b=document.createElement('button');
        b.innerHTML=opt.label+(opt.note?'  <span class="no">'+opt.note+'</span>':'');
        /* stopPropagation matters: the option sits INSIDE the level root, and
           whatever `pick` opens next - almost always a beat - binds its own
           dismiss handler on that same root. Let this click carry on
           bubbling and it dismisses the reply before the player can read a
           word of it. The coach's answer came back blank every time. */
        b.onclick=ev=>{ ev.stopPropagation();
          box.querySelectorAll('button').forEach(x=>x.disabled=true);
          S._holding=false; audio.clack&&audio.clack(); opt.pick(); };
        box.appendChild(b);
      });
      const first=box.querySelector('button');
      if(first) setTimeout(()=>first.focus(),60);
    },
    /* The end of an assignment. Both levels used to just stop - set the
       counter to DONE and sit there - so the only way out of a finished
       level was reloading the page and walking the boot sequence again.
       There was no route from level zero to level one either; this was
       never a gap that appeared when a third level turned up.
       Where you go next is a property of the TEMPLATE. A level says it is
       over and what the coach signs off with; it does not decide what
       follows it, and it does not know a menu exists. */
    finish(f){
      if(S._done) return; S._done=true;
      f=f||{};
      S.say('', f.lesson||'');
      S.count('DONE');
      const nx=LPE_NAV.levels[LPE_NAV.idx+1],
            nxRun=nx&&(nx.start||nx.play),
            back=LPE_NAV.opt;
      const d=document.createElement('div'); d.className='beat';
      d.innerHTML='<div class="tech-eyebrow">ASSIGNMENT COMPLETE</div>'+
        '<div class="tech-title">'+(o.t1||'')+'</div>'+
        (f.line?'<div class="immersion">'+f.line+'</div>':'')+
        '<div class="dmenu"></div>';
      const dm=d.querySelector('.dmenu');
      const add=(html,fn)=>{ const b=document.createElement('button');
        b.innerHTML=html; b.onclick=fn; dm.appendChild(b); return b; };
      const leave=go=>()=>{ cleanup(); d.remove(); S.destroy(); go(); };
      if(nxRun) add('NEXT ASSIGNMENT  <span class="no">'+nx.label+'</span>',
                    leave(()=>launch(back,LPE_NAV.idx+1)));
      if(back) add('SELECT ASSIGNMENT', leave(()=>_select(back)));
      /* Players poke at a rig they have just solved, and taking it away the
         instant the last step passes is the wrong reward. The card steps
         aside; the level is still underneath it, still running. */
      add('STAY ON THE RIG', ()=>{ cleanup(); d.remove();
        /* Say so. The rig unlocking is a real change of state and the
           player has no other way to find out it happened. */
        q('.task').innerHTML='<span class="free">The rig is yours &mdash; '+
          'every valve is unlocked.</span>'; });
      function key(e){ if(e.key==='Escape'){ cleanup(); d.remove(); } }
      function cleanup(){ window.removeEventListener('keydown',key); }
      window.addEventListener('keydown',key);
      document.body.appendChild(d);
      d.classList.add('show');   // synchronous: a backgrounded tab runs no rAF
      const first=dm.querySelector('button');
      if(first) setTimeout(()=>first.focus(),60);
    },
    pt(e){ const r=cv.getBoundingClientRect();
      return {x:(e.clientX-r.left)*(S.w/r.width), y:(e.clientY-r.top)*(S.h/r.height)}; },
  };

  q('[data-a="sound"]').onclick=e=>{ e.target.textContent='SOUND: '+(audio.toggle()?'ON':'OFF'); };
  /* Reset puts the assignment back to un-finished, and cancels whatever the
     strip was waiting on. Without the cancel, resetting mid-lesson left
     `_holding` stuck true - so the level could never speak again - and left
     the old handler bound, so a later click would fire a step transition
     belonging to a run that no longer exists. */
  q('[data-a="reset"]').onclick=()=>{
    if(S._holdDrop) S._holdDrop();
    S._holding=false; S._done=false;
    if(o.onReset) o.onReset();
  };
  const fsOn=()=>!!(document.fullscreenElement||document.webkitFullscreenElement);
  const fsBtn=q('[data-a="fs"]');
  fsBtn.onclick=()=>{
    const d=document.documentElement;
    const fn=fsOn()?(document.exitFullscreen||document.webkitExitFullscreen)
                   :(d.requestFullscreen||d.webkitRequestFullscreen);
    if(!fn) return;
    try{ const r=fn.call(fsOn()?document:d); if(r&&r.catch) r.catch(()=>{}); }catch(_){}
  };
  const sync=()=>{ fsBtn.style.display=document.fullscreenEnabled!==false?'':'none';
                   fsBtn.textContent=fsOn()?'EXIT FULL SCREEN':'FULL SCREEN'; };
  document.addEventListener('fullscreenchange',sync);
  document.addEventListener('webkitfullscreenchange',sync);
  sync();

  /* One clock for everything, so a level never starts its own loop.
     `pump` advances a single frame by hand. requestAnimationFrame does not
     fire in a backgrounded tab, so without this the simulation cannot be
     stepped or inspected outside a visible window. */
  let last=0, t=0, live=true;
  S.pump=function(dt){
    t+=dt; if(o.step) o.step(dt); if(o.draw) o.draw(S.ctx,dt,t);
    if(S._holdUntil) S._holdUntil();     // a lesson waiting on the rig to show something
  };
  function frame(ts){
    if(!live) return;                      // a torn-down level stops simulating
    const dt=last?Math.min(0.05,(ts-last)/1000):0; last=ts;
    S.pump(dt);
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
  LPE_CURRENT=S;

  /* Until levels could follow one another, nothing ever had to come down,
     so nothing ever did: the clock ran forever and the fullscreen listeners
     stayed bound. Mounting a second level on top of that would have left the
     first one simulating and drawing into a canvas no longer in the document. */
  S.destroy=function(){
    if(!live) return; live=false;
    document.removeEventListener('fullscreenchange',sync);
    document.removeEventListener('webkitfullscreenchange',sync);
    audio.flow(0);                         // the level's flow hum goes with it
    root.remove();
    if(LPE_CURRENT===S) LPE_CURRENT=null;
  };

  const start=()=>{ root.classList.remove('pending'); if(o.onStart) o.onStart(); };
  if(o.intro && o.intro.length){
    const run=()=>intro(o.intro,start);
    if(document.body) run(); else document.addEventListener('DOMContentLoaded',run);
  }
  return S;
}

return {palette:P, art, Line, Cutaway, pipeRun, runSegments, runPoly,
        penetration, valveBody, handWheel, gauge,
        piping, pipes, valveShell, valveTrim, WHEEL_SWEEP, audio, intro, mount, boot, title,
        get current(){ return LPE_CURRENT; }};
})();

/* @layer catalogue
   @core Process Core -- the parts repository.
   May use: nothing. This is the BOTTOM of the stack and depends on no other
   layer; if it ever reaches up to the netlist the dependency is inverted.
   Never: I/O. The core does not fetch, read a file or know a path. A
   consumer hands `load()` already-parsed JSON -- node reads it with fs, a
   browser fetches it -- which is what keeps this file identical in both.

 "packing": {
  "_source": "Fisher ED and EAD easy-e Valves instruction manual D100390X012, February 2026, Table 4 \"Recommended Torque for Packing Flange Nuts\". Note: lubricate with anti-seize compound. CORRECTED 2026-10-11: these rows were cited to \"D100399X012, March 2026, Table 6\", a document the vault does not hold and never did -- see check-techpubs.js. Every value matches Table 4 of the ED manual we DO hold, to the lbf.in, so the numbers were never in doubt and only the citation was. The table is keyed on stem diameter and pressure class, not on body family, which is why it reads the same in every easy-e manual. AND IT STARTS AT 3/8, not 1/2: the four 3/8 in rows were missing here because the note claimed the manual did not go that small. It does. PLUS Fisher ENVIRO-SEAL Sliding-Stem Valves instruction manual D101642X012, July 2017: Tables 4, 5 and 6 (packing friction, in newtons and pounds force, by stem diameter and packing type) and Table 7 (Graphite ULF packing torque). Table 7 note 1: \"For A, DBQ, easy-e, EH, FB, HP, YD, and YS valves\" -- easy-e is the ED family, so it applies here.",
  "_note": "THE WINDOW IS THE LESSON. Every row is a minimum AND a maximum, and both ends are failures: under the minimum the packing does not seal and the valve leaks to atmosphere; over the maximum the stem binds, friction climbs, and a positioner that could hold position starts sticking and hunting. There is no \"tighter is safer\" here, which is exactly the instinct the figures contradict. Graphite takes roughly twice the torque of PTFE for the same stem and class, because it is a different material doing the same job. TWO DIFFERENT PACKING SYSTEMS, and they publish different things. STANDARD packing (D100390X012 Table 4) gives a torque WINDOW, minimum and maximum, from 3/8 inch stems up. ENVIRO-SEAL live-loaded packing (D101642X012) gives a single torque and, more usefully, the FRICTION FORCE IN POUNDS -- which is the number the actuator has to overcome and which the standard arrangement never publishes. Both systems reach a 3/8 inch stem. The note here used to say the standard table did not, which was wrong twice over: it was reasoning about a table in a document the vault does not hold, and the table we DO hold starts at 3/8.",

 "resistance": {
  "_note": [
   "WHAT A FITTING COSTS. Not a number -- a correlation, evaluated at the",
   "Reynolds number and bore in play. Two are held and they disagree, so",
   "both are carried and the caller chooses; see src/sizing.js for which",
   "is the outlier at which size.",
   "",
   "THE JUDGEMENT THIS FORCES, stated here rather than buried in code:",
   "NO PUBLISHED CORRELATION HAS A SOCKET-WELD ROW. The choice is",
   "'threaded' or 'flanged/welded', and for ASME B16.11 fittings the",
   "honest mapping is THREADED -- B16.11 governs socket-welding AND",
   "threaded fittings in one document and gives them the same body",
   "dimensions, Table 1 and Table 5 carrying the same centre-to-bottom-of-",
   "socket A. They are the same forging with a different end preparation,",
   "and both are compact blocks with sharp internal corners. A flanged or",
   "butt-welded elbow has a real radius, which is exactly why its",
   "coefficient is lower.",
   "",
   "If anything this UNDER-states the loss: a socket-weld joint leaves a",
   "small annular step at the socket bottom that a threaded one does not.",
   "No source quantifies it, so it is not modelled -- recorded, not guessed.",
   "",
   "Every basis carries its uncertainty. Published fitting-loss data runs",
   "25-30% in general and 10% at the very best."
  ],

/* @layer netlist
   @core Process Core -- this file moves to `45 - Process Core` in Phase 1.
   May use: nothing. The netlist is the bottom of the stack.
   Never: a colour, a canvas call, a COORDINATE, or any consumer's runtime.
   A netlist says what is connected to what, with bores in inches because a
   half-inch line is half an inch however you draw it. WHERE anything sits
   is a frame's business and HOW it looks is decided above -- which symbol,
   what is hidden, where a line breaks, what colour anything is.
   Enforced by layers.test.js, which fails the build rather than trusting
   anyone to remember. See `00 - Project/Process Core -- Architecture & Build
   Plan.md`.                                                              */
/* ---------------- TOPOLOGY: what connects to what ----------------

   A level declares its pipework ONCE, as components with named ports and
   segments between those ports. Everything downstream - the drawing, the
   water, the bend radii, the tee positions - is derived from that single
   declaration.

   Why this exists
   ---------------
   Level 1 declares the same bay THREE times, in three incompatible forms:

     1. LPE.Line water segments, with elbow arc centres hand-derived
        (cx:E1.x-BEND, cy:E1.y+BEND) and sweep angles written out
     2. LPE.piping() drawing, as absolute pixel pts/tees/reducers
     3. BR_SEGS branch water, with its own hand-derived tee-turn arcs

   Move the riser and three places must be edited into agreement, each with
   its own hand-computed radii and arc centres. Nothing checks that they
   still agree. The level files carry the scars in their own comments:
   "drawing it as one stopped the butt-capped riser leaving bed 3 hanging
   off its end"; "the water narrows only where the fitting narrows it";
   "Water turns into a branch, it does not appear already running sideways."

   Every one of those was a disagreement between representations that a
   single source of truth cannot have.

   Where the model comes from
   --------------------------
   Not invented here. The structure is DEXPI's - "Data Exchange in the
   Process Industry", the open specification for describing a P&ID as data
   (dexpi.org, spec 1.4; vocabulary from ISO 15926). Its core is exactly
   this: a PipingNetworkSegment records SourceItem/SourceNode ->
   TargetItem/TargetNode, so components connect through NAMED PORTS and
   never through coordinates.

   That is the whole fix. A tee is not an {x,y} that must happen to agree
   with a vertex in some other array; it is a component with three ports,
   and a segment attaches TO a port. There are no two numbers left that can
   disagree.

   Borrowed: the topology model and its vocabulary. Not borrowed: the
   Proteus XML serialisation, the ISO 15926 taxonomy, units machinery. This
   is a canvas game, not a plant data exchange.

   What this is NOT
   ----------------
   It carries no symbol geometry. ISA-5.1's symbol set is a separate
   question, still blocked on getting the standard - Emerson's Information
   Center holds 5.2/5.3/5.4/5.5 but not 5.1. Topology first; symbols later;
   the two are independent.                                               */

(function (LPE) {
  'use strict';

  /* ---- the two radius rules -- UNSCALED BY DESIGN, AND SAYING SO -----

     Both came out of Lunar Process Engineer, written at each use site,
     and collecting them here made them look more authoritative than they
     are. Every drawn corner and every curve the water follows derives
     from them, so what backs them matters. Nothing did.

     THE REAL ERROR IS NOT THE NUMBER, IT IS THE FITTING FAMILY.

     BEND claimed "how a real long-radius elbow is made", citing the
     buttwelding convention. But **a half-inch line is not buttwelded.**
     At small bore, real pipework uses socket-welding or threaded
     fittings -- `ASME B16.11` -- and a socket-welding 90 degree elbow is
     a COMPACT FORGED BLOCK, not a sweeping curve. There is no long
     radius at this size to get right or wrong.

     Measured against the standards, both now held and read 2026-10-10:

       B16.11 Table 1, socket-weld 90 el, Class 3000, centre-to-socket
         NPS 3/8   13.5 mm = 0.531 in
         NPS 1/2   15.5 mm = 0.610 in
       B16.9 Table 6.1-1, long radius buttweld elbow, centre-to-end
         NPS 1/2   38 mm = 1.50 in   (flat to NPS 1; scales from 1-1/4)
         -- and the table STARTS at NPS 1/2, so 3/8 has no entry at all

       this code, at level 1's NPS 1/2 main    1.866 in

     So: 3x too large against the fitting actually used, and 24 % too
     large even against the buttweld one it wrongly cited.

     TEE_TURN claims nothing and never could. Its own history says why --
     1.6 is "the value level 1 settled on after the branches looked wrong
     at anything larger", which is an art decision. B16.11 gives the real
     locating dimension for a socket-weld tee (same `A` as the elbow), so
     a sourced replacement now exists.

     ---- AND A CORRECTION TO THE PARAGRAPH THAT USED TO SIT HERE ----

     It said both numbers were wrong and would be fixed once the catalogue
     could supply the real dimension. The catalogue now exists and supplies
     it -- 0.6102 in for the NPS 1/2 socket-weld elbow -- and dropping that
     number in here would be a WORSE error than the one it replaced.

     Because this drawing has no length scale.

       `pxPerInch` is applied to BORES ONLY, to get a drawn radius. Every
       position in a frame's `at` is authored in raw pixels. So:

         branch bore   0.493 in  drawn 20 px wide   => 1 in = 40.5 px
         branch run    TRUNK_X -> POD_X, 492 px     => 12.1 inches

       A 12-inch run to a grow bed is not what level 1 means. The bay is
       metres across. Bore is exaggerated against length by about an order
       of magnitude, which is what a schematic IS -- a P&ID does the same
       thing and nobody calls it an error.

     Put 0.6102 in through `pxPerInch` and you have used the BORE scale to
     place a LENGTH. That is the same category mistake as `3 * r`, only
     now wearing a citation, which makes it harder to spot rather than
     easier. A sourced number in the wrong frame is not an improvement.

     SO THE HONEST SPLIT, and it is the layer rule this file already
     states applied to itself:

       the fitting's IDENTITY and its REAL dimensions are model facts and
       come from the catalogue -- `net.fittingFor()` below returns them;

       the radius this schematic DRAWS a corner at is a render convention
       in a deliberately unscaled picture, and belongs to whoever is
       drawing. It is not a claim about a part and must stop being written
       as though it were.

     The two numbers below are therefore kept, unchanged, and relabelled
     for what they actually are. What changed is that the real dimension is
     now reachable beside them, so a consumer that IS to scale -- a
     to-scale assembly drawing, LoopBench's real bench -- asks the
     catalogue instead of scaling these.

     What was genuinely wrong and IS now fixed: level 1 declared its bores
     as bare literals (`main: 0.622`) retyped out of a standard by hand.
     Bores are declarable as catalogue part ids, so 0.622 arrives from
     `ASME B36.10M` through a loader that checks it, not from a keystroke.

     See `20 - Source Library/Standards/asme-b16.11.md` (the fitting family
     that governs), `asme-b16.9.md` (the one originally cited in error) and
     `asme-b36.10m.md` (where the bores come from). */

  const bendRadius = r => 3 * r;          // schematic corner, unscaled

     LPE sometimes needs the opposite, though. Level 1's reducer is the
     point of the level: it is worth about a third of the flow, and a
     learner has to see it. So fittings are classified rather than dropped,
     and the renderer decides. Franz's requirement (2026-10-08): if
     fittings can be shown, they must also be hideable for clarity.

     The rule that keeps this honest: **class only affects drawing.** A
     hidden reducer still exists -- the line still runs through it, the
     bore still changes, the solver still sees it. Suppressing a symbol is
     never allowed to change the topology. */
  /* ISA-5.5 3.3.13 valve mnemonics, by type. Read from the standard's
     symbol pages; these are its identifiers, not ours. */
  /* ISA-5.5 3.3.2, group "Containers and vessels". The Process subgroup
     gave us VSSL from the start; the Storage subgroup is on the
     standard's pages 18-19 and went unread until 2026-10-09, which is
     why every tank in every rig was a generic vessel.

     A grow bed open to the bay is an ATMOSPHERIC TANK -- the standard's
     own words, "a tank for material stored under atmospheric pressure"
     -- and drawing it as a generic vessel was not wrong so much as
     unspecific. VSSL stays the right answer for a pressurised one: its
     description says so outright, "can also be used as a pressurized
     vessel in either a vertical or horizontal arrangement".       */
  const ISA_VESSEL = {
    vessel:      'VSSL',   // 3.3.2 Process  - vessel or separator
    separator:   'VSSL',
    jacketed:    'JVSL',   // 3.3.2 Process  - with a heating/cooling jacket
    reactor:     'RCTR',   // 3.3.2 Process  - a chemical reactor
    tower:       'DTWR',   // 3.3.2 Process  - packed or trayed distillation
    atmospheric: 'ATNK',   // 3.3.2 Storage  - stored at atmospheric pressure
    bin:         'BINN',   // 3.3.2 Storage  - solids, discharged from the bottom
    'floating-roof': 'FTNK', // 3.3.2 Storage - roof rides the liquid level
    'gas-holder':    'GHDR', // 3.3.2 Storage - roof rides the gas volume
    sphere:      'PVSL',   // 3.3.2 Storage  - pressurised spherical storage
    'weigh-hopper': 'WHPR',// 3.3.2 Storage  - a vessel used for weighing
  };

  const ISA_VALVE = {
    globe: 'VLVE', gate: 'VLVE', ball: 'VLVE', needle: 'VLVE',
    'three-way': 'VLV3',
    butterfly: 'BVLV',
    check: 'CVLV',
    relief: 'RVLV',
  };

  const CLASS = {
    boundary:  'boundary',   // where the diagram stops: source, sink
    fitting:   'fitting',    // pipe connections: tee, reducer, union, elbow
    equipment: 'equipment',  // valves, vessels, pumps -- ISA-5.5's 13 groups
  };

  /* ---- components and their ports -----------------------------------
     A port is a named attachment point. Its position is derived from the
     component's own position and geometry, never declared separately --
     that separation is the bug this module exists to remove.

     `ports` returns {name: {x, y, dir}} where dir is the outward unit
     vector, used to decide which way a segment leaves. */
  const KINDS = {
    source: {
      ports: c => ({ out: { x: c.at[0], y: c.at[1], dir: [1, 0] } }),
      draws: false,
      cls: CLASS.boundary,
    },
    sink: {
      ports: c => ({ in: { x: c.at[0], y: c.at[1], dir: [-1, 0] } }),
      draws: false,
      cls: CLASS.boundary,
    },
    /* A union is a fitting in the run: same bore in and out, drawn as a
       pair of collars. It does not move the line. */
    union: {
      ports: c => ({
        in:  { x: c.at[0], y: c.at[1], dir: [-1, 0] },
        out: { x: c.at[0], y: c.at[1], dir: [1, 0] },
      }),
      draws: 'fitting',
      cls: CLASS.fitting,
    },
    /* A tee: flow continues along the run and some of it leaves on the
       branch. Three ports, and the branch leaves perpendicular to the run.
       `axis` is the run's direction: 'v' for a vertical riser (branch goes
       +x), 'h' for a horizontal header (branch goes +y). */
    tee: {
      ports: c => (c.axis === 'h'
        ? { in:     { x: c.at[0], y: c.at[1], dir: [-1, 0] },
            out:    { x: c.at[0], y: c.at[1], dir: [1, 0] },
            branch: { x: c.at[0], y: c.at[1], dir: [0, 1] } }
        : { in:     { x: c.at[0], y: c.at[1], dir: [0, -1] },
            out:    { x: c.at[0], y: c.at[1], dir: [0, 1] },
            branch: { x: c.at[0], y: c.at[1], dir: [1, 0] } }),
      draws: 'tee',
      cls: CLASS.fitting,
    },

    /* ---- MANIFOLD: one body, several ports -------------------------

       Not two tees that a renderer is told to draw together. A manifold
       is a different object from an assembly of fittings, and the
       difference is physical: a fabricated run has a forged tee at each
       junction, with a socket hub the pipe lands in and a radiused
       crotch where the branch leaves. A manifold machined or printed as
       one body has neither. It has PORTS, and passages bored through it.

       Drawing hubs on a part that was never assembled invents a joint
       that does not exist, so the two cannot share a representation.

       Topology is unchanged either way -- flow branches at the same
       points whatever the thing is made of -- which is exactly why this
       belongs in the netlist rather than being inferred downstream.
       Only whoever specified the rig knows how it was made, and a
       renderer cannot deduce it from coordinates.

       PLACEMENT is a list of points, the same idea as the reducer's
       span taken to its conclusion: INLET first, OUTLET last, branch
       ports in between in declaration order.

           at: { man: [[x,y0], [x,y1], [x,y2], [x,y3]] }
                        inlet    b0       b1      outlet

       Ports are `in`, `out`, and `b0`..`bN`. On a process display it is
       still class `fitting`: ISA-5.5's Connectors group is empty
       because pipe connections are not detailed, and a manifold body is
       no more a schematic symbol than a tee is. It is a PHYSICAL fact,
       and phys-view is where physical facts are drawn. */
    manifold: {
      ports: c => {
        const p = c._pts, n = p.length;
        const vert = p[0][0] === p[n - 1][0];
        const ports = {
          in:  { x: p[0][0],     y: p[0][1],     dir: vert ? [0, -1] : [-1, 0] },
          out: { x: p[n - 1][0], y: p[n - 1][1], dir: vert ? [0, 1]  : [1, 0] },
        };
        for (let i = 1; i < n - 1; i++) {
          ports['b' + (i - 1)] = {
            x: p[i][0], y: p[i][1], dir: vert ? [1, 0] : [0, 1],
          };
        }
        return ports;
      },
      draws: 'manifold',
      cls: CLASS.fitting,
    },
    /* A change of bore: taper in, throat, taper out. Horizontal only,
       which is all any level has needed; a vertical reducer would need
       piping() to learn one too. */
    reducer: {
      /* The only component that occupies a SPAN rather than a point, so
         its frame placement is two points: [[x0,y],[x1,y]]. `_a` and `_b`
         are those, resolved by the frame before ports are read. */
      ports: c => ({
        in:  { x: c._a[0], y: c._a[1], dir: [-1, 0] },
        out: { x: c._b[0], y: c._b[1], dir: [1, 0] },
      }),
      draws: 'reducer',
      cls: CLASS.fitting,
    },
    /* ---- equipment --------------------------------------------------
       The four kinds the levels actually contain: valves (the solver's
       main/b0/b1/b2), vessels (reservoir, pods, the level 4 chamber),
       pumps, and level 3's static mixer. Each maps onto one of ISA-5.5's
       13 symbol groups, which is what schem vis will draw.

       Every ISA-5.5 symbol carries a four-character mnemonic "to be used
       as its reference name in a computer system". Those are the `isa`
       values below, read off the standard's own symbol pages (which are
       images, not text -- pdftotext does not see them). They are the
       standard's identifiers, not ours, which is the point: schem vis
       keys its symbol table on them.                                    */

    /* The thing players operate. Sits IN a run, so a line passes through
       it the way it passes through a union. `key` is the solver's own
       name for it (main, b0, b1, b2) -- the netlist and the solver
       referring to one valve by one name, instead of the netlist not
       knowing valves exist at all. */
    valve: {
      ports: c => (c.valveType === 'three-way'
        ? { in:     { x: c.at[0], y: c.at[1], dir: [-1, 0] },
            out:    { x: c.at[0], y: c.at[1], dir: [1, 0] },
            branch: { x: c.at[0], y: c.at[1], dir: [0, 1] } }
        : { in:  { x: c.at[0], y: c.at[1], dir: [-1, 0] },
            out: { x: c.at[0], y: c.at[1], dir: [1, 0] } }),
      cls: CLASS.equipment,
      inline: true,
      draws: 'equipment',
      /* ISA-5.5 3.3.13. VLVE covers "GLOBE, GATE, BALL, and NEEDLE
         valves used to regulate fluid flow through piping systems", so
         all four of those are one symbol; butterfly, check and relief
         are their own. The symbol also carries STATE in its fill --
         outline for closed, solid for open -- which is a display
         convention a game can use directly. */
      isa: c => ISA_VALVE[c && c.valveType] || 'VLVE',
    },
    /* Reservoirs, grow-bay pods, the level 4 chamber. `role` says whether
       it feeds the net, receives from it, or sits in the middle -- which
       decides its ports, and means a vessel can replace a bare source or
       sink once it has a symbol to draw. */
    vessel: {
      ports: c => (c.role === 'source'
        ? { out: { x: c.at[0], y: c.at[1], dir: [1, 0] } }
        : c.role === 'inline'
          ? { in:  { x: c.at[0], y: c.at[1], dir: [-1, 0] },
              out: { x: c.at[0], y: c.at[1], dir: [1, 0] } }
          : { in: { x: c.at[0], y: c.at[1], dir: [-1, 0] } }),
      cls: CLASS.equipment,
      inline: false,
      draws: 'equipment',
      /* ISA-5.5 3.3.2. `vesselType` picks from the group -- the Process
         subgroup's VSSL/JVSL/RCTR/DTWR and the Storage subgroup's
         ATNK/BINN/FTNK/GHDR/PVSL/WHPR. VSSL stays the default because
         it is the standard's own generic: "a vessel or separator...
         can also be used as a pressurized vessel". */
      isa: c => ISA_VESSEL[c && c.vesselType] || 'VSSL',
    },
    pump: {
      ports: c => ({
        in:  { x: c.at[0], y: c.at[1], dir: [-1, 0] },
        out: { x: c.at[0], y: c.at[1], dir: [1, 0] },
      }),
      cls: CLASS.equipment,
      inline: true,
      draws: 'equipment',
      /* ISA-5.5 3.3.10 Rotating equipment: "that class of equipment used
         to transport slurries or liquids by internal rotary action".
         BLWR, CMPR and TURB are the others in the group; RECP in 3.3.9 is
         the reciprocating kind. */
      isa: () => 'PUMP',
    },
    /* Level 3's static mixer. ISA-5.5 calls this an Inline Mixer; an
       Agitator is the other symbol in the same group and is a different
       thing (it stirs a vessel, it does not sit in a line). */
    mixer: {
      ports: c => ({
        in:  { x: c.at[0], y: c.at[1], dir: [-1, 0] },
        out: { x: c.at[0], y: c.at[1], dir: [1, 0] },
      }),
      cls: CLASS.equipment,
      inline: true,
      draws: 'equipment',
      /* ISA-5.5 3.3.8 Mixing. IMIX, "a mixing device used to continuously
         blend materials" -- not AGIT, which is a blade/propeller/paddle
         agitator that stirs a vessel rather than sitting in a line. */
      isa: () => 'IMIX',
    },

    /* A corner with nothing in it. Usually implicit - a segment's own
       waypoints become elbows - but declarable when something needs to
       attach to the corner itself. */
    elbow: {
      ports: c => ({
        in:  { x: c.at[0], y: c.at[1], dir: [-1, 0] },
        out: { x: c.at[0], y: c.at[1], dir: [1, 0] },
      }),
      draws: false,
      cls: CLASS.fitting,
    },
  };

  /* =================================================================== */

  /* ---- frames and registration ---------------------------------------
     A netlist is a graph, not a drawing. The same bay has to come out as a
     1990s cutaway, as an ISA-5.5 process display and, later, as a modern
     render -- so WHERE each component sits cannot live on the component.
     It lives in a named frame, and `LPE.net(spec, {frame})` resolves one in.

     A frame carries three things:

       pxPerInch   how big an inch is here. Bores are declared in INCHES
       round       decimal places to quantise a scaled bore to (optional)
       at          {componentId: [x,y]}, or [[x0,y],[x1,y]] for a reducer
       via         {segmentId: [[x,y],...]} waypoints, keyed by the same
                   "from.port->to.port" id the segments already carry
       runPxPerInch  OPTIONAL, and purely declarative -- see below

     ---- AND A FRAME MAY NOW SAY WHAT ITS LENGTHS MEAN ----

     `pxPerInch` scales BORES. Positions in `at` are raw pixels and always
     have been, so a frame has no length scale and the bore is exaggerated
     against the run by whatever the author's pixels happened to imply.
     That is what a schematic IS and it is not an error.

     What IS an error is being unable to say by how much. A reader looking
     at a drawn bore beside a drawn run has no way to know whether the
     proportion is real, and neither does the drawing.

     `runPxPerInch` fixes that without moving anything. It declares how
     many pixels of `at` make one inch of RUN. Nothing reads it to place a
     component -- positions stay exactly where they were authored -- and
     omitting it leaves a frame behaving as it always did. What it buys is
     that `net.exaggeration` can then state the factor, and a view can
     print "bore x8 against length" instead of leaving a reader to guess.

     Declared rather than derived, because only the author of a frame
     knows what their pixels were supposed to mean.

     Transposing a new physical structure over an existing netlist is then
     exactly one thing: another frame. That is the whole of registration.  */

  const DEFAULT_FRAME = { pxPerInch: 1, at: {}, via: {} };

  /* How far the bore is stretched against the run, when the frame has said
     enough to work it out. Null when it has not -- never a guess, because
     a made-up exaggeration factor is worse than an unstated one: the first
     is believed. */
  function exaggerationOf(frame) {
    const run = frame.runPxPerInch;
    if (typeof run !== 'number' || !(run > 0)) return null;

    /* FROM WHAT IS DRAWN, NOT FROM WHAT IS DECLARED, and the two are not
       the same thing. `scaleBore` multiplies the bore -- a DIAMETER, in
       inches -- by pxPerInch, and the result is carried as `r` and used
       as a RADIUS: phys-view draws the run at `lineWidth = 2 * r`. So a
       6.065 in bore at pxPerInch 1.6 comes out 19.5 px across, not 9.7,
       and the effective bore scale is twice pxPerInch.
       
       Reported as drawn, because the number this exists to print is what
       a reader is looking at. Left as pxPerInch it would understate the
       exaggeration by exactly half, on a page whose entire purpose is
       stating it correctly. */
    const declared = frame.pxPerInch === undefined ? 1 : frame.pxPerInch;
    const drawn = declared * 2;
    return Object.freeze({
      factor: drawn / run,
      borePxPerInch: drawn,
      declaredPxPerInch: declared,
      runPxPerInch: run,
      note: 'Bore is drawn ' + (drawn / run).toFixed(1) + ' times larger '
          + 'against length than it is. Positions are unchanged; this is '
          + 'what the frame declares its own pixels to mean. The bore '
          + 'scale is twice `pxPerInch` because the scaled bore is '
          + 'carried as a radius.',
    });
  }

  function scaleBore(inches, frame) {
    const px = inches * (frame.pxPerInch === undefined ? 1 : frame.pxPerInch);
    if (frame.round === undefined) return px;
    const m = Math.pow(10, frame.round);
    return Math.round(px * m) / m;
  }

  function segId(s) {
    return s.from + '->' + s.to;
  }

  function Net(spec, opts) {
    const o = opts || {};
    const frames = spec.frames || {};
    const names = Object.keys(frames);
    /* One frame and no argument means that one. More than one and the
       caller has to say, because silently picking would be the same class
       of accident this layer exists to end. */
    const frameName = o.frame || (names.length === 1 ? names[0] : 'rig');
    const frame = Object.assign({}, DEFAULT_FRAME, frames[frameName] || {});
    const comps = {};
    const errors = [];

    if (names.length && !frames[frameName]) {
      errors.push(`no frame "${frameName}"; this netlist declares ` +
                  names.map(n => `"${n}"`).join(', '));
    }

    /* --- bores, declared in inches, drawn in this frame's units

       A bore may be declared two ways:

         main: 0.622                  a bare number of inches
         main: 'PIPE/NPS0.5/S40'      a CATALOGUE PART ID

       The second is the one to use. A bare number is a dimension somebody
       retyped: 0.622 is right, and it is right because `ASME B36.10M` says
       so, but nothing in the netlist knows that and nothing would notice if
       a digit moved. A part id makes the catalogue answer, and the
       catalogue refuses to load at all unless every dimension in it agrees
       with what it says the standard printed.

       Bare numbers still work. Level 1's `throat: 0.108` is derived from a
       Cv the restriction has to have, not read out of a table, so there is
       no part to name -- and inventing a catalogue entry for it would be
       exactly the dishonesty the catalogue exists to prevent. */
    const cat = o.catalogue || null;
    const bores = {};
    const boreParts = {};
    for (const b of Object.keys(spec.bores || {})) {
      const decl = spec.bores[b];
      let inches = decl;
      if (typeof decl === 'string') {
        if (!cat) {
          errors.push(`bore "${b}" names the catalogue part "${decl}", but ` +
            `no catalogue was passed. Call LPE.net(spec, {catalogue}) with ` +
            `a loaded catalogue, or declare the bore as a number of inches ` +
            `and accept that nothing will check it.`);
          continue;
        }
        if (!cat.has(decl)) {
          errors.push(`bore "${b}": no catalogue part "${decl}"`);
          continue;
        }
        const part = cat.part(decl);
        if (typeof part.dims.bore !== 'number') {
          errors.push(`bore "${b}": catalogue part "${decl}" has no bore ` +
            `dimension, so it cannot size a run. Its dimensions are: ` +
            Object.keys(part.dims).join(', '));
          continue;
        }
        inches = part.dims.bore;
        boreParts[b] = part;
      }
      if (typeof inches !== 'number' || !isFinite(inches) || inches <= 0) {
        errors.push(`bore "${b}" is ${JSON.stringify(decl)}; expected a ` +
          `positive number of inches or a catalogue part id`);
        continue;
      }
      bores[b] = scaleBore(inches, frame);
    }

    // --- components
    for (const id of Object.keys(spec.components || {})) {
      const c = Object.assign({ id }, spec.components[id]);
      const kind = KINDS[c.kind];
      if (!kind) { errors.push(`${id}: unknown kind "${c.kind}"`); continue; }
      c._kind = kind;
      c._cls = kind.cls;
      // A component may opt out of being drawn without leaving the net.
      c._visible = c.show !== false;

      /* Placement comes from the frame and only from the frame. */
      const place = frame.at[id];
      if (place === undefined) {
        errors.push(`${id} has no placement in frame "${frameName}"`);
        continue;
      }
      if (c.kind === 'manifold') {
        /* A list, not a point: inlet, branches, outlet. Refused by name
           when it is short or crooked, because a manifold placed wrong
           draws a body across geometry that is not its own. */
        if (!Array.isArray(place[0])) {
          errors.push(`${id} is a manifold, so frame "${frameName}" must ` +
                      `place it as a LIST of points -- inlet first, outlet ` +
                      `last, one per branch in between`);
          continue;
        }
        if (place.length < 3) {
          errors.push(`${id} is a manifold with ${place.length} point(s) in ` +
                      `frame "${frameName}". It needs at least three: an ` +
                      `inlet, one branch and an outlet. With no branch it ` +
                      `is a length of pipe, not a manifold`);
          continue;
        }
        const sameX = place.every(p => p[0] === place[0][0]);
        const sameY = place.every(p => p[1] === place[0][1]);
        if (!sameX && !sameY) {
          errors.push(`${id} is a manifold whose ports in frame ` +
                      `"${frameName}" are not in line. A manifold body is ` +
                      `one run of material: every port sits on one axis`);
          continue;
        }
        c._pts = place;
        c.at = place[0];           // its nominal point, for anything that asks
        c._axis = sameX ? 'v' : 'h';
      } else if (c.kind === 'reducer') {
        if (!Array.isArray(place[0]) || !Array.isArray(place[1])) {
          errors.push(`${id} is a reducer, so frame "${frameName}" must ` +
                      `place it as two points [[x0,y],[x1,y]] -- it spans a ` +
                      `distance rather than sitting at one`);
          continue;
        }
        c._a = place[0]; c._b = place[1];
        c.at = place[0];        // its nominal point, for anything that asks
        c.x1 = place[1][0];
        c.throatIn = c.throat;
        c.throat = scaleBore(c.throat, frame);
      } else {
        if (Array.isArray(place[0])) {
          errors.push(`${id} is placed as two points but only a reducer ` +
                      `spans a distance`);
          continue;
        }
        c.at = place;
      }

      c._ports = kind.ports(c);
      comps[id] = c;
    }

    // --- segments, resolved against ports
    const segs = (spec.segments || []).map((s, i) => {
      const seg = Object.assign({ index: i }, s);
      seg.from = resolvePort(comps, s.from, errors, `segment ${i} from`);
      seg.to   = resolvePort(comps, s.to,   errors, `segment ${i} to`);
      seg.r    = bores[s.bore];
      if (seg.r === undefined) errors.push(`segment ${i}: unknown bore "${s.bore}"`);
      /* Waypoints are coordinates, so they come from the frame too, keyed
         by the segment's own "from->to" id rather than its array index --
         an index shifts the moment somebody inserts a segment above it. */
      seg.sid  = segId(s);
      const via = frame.via[seg.sid] || [];
      seg.pts  = seg.from && seg.to
        ? [[seg.from.x, seg.from.y]]
            .concat(via)
            .concat([[seg.to.x, seg.to.y]])
        : [];
      return seg;
    });

    const net = {
      spec, components: comps, segments: segs, bores,
      frame: frameName, frames: names,

      /* ---- the REAL fitting, for consumers that are actually to scale ----

         `bendRadius` above is a render convention in an unscaled
         schematic. This is the other half: the actual part, from the
         catalogue, with the dimensions a document prints.

         A to-scale assembly drawing asks this. LoopBench, which has real
         pipe on a real bench, asks this. Level 1's schematic does not, and
         should not -- scaling a 0.6102 in elbow by a bore-to-radius factor
         would be a category error dressed as precision.

         It answers for a BORE NAME, because that is what the netlist
         knows. `fittingFor('main', 'elbow90')` ->  the socket-weld elbow
         for whatever pipe the main is. Null when the bore was declared as
         a bare number, because then there is no part to look up and
         guessing one would invent exactly what the catalogue prevents. */
      fittingFor: (boreName, what) => {
        if (!cat) return null;
        const pipe = boreParts[boreName];
        if (!pipe) return null;         // bare number: no part, no answer
        const nps = pipe.nps;
        const want = { elbow90: 'elbow-socketweld', tee: 'tee-socketweld' };
        const cls = want[what];
        if (!cls)
          throw new Error(`fittingFor: do not know what a "${what}" is. ` +
            `Known: ${Object.keys(want).join(', ')}. Add it to the ` +
            `catalogue first -- this function maps a bore to a part that ` +
            `exists, it does not conjure part classes.`);
        const hits = cat.where({ class: cls, nps: nps });
        return hits.length ? hits[0] : null;
      },

      /* Which catalogue part a bore came from, or null if it was a bare
         number. A drawing that wants to state its own provenance asks
         this and gets something it can cite. */
      pipeFor: boreName => boreParts[boreName] || null,
      catalogue: cat,
      errors: errors.concat(validate(comps, segs, spec, frameName)),
      /* `opts.hide` is a list of display classes to suppress, e.g.
         {hide:['fitting']} for an ISA-5.5-style process display. It
         changes which symbols are emitted and nothing else -- the lines,
         the bores and the water are identical either way. */
      toPiping: (opts) => toPiping(comps, segs, opts || {}),
      toWater: () => toWater(comps, segs),

      /* Identity, which is the point of a tag: a scenario names HV-1 and
         gets the same valve in every frame and every consumer. */
      byTag: tag => comps[Object.keys(comps)
        .filter(id => comps[id].tag === tag)[0]],
      byKey: key => comps[Object.keys(comps)
        .filter(id => comps[id].key === key)[0]],

      /* What this frame stretched, if it said. Null when the frame has
         not declared a run scale, which is most of them. */
      exaggeration: exaggerationOf(frame),

      /* The same graph, placed somewhere else. This is registration in
         one call -- and the proof that nothing above the netlist has
         quietly baked in one view's coordinates. */

    };

  }

  function resolvePort(comps, ref, errors, where) {
    if (typeof ref !== 'string' || ref.indexOf('.') < 0) {
      errors.push(`${where}: expected "component.port", got ${JSON.stringify(ref)}`);
      return null;
    }
    const dot = ref.indexOf('.');
    const id = ref.slice(0, dot), port = ref.slice(dot + 1);
    const c = comps[id];
    if (!c) { errors.push(`${where}: no component "${id}"`); return null; }
    const p = c._ports[port];
    if (!p) {
      errors.push(`${where}: "${id}" (${c.kind}) has no port "${port}" ` +
                  `-- it has ${Object.keys(c._ports).join(', ')}`);
      return null;
    }
    return { id, port, x: p.x, y: p.y, dir: p.dir, comp: c };
  }

  /* ---- validation ---------------------------------------------------
     The checks a hand-written level could not make, because it had no
     idea what was connected to what. */
  /* An ISA tag: letters, a dash, a number. Grounded in the vault's own
     Source Library rather than invented here -- the Pulp & Paper
     Sourcebook's P&IDs (drawings C0748 and E0894) tag handvalves HV-1..20
     and control valves FV-, PV-, TV-, LV- with plain sequential numbers.
     The core validates the SHAPE and never mints a tag: which letters a
     given valve deserves is a question about the real plant, and the
     netlist's author is the one who knows. */
  const TAG = /^[A-Z]{1,4}-[0-9]+$/;

  function validate(comps, segs, spec, frameName) {
    const errs = [];
    const used = {};

    /* ---- no coordinates in the spec --------------------------------
       The whole of Phase 2. A coordinate on a component is that component
       asserting it can only ever be drawn one way, which is exactly how
       level 1's schematic came to line up with its cutaway by coincidence
       rather than by construction. */
    for (const id of Object.keys((spec && spec.components) || {})) {
      const raw = spec.components[id];
      for (const bad of ['at', 'x1', 'xy', 'pos']) {
        if (raw[bad] !== undefined) {
          errs.push(`${id} declares "${bad}": coordinates belong to a ` +
                    `frame, not to a component. Move it to ` +
                    `frames.${frameName}.at.${id}`);
        }
      }
    }
    for (const s of ((spec && spec.segments) || [])) {
      if (s.via !== undefined) {
        errs.push(`segment ${s.from}->${s.to} declares "via": waypoints ` +
                  `are coordinates and belong to frames.${frameName}.via` +
                  `["${s.from}->${s.to}"]`);
      }
    }

    /* ---- equipment carries a tag -----------------------------------
       Fittings do not: a tee or a union is part of the line and is not
       tagged on a real P&ID, so requiring one would be inventing a
       convention. Equipment is what a scenario will need to name. */
    const tags = {};
    for (const id of Object.keys(comps)) {
      const c = comps[id];
      if (c._cls === CLASS.equipment) {
        if (!c.tag) {
          errs.push(`${id} is equipment and has no tag. A scenario has to ` +
                    `be able to name it, and a map key is this netlist's ` +
                    `private handle, not a durable identity`);
        } else if (!TAG.test(c.tag)) {
          errs.push(`${id}: tag "${c.tag}" is not letters-dash-number ` +
                    `(HV-1, FV-101, TK-2)`);
        }
      }
      if (c.tag) {
        if (tags[c.tag]) {
          errs.push(`${id} and ${tags[c.tag]} share the tag "${c.tag}"`);
        }

      }
    }

      if (!s.from || !s.to) continue;

      const a = s.from.id + '.' + s.from.port;
      const b = s.to.id + '.' + s.to.port;
      if (used[a]) errs.push(`port ${a} is connected twice`);
      if (used[b]) errs.push(`port ${b} is connected twice`);
      used[a] = used[b] = true;

      // Every leg must be orthogonal: the drawing, the elbow fillets and
      // the water arcs all assume it, and a diagonal would silently come
      // out as a mitred corner.
      for (let i = 1; i < s.pts.length; i++) {
        const [x0, y0] = s.pts[i - 1], [x1, y1] = s.pts[i];
        if (x0 !== x1 && y0 !== y1) {
          errs.push(`segment ${s.index}: leg ${i} is diagonal ` +
                    `(${x0},${y0})->(${x1},${y1})`);
        }
      }

         where a component is built to take one.

         A tee was already exempt: a reducing tee is a stock fitting and
         the branch outlet is commonly smaller than the run.

         A MANIFOLD is exempt for a stronger reason. Feeding branches
         narrower than the run is the whole purpose of the thing, and
         there is no joint at the port to put a reducer in -- the bore
         changes inside one piece of material. Demanding a fitting there
         would be demanding a joint the part was specified to avoid.

         This rule was written when every junction was fabricated, which
         is why it needed widening rather than overriding: the principle
         is sound, its list of exceptions was just incomplete. */
      const TAKES_BORE_CHANGE = { tee: true, manifold: true, reducer: true };
      if (!TAKES_BORE_CHANGE[s.from.comp.kind] &&
          !TAKES_BORE_CHANGE[s.to.comp.kind]) {
        const other = segs.filter(o => o !== s && o.from && o.to &&
          (o.from.id === s.to.id || o.to.id === s.from.id));
        for (const o of other) {
          if (o.r !== s.r) {
            errs.push(`segments ${s.index} and ${o.index} meet at a bore ` +
                      `change (${s.r} vs ${o.r}) with no reducer between them`);
          }
        }
      }
    }

    // One solver key, one valve. Two valves sharing a key would both move
    // when the player turned one of them, and nothing else would notice.
    const keys = {};
    for (const id of Object.keys(comps)) {
      const k = comps[id].key;
      if (!k) continue;
      if (keys[k]) errs.push(`${id} and ${keys[k]} both claim solver key "${k}"`);
      keys[k] = id;
    }

    // Everything must be reachable from a source, or it is drawn but dead.
    const sources = Object.keys(comps).filter(id =>
      comps[id].kind === 'source' ||
      (comps[id].kind === 'vessel' && comps[id].role === 'source'));
    if (sources.length) {
      const seen = {};
      const walk = id => {
        if (seen[id]) return;
        seen[id] = true;
        for (const s of segs) {
          if (!s.from || !s.to) continue;
          if (s.from.id === id) walk(s.to.id);
          if (s.to.id === id) walk(s.from.id);
        }
      };
      sources.forEach(walk);
      for (const id of Object.keys(comps)) {
        if (!seen[id]) errs.push(`${id} is not reachable from any source`);
      }
    }

    return errs;

        out.equipment.push({
          id, kind: c.kind, x: c.at[0], y: c.at[1],
          r: boreAt(live, id, 'in') || boreAt(live, id, 'out'),
          type: c.valveType || c.role || null,
          key: c.key || null,      // the solver's own name, where there is one
          tag: c.tag || null,      // and its durable one, which a board captions with
          isa: typeof c._kind.isa === 'function' ? c._kind.isa(c) : null,
        });
      } else if (c._kind.draws === 'fitting') {
        out.fittings.push({
          x: c.at[0], y: c.at[1],
          r: boreAt(live, id, 'in') || boreAt(live, id, 'out'),
          kind: c.fitting || 'union',
        });
      }
    }

    /* ---- what was left undrawn, and where its ports were -------------
       The lines above are unchanged by hiding, by design: a hidden
       reducer still exists and still changes the bore, so topology must
       not pretend otherwise. But a reducer's in and out ports are 80 px
       apart, and a display that draws no fitting there is left with a
       hole in a connection that is actually continuous.

       Resolving that is the display's call, not topology's -- so this
       reports the facts and stops. Each entry is a component that WOULD
       have been drawn and was not, with the port positions a line
       reaches it at. A display that draws no fittings joins across
       them; one that draws them ignores this list entirely. */
    out.undrawn = [];
    for (const id of Object.keys(comps)) {
      const c = comps[id];
      if (c._visible === false || !c._kind.draws || drawn(c)) continue;
      const ports = c._kind.ports(c);
      const used = Object.keys(ports)
        .filter(n => live.some(s => (s.to && s.to.id === id && s.to.port === n) ||
                                    (s.from && s.from.id === id && s.from.port === n)))
        .map(n => [ports[n].x, ports[n].y]);
      if (used.length >= 2) out.undrawn.push({ id, kind: c.kind, pts: used });
    }
    return out;
  }

  function boreAt(segs, id, port) {
    const s = segs.find(o => (o.to && o.to.id === id && o.to.port === port) ||
                             (o.from && o.from.id === id && o.from.port === port));
    return s ? s.r : undefined;
  }

  /* Keep only the corners. A chain through a union or a tee leaves a
     vertex sitting on a straight leg, and piping() fillets EVERY interior
     vertex with arcTo -- so a collinear one is at best wasted work and at
     worst a rounding artefact on a line that should be dead straight.
     The hand-written level 1 run had exactly the corners and nothing
     else; this is how that falls out of the graph instead of being
     maintained by hand. */
  function simplify(pts) {
    const p = dedupe(pts);
    if (p.length < 3) return p;
    const out = [p[0]];
    for (let i = 1; i < p.length - 1; i++) {
      const [ax, ay] = p[i - 1], [bx, by] = p[i], [cx, cy] = p[i + 1];
      const collinear = (ax === bx && bx === cx) || (ay === by && by === cy);
      if (!collinear) out.push(p[i]);

    const out = [];
    for (const p of pts) {
      const last = out[out.length - 1];
      if (!last || last[0] !== p[0] || last[1] !== p[1]) out.push(p);
    }
    return out;

  /* ---- water ---------------------------------------------------------
     LPE.Line wants straight runs and arcs, and it must be SPLIT AT EVERY
     TEE, because "flow is constant BETWEEN tees and changes AT them, and
     each piece owns its particles so none can strand at a velocity
     boundary" (level 1's own rule). A netlist knows where the tees are;
     a hand-written coordinate list does not.

     Corners become arcs on the same radius the drawing fillets them with,
     so the water goes round the elbow the pipe actually has instead of
     cutting the corner. */
  function toWater(comps, segs) {
    const live = segs.filter(s => s.from && s.to);

    /* Where does the run ARRIVE from, at this tee?

       Needed because a branch turns at the tee, and that turn is the one
       corner in the whole model that does not sit inside a segment: the
       riser is one segment, the branch is another, and the bend belongs
       to neither. The loop below only fillets corners it finds in a
       single `pts` list, so without this a branch came back dead straight
       and the water cut the corner the drawing had curved -- running
       outside its own pipe, which is the bug the levels call "nothing
       curved anywhere".

       The incoming direction is taken from the segment that FEEDS the
       tee, not from the tee's declared axis: the axis says the run is
       vertical, it does not say the water is coming down it. */
    const feedOf = teeId => {
      const feed = live.find(o => o.to.id === teeId && o.to.port === 'in');
      if (!feed) return null;
      const fp = dedupe(feed.pts);
      return fp.length >= 2 ? fp[fp.length - 2] : null;
    };

    return live.map(s => {
      /* A manifold's branch ports are b0..bN; a tee's is `branch`.
         Both are a branch leaving a run, and both turn tightly. */
      const isBranch = s.from.port === 'branch' || /^b\d+$/.test(s.from.port);
      const R = isBranch
        ? teeTurnRadius(s.r)      // leaving a run sideways is a tight turn
        : bendRadius(s.r);        // a run corner is a long-radius elbow
      const pts = dedupe(s.pts);
      const out = [];

      /* A fillet carrying the water off the run and into the branch. It
         starts one radius back up the run, so the arc is geometrically
         part of the riser -- which is correct: the metal curves there
         too, and the branch's own first leg begins where the bend ends. */
      let turnsAtStart = false;
      if (isBranch && pts.length >= 2) {
        const from = feedOf(s.from.id);
        const corner = pts[0], next = pts[1];
        if (from) {
          const inHoriz = from[1] === corner[1];
          const outHoriz = corner[1] === next[1];

            const back = inHoriz
              ? [corner[0] - Math.sign(corner[0] - from[0]) * R, corner[1]]
              : [corner[0], corner[1] - Math.sign(corner[1] - from[1]) * R];
            out.push({ arc: cornerArc(back[0], back[1], corner[0], corner[1],
                                      next[0], next[1], R), r: s.r });
            turnsAtStart = true;
          }
        }

      for (let i = 1; i < pts.length; i++) {
        const [x0, y0] = pts[i - 1], [x1, y1] = pts[i];
        const isLast = i === pts.length - 1;
        const horiz = y0 === y1;

        // Shorten this leg where it runs into a corner, and emit the arc.
        let ax = x0, ay = y0, bx = x1, by = y1;
        if (i > 1 || turnsAtStart) {
          if (horiz) ax += Math.sign(x1 - x0) * R;
          else       ay += Math.sign(y1 - y0) * R;
        }
        if (!isLast) { if (horiz) bx -= Math.sign(x1 - x0) * R;
                       else       by -= Math.sign(y1 - y0) * R; }

        if (horiz ? Math.abs(bx - ax) > 0.01 : Math.abs(by - ay) > 0.01) {
          out.push({ ax, ay, bx, by, r: s.r });
        }
        if (!isLast) {
          const [x2, y2] = pts[i + 1];
          out.push({ arc: cornerArc(bx, by, x1, y1, x2, y2, R), r: s.r });
        }
      }
      return { id: `${s.from.id}.${s.from.port}->${s.to.id}.${s.to.port}`,
               r: s.r, segments: out };

     corner at (cx,cy) and onto the leg heading toward (nx,ny). Centre is
     one radius back along the incoming leg and one radius along the
     outgoing one, which is what makes the inner and outer walls come out
     concentric the way a real elbow's do. */

    const outDx = Math.sign(nx - cx), outDy = Math.sign(ny - cy);
    const ccx = inHoriz ? bx : cx + outDx * R;

       radius along it from the corner. Stated once, for both
       orientations, rather than branched.

       The branched version was wrong for a vertical-in corner: it set the
       end's y to the centre's own y, so both deltas came out zero and
       atan2(0,0) returned 0 instead of a quarter turn. It happened to be
       right for horizontal-in, where that same expression lands on the
       correct answer by coincidence -- which is why it survived. Nothing
       exercised the other case until a branch leaving a tee needed
       filleting, because that is the only corner in the model whose
       incoming leg is vertical. */
    const a1 = Math.atan2((cy + outDy * R) - ccy, (cx + outDx * R) - ccx);
