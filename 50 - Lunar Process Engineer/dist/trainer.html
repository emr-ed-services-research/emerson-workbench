  q('.t1').textContent=o.t1||''; q('.t2').textContent=o.t2||'';
  const cv=q('canvas.rig');

  /* Scale once, here. Nothing in a level touches the transform. Smoothing
     stays OFF so the hand-authored background - wall panels, rivets, the
     Bayer vignette, all built at 1x - lands as clean blocks rather than
     being interpolated into mush. Text and pipework, drawn straight into
     the scaled context, get the full resolution. */
  const _ctx=cv.getContext('2d');
  _ctx.setTransform(RES,0,0,RES,0,0);
  _ctx.imageSmoothingEnabled=false;

  const S={
    canvas:cv, ctx:_ctx, w:o.w||900, h:o.h||400, res:RES,
    say(task,lesson){ q('.task').innerHTML=task||''; q('.lesson').innerHTML=lesson||''; },
    count(t){ q('.count').textContent=t||''; },
    /* A level with more than one scene needs the bar to follow it. */
    title(t1,t2){ q('.t1').textContent=t1||''; if(t2!==undefined) q('.t2').textContent=t2; },
    /* A beat holds what just happened on screen until the player says go.
       Levels used to flash the lesson and replace it on a 1.5s timer, which
       is nowhere near long enough to read a paragraph - and the length of
       the wait is a property of the TEMPLATE, not something each level
       should be inventing a number for. Returns true while it is holding,
       so a level's step check can stand down rather than racing it. */
    /* `until` is for a lesson that has to DEMONSTRATE something before the
       player can sensibly move on. The velocity race needs a few seconds
       for the two tracers to separate; a click in the first instant skipped
       the entire point of the beat with nothing having happened yet. While
       the predicate is unmet the control reads WATCH and does not accept a
       click - not forced waiting so much as the lesson still presenting. */
    /* Returns true if the beat took. It refuses while another is already
       on screen, and a caller that advances its own step counter has to
       know that, or the refused lesson vanishes without a trace - which
       is exactly how level 4 lost the beat that explained cavitation. */
    beat(lesson,then,until){
      if(S._holding) return false;
      S._holding=true;
      const hint=()=>'<span class="beat-hint'+(until&&!until()?' waiting':'')+'">'+
        (until&&!until()?'watch':'continue &rarr;')+'</span>';
      q('.task').innerHTML=hint();
      q('.lesson').innerHTML=lesson||'';
      const openedAt=performance.now();
      /* Polled from the frame loop, not a timer. What the predicate is
         waiting on is something happening in the SIMULATION, and the
         simulation only advances when a frame runs - so a wall-clock timer
         both fires when nothing has moved and, in a background tab where
         timers are throttled to a second or more, fails to fire when it
         has. Tying it to pump() makes the two agree by construction. */
      S._holdUntil = until ? ()=>{
        if(!until()) return;
        S._holdUntil=null;
        q('.task').innerHTML=hint();
      } : null;
      const go=e=>{
        if(until && !until()) return;            // nothing to continue from yet
        if(e.type==='keydown' && e.key!=='Enter' && e.key!==' ') return;
        if(e.type==='click'){
          /* Only the control advances. This used to listen on the whole
             shell, so any click anywhere - opening a valve, picking a
             spare, missing a drag - ate the lesson you had not read yet.
             The hint has looked like a button the whole time; now it is
             the only thing that behaves like one. ENTER and SPACE still
             work, for anyone who would rather not go back to the mouse. */
          if(!(e.target.closest && e.target.closest('.beat-hint'))) return;
          /* And the click that finishes the drag which OPENED this lesson
             is not the player asking to move on either. */
          if(lastDownAt<openedAt) return;
        }
        e.preventDefault();
        drop();
        S._holding=false; if(then) then();
      };
      function drop(){ window.removeEventListener('keydown',go);
                       root.removeEventListener('click',go); S._holdDrop=null;
                       S._holdUntil=null; }
      S._holdDrop=drop;
      window.addEventListener('keydown',go);
      root.addEventListener('click',go);
      return true;
    },
    get holding(){ return !!S._holding; },
    get done(){ return !!S._done; },
    /* A fork the player is asked to make out loud, in the coach's voice.
       Same hold as `beat` - the rig keeps running underneath, nothing
       advances until they answer - but with named options instead of a
       continue. The choice itself is the teaching: which one they pick is
       allowed to be wrong, and the coach is allowed to say so. */
    ask(o2){
      if(S._holding) return;
      S._holding=true;
      q('.task').innerHTML='<span class="beat-hint">your call &rarr;</span>';
      q('.lesson').innerHTML=(o2.lesson||'')+'<div class="choice"></div>';
      const box=q('.choice');
      o2.options.forEach(opt=>{
        const b=document.createElement('button');
        b.innerHTML=opt.label+(opt.note?'  <span class="no">'+opt.note+'</span>':'');
        /* stopPropagation matters: the option sits INSIDE the level root, and
           whatever `pick` opens next - almost always a beat - binds its own
           dismiss handler on that same root. Let this click carry on
           bubbling and it dismisses the reply before the player can read a
           word of it. The coach's answer came back blank every time. */
        b.onclick=ev=>{ ev.stopPropagation();
          box.querySelectorAll('button').forEach(x=>x.disabled=true);
          S._holding=false; audio.clack&&audio.clack(); opt.pick(); };
        box.appendChild(b);
      });
      const first=box.querySelector('button');
      if(first) setTimeout(()=>first.focus(),60);
    },
    /* The end of an assignment. Both levels used to just stop - set the
       counter to DONE and sit there - so the only way out of a finished
       level was reloading the page and walking the boot sequence again.
       There was no route from level zero to level one either; this was
       never a gap that appeared when a third level turned up.
       Where you go next is a property of the TEMPLATE. A level says it is
       over and what the coach signs off with; it does not decide what
       follows it, and it does not know a menu exists. */
    finish(f){
      if(S._done) return; S._done=true;
      f=f||{};
      S.say('', f.lesson||'');
      S.count('DONE');
      const nx=LPE_NAV.levels[LPE_NAV.idx+1],
            nxRun=nx&&(nx.start||nx.play),
            back=LPE_NAV.opt;
      const d=document.createElement('div'); d.className='beat';
      d.innerHTML='<div class="tech-eyebrow">ASSIGNMENT COMPLETE</div>'+
        '<div class="tech-title">'+(o.t1||'')+'</div>'+
        (f.line?'<div class="immersion">'+f.line+'</div>':'')+
        '<div class="dmenu"></div>';
      const dm=d.querySelector('.dmenu');
      const add=(html,fn)=>{ const b=document.createElement('button');
        b.innerHTML=html; b.onclick=fn; dm.appendChild(b); return b; };
      const leave=go=>()=>{ cleanup(); d.remove(); S.destroy(); go(); };
      if(nxRun) add('NEXT ASSIGNMENT  <span class="no">'+nx.label+'</span>',
                    leave(()=>launch(back,LPE_NAV.idx+1)));
      if(back) add('SELECT ASSIGNMENT', leave(()=>_select(back)));
      /* Players poke at a rig they have just solved, and taking it away the
         instant the last step passes is the wrong reward. The card steps
         aside; the level is still underneath it, still running. */
      add('STAY ON THE RIG', ()=>{ cleanup(); d.remove();
        /* Say so. The rig unlocking is a real change of state and the
           player has no other way to find out it happened. */
        q('.task').innerHTML='<span class="free">The rig is yours &mdash; '+
          'every valve is unlocked.</span>'; });
      function key(e){ if(e.key==='Escape'){ cleanup(); d.remove(); } }
      function cleanup(){ window.removeEventListener('keydown',key); }
      window.addEventListener('keydown',key);
      document.body.appendChild(d);
      d.classList.add('show');   // synchronous: a backgrounded tab runs no rAF
      const first=dm.querySelector('button');
      if(first) setTimeout(()=>first.focus(),60);
    },
    pt(e){ const r=cv.getBoundingClientRect();
      return {x:(e.clientX-r.left)*(S.w/r.width), y:(e.clientY-r.top)*(S.h/r.height)}; },
  };

  q('[data-a="sound"]').onclick=e=>{ e.target.textContent='SOUND: '+(audio.toggle()?'ON':'OFF'); };
  /* Reset puts the assignment back to un-finished, and cancels whatever the
     strip was waiting on. Without the cancel, resetting mid-lesson left
     `_holding` stuck true - so the level could never speak again - and left
     the old handler bound, so a later click would fire a step transition
     belonging to a run that no longer exists. */
  q('[data-a="reset"]').onclick=()=>{
    if(S._holdDrop) S._holdDrop();
    S._holding=false; S._done=false;
    if(o.onReset) o.onReset();
  };
  const fsOn=()=>!!(document.fullscreenElement||document.webkitFullscreenElement);
  const fsBtn=q('[data-a="fs"]');
  fsBtn.onclick=()=>{
    const d=document.documentElement;
    const fn=fsOn()?(document.exitFullscreen||document.webkitExitFullscreen)
                   :(d.requestFullscreen||d.webkitRequestFullscreen);
    if(!fn) return;
    try{ const r=fn.call(fsOn()?document:d); if(r&&r.catch) r.catch(()=>{}); }catch(_){}
  };
  const sync=()=>{ fsBtn.style.display=document.fullscreenEnabled!==false?'':'none';
                   fsBtn.textContent=fsOn()?'EXIT FULL SCREEN':'FULL SCREEN'; };
  document.addEventListener('fullscreenchange',sync);
  document.addEventListener('webkitfullscreenchange',sync);
  sync();

  /* One clock for everything, so a level never starts its own loop.
     `pump` advances a single frame by hand. requestAnimationFrame does not
     fire in a backgrounded tab, so without this the simulation cannot be
     stepped or inspected outside a visible window. */
  let last=0, t=0, live=true;
  S.pump=function(dt){
    t+=dt; if(o.step) o.step(dt); if(o.draw) o.draw(S.ctx,dt,t);
    if(S._holdUntil) S._holdUntil();     // a lesson waiting on the rig to show something
  };
  function frame(ts){
    if(!live) return;                      // a torn-down level stops simulating
    const dt=last?Math.min(0.05,(ts-last)/1000):0; last=ts;
    S.pump(dt);
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
  LPE_CURRENT=S;

  /* Until levels could follow one another, nothing ever had to come down,
     so nothing ever did: the clock ran forever and the fullscreen listeners
     stayed bound. Mounting a second level on top of that would have left the
     first one simulating and drawing into a canvas no longer in the document. */
  S.destroy=function(){
    if(!live) return; live=false;
    document.removeEventListener('fullscreenchange',sync);
    document.removeEventListener('webkitfullscreenchange',sync);
    audio.flow(0);                         // the level's flow hum goes with it
    root.remove();
    if(LPE_CURRENT===S) LPE_CURRENT=null;
  };

  const start=()=>{ root.classList.remove('pending'); if(o.onStart) o.onStart(); };
  if(o.intro && o.intro.length){
    const run=()=>intro(o.intro,start);
    if(document.body) run(); else document.addEventListener('DOMContentLoaded',run);
  }
  return S;
}

return {palette:P, art, Line, Cutaway, pipeRun, runSegments, runPoly,
        penetration, valveBody, handWheel, gauge,
        piping, pipes, valveShell, valveTrim, WHEEL_SWEEP, audio, intro, mount, boot, title,
        get current(){ return LPE_CURRENT; }};
})();

<script>
/* ============================================================
   FLUIDS \u2014 the properties the bench loop can actually demonstrate.

   Real values, at stated conditions, so the crash course is teaching
   something true rather than three colours of water. Every figure here is
   a standard reference value for the fluid at the condition named; where a
   fluid is only a liquid under pressure, the condition says so, because
   that is the honest reason its temperature cannot be freely dialled.

   Two properties matter and they are independent, which is the lesson:
     SG   decides how much flows for a given pressure drop
            q = Cv * sqrt(dP / SG)
     nu   decides what the flow LOOKS like
            Re = v * D / nu   ->  laminar below 2300, turbulent above 4000

   A dense fluid is not a sluggish one. Propane is half the density of
   water and five times less viscous: more of it flows, and it is more
   turbulent while doing it. That pair coming apart is the whole point of
   putting three fluids on one rig.
   ============================================================ */
(function (root) {

  const M2_TO_FT2 = 10.7639;

  /* Kinematic viscosity of water against temperature. Standard table,
     m^2/s. This is the dial the bench actually turns. */
  const WATER_NU = {
    0: 1.792e-6, 10: 1.307e-6, 20: 1.004e-6, 30: 0.801e-6,
    40: 0.658e-6, 50: 0.553e-6, 60: 0.475e-6, 70: 0.413e-6, 80: 0.365e-6,
  };

  /* Saturation pressure of water against temperature, kPa absolute.
     Standard steam-table values. This is the line a vena contracta has to
     stay above: dip under it and the liquid boils inside the valve. */
  const WATER_PV = {
    0: 0.61, 10: 1.23, 20: 2.34, 30: 4.25, 40: 7.38,
    50: 12.35, 60: 19.95, 70: 31.20, 80: 47.39,
  };
  const KPA_TO_PSI = 0.145038;

  function lerpTable(tbl, t) {
    const keys = Object.keys(tbl).map(Number).sort((a, b) => a - b);
    const c = Math.max(keys[0], Math.min(keys[keys.length - 1], t));
    for (let i = 0; i < keys.length - 1; i++) {
      const a = keys[i], b = keys[i + 1];
      if (c >= a && c <= b) return tbl[a] + (tbl[b] - tbl[a]) * ((c - a) / (b - a));
    }
    return tbl[keys[0]];
  }
  /* psia, because every pressure in a cavitation sum is absolute */
  function waterPv(tempC) { return lerpTable(WATER_PV, tempC) * KPA_TO_PSI; }

  function waterNu(tempC) {
    const keys = Object.keys(WATER_NU).map(Number).sort((a, b) => a - b);
    const t = Math.max(keys[0], Math.min(keys[keys.length - 1], tempC));
    for (let i = 0; i < keys.length - 1; i++) {
      const a = keys[i], b = keys[i + 1];
      if (t >= a && t <= b) {
        const f = (t - a) / (b - a);
        return WATER_NU[a] + (WATER_NU[b] - WATER_NU[a]) * f;   // linear between table points
      }
    }
    return WATER_NU[20];
  }

  const FLUIDS = {
    water: {
      name: 'WATER',
      sg: 1.000,
      nuAt: waterNu,
      tempRange: [0, 80],
      note: 'liquid at bench pressure across the whole range',
    },
    /* Liquid only under pressure - about 57 bar at 20 C. The bench holds it
       near saturation, so its temperature is not a free dial: heat it and
       it does not get hotter, it flashes. That is a later lesson, and the
       reason this one is pinned. */
    co2: {
      name: 'LIQUID CO2',
      sg: 0.772,
      nuAt: () => 0.0908e-6,
      tempRange: [20, 20],
      note: 'held near saturation, about 57 bar at 20 C',
    },
    propane: {
      name: 'LIQUID PROPANE',
      sg: 0.501,
      nuAt: () => 0.204e-6,
      tempRange: [20, 20],
      note: 'held near saturation, about 8.4 bar at 20 C',
    },
    /* Nutrient stock concentrate, for the Garden's dosing skid. NOT a
       bench fluid - the three on R.O.'s switch panel are unchanged.

       HONESTY NOTE, because this one is different in kind from the three
       above. Those are standard reference values for named pure fluids.
       This is a mixture with no single published figure: hydroponic stock
       is made up on site, and the practice literature gives ratios (stock
       is about 100x the delivered strength, injected at 1:100 to 1:3000)
       without ever quoting a density or a viscosity.

       So these are reasoned from the component salts rather than read off
       a table. A 100x stock is close to saturated in calcium and
       potassium nitrate; saturated solutions of those sit around SG
       1.2-1.4, and concentrated salt solutions typically run two to three
       times the kinematic viscosity of water. SG 1.22 and 2.4e-6 are the
       conservative end of that.

       What the level actually turns on is the mixing run's Reynolds
       number, which is dominated by bore and velocity - so the lesson
       survives these two numbers being approximate, and that is the only
       reason it is acceptable to carry them. */
    concentrate: {
      name: 'NUTRIENT STOCK',
      sg: 1.22,
      nuAt: () => 2.4e-6,
      tempRange: [20, 20],
      bench: false,
      note: 'mixture, estimated from its component salts - see the note in fluids.js',
    },
  };

  /* Reynolds number. D in feet, v in ft/s, nu converted from the table. */
  function reynolds(velFtS, boreIn, fluid, tempC) {
    const nu = fluid.nuAt(tempC) * M2_TO_FT2;
    return velFtS * (boreIn / 12) / nu;
  }

  function regime(re) {
    return re < 2300 ? 'laminar' : (re > 4000 ? 'turbulent' : 'transitional');
  }

  /* How much flows, for a given Cv and pressure drop. The SG term is the
     one the fluid selector moves. */
  function flow(cv, dP, fluid) { return cv * Math.sqrt(dP / fluid.sg); }

  /* Vena contracta pressure, the lowest point inside a restriction.
     Pvc = P1 - dP / FL^2      (Fisher CVH ch5, all absolute)
   This is the number that decides cavitation, and it is lower than
   anything a gauge on either flange can read. */
  function venaContracta(p1Abs, dP, FL) { return p1Abs - dP/(FL*FL); }

  root.LPE_FLUIDS = { FLUIDS, waterNu, waterPv, venaContracta,
                      reynolds, regime, flow, M2_TO_FT2, ATM: 14.696 };

})(typeof window !== 'undefined' ? window : globalThis);

if (typeof module !== 'undefined') module.exports = globalThis.LPE_FLUIDS;

<script>
'use strict';
/* ============================================================
   THE TRAINING LOOP \u2014 a device, not a level.

   It is the bench on R.O.'s desk, and it runs BEFORE a level to teach
   what that level is about to need. One or two concepts a visit, titled
   on screen before the demonstration starts, because a learner performs
   better knowing what they are looking for before they look.

   Levels declare what they need:   teach:['markers','velocity-profile']
   and the shell runs those segments first.

   It is one desk, always the same desk. Different apparatus clamped to it
   each time, the same mug ring, the same poster going soft at the corner.
   Familiarity is the point - this is your bench.
   ============================================================ */
(function(){
const A=LPE.art, P=LPE.palette, W=900, H=400;
const FL=LPE_FLUIDS;

/* ---- the apparatus: just the primary piping, clamped to the desk ---- */
const LAY={
  /* The glass is a CUTAWAY of the run, not a different pipe bolted to it,
     so the run enters and leaves the frame at the same bore. An 18px pipe
     either side of a 92px window read as two unrelated objects. */
  glass : {x:206,y:148,w:470,h:88},
  meter : {x:648,y:246,w:222,h:108},
  flowS : {box:{x:196,y:262,w:128,h:22}, track:{x:334,y:273,w:188}},
  tempS : {box:{x:196,y:300,w:150,h:22}, track:{x:356,y:311,w:166}},
  fsw   : {x:28, y:242, w:156, h:124, sx:40, sy:266, pitch:34},
  sched : {x:366, y:332, w:182, h:48, pitch:64, bw:54},
  lamp  : {x:742,y:30,r:30},
  pic   : {x:556,y:338},   // the framed print where the mug used to be
  book  : {x:196,y:338,w:150,h:50},
  rule  : {x:630,y:376,w:230},
};

const B={ flow:0, temp:20, fluid:'water', section:'sch40', b1:0, b2:0, watch:0, drag:null };
const CUT=new LPE.Cutaway({x:LAY.glass.x,y:LAY.glass.y,w:LAY.glass.w,h:LAY.glass.h});
const FKEYS=['water','co2','propane'];
const FSW=FKEYS.map((k,i)=>({k, x:LAY.fsw.sx, y:LAY.fsw.sy+i*LAY.fsw.pitch}));
const BHIT=6;

/* ---- the sections on the desk ----
   Three short pieces of the same NPS 3/8 run, any one of which can be
   fitted to the bench. Two differ only in wall thickness; the third is
   necked down in the middle.

   ASME B36.10M. Outside diameter is fixed by the nominal size - that is
   what "3/8 pipe" buys you - and the schedule decides how much of it is
   wall:

     section     OD      wall     bore     flow area    restriction
     SCH 40      0.675   0.091    0.493    0.00133      -
     SCH 80      0.675   0.126    0.423    0.00098      -
     REDUCER     0.675   0.091    0.493    0.00133      Cv 0.296

   The reducer's Cv comes from sizing.js, which is also where level 2 gets
   the one it pulls out of bed 3. */
const PIPE_OD = 0.675;
const SECTION = {
  sch40:   { label:'SCH 40',  wall:0.091, bore:0.493, area:0.00133, cv:null },
  sch80:   { label:'SCH 80',  wall:0.126, bore:0.423, area:0.00098, cv:null },
  /* The throat is not decoration. sizing.js derives it from the Cv the
     duty needs, Cv = 29.9 d^2 / sqrt(K) with K for a sudden contraction
     and expansion, and gets 0.108 in - beta 0.219 of the bore. Area goes
     as beta^2, so the throat is 4.8% of the bore area and the fluid
     through it is 21 times faster. */
  reducer: { label:'REDUCER', wall:0.091, bore:0.493, area:0.00133, cv:0.296,
             throat:0.108, beta:0.219 },
};
const SECKEYS = ['sch40','sch80','reducer'];
function pipeNow(){ return SECTION[B.section] || SECTION.sch40; }

/* Two resistances in series share the pump's pressure: 1/Cv^2 = sum of
   1/Cvi^2. With nothing fitted the valve takes all of it and there is no
   difference across the test section at all - which is the lesson. */
function seriesCv(a,b){ return b==null ? a : 1/Math.sqrt(1/(a*a) + 1/(b*b)); }

function rig(){
  if(manifoldOn()) return manifold();
  const f=fluidNow(), p=pipeNow();
  const cvV=BENCH_CV*B.flow;
  const cvT=seriesCv(cvV, p.cv);
  const q=FL.flow(cvT, BENCH_DP, f);
  const v=q/448.831/p.area;
  const t=tempLocked()?20:B.temp;
  const re=B.flow>0.001?FL.reynolds(v,p.bore,f,t):0;
  /* P2 is the bench discharge, open to the room, so zero gauge. P1 is what
     is left standing between the valve and the restriction - which is the
     whole of the restriction's share of the drop. */
  const p2=0;
  const p1=p.cv ? Math.pow(q/p.cv,2)*f.sg : 0;
  /* Velocity THROUGH the throat, by continuity. The bore reading falls
     when the reducer goes in, because the restriction takes flow out of
     the line - so a panel showing only bore velocity contradicts the
     lesson it is sitting next to. This is the number that rises. */
  const aThroat = p.throat ? Math.PI*Math.pow(p.throat/2,2)/144 : null;
  const vThroat = aThroat ? q/448.831/aThroat : null;
  return {f,q,v,vThroat,re,t,p1,p2,dp:p1-p2,
          regime:B.flow<=0.001?'still':FL.regime(re)};
}
const BENCH_CV=0.25, BENCH_DP=20;              // a needle valve and a bench pump
const TRICKLE=[0.23,0.30], HOT=[72,80];

const SLID={
  flow:{...LAY.flowS, label:'FLOW', key:'flow', get:()=>B.flow,
        set:v=>{B.flow=v;}, fmt:()=>Math.round(B.flow*100)+'%'},
  temp:{...LAY.tempS, label:'TEMPERATURE', key:'temp', get:()=>B.temp/80,
        set:v=>{B.temp=Math.round(v*80);}, fmt:()=>B.temp+' \u00b0C'},
};

function fluidNow(){ return FL.FLUIDS[B.fluid]; }
function tempLocked(){ return B.fluid!=='water'; }

/* ---- the desk ---- */
let BG;
function buildDesk(){
  BG=document.createElement('canvas'); BG.width=W; BG.height=H;
  const g=BG.getContext('2d');

  // wall behind the bench, warmer than the service corridors
  g.fillStyle='#17161a'; g.fillRect(0,0,W,H);
  for(let py=0;py<150;py+=52) for(let px=-10;px<W;px+=86){
    g.fillStyle=((px/86+py/52)|0)%2?'#1d1b20':'#1a181d';
    g.fillRect(px,py,84,50);
  }
  // the desk itself: warm laminate, a lip, and the shadow under it
  g.fillStyle='#3a2f22'; g.fillRect(0,150,W,H-150);

  g.fillStyle='#6b5536'; g.fillRect(0,150,W,5);
  g.fillStyle='#241c13'; g.fillRect(0,155,W,3);
  A.dither(g,0,336,W,H-336,'#1a140d',0.5);              // front edge falls away

  /* Vignette BEFORE the props. Level one's scene says it plainly - "room
     first, then signage on top of it" - and the trainer had it last, so the
     Bayer dither fell across every label and every object on the desk. */
  A.vignetteOnto(g,W,H);

  /* Everything that HANGS on the wall goes above the vignette too, for the
     same reason the lamp does: the vignette is a dither, and underneath it
     the poster and the schedule chart came out speckled, as if printed on
     sandpaper. The vignette darkens the room; it is not a surface finish
     for the things in it. */
  /* The Circuit's Edge box, pinned to the wall - a pixel homage to the 1990
     Infocom/Westwood game, not a copy of the artwork. Flat inks and hard
     edges, nothing dithered: a dithered band reads as a dirty surface and
     this is meant to read as something that came off a press.

     The composition follows what a 1990 box did: a hot night sky over a
     low skyline, neon signage, a coated figure in the foreground with their
     back to you, title across the top, publisher line at the foot. Paper
     stands a few millimetres off the wall, so it throws a shadow down-left
     like everything else on this desk. */
  const PO={x:48,y:22,w:120,h:116};
  g.fillStyle='rgba(8,6,4,0.55)'; g.fillRect(PO.x-3,PO.y+5,PO.w,PO.h);
  g.fillStyle='#120f14'; g.fillRect(PO.x,PO.y,PO.w,PO.h);            // box board
  g.fillStyle='#241e28'; g.fillRect(PO.x,PO.y,PO.w,1);

  const AX=PO.x+5, AY=PO.y+16, AW=PO.w-10, AH=66;                    // the art panel
  // night sky, banded from deep violet down to a sodium haze
  const sky=['#2a1240','#3a1546','#55194a','#7d2448','#a8373c'];
  sky.forEach((c,i)=>{ g.fillStyle=c; g.fillRect(AX,AY+i*7,AW,7); });
  g.fillStyle='#f2c46a'; g.beginPath();                              // low moon
  g.arc(AX+AW-22,AY+14,7,0,6.284); g.fill();

  // skyline: blocky towers, a couple of domes, windows left burning
  const tow=[[0,26,13],[13,34,9],[22,20,11],[33,30,8],[41,40,12],

  g.arc(AX+28,AY+AH-20,9,Math.PI,0); g.fill();
  g.fillStyle='#2a1a34'; g.fillRect(AX,AY+AH-5,AW,5);                // the street

  g.fillStyle='#ff3ea5'; g.fillRect(AX+6,AY+44,12,2);
  g.fillStyle='#2ad8ff'; g.fillRect(AX+AW-26,AY+36,2,14);
  g.fillStyle='#ff3ea5'; g.fillRect(AX+AW-21,AY+39,2,11);

  // the figure: long coat, back to us, standing in the street
  const FX=AX+AW/2-7, FY=AY+30;
  g.fillStyle='#0a070d';
  g.fillRect(FX+1,FY+10,13,30);                                      // coat
  g.fillRect(FX-2,FY+13,17,13);                                      // shoulders
  g.fillRect(FX+4,FY,7,9);                                           // head
  g.fillStyle='#120d16'; g.fillRect(FX+4,FY,7,3);                    // rim light, lamp side
  g.fillStyle='#ff3ea5'; g.fillRect(FX+13,FY+14,1,22);               // neon edge on the coat
  g.fillStyle='#2ad8ff'; g.fillRect(FX,FY+16,1,18);

  g.strokeStyle='#3a3040'; g.lineWidth=1;                            // art panel border
  g.strokeRect(AX+0.5,AY+0.5,AW-1,AH-1);

  // title and footer, the parts a box has that a poster does not
  A.stencil(g,PO.x+8,PO.y+11,'CIRCUIT\u2019S EDGE',11,'#ffd24a');
  g.fillStyle='#8f8597'; g.font="10px 'VT323',monospace"; g.textAlign='left';
  g.fillText('WHEN GRAVITY FAILS',PO.x+8,PO.y+AH+27);
  g.fillStyle='#5f5668'; g.font="9px 'VT323',monospace";
  g.fillText('INFOCOM',PO.x+8,PO.y+AH+38);
  g.fillText('1990',PO.x+PO.w-28,PO.y+AH+38);
  g.textAlign='left';

  g.fillStyle='#17161a'; g.beginPath();                              // curled corner
  g.moveTo(PO.x+PO.w,PO.y+PO.h); g.lineTo(PO.x+PO.w-16,PO.y+PO.h);
  g.lineTo(PO.x+PO.w,PO.y+PO.h-16); g.closePath(); g.fill();
  g.fillStyle='#2e2833'; g.beginPath();                              // the lifted flap
  g.moveTo(PO.x+PO.w-16,PO.y+PO.h); g.lineTo(PO.x+PO.w,PO.y+PO.h-16);
  g.lineTo(PO.x+PO.w-2,PO.y+PO.h-2); g.closePath(); g.fill();
  g.fillStyle='#8a94a0'; g.beginPath(); g.arc(PO.x+PO.w/2,PO.y+4,2.5,0,6.284); g.fill();
  g.fillStyle='#454f58'; g.fillRect(PO.x+PO.w/2-2,PO.y+5,5,1);       // pin, shaded

  // a second pinned thing: a schedule chart
  g.fillStyle='rgba(8,6,4,0.55)'; g.fillRect(185,35,96,78);
  g.fillStyle='#2e2a26'; g.fillRect(188,30,96,78);
  g.fillStyle='#3a352f'; g.fillRect(188,30,96,1);
  A.stencil(g,194,44,'SCH 40',11,'#8b7f6a');
  for(let ly=52;ly<102;ly+=8){ g.fillStyle='#4a4238'; g.fillRect(194,ly,84,1); }
  g.fillStyle='#8a94a0'; g.beginPath(); g.arc(236,34,2.5,0,6.284); g.fill();

  /* The lamp goes on AFTER the vignette, with the props. It sits in the
     top-right corner, which is exactly where the vignette dither is at its
     densest - so drawn underneath it, the shade and the bulb came out
     crawling with speckle, and so did the wall around them. A light source
     is the one thing in a scene that must not look dirty. */
  // desk lamp: arm from the right, head over the apparatus
  const L=LAY.lamp;
  g.strokeStyle='#4a4038'; g.lineWidth=6;
  g.beginPath(); g.moveTo(866,150); g.lineTo(856,70); g.lineTo(L.x+14,L.y+6); g.stroke();
  g.fillStyle='#5a4a38'; g.beginPath();
  g.moveTo(L.x-22,L.y+16); g.lineTo(L.x+22,L.y+16); g.lineTo(L.x+13,L.y-10);
  g.lineTo(L.x-13,L.y-10); g.closePath(); g.fill();
  g.fillStyle='#ffd9a0'; g.fillRect(L.x-20,L.y+14,40,4);

  /* The pool of light the cutaway is already shaded by - it should come
     from somewhere on screen, not from nowhere.

     Drawn as flat translucent bands, not Bayer dither. Dither is right for
     a surface with a texture; light has none, and speckling it put visible
     grain across the whole top-right of the wall. Banding keeps the hard
     steps the rest of the scene is drawn in without the crawl. */
  for(let i=0;i<9;i++){
    const t=i/9, yy=L.y+18+t*230, half=30+t*310;
    g.fillStyle='rgba(255,217,160,'+(0.030*(1-t*0.72)).toFixed(3)+')';
    g.fillRect(L.x-half,yy,half*2,30);
  }

  /* ---- props ----
     Everything on this desk is lit by the lamp above right. That means one
     light direction for the whole surface: highlights on the upper right of
     a form, the darker face down-left, and a cast shadow thrown down-left
     from every object that stands up off the laminate. The first pass drew
     flat rectangles with a single tone band and no shadows, which is what
     makes a scene read as placed rather than built. */
  const LX=LAY.lamp.x, LY=LAY.lamp.y;
  const cast=(x,y,w,h,amt)=>{                       // soft shadow, away from the lamp
    const dx=(x+w/2-LX)*0.05, dy=10;
    A.dither(g,x+dx-3,y+dy,w+6,h,'#0e0a05',amt===undefined?0.40:amt);
  };
  /* An upright form, shaded across its width: lit face toward the lamp,
     two steps down away from it. */
  const column=(x,y,w,h,lit,mid,dark)=>{
    const n=5;
    for(let i=0;i<n;i++){
      const t=i/(n-1);
      const toward = (x+w/2) < LX ? 1-t : t;        // which side faces the lamp
      g.fillStyle = toward>0.72 ? lit : (toward>0.34 ? mid : dark);
      g.fillRect(x+Math.round(t*w), y, Math.ceil(w/n)+1, h);
    }
  };

  /* ---- the framed print on the desk ----
     What stood here was a mug drawn as a lit cylinder, and at this size it
     read as a brown lump. R.O. keeps a framed print instead: a hero on
     rocket boots, mid-jump, gun out. Drawn as a pixel sprite from a
     character map rather than with curves, so it is crisp at 1:1 and can
     be edited a pixel at a time. The coffee ring stays - something did
     used to sit there. */
  const M=LAY.pic;
  g.strokeStyle='#5c4a30'; g.lineWidth=2;           // the ring it left behind
  g.beginPath(); g.ellipse(M.x+52,M.y+32,13,5,0,0,6.284); g.stroke();

  /* Twenty-three rows, two screen pixels each. The first pass read as a
     man standing still: legs straight, boots lost under a sun band laid
     over the bottom of the print. He is airborne now - knees bent, feet
     splayed out behind, jets firing down out of both soles - and the
     caption has its own strip under the art so nothing is painted over
     the figure. */
  const SPR=[
    '.......kkkkk........',
    '......khhhhhk.......',
    '.....khhhhhhhk......',
    '.....khsssssshk.....',
    '.....kgggggssk......',
    '.....ksssssssk......',
    '......kssssk........',
    '....kkkrrrkkk.......',
    '...kskrrrrrrkwwwwk..',
    '...kskrrrrrrkwWWWWk.',
    '...kkkrrrrrrkwwwwk..',
    '.....krrrrrrk.......',
    '.....kRRRRRRk.......',
    '.....kbbbbbbk.......',
    '....kbbbbbbbk.......',
    '...kbbbk.kbbbk......',
    '..kbbbk...kbbbk.....',
    '..kbbk.....kbbk.....',
    '..kttk.....kttk.....',
    '..kTTk.....kTTk.....',
    '...ff.......ff......',
    '...fF.......Ff......',
    '....f.......f.......',
    '....................',
    '....................',
    '....................',
    '....................',
  ];
  const PAL={ k:'#17120d', h:'#f2d16b', s:'#e8b887', g:'#20304a',
              r:'#c0392b', R:'#8f281d', b:'#2f4f7a', t:'#4a3a2a',
              T:'#2b2118', w:'#8a94a0', W:'#c3ccd3',
              f:'#ff9b2f', F:'#ffe39a' };
  const PX=2, PW=SPR[0].length*PX, PH=SPR.length*PX;
  const CAP=9;                                     // the caption's own strip
  const QW=PW+8, QH=PH+8+CAP, QX=M.x, QY=M.y+40-QH;

  cast(QX,QY+QH-6,QW,8,0.34);
  g.fillStyle='#2a2119'; g.fillRect(QX-2,QY-2,QW+4,QH+4);     // frame
  g.fillStyle='#6b5533'; g.fillRect(QX-2,QY-2,QW+4,2);        // lit top edge
  g.fillStyle='#120d08'; g.fillRect(QX,QY,QW,QH);             // mount

  /* dusk sky: he has to be against something, or he reads as a decal */
  for(let i=0;i<PH;i++){
    const u=i/PH;
    g.fillStyle='rgb('+Math.round(26+52*u)+','+Math.round(18+26*u)+','+
                 Math.round(48+26*u)+')';
    g.fillRect(QX+4,QY+4+i,PW,1);
  }
  g.fillStyle='#4a2a22';                                       // ground, low
  g.fillRect(QX+4,QY+4+PH-7,PW,7);
  g.fillStyle='#7a4132';                                       // rim of light
  g.fillRect(QX+4,QY+4+PH-7,PW,1);

  SPR.forEach((row,y)=>{
    for(let x=0;x<row.length;x++){
      const c=PAL[row[x]];
      if(c){ g.fillStyle=c; g.fillRect(QX+4+x*PX, QY+4+y*PX, PX, PX); }
    }
  });

  g.fillStyle='rgba(255,255,255,0.06)';                        // glass sheen
  g.beginPath(); g.moveTo(QX,QY); g.lineTo(QX+QW*0.5,QY);
  g.lineTo(QX,QY+QH*0.7); g.closePath(); g.fill();

  g.fillStyle='#1b1510'; g.fillRect(QX+4,QY+4+PH,PW,CAP-1);    // caption strip
  g.fillStyle='#d8c79a'; g.font="9px 'VT323',monospace"; g.textAlign='center';
  g.fillText('NUKEM',QX+QW/2,QY+4+PH+7); g.textAlign='left';

  g.strokeStyle='#2a2119'; g.lineWidth=2;                      // the kickstand
  g.beginPath(); g.moveTo(QX+QW*0.6,QY+QH+1);
  g.lineTo(QX+QW*0.85,QY+QH+7); g.stroke();


  // ---- steel rule: bevelled, and it sits ON something
  const RU=LAY.rule;
  cast(RU.x,RU.y,RU.w,8,0.30);
  g.fillStyle='#6d7a84'; g.fillRect(RU.x,RU.y,RU.w,9);
  g.fillStyle='#aab4bd'; g.fillRect(RU.x,RU.y,RU.w,2);        // lit top edge
  g.fillStyle='#3a434a'; g.fillRect(RU.x,RU.y+7,RU.w,2);
  g.fillStyle='#2b343a';
  for(let rx=RU.x+5;rx<RU.x+RU.w-4;rx+=9){
    const major=(rx-RU.x-5)%45===0;
    g.fillRect(rx,RU.y+2,1,major?6:3);
  }

  /* The three loose fittings that used to sit here are gone: the two pipe
     samples are drawn in the same place now, and they are a control. */

  // ---- notebook: paper, ruled, with a spiral and a lifted corner
  const BK=LAY.book;
  cast(BK.x,BK.y,BK.w,BK.h,0.34);
  g.fillStyle='#cfc4ab'; A.rr(g,BK.x,BK.y,BK.w,BK.h,2); g.fill();
  g.fillStyle='#e2d8c0'; g.fillRect(BK.x,BK.y,BK.w,BK.h-6);   // lit page
  g.fillStyle='#b3a88e'; g.fillRect(BK.x,BK.y+BK.h-6,BK.w,6); // shadowed edge
  for(let ly=BK.y+10; ly<BK.y+BK.h-8; ly+=9){
    g.fillStyle='#c3b89c'; g.fillRect(BK.x+6,ly,BK.w-12,1);
  }
  g.fillStyle='#9d9177'; g.fillRect(BK.x+BK.w/2-1,BK.y,2,BK.h-6);
  g.fillStyle='#8a94a0';
  for(let sy=BK.y+6; sy<BK.y+BK.h-8; sy+=10){                 // spiral binding
    g.fillRect(BK.x+BK.w/2-4,sy,8,2);
  }
  g.fillStyle='#4a3b2a'; g.font="13px 'VT323',monospace"; g.textAlign='left';
  g.fillText('cold water',BK.x+7,BK.y+20);
  g.fillText('first.',BK.x+7,BK.y+33);
  g.fillText('watch the',BK.x+BK.w/2+8,BK.y+20);
  g.fillText('middle  R.O.',BK.x+BK.w/2+8,BK.y+33);
}

/* ---- the apparatus, clamped to the desk ---- */
function drawRig(g,r){
  const G=LAY.glass;
  // two clamps holding the run to the bench
  [G.x-4,G.x+G.w-26].forEach(cx=>{
    g.fillStyle='#39444b'; g.fillRect(cx,G.y+G.h+22,30,54);
    g.fillStyle='#5d6a73'; g.fillRect(cx,G.y+G.h+22,30,3);
    g.fillStyle='#8a94a0'; g.beginPath(); g.arc(cx+15,G.y+G.h+44,3,0,6.284); g.fill();
  });
  /* The run itself is SOLID pipe - only the glass is cut open. Drawing it
     with the bore showing gave a huge empty black band either side of the
     window, as if the cutaway were a different pipe. Same shading language
     as the glass outer skin, so it reads as one continuous run. */
  const run=(x0,x1)=>{
    const cy=G.y+G.h/2, hr=G.h/2+10;
    g.fillStyle='#2b343a'; g.fillRect(x0,cy-hr,x1-x0,hr*2);
    for(let i=0;i<10;i++){
      const t=i/10, yy=cy-hr+t*hr*2;
      const k=1-Math.abs(t-0.32)*1.9;
      g.fillStyle='rgba(140,156,168,'+(Math.max(0,k)*0.20).toFixed(3)+')';
      g.fillRect(x0,yy,x1-x0,hr*2/10+1);
    }
    g.fillStyle='#5d6a73'; g.fillRect(x0,cy-hr,x1-x0,2);
    g.fillStyle='#141a1e'; g.fillRect(x0,cy+hr-2,x1-x0,2);
  };
  run(0,G.x-6); run(G.x+G.w+6,W);
  /* The bore the markers run in is the bore the numbers use. Schedule 80
     is the same pipe from outside and a third less hole, so the wall is
     drawn into the window and the water column shrinks between it. */
  const BR=boreRect(), G2=LAY.glass;
  /* Hand the throat to the water as well as to the metal, so the markers
     squeeze and accelerate through the neck instead of crossing a drawn
     reducer at the speed they approached it. */
  const pNow=pipeNow();
  CUT.set({x:BR.x,y:BR.y,w:BR.w,h:BR.h,
           throat: pNow.beta ? {at:THROAT_AT, span:THROAT_SPAN, beta:pNow.beta} : null});
  CUT.draw(g);
  drawThroat(g);
  const wallTop=BR.y-G2.y, wallBot=(G2.y+G2.h)-(BR.y+BR.h);
  [[G2.y,wallTop],[BR.y+BR.h,wallBot]].forEach(([wy,wh])=>{
    if(wh<=0) return;
    const wg=g.createLinearGradient(0,wy,0,wy+wh);
    wg.addColorStop(0,'#5a646e'); wg.addColorStop(.45,'#8e99a2'); wg.addColorStop(1,'#39424b');
    g.fillStyle=wg; g.fillRect(G2.x,wy,G2.w,wh);
    g.fillStyle='#20272c'; g.fillRect(G2.x,wy+(wh>6?wh-2:0),G2.w,2);
  });
}

/* ---- the three sections, as a control that is the thing it controls ----
   Short pieces of pipe you can see down. Same outside on all three; what
   differs is the wall, and on the third one, the middle. */
const SECBTN = SECKEYS.map((k,i)=>({
  k, x:LAY.sched.x + i*LAY.sched.pitch, y:LAY.sched.y,
  w:LAY.sched.bw, h:LAY.sched.h,
}));

function drawSections(g){
  const live = liveCtl('section');
  SECBTN.forEach(b=>{
    const on = B.section===b.k, p = SECTION[b.k];
    A.dither(g,b.x-3,b.y+b.h-6,b.w+6,8,'#0e0a05',0.34);
    const cx=b.x+b.w/2, cy=b.y+b.h/2-6, R=15;
    const wall = R * (p.wall / (PIPE_OD/2));
    g.fillStyle = on?'#8d98a1':(live?'#5d6872':'#3c444b');
    g.beginPath(); g.arc(cx,cy,R,0,6.284); g.fill();
    g.fillStyle = '#c3ccd3';                        // the cut face, toward the lamp
    g.beginPath(); g.arc(cx,cy,R,-2.4,-0.7); g.arc(cx,cy,R-wall,-0.7,-2.4,true); g.fill();
    g.fillStyle = '#0b1013';
    g.beginPath(); g.arc(cx,cy,R-wall,0,6.284); g.fill();
    if(p.cv){                                       // the necked one, seen end on
      g.strokeStyle='#6d7a84'; g.lineWidth=2;
      g.beginPath(); g.arc(cx,cy,(R-wall)*0.52,0,6.284); g.stroke();
    }
    if(on){ g.strokeStyle=P.amber; g.lineWidth=2;
            g.beginPath(); g.arc(cx,cy,R+3,0,6.284); g.stroke(); }
    g.fillStyle = on?P.amber:(live?'#8e9aa3':'#5a646c');
    g.font="11px 'VT323',monospace"; g.textAlign='center';
    g.fillText(p.label, cx, b.y+b.h+6);
    g.fillStyle = on?'#8fb9ff':'#59646d';
    g.font="9px 'VT323',monospace";
    g.fillText(p.cv ? 'Cv '+p.cv.toFixed(3) : p.bore.toFixed(3)+' in', cx, b.y+b.h+16);
    g.textAlign='left';
  });
}

/* The bore the markers run in is the bore the numbers use. The necked
   section keeps the same bore either side and pinches the middle, so the
   water column narrows where the throat is and nowhere else. */
function boreRect(){
  const G=LAY.glass, p=pipeNow();
  const h = Math.round(G.h * (p.bore / PIPE_OD));
  return { x:G.x, y:G.y + Math.round((G.h-h)/2), w:G.w, h };
}
const THROAT_AT=0.5, THROAT_SPAN=0.085;         // where the neck sits, as fractions

function drawThroat(g){
  const p=pipeNow(); if(!p.beta) return;
  const BR=boreRect(), mid=BR.x+BR.w*THROAT_AT;
  const span=BR.w*THROAT_SPAN*0.42, flare=BR.w*THROAT_SPAN*0.58;
  /* to scale: the neck leaves beta of the bore open, not an eyeballed
     half. beta 0.219 is a much tighter hole than it was being drawn as,
     and the tightness is the whole reason the fluid sprints. */
  const d=BR.h*(1-p.beta)/2;
  g.fillStyle='#7c8791';
  [[BR.y,1],[BR.y+BR.h,-1]].forEach(([edge,dir])=>{
    g.beginPath();
    g.moveTo(mid-span-flare, edge);
    g.lineTo(mid-span,       edge + dir*d);
    g.lineTo(mid+span,       edge + dir*d);
    g.lineTo(mid+span+flare, edge);
    g.closePath(); g.fill();
    g.fillStyle='#9aa5ae';                    // the lit inside face of the neck
    g.fillRect(mid-span, edge + dir*d - (dir>0?0:2), span*2, 2);
    g.fillStyle='#7c8791';
  });
}

/* ---- the manifold apparatus ----
   Same desk, different thing clamped to it. The run comes in through a
   supply valve, meets a tee, and leaves down two branches with a valve
   each. The cut-open section shows branch 1.

   The divider is level one's, unchanged:
       P_man = P_sup * Cvm^2 / (Cvm^2 + Cv_sum^2)
   so the pressure at the tee depends on what EVERY branch is drawing. Open
   the second branch and the first one falls without anybody touching it,
   which is the entire lesson and the reason a single-outlet bench cannot
   teach it.

   Cv values are sizing.js's: supply 0.896, branch 0.513 each. */
const CV_SUP = 0.896, CV_BR = 0.513;

function manifoldOn(){ return !!(seg && seg.manifold); }

function manifold(){
  const f = fluidNow();
  const cv1 = CV_BR*B.b1, cv2 = CV_BR*B.b2, cvSum = cv1+cv2;
  const pMan = cvSum<=0 ? BENCH_DP
             : BENCH_DP*(CV_SUP*CV_SUP)/(CV_SUP*CV_SUP + cvSum*cvSum);
  const root = Math.sqrt(Math.max(0,pMan)/f.sg);
  const q1 = cv1*root, q2 = cv2*root;
  const v1 = q1/448.831/pipeNow().area;
  const re = q1>0.001 ? FL.reynolds(v1,pipeNow().bore,f,20) : 0;
  return { f, pMan, q1, q2, qTot:q1+q2,
           q:q1, v:v1, re, t:20, p1:pMan, p2:0, dp:pMan,
           regime: q1<=0.001 ? 'still' : FL.regime(re) };
}

/* The two levers are branch valves while this apparatus is fitted. The
   bench has two levers; what they control is whatever is clamped to it. */
const SLID_MAN = {
  b1:{...LAY.flowS, label:'BRANCH 1', key:'b1', get:()=>B.b1,
      set:v=>{B.b1=v;}, fmt:()=>Math.round(B.b1*100)+'%'},
  b2:{...LAY.tempS, label:'BRANCH 2', key:'b2', get:()=>B.b2,
      set:v=>{B.b2=v;}, fmt:()=>Math.round(B.b2*100)+'%'},
};

/* The tee and the second branch, drawn into the run upstream of the glass
   so the split is visible rather than asserted. */
function drawTee(g, r){
  if(!manifoldOn()) return;
  const G=LAY.glass, cy=G.y+G.h/2, hr=G.h/2+10;
  const tx=G.x-74;                          // the tee sits before the window
  const barW=26, dropH=96;
  // the branch dropping away out of frame
  g.fillStyle='#2b343a'; g.fillRect(tx-barW/2, cy, barW, dropH);
  for(let i=0;i<4;i++){
    g.fillStyle='rgba(140,156,168,'+(0.16-i*0.03).toFixed(2)+')';
    g.fillRect(tx-barW/2+i*3, cy, 3, dropH);
  }
  g.fillStyle='#5d6a73'; g.fillRect(tx-barW/2, cy, 2, dropH);
  g.fillStyle='#141a1e'; g.fillRect(tx+barW/2-2, cy, 2, dropH);
  // the crotch of the tee
  g.fillStyle='#39444b'; g.fillRect(tx-barW/2-6, cy-hr, barW+12, hr+8);
  g.fillStyle='#6d7a84'; g.fillRect(tx-barW/2-6, cy-hr, barW+12, 2);
  // branch 2 running, drawn as markers falling away down the drop
  if(r.q2>0.01){
    const n=Math.min(9, 2+Math.round(r.q2*5));
    for(let i=0;i<n;i++){
      const yy = cy + ((i*23 + (performance.now()*0.05*r.q2))%dropH);
      marker2(g, tx-5+((i*7)%11), yy, r.f.sg);
    }
  }
  g.fillStyle=P.rim; g.font="10px 'VT323',monospace"; g.textAlign='center';
  g.fillText('BRANCH 2', tx, cy+dropH+12);
  g.textAlign='left';
}
/* the same square the rest of the game draws, since this is still fluid */
function marker2(g,x,y,sg){
  const s=2.4*(sg===undefined?1:sg);
  g.fillStyle='rgba(54,224,255,0.55)';
  g.fillRect(x-s/2,y-s/2,s,s);
}

/* ---- the pressure trace ----
   Fisher CVH ch6 fig 6-2, drawn over the section it describes so the dip
   sits at the same x as the throat that causes it.

   The point of the view: the lowest pressure in a restriction is NOT the
   downstream reading. It is at the vena contracta, inside, where neither
   gauge can see it. P2 recovers above it. */
const FL_BENCH = 0.90;                 // globe-style trim, CVH ch5 table

function venaOn(){ return !!(seg && seg.trace); }

function pressures(r){
  const p1a = r.p1 + FL.ATM, p2a = r.p2 + FL.ATM;
  const pvc = FL.venaContracta(p1a, r.p1 - r.p2, FL_BENCH);
  const pv  = FL.waterPv(r.t);
  return { p1a, p2a, pvc, pv, margin: pvc - pv, cav: pvc <= pv };
}

function drawTrace(g, r){
  const G=LAY.glass, P=pressures(r);
  const PMAX=26;                                   // psia, full height of the window
  const y = p => G.y + G.h - 6 - (Math.max(0,Math.min(PMAX,p))/PMAX)*(G.h-14);
  const mid = G.x + G.w*0.52, span = G.w*0.055, flare = G.w*0.11;

  g.save();
  g.fillStyle='rgba(8,14,18,0.72)'; g.fillRect(G.x,G.y,G.w,G.h);   // dim the water

  // the vapour pressure line, and the band below it
  g.fillStyle='rgba(192,73,59,0.16)';
  g.fillRect(G.x, y(P.pv), G.w, G.y+G.h-y(P.pv));
  g.strokeStyle='#c0493b'; g.lineWidth=1.5; g.setLineDash([5,4]);
  g.beginPath(); g.moveTo(G.x,y(P.pv)); g.lineTo(G.x+G.w,y(P.pv)); g.stroke();
  g.setLineDash([]);
  g.fillStyle='#c0493b'; g.font="10px 'VT323',monospace";
  g.fillText('Pv  '+P.pv.toFixed(2)+' psia', G.x+6, y(P.pv)-4);

  if(r.q>0.004){
    // P1 flat, dip through the throat, partial recovery to P2
    g.strokeStyle='#ffd24a'; g.lineWidth=2.2; g.beginPath();
    g.moveTo(G.x, y(P.p1a));
    g.lineTo(mid-span-flare, y(P.p1a));
    g.bezierCurveTo(mid-span, y(P.p1a), mid-span*0.6, y(P.pvc), mid, y(P.pvc));
    g.bezierCurveTo(mid+span*0.9, y(P.pvc), mid+span+flare*0.6, y(P.p2a), mid+span+flare*1.3, y(P.p2a));
    g.lineTo(G.x+G.w, y(P.p2a));
    g.stroke();
    // the three readings, marked where they happen
    const pin=(px,py,lab,col)=>{
      g.fillStyle=col; g.beginPath(); g.arc(px,py,3.2,0,6.284); g.fill();
      g.font="10px 'VT323',monospace"; g.fillText(lab,px+6,py-4);
    };
    pin(G.x+42, y(P.p1a), 'P1 '+P.p1a.toFixed(1), '#8fb9ff');
    pin(mid,    y(P.pvc), 'vena contracta '+P.pvc.toFixed(1), P.cav?'#c0493b':'#ffd24a');
    pin(G.x+G.w-96, y(P.p2a), 'P2 '+P.p2a.toFixed(1), '#8fb9ff');
    // the margin, called out as a bar between the dip and the line
    if(!P.cav){
      g.strokeStyle='rgba(126,196,122,0.9)'; g.lineWidth=1.4;
      g.beginPath(); g.moveTo(mid, y(P.pvc)+4); g.lineTo(mid, y(P.pv)-2); g.stroke();
      g.fillStyle='#7ec47a'; g.font="10px 'VT323',monospace"; g.textAlign='center';
      g.fillText(P.margin.toFixed(1)+' psi', mid+34, (y(P.pvc)+y(P.pv))/2+3);
      g.textAlign='left';
    }
  } else {
    g.fillStyle='#5d6a73'; g.font="12px 'VT323',monospace"; g.textAlign='center';
    g.fillText('open the valve', G.x+G.w/2, G.y+G.h/2);
    g.textAlign='left';
  }
  g.restore();
}

/* ---- the meter block ---- */
/* ---- the panel only shows what has been taught ----
   REYNOLDS and REGIME used to sit on this panel from the first segment -
   five rungs before anything explained either of them - and a labelled
   number on screen is a reference whether or not the script says the word.
   A row appears when its concept is introduced, so the panel grows as the
   player does. Once the visit is over every row is live, because by then
   nothing on it is unexplained.

   FLOW is the exception: PROCESS needs something to point at when it says
   the panel is the measurement, so it is there from the start, and that
   lesson glosses it rather than leaving it bare. */
const KNOWN = new Set();
function drawMeters(g,r){
  const M=LAY.meter;
  const shows=(seg&&seg.shows)||[];      // read by the rows AND by the P1 label
  const all=[
    /* Supply pressure is there whether or not anything is moving - that is
       the whole point of the PRESSURE segment - so this row never greys
       out with the valve shut the way the flow-derived rows do. */
    /* Called SUPPLY until the restriction rung, where a second gauge makes
       the name necessary and it becomes P1 - the notation the handbook,
       the Cv equation and every later level already use. */
    {k:'pressure',    label:manifoldOn() ? 'MANIFOLD'
                      : ((KNOWN.has('restriction')||shows.indexOf('restriction')>=0||done) ? 'P1' : 'SUPPLY'),
     val:(manifoldOn()||KNOWN.has('restriction')||shows.indexOf('restriction')>=0||done ? r.p1 : BENCH_DP).toFixed(1)+' psi',
     col:'#39ff6a', always:true},
    {k:'restriction', label:'P2', val:r.p2.toFixed(1)+' psi', col:'#39ff6a',
     always:true, hideOn:manifoldOn()},
    {k:'manifold', label:'BRANCH 1', val:(r.q1!==undefined?r.q1:0).toFixed(2)+' gpm',
     col:'#39ff6a', always:true, onlyOn:manifoldOn()},
    {k:'manifold', label:'BRANCH 2', val:(r.q2!==undefined?r.q2:0).toFixed(2)+' gpm',
     col:(r.q2>0.01?'#ffd24a':'#8b949b'), always:true, onlyOn:manifoldOn()},
    {k:'restriction', label:'\u0394P', val:r.dp.toFixed(1)+' psi',
     col:r.dp>0.05?'#ffd24a':'#8b949b', always:true},
    {k:'velocity-profile',label:'VELOCITY', val:r.v.toFixed(2)+' ft/s', col:'#39ff6a'},
    /* only while something with a throat is fitted, and the one number
       that goes UP when you restrict a line */
    /* hideOn, not onlyOn: the rung is in KNOWN while this segment runs, so
       onlyOn was being short-circuited and the row sat there reading
       0.0 ft/s with no throat in the line to read. */
    {k:'restriction', label:'AT THROAT',
     val:(r.vThroat||0).toFixed(1)+' ft/s', col:'#ffd24a',
     always:true, hideOn:!r.vThroat},
    {k:'reynolds',        label:'REYNOLDS',
     val:r.re>0?Math.round(r.re).toLocaleString('en-US'):'\u2014', col:'#39ff6a'},
    {k:'reynolds',        label:'REGIME',   val:r.regime.toUpperCase(),
     col:r.regime==='laminar'?'#8fb9ff':(r.regime==='turbulent'?'#ffd24a':'#8b949b')},
    {k:'flow',            label:'FLOW',     val:r.q.toFixed(2)+' gpm',
     col:'#39ff6a', fromStart:true, hideOn:manifoldOn()},
  ];
  const rows=all.filter(c=>!c.hideOn && (c.onlyOn || done || c.fromStart ||
                            KNOWN.has(c.k) || shows.indexOf(c.k)>=0));
  const h=Math.max(30, 12+rows.length*21);
  g.fillStyle='#232a2f'; A.rr(g,M.x,M.y,M.w,h,4); g.fill();
  g.strokeStyle='#4a565d'; g.lineWidth=2; g.stroke();
  rows.forEach((c,i)=>{
    const y=M.y+10+i*21;
    g.fillStyle=P.rim; g.font="11px 'VT323',monospace"; g.textAlign='left';
    g.fillText(c.label,M.x+10,y+10);
    if(!done && !KNOWN.has(c.k)){            // shown early: flag it as such
      g.fillStyle='#6b5a3a'; g.font="9px 'VT323',monospace";
      g.fillText('later',M.x+10+c.label.length*6.6,y+10);
    }
    g.fillStyle=(c.always||B.flow>0.001)?c.col:'#5d6a73';
    g.font="16px 'VT323',monospace"; g.textAlign='right';
    g.fillText(c.val,M.x+M.w-10,y+10);
  });
  g.textAlign='left';
}

/* ---- fluid select: three labelled switches ----
   The bottles were scenery pretending to be a control. Nothing about a
   glass vial says "throw me", nothing says which one is currently on the
   loop, and the only label was four grey characters under the glass. A
   switch bank says all three things without being explained: the lever
   position shows state, the lamp confirms it, and the engraved plate
   names what the switch does. */
function drawFluidSwitches(g){
  const S=LAY.fsw, live=liveCtl('fluid');

  A.dither(g,S.x-4,S.y+S.h,S.w+8,10,'#0e0a05',0.38);          // sits on the desk
  g.fillStyle='#39424a'; A.rr(g,S.x,S.y,S.w,S.h,3); g.fill();  // plate
  g.fillStyle='#5a666f'; g.fillRect(S.x,S.y,S.w,2);            // lit top edge
  g.fillStyle='#232a30'; g.fillRect(S.x,S.y+S.h-2,S.w,2);
  g.strokeStyle='#1b2126'; g.lineWidth=1;
  A.rr(g,S.x+0.5,S.y+0.5,S.w-1,S.h-1,3); g.stroke();

  g.fillStyle='#2b333a'; g.fillRect(S.x+6,S.y+6,S.w-12,15);    // header
  g.fillStyle=live?P.rim:'#5a666f';
  g.font="13px 'VT323',monospace"; g.textAlign='left';
  g.fillText('FLUID  SELECT',S.x+11,S.y+18);
  [S.x+5,S.x+S.w-6].forEach(sx=>{                              // plate screws
    [S.y+5,S.y+S.h-6].forEach(sy=>{
      g.fillStyle='#6d7a84'; g.fillRect(sx-2,sy-2,4,4);
      g.fillStyle='#1b2126'; g.fillRect(sx-2,sy,4,1);
    });
  });

  FSW.forEach(s=>{
    const on=s.k===B.fluid, f=FL.FLUIDS[s.k];

    /* A toggle, drawn as one: a bezel with a slot cut through it, and a
       lever that occupies the top of the slot when thrown and the bottom
       when not. The travel gap is the tell - a slab filling the whole well
       reads as a panel, a slab with empty slot above or below it reads as
       something that moved and can move back. The lever tip is wider than
       its shaft so it has a thumb to push. */
    g.fillStyle='#4e5962'; A.rr(g,s.x-1,s.y-1,24,28,3); g.fill();   // bezel
    g.fillStyle='#69757e'; g.fillRect(s.x-1,s.y-1,24,2);            // lit edge
    g.fillStyle='#0c1114'; g.fillRect(s.x+4,s.y+2,14,22);           // the slot
    const ty = on ? s.y+3 : s.y+13;                                 // throw
    g.fillStyle=on?'#c3cdd4':'#5d6872'; g.fillRect(s.x+7,ty+3,8,8); // shaft
    g.fillStyle=on?'#dbe4ea':'#6d7983'; g.fillRect(s.x+5,ty,12,5);  // thumb tip
    g.fillStyle=on?'#f2f7fa':'#828e98'; g.fillRect(s.x+5,ty,12,1);
    g.fillStyle='#232b31'; g.fillRect(s.x+7,ty+10,8,2);             // shaft base
    g.fillStyle=on?'#6f7b85':'#39434b';
    g.font="8px 'VT323',monospace"; g.textAlign='center';
    g.fillText(on?'I':'O', s.x+11, on ? s.y+23 : s.y+9);            // panel mark
    g.textAlign='left';

    g.fillStyle=on?'#ffb13a':'#2a3238';                        // indicator lamp
    g.fillRect(s.x+28,s.y+8,8,8);
    if(on){ g.globalAlpha=0.30; g.fillStyle='#ffb13a';
            g.fillRect(s.x+26,s.y+6,12,12); g.globalAlpha=1; }
    g.strokeStyle='#161c21'; g.lineWidth=1;
    g.strokeRect(s.x+27.5,s.y+7.5,9,9);

    g.fillStyle=on?'#f0d7a8':(live?'#8e9aa3':'#5a646c');       // engraved label
    g.font="15px 'VT323',monospace";
    g.fillText(f.name.replace('LIQUID ','LIQ '),s.x+44,s.y+13);
    g.fillStyle=on?'#8fb9ff':'#59646d';
    g.font="12px 'VT323',monospace";
    g.fillText('SG '+f.sg.toFixed(2),s.x+44,s.y+24);
  });
}

function slider(g,sl,live){
  const v=Math.max(0,Math.min(1,sl.get())), tr=sl.track, kx=tr.x+v*tr.w, ky=tr.y;
  A.plate(g,sl.box.x,sl.box.y,sl.box.w,sl.box.h);
  g.fillStyle=live?P.rim:'#4a545e'; g.font="12px 'VT323',monospace"; g.textAlign='left';
  g.fillText(sl.label,sl.box.x+6,sl.box.y+15);
  g.fillStyle=live?'#39ff6a':'#5d6a73'; g.font="15px 'VT323',monospace"; g.textAlign='right';
  g.fillText(sl.fmt(),sl.box.x+sl.box.w-6,sl.box.y+15);
  g.textAlign='left';

  const tg=(!done&&STEPS[si]&&STEPS[si].target);
  if(tg && ((tg.on==='flow')===(sl.key==='flow'))){
    const a=tr.x+tg.lo*tr.w, b=tr.x+tg.hi*tr.w;
    g.fillStyle='rgba(255,210,74,0.20)'; g.fillRect(a,ky-11,b-a,22);
    g.strokeStyle='#ffd24a'; g.lineWidth=1; g.strokeRect(a+0.5,ky-11.5,b-a-1,22);
    g.fillStyle='#ffd24a'; g.font="10px 'VT323',monospace"; g.textAlign='center';
    g.fillText(tg.label,(a+b)/2,ky-15); g.textAlign='left';
  }
  g.fillStyle='#0b1116'; g.fillRect(tr.x,ky-3,tr.w,6);
  g.fillStyle=live?P.amber:'#39464f'; g.fillRect(tr.x,ky-3,v*tr.w,6);
  g.fillStyle=live?'#ffd24a':'#5d6a73'; g.fillRect(kx-4,ky-10,8,20);
  g.strokeStyle='rgba(0,0,0,0.6)'; g.lineWidth=1; g.strokeRect(kx-4,ky-10,8,20);
}

/* ============================================================
   SEGMENTS \u2014 one concept each, named before it is demonstrated
   ============================================================ */
/* ============================================================
   THE CONCEPT LADDER

   Ordered by what a person needs to already know, not by what the rig
   happens to be able to draw.

     1  PROCESS        what we are doing at all
     2  FLUID          what is in the pipe; liquid and gas
     3  TEMPERATURE    a property of it; random motion, not transport
     4  PRESSURE       the stored energy; present with nothing moving
     5  FLOW           volume per unit time; driven by pressure difference
     ---- level 0 plays here ----
     6  PIPE BORE          nominal size is not the opening (B36.10M)
     7  VELOCITY PROFILE   no-slip at the wall; speed varies across the bore
     8  VISCOSITY / REYNOLDS / LAMINAR / TURBULENT
     9  SPECIFIC GRAVITY

   ON THE DEFINITIONS: these are the real ones, not approximations that
   happen to fit the demonstration. The first pass had a process "moving
   something", which is transport only - one kind of process among heating,
   mixing, separating and reacting - and had the VALVE moving the fluid. A
   valve moves nothing. It is a variable resistance. Energy moves fluid:
   the pump does work on it, raising its pressure, and fluid runs from high
   pressure to low. Writing it the other way teaches something false, and
   it is the single most load-bearing idea in the game.

   ON THE WRITING: plain and direct. Name the term, define it accurately,
   then say what the player just watched it do. A lesson is three lines at
   103 columns - about 300 characters - so every word has to earn it.
   ============================================================ */
/* Scratch state for steps that must remember something across frames:
   that the valve was opened before it was shut again, which fluids have
   been tried. Cleared at the start of every segment, so replaying one
   does not begin half-satisfied. */

const SEG={

      { ctl:['fluid'],
        task:'Switch the loop over to propane.',
        ok:()=>B.fluid==='propane',
        lesson:'Specific gravity is the ratio of a fluid\u2019s density to the '+
          'density of water. Propane is 0.50, half as dense. Through a fixed '+
          'restriction, flow goes as Cv times the square root of pressure drop '+
          'over SG \u2014 so less dense means more volume through the same opening.' },
      { ctl:['flow','temp','fluid'],
        task:'Deliver 0.50 gpm and keep the flow laminar. Fluid, temperature and valve are all live.',
        ok:()=>{ const r=rig(); return !B.drag && r.q>=0.50 && r.regime==='laminar'; },
        /* The TEMPERATURE slider greys out and reads HELD NEAR SATURATION
           for anything but water, so 'propane fails at any temperature' was
           asserting something the player is prevented from testing. Say what
           the bench actually does instead. */
        lesson:'Propane is held near saturation on this bench, so TEMPERATURE '+
          'locks and you cannot cool it. At 20 \u00b0C it is too thin to stay '+
          'laminar at 0.50 gpm. Water will, once cooled, because cold water is '+
          'more viscous. Fluid, temperature and valve decide together.' },
    ],
  },
};

/* ---- running a visit ---- */
let QUEUE=[], seg=null, STEPS=[], si=0, done=false, SH=null, onDone=null;

function liveCtl(which){
  if(done||!STEPS[si]) return true;
  return (STEPS[si].ctl||[]).indexOf(which)>=0;
}
function magnet(key,v){
  if(done||!STEPS[si]) return v;
  const tg=STEPS[si].target;
  if(!tg || (tg.on==='flow')!==(key==='flow')) return v;
  if(v>tg.lo-0.035 && v<tg.lo) return tg.lo;
  if(v<tg.hi+0.035 && v>tg.hi) return tg.hi;
  return v;
}

function draw(g,dt,t){
  const r=rig();
  /* the compare step wants the player to have actually seen both */
  if(B.flow>0.3){ if(B.section==='reducer') PROBE.sawRed=true; else PROBE.sawPlain=true; }
  if(PROBE.sawRed && PROBE.sawPlain) PROBE.sawBoth=true;
  /* the margin is smallest at full flow, hottest water, reducer fitted -
     let the step pass once the player has been to that corner */
  if(B.flow>0.9 && B.temp>=70 && B.section==='reducer') PROBE.triedHard=true;
  g.drawImage(BG,0,0);
  CUT.set({ flow:Math.min(1,r.v/3.0), regime:r.regime, re:r.re,
            tempF:r.t*9/5+32, sg:r.f.sg, gas:false });
  drawRig(g,r); drawTee(g,r);
  if(venaOn()) drawTrace(g,r);
  drawMeters(g,r); drawFluidSwitches(g); drawSections(g);
  if(manifoldOn()){
    slider(g,SLID_MAN.b1, liveCtl('b1'));
    slider(g,SLID_MAN.b2, liveCtl('b2'));
  } else {
    slider(g,SLID.flow, liveCtl('flow'));
    slider(g,SLID.temp, liveCtl('temp') && !tempLocked());
  }
  if(tempLocked()){
    g.fillStyle=P.amber; g.font="10px 'VT323',monospace";
    g.fillText('HELD NEAR SATURATION',SLID.temp.box.x+6,SLID.temp.box.y-5);
  }
  // the concept, named, where it cannot be missed
  if(seg){
    A.plate(g,LAY.glass.x,LAY.glass.y-56,LAY.glass.w,34);
    g.fillStyle=P.amber; g.font="17px 'VT323',monospace"; g.textAlign='left';
    g.fillText('CONCEPT: '+seg.concept,LAY.glass.x+10,LAY.glass.y-40);
    g.fillStyle='#8b949b'; g.font="12px 'VT323',monospace";
    g.fillText(seg.sub,LAY.glass.x+10,LAY.glass.y-27);
  }
}
function step(dt){
  const r=rig();
  CUT.update(dt);
  if(r.v>0.25) B.watch+=dt;
  LPE.audio.flow(Math.min(1,r.v/4));
  if(done||!STEPS[si]||SH.holding) return;
  if(STEPS[si].ok()){
    const last=si>=STEPS.length-1;
    const need=STEPS[si].watch;
    SH.beat(STEPS[si].lesson, ()=>{
      if(last) nextSegment(); else { si++; B.watch=0; say(); }
    }, need? (()=>B.watch>=need) : null);
    SH.count(last?'\u2014':(si+2)+' / '+STEPS.length);
  }
}
function say(){ if(done||!STEPS[si]) return;
  SH.say(STEPS[si].task,''); SH.count((si+1)+' / '+STEPS.length); }

function nextSegment(){
  if(!QUEUE.length){ done=true; SH.destroy(); onDone&&onDone(); return; }
  const id=QUEUE.shift();
  /* Put the bench back the way LPE.trainer() hands it over. Without this
     the next segment inherits whatever the last one left set, and any
     first step whose condition is ALREADY satisfied fires on frame one -
     its instruction is never shown and the player is dropped into a
     lesson about something they did not do. Running flow -> bore did
     exactly that: the valve was still at 82%, so "Open the valve into
     the marked band" was skipped outright.
     The game path never saw it, because each level calls LPE.trainer()
     afresh and that already resets. The bench itself did not. */
  Object.assign(B,{flow:0,temp:20,fluid:'water',section:'sch40',
                   b1:0,b2:0,watch:0,drag:null});
  seg=SEG[id]; STEPS=seg.steps; si=0; B.watch=0;
  KNOWN.add(id);          // its readouts may appear from now on
  PROBE.opened=false; PROBE.seen={};
  PROBE.sawPlain=false; PROBE.sawRed=false; PROBE.sawBoth=false; PROBE.triedHard=false;
  SH.title('R.O.\u2019S BENCH \u2014 TRAINING LOOP', seg.concept.toLowerCase());
  if(STEPS[0].auto){
    SH.beat(STEPS[0].lesson, ()=>{ si=0; nextStepsOrSegment(); });
  } else say();
}
function nextStepsOrSegment(){
  if(STEPS.length<=1) nextSegment(); else { si=1; say(); }
}

/* ---- input ---- */
function down(p){
  for(const key of (manifoldOn()?['b1','b2']:['flow','temp'])){
    const sl=(manifoldOn()?SLID_MAN:SLID)[key], tr=sl.track;
    if(!liveCtl(key)) continue;
    if(key==='temp' && tempLocked()) continue;
    if(p.x>=tr.x-12 && p.x<=tr.x+tr.w+12 && Math.abs(p.y-tr.y)<18){
      B.drag=key; sl.set(magnet(key,Math.max(0,Math.min(1,(p.x-tr.x)/tr.w))));
      LPE.audio.tick(); return;
    }
  }
  /* The whole switch row is the target, lever through label - a 22px
     lever alone is a smaller hit than the thing it represents. */
  if(liveCtl('section')) for(const b of SECBTN){
    if(p.x>=b.x-6 && p.x<=b.x+b.w+6 && p.y>=b.y-6 && p.y<=b.y+b.h+20){
      if(B.section!==b.k){ B.section=b.k; LPE.audio.clack(); }
      return;
    }
  }
  if(liveCtl('fluid')) for(const s of FSW){
    if(p.x>=s.x-10 && p.x<=LAY.fsw.x+LAY.fsw.w && p.y>=s.y-4 && p.y<=s.y+28){
      if(B.fluid!==s.k){ B.fluid=s.k; LPE.audio.clack(); }
      return;
    }
  }
}
function move(p){
  if(!B.drag) return;
  const sl=(manifoldOn()?SLID_MAN:SLID)[B.drag];
  if(!sl) return;                      // a lever from the other apparatus
  const tr=sl.track, before=sl.get();
  sl.set(magnet(B.drag,Math.max(0,Math.min(1,(p.x-tr.x)/tr.w))));
  if(Math.floor(before*14)!==Math.floor(sl.get()*14)) LPE.audio.tick();
}

/* ---- entry point ---- */
LPE.trainer=function(ids,after){
  QUEUE=ids.slice(); onDone=after; done=false;
  Object.assign(B,{flow:0,temp:20,fluid:'water',section:'sch40',b1:0,b2:0,watch:0,drag:null});
  buildDesk();
  SH=LPE.mount({
    t1:'R.O.\u2019S BENCH \u2014 TRAINING LOOP', t2:'', w:W,h:H, step, draw,
    intro:[
      {kind:'comms', tag:'[ COLONY INTERCOM \u00b7 CREW CHANNEL 3 ]',
       text:'&ldquo;Before you go down there.<br>R.O. keeps a bench for this. Use it.&rdquo;'},
    ],
    onStart:nextSegment,
    onReset(){ Object.assign(B,{flow:0,temp:20,fluid:'water',section:'sch40',b1:0,b2:0,watch:0,drag:null});
               si=0; say(); },
  });
  SH.canvas.addEventListener('pointerdown',e=>{
    LPE.audio.init(); LPE.audio.resume(); LPE.audio.startFlow(); down(SH.pt(e)); });
  SH.canvas.addEventListener('pointermove',e=>move(SH.pt(e)));
  ['pointerup','pointercancel'].forEach(k=>
    SH.canvas.addEventListener(k,()=>{B.drag=null;}));
  return SH;
};
LPE.TRAINER_SEGMENTS=SEG;
/* Standalone: run every segment, for working on the bench itself.
   ?seg=reynolds,specific-gravity runs just those, in that order - working
   on the last segment should not cost four playthroughs of the first. The
   game path never reads this; it passes the ids it wants. */
if(!window.LPE_GAME) LPE.boot(()=>{
  const want=(new URLSearchParams(location.search).get('seg')||'')
    .split(',').map(s=>s.trim()).filter(s=>SEG[s]);
  LPE.trainer(want.length?want:Object.keys(SEG),()=>{});
});
})();
</script>
