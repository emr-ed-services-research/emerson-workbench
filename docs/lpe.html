<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lunar Process Engineer</title>
<meta name="robots" content="noindex">
<style>
  :root{ --ink:#e6e8ea; --label:#8d9399; --panel:#14171b; --ground:#0d0f12;
         --fast:#7fe3ff; }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{background:var(--ground); color:var(--ink);
       font:16px/1.5 system-ui,-apple-system,Segoe UI,sans-serif;
       display:flex; flex-direction:column; align-items:center;
       justify-content:center; gap:18px; padding:20px}
  h1{margin:0; font-size:15px; font-weight:700; letter-spacing:.14em;
     text-transform:uppercase; color:var(--label)}
  .wrap{width:100%; max-width:1100px; background:var(--panel);
        border:1px solid #23272c; border-radius:10px; overflow:hidden}
  video{display:block; width:100%; height:auto; background:#000}
  p{margin:0; color:var(--label); font-size:13px; text-align:center}
  a{color:var(--fast)}
</style>
</head>
<body>
  <h1>Lunar Process Engineer</h1>
  <div class="wrap">
    <video controls playsinline preload="metadata" src="lpe.mp4"></video>
  </div>
  <p>Emerson Workbench &middot; <a href="lpe.mp4">download</a></p>
</body>
</html>
